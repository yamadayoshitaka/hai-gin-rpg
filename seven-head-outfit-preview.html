<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7頭身衣装素材検証</title>
<style>body{margin:0;background:#101827;color:#e8edf5;font:15px system-ui}header{padding:12px 16px;background:#1c2940}main{display:flex;flex-wrap:wrap;gap:12px;padding:12px}section{flex:1;min-width:270px}select{background:#263651;color:white;border:1px solid #536581;padding:10px;margin:4px}#viewer{width:100%;height:65vh;min-height:360px;touch-action:none;background:#192538}#status{white-space:pre-wrap;padding:10px;color:#f5d48c}small{color:#b4c2d7}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head>
<body><header><strong>7頭身向け衣装候補・3D素材検証</strong><div><small>静的GLBの形状確認専用。人物へのリギング・装着は未完了です。</small></div></header>
<main><section><label>ジョブ <select id="job"></select></label><label>性別 <select id="sex"><option value="male">男性</option><option value="female">女性</option></select></label><label>部位 <select id="part"></select></label><div id="status" role="status"></div></section><section><div id="viewer"></div><small>ドラッグで回転、ピンチで拡大・縮小。部品単体の寸法・形状確認です。</small></section></main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const base='./assets/characters/seven-head-equipment-candidates/';
const job=document.getElementById('job'),sex=document.getElementById('sex'),part=document.getElementById('part'),status=document.getElementById('status');
const viewer=document.getElementById('viewer');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x192538);
const camera=new THREE.PerspectiveCamera(40,1,.01,1000);camera.position.set(2,1.5,3);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));viewer.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x526078,2));
const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(3,6,4);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const loader=new GLTFLoader();let current=null,manifest=null,sequence=0;
function resize(){const w=viewer.clientWidth,h=viewer.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(viewer);
function refreshParts(){const files=manifest.jobs[job.value][sex.value];part.replaceChildren(...files.map(f=>new Option(f,f)));show();}
async function show(){if(!manifest)return;const id=++sequence;const file=part.value;status.textContent='読み込み中: '+file;
try{const gltf=await loader.loadAsync(base+encodeURIComponent(file));if(id!==sequence)return;
if(current){scene.remove(current);current.traverse(n=>{if(n.isMesh){n.geometry?.dispose();const mats=Array.isArray(n.material)?n.material:[n.material];mats.forEach(m=>m?.dispose());}});}
current=gltf.scene;scene.add(current);const box=new THREE.Box3().setFromObject(current);if(box.isEmpty())throw Error('メッシュがありません');
const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());controls.target.copy(center);
const radius=Math.max(size.length()*.75,.25);camera.position.copy(center).add(new THREE.Vector3(radius,radius*.55,radius*1.7));camera.near=Math.max(radius/1000,.001);camera.far=Math.max(radius*100,100);camera.updateProjectionMatrix();controls.update();
let meshes=0,skins=0;current.traverse(n=>{if(n.isMesh)meshes++;if(n.isSkinnedMesh)skins++;});
status.textContent=file+'\nメッシュ: '+meshes+' / スキンメッシュ: '+skins+'\n寸法: '+size.toArray().map(x=>x.toFixed(3)).join(' × ')+'\n状態: 静的衣装候補（人物への装着不可）';
}catch(e){if(id===sequence)status.textContent='読み込み失敗: '+e.message;}}
job.onchange=refreshParts;sex.onchange=refreshParts;part.onchange=show;
try{const response=await fetch(base+'manifest.json',{cache:'no-store'});if(!response.ok)throw Error('manifest HTTP '+response.status);manifest=await response.json();job.replaceChildren(...Object.keys(manifest.jobs).map(j=>new Option(j,j)));refreshParts();}
catch(e){status.textContent='素材一覧取得失敗: '+e.message;}
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);}loop();
</script></body></html>
