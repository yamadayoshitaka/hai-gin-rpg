name: Story chapters 1-5 production readiness
on:
  pull_request:
    paths:
      - 'src/story-chapter-comic.js'
      - 'src/story-chapter-scene-selection.js'
      - 'src/story-screenplay-v2.js'
      - 'scripts/prepare-story-chapter.mjs'
      - 'scripts/prepare-story-five-chapters.mjs'
      - 'scripts/compile-story-art-briefs.mjs'
      - 'scripts/compile-story-chapter-atlas.mjs'
      - 'scripts/ingest-story-chapter-atlas.py'
      - 'scripts/assemble-story-chapter-atlas.py'
      - 'scripts/run-story-chapter-pipeline.py'
      - 'qa/story-150-panel-atlas.test.mjs'
      - 'qa/story-150-atlas-ingest-smoke.py'
      - 'assets/story/chapters/c0[1-5]/**'
      - 'src/story-ruby-display.js'
      - 'qa/story-ruby-display.test.mjs'
      - 'qa/story-art-briefs.test.mjs'
      - 'scripts/prune-voicevox-duplicates.mjs'
      - 'qa/story-chapter-pipeline.test.mjs'
      - 'qa/story-panel-voice-assets.test.mjs'
      - '.github/workflows/story-five-chapter-production.yml'
      - 'audio/voicevox/manifest.json'
      - 'audio/voicevox/clips/**'
  push:
    branches: [main]
    paths:
      - 'src/story-chapter-comic.js'
      - 'src/story-chapter-scene-selection.js'
      - 'scripts/prepare-story-five-chapters.mjs'
      - 'scripts/compile-story-art-briefs.mjs'
      - 'src/story-ruby-display.js'
      - '.github/workflows/story-five-chapter-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate screenplay and comic code
        run: |
          node --check src/story-chapter-comic.js
          node --check src/story-chapter-scene-selection.js
          node --check scripts/generate-story-panel-voicevox.mjs
          node --check scripts/prepare-story-five-chapters.mjs
          node --check scripts/prune-voicevox-duplicates.mjs
          node qa/story-screenplay-v2.test.mjs
          node qa/story-chapter-pipeline.test.mjs
          node qa/story-ruby-display.test.mjs
          node qa/story-art-briefs.test.mjs
          node qa/story-150-panel-atlas.test.mjs
          python3 -m py_compile scripts/ingest-story-chapter-atlas.py
          python3 -m py_compile scripts/assemble-story-chapter-atlas.py
          python3 -m py_compile scripts/run-story-chapter-pipeline.py
      - name: Exercise full-size 150-cell cutter with CI-only synthetic stripes
        run: |
          python3 -m pip install --quiet Pillow
          python3 qa/story-150-atlas-ingest-smoke.py
      - name: Prepare first five chapters together (no fake art)
        run: |
          node scripts/prepare-story-five-chapters.mjs
          node scripts/compile-story-art-briefs.mjs
          node scripts/compile-story-chapter-atlas.mjs --all
      - name: Verify legacy VOICEVOX references after deduplication
        run: node qa/story-panel-voice-assets.test.mjs
      - name: Archive all 50 stage / 5 chapter production worklists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-c01-c05-branch-art-and-voice-production-plan
          path: qa-reports/story-chapters/
          if-no-files-found: ignore
          retention-days: 30
