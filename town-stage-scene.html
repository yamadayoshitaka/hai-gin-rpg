<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1a2c"><title>灰銀戦記 | 町ステージ3D探索</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172b33;color:#fff6d9;font:13px system-ui,'Noto Sans JP',sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(130deg,#111e2e,#223c55);text-align:center;padding:24px}
#loading[hidden]{display:none}#loading h2{font:700 24px Georgia,'Noto Serif JP',serif;color:#ffe2ab}#loading p{line-height:1.8;color:#d9e4eb}
#sceneInfo{position:fixed;top:126px;left:11px;background:#12263ac9;border:1px solid #a29a72;color:#fff0c5;border-radius:8px;padding:7px 11px;pointer-events:none;max-width:calc(100% - 22px);font-size:11px;text-shadow:0 1px 2px #000}
#stick{position:fixed;bottom:clamp(32px,7vh,105px);right:clamp(14px,4vw,28px);width:clamp(108px,28vw,160px);height:clamp(108px,28vw,160px);border-radius:50%;border:2px solid #c7d9ec8c;background:#143253b9;touch-action:none;box-shadow:inset 0 0 30px #020b17aa}
#knob{position:absolute;left:50%;top:50%;width:43%;height:43%;border:2px solid #bed6ed;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 25%,#91b6da,#335478);pointer-events:none}
#actions{position:fixed;bottom:clamp(35px,7vh,95px);left:14px;display:grid;gap:8px;min-width:clamp(114px,31vw,170px)}
#actions button,#actions a{display:block;background:linear-gradient(#3b5876e8,#19344fed);border:1px solid #c3d1e0;border-radius:9px;color:#fff;text-decoration:none;padding:11px 8px;min-height:43px;text-align:center;font-weight:700;box-shadow:0 4px 14px #0007;touch-action:manipulation}
#actions a{background:linear-gradient(#876d43,#59432d);border-color:#edc48a}
#actions button:disabled{opacity:.55}
#hint{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;color:#d3dce3c5;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
#notice{position:fixed;left:50%;transform:translateX(-50%);bottom:220px;width:min(83vw,350px);background:#0d2435dd;border:1px solid #e0bc7c;border-radius:9px;padding:8px;text-align:center;display:none;pointer-events:none}
@media(max-height:630px){#sceneInfo{top:95px}#actions{bottom:12px;gap:4px}#actions button,#actions a{padding:7px;min-height:34px}#stick{bottom:16px;width:100px;height:100px}#hint{display:none}}
</style></head><body>
<div id="loading"><div><h2 id="loadingTitle">町のステージを準備中</h2><p id="loadingText">既存の城・町ステージから地形と建造物を読み込みます。</p><a href="./world-map.html" target="_top" style="color:#ffe1ac;font-weight:700">読み込めないときは地図へ ▶</a></div></div>
<div id="sceneInfo">町のステージ読込中…</div>
<div id="actions"><button id="interact" type="button">話す・施設</button><button id="view" type="button">視点切替</button><a id="exit" href="./world-map.html" target="_top">🚪 町を出て地図へ ▶</a></div>
<div id="stick" aria-label="移動操作"><div id="knob"></div></div><div id="notice"></div><div id="hint">左側ドラッグでカメラ回転・右のスティックで移動</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {STAGE_PRESETS,STAGE_WORLD_SIZE,applyStageTerrain,stageWaterway,stageBridgeRows,selectStageBuildings,stageLandmarks,stageBounds} from './src/stage-library.js';
import {CAMPAIGN_STAGE_BY_ID} from './src/campaign-stage-plan.js';
import {TILE_COLORS,makeTreeAsset} from './src/shared-stage-assets.js';
import {createCatalogObject} from './src/object-catalog.js';
const $=id=>document.getElementById(id);
const query=new URLSearchParams(location.search),stageId=query.get('stage')||'c01-s01';
const campaignStage=CAMPAIGN_STAGE_BY_ID[stageId]||CAMPAIGN_STAGE_BY_ID['c01-s01'];
const preset=STAGE_PRESETS.find(x=>x.id===campaignStage.scenePreset)||STAGE_PRESETS[0];
const CELL=1.13,SIZE=STAGE_WORLD_SIZE,riverX=z=>116+Math.round(5*Math.sin(z*.055));
const isRiver=stageWaterway(preset)==='river';
const data={width:SIZE,height:SIZE,tiles:Array(SIZE*SIZE).fill('grass'),heights:Array(SIZE*SIZE).fill(3),season:preset.season};
for(let z=0;z<SIZE;z++)for(let x=0;x<SIZE;x++){
 const idx=z*SIZE+x,dx=Math.abs(x-riverX(z));
 if(isRiver&&dx<=5){data.tiles[idx]='river';data.heights[idx]=1;}
 else if(isRiver&&dx<=7){data.tiles[idx]='gravel';data.heights[idx]=2;}
 if(Math.abs(z-116)<5&&x>135&&x<218||Math.abs(x-174)<5&&z>75&&z<220)data.tiles[idx]='cobble';
}
applyStageTerrain(data,preset);
const at=(x,z)=>Math.max(0,Math.min(SIZE-1,Math.round(z)))*SIZE+Math.max(0,Math.min(SIZE-1,Math.round(x)));
const ground=(x,z)=>data.heights[at(x,z)]*.42;
const badTile=(x,z)=>['river','water','cliff'].includes(data.tiles[at(x,z)]);
function center(x,z){return new THREE.Vector3((x-SIZE/2)*CELL,ground(x,z),(z-SIZE/2)*CELL)}
const sky= preset.biome==='snow'?0xa1bac9:preset.biome==='desert'?0xb8aa8c:0x93b8ca;
const scene=new THREE.Scene();scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(sky,90,380);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,650);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f1ff,0x476348,2.5));
const sun=new THREE.DirectionalLight(0xffefcc,2.1);sun.position.set(-42,90,57);scene.add(sun);
const terrainCanvas=document.createElement('canvas');terrainCanvas.width=terrainCanvas.height=SIZE;
const tc=terrainCanvas.getContext('2d'),image=tc.createImageData(SIZE,SIZE);
const colorMemo={};
function rgbOf(name){if(!colorMemo[name]){const c=new THREE.Color(TILE_COLORS[name]||TILE_COLORS.grass);colorMemo[name]=[Math.round(c.r*255),Math.round(c.g*255),Math.round(c.b*255)];}return colorMemo[name];}
for(let i=0;i<data.tiles.length;i++){
 const c=rgbOf(data.tiles[i]),p=i*4;
 image.data[p]=c[0];image.data[p+1]=c[1];image.data[p+2]=c[2];image.data[p+3]=255;
}
tc.putImageData(image,0,0);
const tex=new THREE.CanvasTexture(terrainCanvas);tex.colorSpace=THREE.SRGBColorSpace;tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.LinearFilter;
const geo=new THREE.PlaneGeometry(SIZE*CELL,SIZE*CELL,SIZE,SIZE);
geo.rotateX(-Math.PI/2);
const pos=geo.getAttribute('position');
for(let i=0;i<pos.count;i++){
 const x=Math.max(0,Math.min(SIZE-1,Math.round(pos.getX(i)/CELL+SIZE/2)));
 const z=Math.max(0,Math.min(SIZE-1,Math.round(pos.getZ(i)/CELL+SIZE/2)));
 pos.setY(i,ground(x,z));
}
pos.needsUpdate=true;geo.computeVertexNormals();
const land=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:tex,side:THREE.DoubleSide}));scene.add(land);
const townRoot=new THREE.Group();scene.add(townRoot);
const buildings=[];
const all=[
 {kind:'castle',x:65,z:169,w:100,d:100,label:'王城'},
 {kind:'church',x:173,z:152,w:11,d:13,label:'教会'},
 {kind:'weapon',x:169,z:99,w:10,d:10,label:'武器屋'},
 {kind:'shop',x:192,z:105,w:11,d:10,label:'道具屋'},
 {kind:'inn',x:190,z:138,w:12,d:11,label:'宿屋'},
 ...[[146,91],[194,92],[152,180],[191,180],[164,202],[208,164],[177,191],[155,128]].map(([x,z],i)=>({kind:'house',x,z,w:10,d:10,label:'町の家 '+(i+1)})),
 {kind:'manor_noble',x:62,z:93,w:17,d:15,label:'館'}
];
const buildingIds={castle:'castle_001',church:'church_001',weapon:'weapon_shop_001',shop:'item_shop_001',inn:'inn_001',house:'town_house_001',manor_noble:'manor_noble_001'};
const selected=selectStageBuildings(all,preset).slice(0,preset.buildingMode==='capital'?all.length:Math.max(1,Math.min(18,preset.buildingLimit+1)));
const built=new Map();
let count=0;
for(const b of selected){
 if(badTile(b.x,b.z)||!buildingIds[b.kind])continue;
 try{
  if(!built.has(b.kind))built.set(b.kind,createCatalogObject(buildingIds[b.kind],{cellSize:CELL}));
  const model=built.get(b.kind).clone(true);
  model.position.copy(center(b.x,b.z));model.position.y-=.12;model.userData.facility=b.kind;townRoot.add(model);
  buildings.push({...b,model});count++;
 }catch(error){console.warn('Stage building unavailable',b.kind,error)}
}
const bridgeMaterial=new THREE.MeshStandardMaterial({color:0xb3b0a1,roughness:1});
for(const row of stageBridgeRows(preset)){
 const bridge=new THREE.Mesh(new THREE.BoxGeometry(18*CELL,.45,4*CELL),bridgeMaterial);
 bridge.position.set(center(116,row).x,ground(113,row)+.15,center(116,row).z);
 townRoot.add(bridge);
 for(const offset of [-2,2]){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(18*CELL,.65,.2),bridgeMaterial);
  rail.position.set(bridge.position.x,bridge.position.y+.45,bridge.position.z+offset*CELL);
  townRoot.add(rail);
 }
}
const treeLocations=[];
const townBounds=stageBounds(preset);
for(let i=0;i<55;i++){
 const x=townBounds.minX+10+((i*53+preset.seed*3)%(townBounds.size-20));
 const z=townBounds.minZ+10+((i*79+preset.seed*5)%(townBounds.size-20));
 if(badTile(x,z)||buildings.some(b=>Math.abs(x-b.x)<b.w/2+9&&Math.abs(z-b.z)<b.d/2+9))continue;
 if(Math.abs(x-174)<9||Math.abs(z-116)<9)continue;
 treeLocations.push([x,z]);if(treeLocations.length>=25)break;
}
try{
 const baseTree=makeTreeAsset('tree_deciduous_001',preset.season);
 for(const [x,z] of treeLocations){
  const tree=baseTree.clone(true);tree.position.copy(center(x,z));tree.scale.setScalar(.8+(x%4)*.07);townRoot.add(tree);
 }
}catch(error){console.warn('Tree renderer skipped',error)}
for(const [id,x,z] of stageLandmarks(preset).slice(0,4)){
 try{const prop=createCatalogObject(id,{cellSize:CELL});prop.position.copy(center(x,z));townRoot.add(prop)}
 catch(error){console.warn('Landmark unavailable',id,error)}
}
const paths=[...buildings].filter(b=>b.kind!=='house').map(b=>({kind:b.kind,name:b.label,x:b.x,z:b.z}));
const gate={x:preset.buildingMode==='capital'?171:184,z:preset.buildingMode==='capital'?218:194};
if(badTile(gate.x,gate.z)){gate.x=168;gate.z=116;}
const exitPost=new THREE.Group();exitPost.position.copy(center(gate.x,gate.z));townRoot.add(exitPost);
const gateLine=new THREE.Mesh(new THREE.BoxGeometry(4.5,5,.35),new THREE.MeshStandardMaterial({color:0xa98657}));
gateLine.position.y=2.5;exitPost.add(gateLine);
const topper=new THREE.Mesh(new THREE.ConeGeometry(3,1.7,4),new THREE.MeshStandardMaterial({color:0x485b70}));
topper.position.y=5.6;topper.rotation.y=Math.PI/4;exitPost.add(topper);
let tx= preset.buildingMode==='capital'?171:176,tz= preset.buildingMode==='capital'?177:157;
if(badTile(tx,tz)||buildings.some(b=>Math.abs(b.x-tx)<b.w/2+3&&Math.abs(b.z-tz)<b.d/2+3)){tx=161;tz=116;}
const hero=new THREE.Group();scene.add(hero);
const cloak=new THREE.MeshStandardMaterial({color:0x813d45,roughness:1}),silver=new THREE.MeshStandardMaterial({color:0x747c8a,metalness:.3,roughness:.6}),skin=new THREE.MeshStandardMaterial({color:0xd6b297,roughness:1});
const makePart=(geometry,material,x,y,z)=>{const m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);hero.add(m);return m;};
makePart(new THREE.CapsuleGeometry(.32,1.05,4,8),cloak,0,1.1,0);
makePart(new THREE.SphereGeometry(.31,12,10),skin,0,2.16,0);
const helmet=makePart(new THREE.ConeGeometry(.38,.42,8),silver,0,2.44,0);
const sword=makePart(new THREE.BoxGeometry(.07,1.3,.10),silver,.5,1.1,.15);sword.rotation.z=-.65;
const legs=[makePart(new THREE.CapsuleGeometry(.15,.61,3,8),silver,-.23,.37,0),makePart(new THREE.CapsuleGeometry(.15,.61,3,8),silver,.23,.37,0)];
hero.position.copy(center(tx,tz));
const avatarHeight=2.6,yawHolder=new THREE.Vector3();
let yaw=0,zoom=11,moveX=0,moveY=0,frame=0,last=performance.now(),noticeTimer=0;
const obstacles=(x,z)=>buildings.some(b=>Math.abs(x-b.x)<b.w/2+1.1&&Math.abs(z-b.z)<b.d/2+1.1);
function passable(x,z){
 if(x<townBounds.minX+3||x>townBounds.maxX-3||z<townBounds.minZ+3||z>townBounds.maxZ-3)return false;
 return !badTile(x,z)&&!obstacles(x,z);
}
function post(type,extra={}){
 try{parent.postMessage({type,stageId:campaignStage.id,...extra},location.origin)}
 catch(error){console.warn(error)}
}
function leave(){post('hai-gin-town-exit');if(parent===window)location.assign('./world-map.html');}
$('exit').addEventListener('click',event=>{if(parent!==window){event.preventDefault();leave();}});
const status=$('sceneInfo');status.textContent='第'+campaignStage.chapter+'章 · '+campaignStage.id+' · '+campaignStage.name+'｜'+preset.name;
const showNotice=text=>{const n=$('notice');n.textContent=text;n.style.display='block';noticeTimer=performance.now()+3200;};
$('view').onclick=()=>{zoom=zoom<10?17:zoom>13?8:17;};
$('interact').onclick=()=>{
 const near=paths.map(b=>({...b,dist:Math.hypot(tx-b.x,tz-b.z)})).sort((a,b)=>a.dist-b.dist)[0];
 if(Math.hypot(tx-gate.x,tz-gate.z)<12){leave();return;}
 if(near&&near.dist<14){const panel=near.kind==='weapon'||near.kind==='shop'?'shop':near.kind==='inn'?'save':near.kind==='castle'?'story':'formation';
  post('hai-gin-town-facility',{panel});showNotice(near.name+'の施設を開きました。');return;
 }
 showNotice('周辺を調べました。近くの城・商店・宿で施設を利用できます。');
};
const pad=$('stick'),knob=$('knob');let activePointer=null;
function stickMove(e){
 const rect=pad.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
 const dx=(e.clientX-cx)/(rect.width*.42),dy=(e.clientY-cy)/(rect.height*.42),len=Math.max(1,Math.hypot(dx,dy));
 moveX=dx/len;moveY=dy/len;
 knob.style.left=(50+moveX*34)+'%';knob.style.top=(50+moveY*34)+'%';
}
pad.onpointerdown=e=>{activePointer=e.pointerId;pad.setPointerCapture(e.pointerId);stickMove(e);};
pad.onpointermove=e=>{if(e.pointerId===activePointer)stickMove(e);};
function stopPad(e){if(e.pointerId!==activePointer)return;activePointer=null;moveX=moveY=0;knob.style.left='50%';knob.style.top='50%';}
pad.onpointerup=stopPad;pad.onpointercancel=stopPad;pad.onlostpointercapture=stopPad;
const keys=new Set();
window.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const canvas=renderer.domElement;let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw+=(e.clientX-drag.x)*.006;drag.x=e.clientX;drag.y=e.clientY;});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
function update(now){
 const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 let mx=moveX,my=moveY;
 if(keys.has('w')||keys.has('arrowup'))my=-1;
 if(keys.has('s')||keys.has('arrowdown'))my=1;
 if(keys.has('a')||keys.has('arrowleft'))mx=-1;
 if(keys.has('d')||keys.has('arrowright'))mx=1;
 const len=Math.hypot(mx,my);
 if(len>.04){
  mx/=Math.max(1,len);my/=Math.max(1,len);
  const dx=(-mx*Math.cos(yaw)+my*Math.sin(yaw))*8.6*dt/CELL;
  const dz=(-my*Math.cos(yaw)-mx*Math.sin(yaw))*8.6*dt/CELL;
  if(passable(tx+dx,tz))tx+=dx;
  if(passable(tx,tz+dz))tz+=dz;
  hero.rotation.y=Math.atan2(dx,dz);
  frame+=dt*12;legs[0].rotation.x=Math.sin(frame)*.38;legs[1].rotation.x=-Math.sin(frame)*.38;
 }else{legs[0].rotation.x=legs[1].rotation.x=0;}
 hero.position.lerp(center(tx,tz),Math.min(1,dt*15));
 camera.position.set(hero.position.x+Math.sin(yaw)*zoom,hero.position.y+Math.max(5,zoom*.58),hero.position.z+Math.cos(yaw)*zoom);
 camera.lookAt(hero.position.x,hero.position.y+1.3,hero.position.z);
 if(noticeTimer&&now>noticeTimer){$('notice').style.display='none';noticeTimer=0;}
 renderer.render(scene,camera);requestAnimationFrame(update);
}
addEventListener('resize',()=>{camera.aspect=Math.max(1,innerWidth)/Math.max(1,innerHeight);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
$('loading').hidden=true;
post('hai-gin-town-stage-ready',{preset:preset.id,buildings:count});
requestAnimationFrame(update);
</script></body></html>
