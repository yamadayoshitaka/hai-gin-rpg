            v107="https://yamadayoshitaka.github.io/hai-gin-rpg/src/face-v107-natural-smile.js?face_verify=${GITHUB_SHA:0:12}-${attempt}"
            initial_v110="https://yamadayoshitaka.github.io/hai-gin-rpg/src/face-initial-preview-v110.js?face_verify=${GITHUB_SHA:0:12}-${attempt}"
            v117_sculpt="https://yamadayoshitaka.github.io/hai-gin-rpg/src/face-v117-reference-portrait-mesh.js?face_verify=${GITHUB_SHA:0:12}-${attempt}"
            v119_sculpt="https://yamadayoshitaka.github.io/hai-gin-rpg/src/face-v119-portrait-contours.js?face_verify=${GITHUB_SHA:0:12}-${attempt}"
            html_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-studio.html -w '%{http_code}' "${url}" || true)
            js_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-expression.js -w '%{http_code}' "${js}" || true)
            topology_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-topology.js -w '%{http_code}' "${topology}" || true)
            local_retopo_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v106-retopo.js -w '%{http_code}' "${local_retopo}" || true)
            v107_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v107.js -w '%{http_code}' "${v107}" || true)
            initial_v110_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v110-initial.js -w '%{http_code}' "${initial_v110}" || true)
            v117_sculpt_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v117-sculpt.js -w '%{http_code}' "${v117_sculpt}" || true)
            v119_sculpt_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v119-sculpt.js -w '%{http_code}' "${v119_sculpt}" || true)
            if [[ "${html_code}" == 200 && "${js_code}" == 200 && "${topology_code}" == 200 && "${local_retopo_code}" == 200 && "${v107_code}" == 200 && "${initial_v110_code}" == 200 && "${v117_sculpt_code}" == 200 && "${v119_sculpt_code}" == 200 ]] &&
               grep -Fq "name=\"hai-gin-pages-sha\" content=\"${GITHUB_SHA}\"" /tmp/public-face-studio.html &&
               grep -Fq '顔品質 v119' /tmp/public-face-studio.html &&
               grep -Fq 'v119-portrait-contours' /tmp/public-face-studio.html &&
