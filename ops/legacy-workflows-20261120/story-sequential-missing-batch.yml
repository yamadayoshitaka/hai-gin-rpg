name: Manga 1-20 sequential missing image batch
on:
  # Cloudflare Free per-day gate resets at 00:00 UTC (09:00 JST).
  # Run once after reset without requiring repeated manual "漫画やって".
  # Existing scheduler still owns the 20-chapter queue and all safety checks.
  schedule:
    - cron: '35 0 * * *'
  # Owner-requested one-shot kick to prove the production/reuse dispatch route.
  push:
    branches: [main]
    paths:
      - 'ops/run-manga-sequential-once-20261118.trigger'
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'scripts/story-sequential-missing-batch.mjs'
      - 'qa/story-sequential-missing-batch.test.mjs'
      - '.github/workflows/story-sequential-missing-batch.yml'
      - 'scripts/manual-hourly-batch-dispatch.mjs'
      - 'scripts/story-chatgpt-fallback-handoff.mjs'
      - 'src/story-generation-fallback.js'
      - 'qa/story-chatgpt-fallback-handoff.test.mjs'
      - 'qa/story-chatgpt-stage2-intake.test.mjs'
      - 'src/story-chapter1-provisional-live.js'
      - 'assets/story/chapter1-provisional-live/c01-s02__pre__male__c01-s02-m1.webp'
      - 'assets/story/chatgpt-candidates/c01-s02__pre__male__c01-s02-m15.webp'
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: manga-sequential-missing-queue
  cancel-in-progress: false
jobs:
  manga:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '漫画やって')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical and actual-byte-checked queue from stage 1 to stage 200
        run: |
          node --check scripts/story-sequential-missing-batch.mjs
          node scripts/story-sequential-missing-batch.mjs --max 20
          node qa/story-sequential-missing-batch.test.mjs
          node qa/story-chatgpt-fallback-handoff.test.mjs
          node qa/story-chatgpt-stage2-intake.test.mjs
      - name: Review first missing stage and safely reuse existing production paths
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CF_FREE: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(jq -r .enabled qa-reports/story-sequential-missing/next.json)
          stage=$(jq -r '.selected[0].stageId // ""' qa-reports/story-sequential-missing/next.json)
          # Auto-route to an exact ChatGPT Images generation REQUEST whenever
          # Cloudflare Free is exhausted, disabled or has no safe chapter adapter.
          # ChatGPT subscription Images cannot run inside GitHub Actions.
          chatgpt_handoff() {
            local reason="$1" title existing
            node scripts/story-chatgpt-fallback-handoff.mjs --reason "$reason"
            title=$(jq -r '.issueTitle // empty' qa-reports/story-sequential-missing/chatgpt-handoff.json)
            if [ -z "$title" ]; then
              echo "::warning::No verified ChatGPT scene to hand off" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            existing=$(gh issue list --state open --limit 200 --json number,title |
              jq -r --arg title "$title" '.[] | select(.title==$title) | .number' | head -n 1)
            if [ -n "$existing" ]; then
              echo "ChatGPT Images request already open: issue #$existing ($title)" >> "$GITHUB_STEP_SUMMARY"
            else
              gh issue create --title "$title" \
                --body-file qa-reports/story-sequential-missing/chatgpt-handoff.md
              echo "Created ChatGPT Images request: $title" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "Actual ChatGPT images generated automatically by GitHub Actions: 0; user must generate in ChatGPT." >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$enabled" != true ] || [ -z "$stage" ]; then
            echo "Anime switch off or nothing pending; no generation" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$stage" =~ ^c01-s0[1-4]$ ]]; then
            # Reuse genuine exact historical art BEFORE spending a Free image call.
            git fetch --no-tags origin refs/heads/story/chapter1-free-actual-art:refs/remotes/origin/story/chapter1-free-actual-art
            git worktree add --detach "$RUNNER_TEMP/hai-gin-original-art" origin/story/chapter1-free-actual-art
            node scripts/restore-existing-story-art.mjs --mode scan --archive "$RUNNER_TEMP/hai-gin-original-art"
            available=$(jq -r '.eligibleExactUnused' qa-reports/story-archive-reuse-scan.json)
            if [ "$available" -gt 0 ]; then
              gh workflow run story-archive-reuse.yml --ref main
              echo "Found $available exact old CGs: requested reversible original restoration first." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "No further eligible exact original CGs; Free-only new review art can be attempted." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$stage" =~ ^c01-s(0[1-9]|10)$ ]]; then
            if [ "$CF_FREE" != true ]; then
              chatgpt_handoff CLOUDFLARE_NOT_CONFIGURED
              exit 0
            fi
            day=$(date -u +%Y-%m-%d)
            prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/story-chapter1-free-complete-draft-production.yml/runs?per_page=100" |
              jq --arg day "$day" '[.workflow_runs[] | select(.event=="workflow_dispatch" or .event=="push") |
              select(.created_at | startswith($day))] | length')
            if [ "$prior" -gt 0 ]; then
              echo "Today already used the single Cloudflare Free production dispatch; no duplicate call." >> "$GITHUB_STEP_SUMMARY"
              chatgpt_handoff FREE_DAILY_DISPATCH_ALREADY_USED
              exit 0
            fi
            gh workflow run story-chapter1-free-complete-draft-production.yml --ref main -f start_stage="$stage" -f through_stage=c01-s10
            echo "Triggered existing FREE Chapter 1 real draft production; not approval/deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Stage $stage: no Cloudflare Free chapter adapter; requesting ChatGPT Images scene production instead." >> "$GITHUB_STEP_SUMMARY"
            chatgpt_handoff NO_VERIFIED_FREE_ADAPTER
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manga-sequential-missing-200-stage-queue-${{ github.run_id }}
          path: qa-reports/story-sequential-missing/
          if-no-files-found: warn
          retention-days: 14
