name: Realtime deployment mobile performance
on:
  pull_request:
    paths:
      - 'src/battle-realtime-commands.js'
      - 'src/combat-action-runtime.js'
      - 'src/mass-battle-grid-sim.js'
      - 'src/mass-battle-worker-client.js'
      - 'src/mass-battle-worker-runtime.js'
      - 'src/battle-job-special-actions.js'
      - 'qa/battle-start-highground-shield-cover.test.mjs'
      - 'src/battle-realtime-commands.css'
      - 'src/battle-target-japanese-flow.js'
      - 'qa/battle-skill-first-japanese-targets.test.mjs'
      - 'tactics-wireframe.html'
      - 'qa/realtime-deployment-mobile-performance.test.mjs'
      - '.github/workflows/realtime-deployment-mobile-performance.yml'
  push:
    branches: [main]
    paths:
      - 'src/battle-realtime-commands.js'
      - 'src/combat-action-runtime.js'
      - 'src/mass-battle-grid-sim.js'
      - 'src/mass-battle-worker-client.js'
      - 'src/mass-battle-worker-runtime.js'
      - 'src/battle-job-special-actions.js'
      - 'qa/battle-start-highground-shield-cover.test.mjs'
      - 'src/battle-realtime-commands.css'
      - 'src/battle-target-japanese-flow.js'
      - 'qa/battle-skill-first-japanese-targets.test.mjs'
      - 'tactics-wireframe.html'
      - 'qa/realtime-deployment-mobile-performance.test.mjs'
      - '.github/workflows/realtime-deployment-mobile-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Realtime deployment syntax and UI
        run: |
          node --check src/battle-realtime-commands.js
          node --check src/battle-target-japanese-flow.js
          node --check src/combat-action-runtime.js
          node --check src/mass-battle-grid-sim.js
          node --check src/mass-battle-worker-runtime.js
          node --test qa/realtime-deployment-mobile-performance.test.mjs qa/battle-skill-first-japanese-targets.test.mjs qa/battle-start-highground-shield-cover.test.mjs
