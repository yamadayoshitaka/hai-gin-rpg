name: RPG data architecture checks
on:
  push:
    branches: [main, 'develop/**']
  pull_request:
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic Three.js geometry dependency
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Current main head and category PR selection contract
        run: node --test qa/batch-live-ref-selection.test.mjs
      - name: Full replacement contract
        run: npm run test:full-replacement
      - name: Syntax and imports
        run: npm run test:syntax
      - name: Verify compact manga Free generation plan without calling Cloudflare
        run: |
          node --check scripts/generate-story-chapter1-free-batch.mjs
          node qa/story-chapter1-stage-priority.test.mjs
          node scripts/build-story-compact-production-queue.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('qa-reports/story-compact-production-queue.json','utf8'));
          assert.equal(q.result.total,880);
          assert.equal(q.entries.length,880);
          assert.equal(q.result.genderVariantsObserved,1760);
          assert.equal(q.result.exactGenderReuse+q.result.missingExactGenderArt,1760);
          assert.equal(q.result.reused+q.result.missing,880);
          assert.equal(q.result.provenNeutralShares,0);
          console.log('PASS: 880 minimum scene IDs; gender variants remain audit-protected');
          NODE
      - name: Architecture and blueprint
        run: npm run test:comprehensive && npm run test:architecture && npm run test:blueprints && npm run test:actors && npm run test:components
      - name: Rules and object systems
        run: npm run test:data-systems && npm run test:entities && npm run test:gameplay && npm run test:town
      - name: Interior maps, floors, and carpets
        run: npm run test:interiors && npm run test:areas && npm run test:decor && npm run test:building-data
      - name: Castle, stairs, and conversations
        run: npm run test:castle-stairs && npm run test:interactions && npm run test:bom && npm run test:exterior-bom && npm run test:info-bom && npm run test:humans

      - name: Character job appearance and seven-action regression
        run: npm run test:actions

      - name: Audit six-point body rig and appearance requirements
        continue-on-error: true
        run: node qa/full-body-six-point-audit.test.mjs

      - name: Seven-action quality matrix (40 character recipes)
        run: node qa/action-quality-matrix.test.mjs
      - name: Upload action quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-action-quality-report
          path: qa-reports/action-quality-report.json
          if-no-files-found: ignore
