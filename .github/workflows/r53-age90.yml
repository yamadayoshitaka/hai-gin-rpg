name: R53 nine-age five-build Blender studies
on:
  push:
    branches: [r53-fixed-face-review]
    paths:
      - 'scripts/r53-blender-age90.py'
      - 'scripts/r53-age90-inventory.py'
      - '.github/workflows/r53-age90.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sex: [female, male]
        band:
          - {name: early, ages: 'under10,teens,20s'}
          - {name: middle, ages: '30s,40s,50s'}
          - {name: late, ages: '60s,70s,80plus'}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            assets/character-review
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil xvfb libgl1-mesa-dri xauth
          blender -b --python-exit-code 1 --python-expr 'import numpy; print(numpy.__version__)'
      - name: Generate rigged GLB and orthographic evidence
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SEX: ${{ matrix.sex }}
          AGES: ${{ matrix.band.ages }}
        run: |
          mkdir -p review/r53-age90
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-age90.py -- assets/character-review review/r53-age90 "$SEX" "$AGES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-age90-${{ matrix.sex }}-${{ matrix.band.name }}
          path: review/r53-age90/
          if-no-files-found: error
          retention-days: 30
  inventory:
    if: always()
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: r53-age90-*
          path: review/shards
      - name: Verify every model and produce comparison sheets
        if: always()
        run: |
          python3 -m pip install pillow
          python3 scripts/r53-age90-inventory.py review/shards review/r53-age90-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-age90-summary
          path: review/r53-age90-summary/
          if-no-files-found: error
          retention-days: 30
