function refresh(){for(const id of ['move','attack','ability']){$(id).classList.toggle('active',mode===id);$(id).disabled=enemyTurn||finished||combatBusy||(id==='move'&&moveUsed)||(id==='attack'&&attackUsed)}$('wait').disabled=enemyTurn||finished||combatBusy;const a=actors[selected];if(a&&jobMap)updateMotionOptions();$('selected').textContent=a?'ターン '+turnNumber+' / '+(enemyTurn?'敵':'味方')+'　'+a.name+' HP '+a.hp+'/'+a.maxHp+'　敵 HP '+(actors.find(b=>b.enemy)?.hp??'--')+'　移動 '+(moveUsed?'済':'可')+' / 攻撃 '+(attackUsed?'済':'可'):'読み込み中';actors.forEach((a,i)=>{a.marker.material.color.setHex(i===selected?0xffdc72:a.enemy?0xff6262:0x65e5ff)});updateMoveMarkers(a);const reachableTiles=null;for(const t of tiles){const a=actors[selected],dist=a?Math.abs(a.x-t.x)+Math.abs(a.z-t.z):99;const allowed=!enemyTurn&&!moveUsed&&!finished&&mode==='move'&&a&&!a.enemy&&inMoveRadius(a,t.x,t.z)&&!actors.some(b=>b!==a&&b.hp>0&&b.x===t.x&&b.z===t.z)&&!actors.some(b=>b!==a&&b.x===t.x&&b.z===t.z);const enemy=actors.find(b=>b.enemy&&b.hp>0);const targetable=mode==='attack'&&!attackUsed&&enemy&&a&&Math.abs(a.x-enemy.x)+Math.abs(a.z-enemy.z)<=2&&Math.abs(t.x-enemy.x)<=1&&Math.abs(t.z-enemy.z)<=1;if(!t.top)continue;t.top.material.opacity=targetable?.4:allowed?.32:0;t.top.material.color.setHex(targetable?0xf15a53:0x2b82f0)}}
async function action(actor,state){
 if(!actor.character)return false;
 try{const ok=await actor.character.play(state);if(ok){actor.activeState=state;if(state==='attack')actor.attackUntil=performance.now()+1100}return ok}
 catch(e){log(actor.name+' '+state+': '+e.message);return false}
}
async function init(){
 try{jobMap=(await (await fetch('./job-command-motion-map.json?v=d0938be1',{cache:'no-store'})).json()).jobs}
 catch(e){log('職業モーション定義: '+e.message);return}
 $('jobSelect').replaceChildren(...Object.keys(jobMap).map(job=>new Option(job,job)));
 for(const spec of specs){
  const root=new THREE.Group();root.position.copy(cellWorld(spec.x,spec.z));scene.add(root);
  const actor={...spec,root,character:null,travel:null,hp:spec.enemy?70:100,maxHp:spec.enemy?70:100,mp:spec.enemy?20:30,maxMp:spec.enemy?20:30};indicator(actor);makeStatusLabel(actor);actors.push(actor);
  try{
   const character=await createCharacter({job:spec.job,sex:spec.sex,height:.95,jobs:jobMap,jumpLift:0});
   actor.character=character;root.add(character.object3D);
   character.model.rotation.y=0;
   await action(actor,'idle');
  }catch(e){log(spec.name+' モデル読込失敗: '+e.message)}
 }
 refresh();if(!actors.some(a=>a.character))log('共通キャラクターの読み込みに失敗しました');
}
// Free exploration: every map cell can be selected, regardless of height or water.
const MOVE_RADIUS=5;
const moveMarkers=new THREE.Group();scene.add(moveMarkers);
const moveMarkerGeo=new THREE.CircleGeometry(CELL*.39,20);
const moveMarkerMat=new THREE.MeshBasicMaterial({color:0x40a8ff,transparent:true,opacity:.36,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2});
function inMoveRadius(actor,x,z){return (x-actor.x)**2+(z-actor.z)**2<=MOVE_RADIUS**2}
function updateMoveMarkers(actor){moveMarkers.clear();if(!actor||actor.enemy||moveUsed||enemyTurn||finished||mode!=='move')return;
for(let dz=-MOVE_RADIUS;dz<=MOVE_RADIUS;dz++)for(let dx=-MOVE_RADIUS;dx<=MOVE_RADIUS;dx++){const x=actor.x+dx,z=actor.z+dz;if(!inMoveRadius(actor,x,z)||x<0||z<0||x>=WORLD_SIZE||z>=WORLD_SIZE||(dx===0&&dz===0)||actors.some(b=>b!==actor&&b.hp>0&&b.x===x&&b.z===z))continue;
const marker=new THREE.Mesh(moveMarkerGeo,moveMarkerMat);marker.rotation.x=-Math.PI/2;marker.position.set((x-6)*CELL,smoothHeight(x,z)+.055,(z-6)*CELL);moveMarkers.add(marker)}}
function routeTo(actor,tx,tz){if(!inMoveRadius(actor,tx,tz)||tx<0||tz<0||tx>=WORLD_SIZE||tz>=WORLD_SIZE)return null;const start=actor.x+','+actor.z,goal=tx+','+tz,prev=new Map([[start,null]]),queue=[[actor.x,actor.z]];for(let i=0;i<queue.length;i++){const [x,z]=queue[i],key=x+','+z;if(key===goal)break;for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,nz=z+dz,k=nx+','+nz;if(nx<0||nz<0||nx>=WORLD_SIZE||nz>=WORLD_SIZE||!inMoveRadius(actor,nx,nz)||prev.has(k)||actors.some(b=>b!==actor&&b.hp>0&&b.x===nx&&b.z===nz))continue;prev.set(k,key);queue.push([nx,nz])}}if(!prev.has(goal))return null;const route=[];for(let k=goal;k!==start;k=prev.get(k)){const [x,z]=k.split(',').map(Number);route.push([x,z])}return route.reverse()}
function selectTile(t){if(enemyTurn||finished||combatBusy)return;const a=actors[selected];const other=actors.findIndex(b=>b.x===t.x&&b.z===t.z);
 if(mode==='place'&&a&&!a.enemy){const dest=cellWorld(t.x,t.z);faceToward(a,dest);mode='move';log('向きを設定しました');refresh();return}
 if(other>=0){
  const target=actors[other];showStatus(target);
  if(target.enemy&&mode==='attack'&&!attackUsed&&a&&!a.enemy){
   const dist=Math.abs(a.x-t.x)+Math.abs(a.z-t.z);
   if(dist>2){log('射程外です。2マス以内へ移動してください');return}
   attackUsed=true;
   faceToward(a,target.root.position);showStatus(a,4500);showStatus(target,4500);
   performHit(a,target,35);refresh();
  }else if(target.enemy)log('攻撃コマンドを選んでください');
  return;
 }
 if(mode!=='move'||!a||a.enemy||a.travel||moveUsed){if(moveUsed)log('このターンは移動済みです。ターン終了で次の移動ができます');return;}
 if(!inMoveRadius(a,t.x,t.z)){log('移動範囲外です。自分を中心に半径5マス以内を選択してください');return}const path=routeTo(a,t.x,t.z);if(!path?.length){log('移動できません。マップ内の別のマスを選択してください');return;}
 startTravel(a,path[0][0],path[0][1]);a.travelQueue=path.slice(1);moveUsed=true;followCamera=true;cameraTween=null;refresh();log('目的地まで移動中：'+path.length+'マス（半径5マス以内）');
}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>18)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(ground,false);if(mode==='attack'){
 const enemy=actors.find(a=>a.enemy&&a.hp>0),hero=actors[selected];
 if(enemy&&hero&&!attackUsed){
  const p=enemy.root.position,hitPoint=new THREE.Vector3();
  const screen=p.clone().project(camera);
  const sx=rect.left+(screen.x+1)*rect.width/2,sy=rect.top+(1-screen.y)*rect.height/2;
  const distPx=Math.hypot(e.clientX-sx,e.clientY-sy);
  const tileHit=hits[0]&&tileMap.get(Math.floor(hits[0].point.x/CELL+6.5)+','+Math.floor(hits[0].point.z/CELL+6.5));
  if(distPx<85||(tileHit&&Math.abs(tileHit.x-enemy.x)<=1&&Math.abs(tileHit.z-enemy.z)<=1)){selectTile(tileMap.get(enemy.x+','+enemy.z));return}
 }
}{const hit=hits[0];if(!hit){log('地形の外側は移動できません');return}const x=Math.floor(hit.point.x/CELL+6.5),z=Math.floor(hit.point.z/CELL+6.5);if(x<0||z<0||x>=WORLD_SIZE||z>=WORLD_SIZE){log('マップ範囲外です');return}const selectedTile=tileMap.get(x+','+z);if(selectedTile)selectTile(selectedTile)}});
async function playReaction(actor,states){
 if(!actor.character)return false;
 for(const state of states){
  try{if(await actor.character.play(state)){actor.activeState=state;return true}}catch(e){}
 }
 return false;
}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function performHit(attacker,target,amount){
 combatBusy=true;refresh();
 faceToward(attacker,target.root.position);
 await action(attacker,'attack');
 await delay(260);
 target.hp=Math.max(0,target.hp-amount);updateStatusLabel(target);showStatus(target,4000);
 log(target.name+' に '+amount+' ダメージ！ 残りHP '+target.hp);
 if(target.hp>0){
  await playReaction(target,['hit','hurt','damage','被弾','受け','被弾リアクション']);
  target.reaction={start:performance.now(),duration:650,fall:false};
  refresh();await delay(700);
  if(!finished)await action(target,'idle');
 }else{
  await playReaction(target,['death','dead','die','戦闘不能','倒れる']);
  target.reaction={start:performance.now(),duration:1150,fall:true};
  finished=true;enemyTurn=false;
  refresh();await delay(1400);
  $('outcome').textContent=target.enemy?'VICTORY':'GAME OVER';
  $('resultDetail').textContent='ターン '+turnNumber+' で戦闘終了';
  $('endScreen').style.display='flex';
 }
 combatBusy=false;refresh();
}

function faceToward(actor,point){const dx=point.x-actor.root.position.x,dz=point.z-actor.root.position.z;if(Math.hypot(dx,dz)>.001)actor.root.rotation.y=Math.atan2(dx,dz)}
function startTravel(a,x,z){
 const from=a.root.position.clone(),to=cellWorld(x,z);
 faceToward(a,to);
 const jumping=elevation(a.x,a.z)!==elevation(x,z);
 const d=Math.abs(a.x-x)+Math.abs(a.z-z);
 a.travel={from,to,elapsed:0,duration:jumping?.22:Math.max(.14,d*.17),jumping};
 a.x=x;a.z=z;action(a,jumping?'jump':'walk');
}
function waitTravel(a){return new Promise(resolve=>{
 function check(){if(!a.travel)resolve();else requestAnimationFrame(check)}
 check();
})}
async function runEnemyTurn(){
 if(enemyTurn||finished||combatBusy||actors.some(a=>a.travel))return;
 enemyTurn=true;mode='enemy';refresh();log('敵のターン');
 const hero=actors.find(a=>!a.enemy);
 for(const enemy of actors.filter(a=>a.enemy&&a.character)){
  if(!hero||finished)break;
  let dist=Math.abs(enemy.x-hero.x)+Math.abs(enemy.z-hero.z);
  if(dist>2){
   const candidates=tiles.filter(t=>{
    const step=Math.abs(t.x-enemy.x)+Math.abs(t.z-enemy.z);
    return !isBlocked(t.x,t.z)&&step>0&&step<=3&&Math.abs(t.h-elevation(enemy.x,enemy.z))<=2
     &&!actors.some(a=>a!==enemy&&a.x===t.x&&a.z===t.z);
   }).sort((a,b)=>(Math.abs(a.x-hero.x)+Math.abs(a.z-hero.z))-(Math.abs(b.x-hero.x)+Math.abs(b.z-hero.z)));
   const dest=candidates.find(t=>Math.abs(t.x-hero.x)+Math.abs(t.z-hero.z)<dist);
   if(dest){startTravel(enemy,dest.x,dest.z);refresh();await waitTravel(enemy)}
  }
  dist=Math.abs(enemy.x-hero.x)+Math.abs(enemy.z-hero.z);
  if(dist<=2){
   faceToward(enemy,hero.root.position);
   await performHit(enemy,hero,20);
   await new Promise(resolve=>{const until=performance.now()+1150;function check(){if(performance.now()>=until)resolve();else requestAnimationFrame(check)}check()});
  }else log('敵兵が接近しました');
 }
 if(finished)return;enemyTurn=false;turnNumber++;moveUsed=false;attackUsed=false;selected=0;mode='move';refresh();
 log('ターン '+turnNumber+'：味方の行動');
}
$('move').onclick=()=>{if(enemyTurn||moveUsed)return;mode='move';refresh()};
$('attack').onclick=()=>{showStatus(actors[selected],3000);showStatus(actors.find(a=>a.enemy),3000);if(enemyTurn||attackUsed)return;mode='attack';refresh();log('たたかう：射程2マス以内の敵をタップしてください')};
$('ability').onclick=()=>{if(enemyTurn||finished)return;mode='place';refresh();log('向きを変えるマスをタップしてください。移動先は「移動」から選択します')};
$('wait').onclick=runEnemyTurn;
addEventListener('resize',()=>{camera.aspect=innerWidth/Math.max(200,innerHeight-94);camera.updateProjectionMatrix();renderer.setSize(innerWidth,Math.max(200,innerHeight-94))});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);for(const a of actors){a.character?.update(dt);if(a.travel){a.travel.elapsed+=dt;const t=Math.min(1,a.travel.elapsed/a.travel.duration);a.root.position.lerpVectors(a.travel.from,a.travel.to,t);if(a.travel.jumping)a.root.position.y+=Math.sin(Math.PI*t)*1.25;if(t>=1){a.root.position.copy(a.travel.to);a.travel=null;if(a.travelQueue?.length){const [nx,nz]=a.travelQueue.shift();startTravel(a,nx,nz)}else{a.travelQueue=null;action(a,'idle')}}}if(a.reaction){const t=Math.min(1,(performance.now()-a.reaction.start)/a.reaction.duration);const kick=Math.sin(Math.PI*t);a.character?.object3D&&(a.character.object3D.rotation.z=a.reaction.fall?Math.PI*.47*t:Math.sin(Math.PI*t)*.18);if(a.reaction.fall){a.character.object3D.position.y=-.38*t}else{a.character.object3D.position.z=-.16*kick}if(t>=1&&!a.reaction.fall){a.character.object3D.rotation.z=0;a.character.object3D.position.z=0;a.reaction=null}}if(a.activeState==='attack'&&a.attackUntil&&performance.now()>=a.attackUntil){a.attackUntil=0;action(a,'idle')}}if(riverFlow)riverFlow.offset.y-=dt*.07;if(cameraTween){cameraTween.elapsed=Math.min(cameraTween.duration,cameraTween.elapsed+dt);const k=cameraTween.elapsed/cameraTween.duration,e=k*k*(3-2*k);controls.target.lerpVectors(cameraTween.startTarget,cameraTween.target,e);camera.position.lerpVectors(cameraTween.startPosition,cameraTween.position,e);if(k>=1)cameraTween=null}else if(followCamera&&actors[selected]){const p=actors[selected].root.position;const delta=p.clone().sub(controls.target).multiplyScalar(Math.min(1,dt*2));controls.target.add(delta);camera.position.add(delta)}controls.update();positionStatusLabels();renderer.render(scene,camera)}animate();init();
</script></body></html>
