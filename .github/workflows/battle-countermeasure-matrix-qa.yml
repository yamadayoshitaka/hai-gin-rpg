name: Battle situation matrix and multi-counter QA
on:
  push:
    branches:
      - 'feat/battle-situation-countermeasure-matrix-*'
  pull_request:
    paths:
      - 'src/battle-countermeasure-situation-matrix.js'
      - 'src/battle-tactics-preset-policy.js'
      - 'tactics-wireframe.html'
      - 'qa/battle-situation-countermeasure-matrix.test.mjs'
      - '.github/workflows/battle-countermeasure-matrix-qa.yml'
  workflow_dispatch:
jobs:
  situation-countermeasures:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full combat situation matrix and multiple counters
        run: node qa/battle-situation-countermeasure-matrix.test.mjs
      - name: Existing commander pacing, coordinated strategy and UI
        run: |
          node qa/battle-coordinated-tactics-counters.test.mjs
          node qa/battle-tactics-preset.test.mjs
      - name: Battle victories, roles and mass formations
        run: |
          node qa/battle-stage-objective-job-squads.test.mjs
          node qa/battle-objective-opposed-sides.test.mjs
          node qa/mass-battle-formations.test.mjs
          node qa/squad-formation-three-types.test.mjs
      - name: Game-core integration
        run: node --experimental-vm-modules qa/game-core-contract.test.mjs
