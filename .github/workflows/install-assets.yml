name: Install 3D assets automatically
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-assets.yml'
      - 'install-models.py'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download CC0 model assets
        run: python install-models.py
      - name: Commit installed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || (git commit -m "Install 3D model assets" && git push)
