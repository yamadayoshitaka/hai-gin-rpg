name: Job squads and battle objectives QA
on:
  push:
    branches:
      - 'feat/job-squads-and-battle-objectives-*'
  pull_request:
    paths:
      - 'src/battle-stage-objective.js'
      - 'src/battle-objective-runtime.js'
      - 'src/battle-uniform-job-squads.js'
      - 'src/mass-battle-formations.js'
      - 'src/core-battle-bridge.js'
      - 'tactics-wireframe.html'
      - 'qa/battle-stage-objective-job-squads.test.mjs'
      - '.github/workflows/battle-stage-objectives-qa.yml'
  workflow_dispatch:
jobs:
  gameplay-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mission objectives and job squads
        run: node qa/battle-stage-objective-job-squads.test.mjs
      - name: Mass battle formations and grid collisions
        run: node qa/mass-battle-formations.test.mjs
      - name: Existing formation/Worker synchronization
        run: node qa/squad-formation-three-types.test.mjs
      - name: Story/game-core battles
        run: |
          node --experimental-vm-modules qa/game-core-contract.test.mjs
          node qa/story-battle-bridge.test.mjs
      - name: Battle UI contract
        run: node qa/battle-squad-ribbons-and-loading.test.mjs
