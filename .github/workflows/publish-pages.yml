name: Publish RPG Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Experimental male chest fitting']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Pages may take longer than the action's 10-minute default to sync the
    # uncompressed 3D textures and motion libraries. Keep every quality asset.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Reject corrupted public HTML and JavaScript blobs
        run: node qa/pages-publication-integrity.cjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
