name: OOP Refactor Validation
on:
  workflow_dispatch:
jobs:
  domain-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime modules and RPG rules
        run: npm run test:all
