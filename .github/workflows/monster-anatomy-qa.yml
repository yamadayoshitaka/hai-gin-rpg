name: Monster anatomy, joints and mesh quality (50 species)
on:
  pull_request:
    paths:
      - 'src/monster-anatomy-reference.js'
      - 'src/monster-joint-motion.js'
      - 'src/monster-animation.js'
      - 'src/monster-geometry.js'
      - 'src/monster-shape-kit.js'
      - 'qa/monster-anatomy-motion.test.mjs'
      - 'data/monster-realism-progress.json'
      - 'qa/monster-realism-progress.test.mjs'
      - '.github/workflows/monster-anatomy-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monster-anatomy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry-and-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and lint real mesh and motion modules
        shell: bash
        run: |
          set -euo pipefail
          for file in src/monster-anatomy-reference.js src/monster-joint-motion.js src/monster-animation.js src/monster-geometry.js; do
            node --check "$file"
          done
      - name: Install pinned Three.js geometry runtime
        run: npm install --no-save --package-lock=false three@0.180.0
      - name: Run every-monster anatomy / action / reference test and baseline mesh contracts
        run: |
          node --test qa/monster-anatomy-motion.test.mjs qa/monster-bestiary.test.mjs qa/monster-realism-progress.test.mjs
      - name: Assert no human-character assets entered patch
        env:
          GH_BASE: '${{ github.event.pull_request.base.sha }}'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$GH_BASE" ]]; then
            git fetch --no-tags origin "$GH_BASE" --depth=1
            FILES="$(git diff --name-only "$GH_BASE" HEAD)"
            if grep -E '(^src/(master-heroine|character-|humanoid|facial-|combat-humanoid)|\.glb$|^assets/humans/)' <<<"$FILES"; then
              echo 'Forbidden human model or mesh change' >&2
              exit 1
            fi
          fi
