permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install head-and-shield geometry test runtime
        run: npm install --no-save --ignore-scripts --no-audit --no-fund three@0.180.0
      - name: JavaScript syntax and late-battle state tests
        run: |
          node --check src/mount-interior-policy.js
          node --check src/combat-action-runtime.js
          node --check src/mass-battle-grid-sim.js
          node --check src/battle-unit-display-identity.js
          node --check src/face-scalp-wig.js
          node --check src/character-system/riding-pose.js
          node --check src/character-system/battle-torso-lining.js
          node --check src/skirmish-distance-impostors.js
          node --check src/character-system/hair-attachment-runtime.js
          node --check src/character-system/battle-artist-head-graft.js
          node --check src/battle-person-pov-camera.js
          node --check src/battle-overview-squad-pins.js
          node --check src/targeted-strategy-runtime.js
          node --check src/battle-ceremony.js
