<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オブジェクト一覧｜灰銀のレゾナンス</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2b;color:#eef4fa;font:15px system-ui}header{background:#1b3045;padding:12px;display:flex;gap:16px;align-items:center}a{color:#a5ddff}main{height:calc(100dvh - 51px);display:flex;flex-direction:column}nav{padding:10px;background:#17293c;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{background:#295b7d;border:1px solid #6b9dbb;border-radius:7px;color:white;padding:10px;font-size:15px}#catalog{display:flex;gap:8px;padding:8px;background:#14263a;overflow-x:auto}#catalog button{white-space:nowrap;flex:0 0 auto}#catalog button.active{background:#a17d49;border-color:#ffdb9c;color:#fff}#view{position:relative;flex:1;min-height:280px;touch-action:none}canvas{display:block}#stats{position:absolute;top:8px;left:8px;background:#132b3cc9;border-radius:6px;padding:8px;font-size:12px}#status{font-size:12px;color:#bfd3df}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><a href="./index.html">← メニュー</a><b>オブジェクト一覧</b></header><main><nav><label>オブジェクト <select id="object"><option value="tree">木</option><option value="flower_tree">花木</option><option value="timber_bridge_001">橋（木製）</option><option value="stone_bridge_001">石橋（幅3マス）</option><option value="rocky_mountain_001">岩山（9×9マス）</option><option value="swamp_001">沼地（9×9マス）</option><option value="small_hill_001">小山（20×20マス）</option><option value="stone_hut_001">石小屋（20×20マス）</option><option value="castle_001">城</option><option value="church_001">教会</option><option value="weapon_shop_001">武器屋</option><option value="inn_001">宿屋</option><option value="item_shop_001">道具屋</option><option value="town_house_001">民家</option><option value="manor_noble_001">貴族の石造屋敷</option><option value="manor_merchant_001">豪商の屋敷</option><option value="manor_garden_001">庭園付き領主館</option><option value="fountain_001">石造噴水</option><option value="market_stall_001">市場の露店</option><option value="street_lamp_001">街灯</option><option value="town_bench_001">街のベンチ</option><option value="town_well_001">石造井戸</option><option value="town_planter_001">花壇</option><option value="town_crate_001">荷箱</option><option value="town_notice_001">掲示板</option><option value="town_fence_001">木柵</option><option value="stone_fence_001">石の柵</option><option value="town_trash_bin_001">街のゴミ箱</option><option value="town_handcart_001">木製荷車</option><option value="rice_paddy_001">水田</option><option value="vegetable_field_001">畑</option></select></label><label>季節 <select id="season"><option value="spring">春</option><option value="summer" selected>夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label><label>状態 <select id="effect"><option value="normal">通常</option><option value="break">折れる</option><option value="burn">燃える</option><option value="freeze">凍る</option></select></label><button id="export">GLB保存</button><span id="status">3Dモデルを生成中…</span><span id="pbrStatus" style="font-size:12px;color:#ffd98e">実写PBR: 読込待ち</span></nav><div id="view"><div id="stats">回転：ドラッグ / 拡大：ピンチ</div></div></main><script type="module" src="./src/tree-seasons.js?v=manors-roof-38"></script><script>window.addEventListener('cottage-texture-status',e=>{const states=window.__cottageTextureStatus||{};const entries=Object.entries(states);const ok=entries.filter(([,v])=>v.ok).length;const fail=entries.filter(([,v])=>!v.ok).length;const el=document.getElementById('pbrStatus');if(el){el.textContent='実写PBR: '+ok+'成功 / '+fail+'失敗'+(fail?'（従来テクスチャ表示）':'');el.style.color=fail?'#ff8e8e':'#a7f0b0'}})</script></body></html>
