name: Import Quaternius CC0 motion library
on:
  workflow_dispatch:
  push:
    paths:
      - tools/import-quaternius-standard.py
      - .github/workflows/import-quaternius.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and unpack Standard GLB
        run: python tools/import-quaternius-standard.py
      - name: Commit imported CC0 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motions/quaternius/
          git diff --cached --quiet || (git commit -m "Import Quaternius Standard CC0 motion assets" && git push)
