      return lo.add(hi).multiplyScalar(.5);
    };
    const regionCenter=new THREE.Box3().setFromObject(piece).getCenter(new THREE.Vector3());
    const regionSamples=bodySamples.filter(v=>Math.abs(v.y-regionCenter.y)<bodyHeight*.075);
    let boneFitCompared=0,boneFitNarrow=0,boneFitLoose=0;
    const boneOrigin=new THREE.Vector3();bone.getWorldPosition(boneOrigin);
    if(regionSamples.length>=8){
      const anatomical=centerOf(regionSamples.map(v=>toBone(v.clone().sub(boneOrigin))));
      const anatomicalWorld=anatomical.clone().applyQuaternion(axisQ).add(boneOrigin);
      const center=new THREE.Box3().setFromObject(piece).getCenter(new THREE.Vector3());
      pivot.position.add(localDelta(anatomicalWorld.clone().sub(center)));
      pivot.updateWorldMatrix(true,true);
      const basePosition=pivot.position.clone(),baseScale=piece.scale.clone();
      // Compare the full 100-slice body/garment envelopes in bone coordinates.
      const bodyLocal=regionSamples.map(v=>toBone(v.clone().sub(boneOrigin)));
      const bodyWidth=Math.max(...bodyLocal.map(v=>v.x))-Math.min(...bodyLocal.map(v=>v.x));
      const bodyDepth=Math.max(...bodyLocal.map(v=>v.z))-Math.min(...bodyLocal.map(v=>v.z));
      let bestScore=Infinity,bestScale=1,bestPosition=basePosition.clone();
      for(const factor of [.8,.9,1,1.1,1.2,1.3,1.4]){
        piece.scale.copy(baseScale).multiplyScalar(factor);
        pivot.position.copy(basePosition);
        pivot.updateWorldMatrix(true,true);
        const candidate=new THREE.Box3().setFromObject(piece);
        const candidateCenter=candidate.getCenter(new THREE.Vector3());
        pivot.position.add(localDelta(anatomicalWorld.clone().sub(candidateCenter)));
        pivot.updateWorldMatrix(true,true);
        const box=new THREE.Box3().setFromObject(piece);
        const corners=[];
        for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])
          for(const z of [box.min.z,box.max.z])
            corners.push(toBone(new THREE.Vector3(x,y,z).sub(boneOrigin)));
        const width=Math.max(...corners.map(v=>v.x))-Math.min(...corners.map(v=>v.x));
        const depth=Math.max(...corners.map(v=>v.z))-Math.min(...corners.map(v=>v.z));
        const score=Math.abs(width/Math.max(bodyWidth,.001)-1.10)
          +Math.abs(depth/Math.max(bodyDepth,.001)-1.10);
        repairAttempts.push({scale:factor,shift:0,score:+score.toFixed(4)});
        if(score<bestScore){bestScore=score;bestScale=factor;bestPosition=pivot.position.clone();}
      }
      piece.scale.copy(baseScale).multiplyScalar(bestScale);
      pivot.position.copy(bestPosition);
      pivot.updateWorldMatrix(true,true);
    }
    finalBox=new THREE.Box3().setFromObject(piece);
    // Bone-oriented cross sections: evaluate widths AND center displacement.
    // These are envelope checks, not watertight collision checks.
    const sliceCount=100,garmentPoints=[];
    piece.updateWorldMatrix(true,true);
    piece.traverse(mesh=>{
      if(!mesh.isMesh||!mesh.geometry?.attributes?.position)return;
      const attr=mesh.geometry.attributes.position;
      const stride=Math.max(1,Math.floor(attr.count/3000));
      for(let vi=0;vi<attr.count;vi+=stride){
        const v=new THREE.Vector3().fromBufferAttribute(attr,vi).applyMatrix4(mesh.matrixWorld);
        if(Number.isFinite(v.x)&&Number.isFinite(v.y)&&Number.isFinite(v.z))
          garmentPoints.push(toBone(v.sub(boneOrigin)));
      }
    });
    const sampledBody=bodySamples.map(v=>toBone(v.clone().sub(boneOrigin)));
    const bounds=arr=>({
      minX:Math.min(...arr.map(v=>v.x)),maxX:Math.max(...arr.map(v=>v.x)),
      minZ:Math.min(...arr.map(v=>v.z)),maxZ:Math.max(...arr.map(v=>v.z))
    });
    const minY=Math.min(...garmentPoints.map(v=>v.y)),maxY=Math.max(...garmentPoints.map(v=>v.y));
    const sliceStep=Math.max((maxY-minY)/sliceCount,.0001);
    const tolerance=sliceStep*2;
    let sliceCompared=0,sliceNarrow=0,sliceLoose=0,sliceDisplaced=0;
    const sliceDetails=[];
    for(let si=0;si<sliceCount;si++){
      const y=minY+(si+.5)*sliceStep;
      const bp=sampledBody.filter(v=>Math.abs(v.y-y)<=tolerance);
      const gp=garmentPoints.filter(v=>Math.abs(v.y-y)<=tolerance);
      if(bp.length<4||gp.length<4)continue;
      const bb=bounds(bp),gg=bounds(gp);
      const bw=Math.max(bb.maxX-bb.minX,.001),bd=Math.max(bb.maxZ-bb.minZ,.001);
      const gw=gg.maxX-gg.minX,gd=gg.maxZ-gg.minZ;
      const narrow=gw<bw*.93||gd<bd*.93;
      const loose=gw>bw*1.6||gd>bd*1.6;
      const overlapX=Math.max(0,Math.min(bb.maxX,gg.maxX)-Math.max(bb.minX,gg.minX));
      const overlapZ=Math.max(0,Math.min(bb.maxZ,gg.maxZ)-Math.max(bb.minZ,gg.minZ));
      const displaced=overlapX<Math.min(bw,gw)*.35||overlapZ<Math.min(bd,gd)*.35
        ||Math.abs((gg.minX+gg.maxX-bb.minX-bb.maxX)*.5)>bw*.3
        ||Math.abs((gg.minZ+gg.maxZ-bb.minZ-bb.maxZ)*.5)>bd*.3;
      sliceCompared++;
      if(narrow)sliceNarrow++;
      if(loose)sliceLoose++;
      if(displaced)sliceDisplaced++;
      if(narrow||loose||displaced) sliceDetails.push({slice:si,narrow,loose,displaced});
    }
    window.__outfitFitReport.push({file:piece.name,region,offset:+offset.toFixed(3),oversized,
      slices:sliceCount,compared:sliceCompared,narrow:sliceNarrow,loose:sliceLoose,displaced:sliceDisplaced,
      sliceDetails:sliceDetails.slice(0,12),repairAttempts:repairAttempts.length,repairBest:repairAttempts.length?repairAttempts.reduce((a,b)=>a.score<b.score?a:b):null,sliceMethod:'bone-local-envelope-center-overlap',

      width:+(finalSize.x/bodyHeight).toFixed(3),height:+(finalSize.y/bodyHeight).toFixed(3),
      bone:bone.name,rigged:false,bodySamples:bodySamples.length});
    // Physically partition paired rigid armor by triangle centroid, preserving
    // original mesh materials/UVs. Each side follows its own joint.
    let splitParts=0;
    if(region==='hands'||region==='feet'||region==='legs'){
      const pairs=region==='hands'?[/hand.*(?:_l|left|\\.l)$/i,/hand.*(?:_r|right|\\.r)$/i]:
        region==='feet'?[/foot.*(?:_l|left|\\.l)$|ankle.*(?:_l|left|\\.l)$/i,
                         /foot.*(?:_r|right|\\.r)$|ankle.*(?:_r|right|\\.r)$/i]:
                        [/(?:thigh|upleg|upper_leg).*?(?:_l|left|\\.l)$/i,
                         /(?:thigh|upleg|upper_leg).*?(?:_r|right|\\.r)$/i];
      const joints=pairs.map(p=>bones.find(b=>p.test(b.name)));
      if(joints.every(Boolean)){
        character.updateWorldMatrix(true,true);
        piece.updateWorldMatrix(true,true);
        const jointX=joints.map(j=>j.getWorldPosition(new THREE.Vector3()).x);
        const sourceMeshes=[];
        piece.traverse(m=>{if(m.isMesh&&m.geometry?.attributes?.position)sourceMeshes.push(m);});
        for(const src of sourceMeshes){
          const geom=src.geometry.toNonIndexed? (src.geometry.index?src.geometry.toNonIndexed():src.geometry.clone()):null;
          if(!geom)continue;
          const pos=geom.attributes.position;
          const sets=[[],[]];
          for(let i=0;i+2<pos.count;i+=3){
            const centroid=new THREE.Vector3();
            for(let k=0;k<3;k++)centroid.add(new THREE.Vector3().fromBufferAttribute(pos,i+k).applyMatrix4(src.matrixWorld));
            centroid.multiplyScalar(1/3);
            const side=Math.abs(centroid.x-jointX[0])<=Math.abs(centroid.x-jointX[1])?0:1;
            sets[side].push(i,i+1,i+2);
          }
          for(let side=0;side<2;side++){
            if(!sets[side].length)continue;
            const out=new THREE.BufferGeometry();
            for(const key of Object.keys(geom.attributes)){
              const attr=geom.attributes[key],array=new attr.array.constructor(sets[side].length*attr.itemSize);
              sets[side].forEach((idx,n)=>{
                for(let k=0;k<attr.itemSize;k++)array[n*attr.itemSize+k]=attr.array[idx*attr.itemSize+k];
              });
              out.setAttribute(key,new THREE.BufferAttribute(array,attr.itemSize,attr.normalized));
            }
            const part=new THREE.Mesh(out,src.material);
            part.name=piece.name+'-'+(side===0?'left':'right');
            part.position.copy(src.getWorldPosition(new THREE.Vector3()));
            part.quaternion.copy(src.getWorldQuaternion(new THREE.Quaternion()));
            part.scale.copy(src.getWorldScale(new THREE.Vector3()));
            scene.add(part);
            joints[side].attach(part);
            // Register each rigid fragment to its own skin-weighted anatomy.
            // Work in the joint frame so animated limb rotation is preserved.
            const joint=joints[side];
            const owned=[];
            for(const [owner,points] of bodyByBone){
              if(owner===joint||owner.parent===joint||joint.parent===owner)owned.push(...points);
            }
            if(owned.length>=4){
              const inverse=joint.getWorldQuaternion(new THREE.Quaternion()).invert();
              const origin=joint.getWorldPosition(new THREE.Vector3());
              const bodyLocal=owned.map(p=>p.clone().sub(origin).applyQuaternion(inverse));
              const bodyBounds=new THREE.Box3().setFromPoints(bodyLocal);
              const bodyCenter=bodyBounds.getCenter(new THREE.Vector3());
              part.updateWorldMatrix(true,false);
              const partPoints=[];
              const positions=part.geometry.attributes.position;
              for(let vi=0;vi<positions.count;vi+=Math.max(1,Math.floor(positions.count/2500)))
                partPoints.push(new THREE.Vector3().fromBufferAttribute(positions,vi)
                  .applyMatrix4(part.matrixWorld).sub(origin).applyQuaternion(inverse));
              const partBounds=new THREE.Box3().setFromPoints(partPoints);
              const partCenter=partBounds.getCenter(new THREE.Vector3());
              const partSize=partBounds.getSize(new THREE.Vector3());
              const bodySize=bodyBounds.getSize(new THREE.Vector3());
              // Safe rigid fit: preserve original armor geometry and topology.
              // Source assets may contain decorative plates rather than tubes;
              // never warp all their vertices onto a synthetic bone cylinder.
              const childJoint=joint.children.find(n=>n.isBone);
              const segment=childJoint?childJoint.position.clone():new THREE.Vector3(0,bodySize.y,0);
              if(segment.lengthSq()<1e-8)segment.set(0,Math.max(bodySize.y,.01),0);
              const boneLength=segment.length();
              const originalPosition=part.position.clone();
              const originalRotation=part.quaternion.clone();
              const originalScale=part.scale.clone();
              const parentScale=joint.getWorldScale(new THREE.Vector3());
              // Use a conservative uniform fit for decorative/flat fragments.
              // This avoids 100x expansions from near-zero source thickness.
              const sourceExtent=Math.max(partSize.x,partSize.y,partSize.z,.001);
              const targetExtent=Math.max(bodySize.x,bodySize.y,bodySize.z,.01);
              const factor=THREE.MathUtils.clamp(targetExtent/sourceExtent,.65,1.45);
              part.scale.multiplyScalar(factor);
              part.updateWorldMatrix(true,false);
              // Compute the real mesh center in joint-local coordinates.
              // World AABBs are incorrect after bone rotation.
              const meshLocal=[];
              for(let vi=0;vi<positions.count;vi+=Math.max(1,Math.floor(positions.count/1500)))
                meshLocal.push(new THREE.Vector3().fromBufferAttribute(positions,vi)
                  .applyMatrix4(part.matrixWorld).sub(origin).applyQuaternion(inverse));
              const fittedCenter=new THREE.Box3().setFromPoints(meshLocal)
                .getCenter(new THREE.Vector3());
              const delta=bodyCenter.clone().sub(fittedCenter);
              // Recenter the rigid part onto its anatomical joint surface.
              // Reject impossible corrections instead of leaving floating armor.
              const limit=Math.max(bodySize.x,bodySize.y,bodySize.z,.05)*3;
              const beyond=delta.length()>limit;
              if(!beyond){
                part.position.add(delta.divide(parentScale));
                part.updateWorldMatrix(true,false);
              }else{
                part.visible=false;
                part.userData.fitRejected='disconnected-from-bone';
              }
              const finalBounds=new THREE.Box3().setFromObject(part);
              const finalSize=finalBounds.getSize(new THREE.Vector3());
              const maxAllowed=Math.max(bodyHeight*.65,targetExtent*2);
              const invalid=beyond||!Number.isFinite(finalSize.length())||
                Math.max(finalSize.x,finalSize.y,finalSize.z)>maxAllowed;
              if(invalid){
                part.position.copy(originalPosition);
                part.quaternion.copy(originalRotation);
                part.scale.copy(originalScale);
                part.visible=false;
                part.userData.fitRejected='oversized-fragment';
              }
              const widthScale=factor,depthScale=factor;
              part.userData.anatomicalFit={bone:joint.name,scaleFactor:factor,widthScale,depthScale,boneLength,owned:owned.length,rejected:invalid};
            }
            outfitAttached.push(part);
            splitParts++;
          }
          src.visible=false;
        }
      }
    }
    // Validate every newly split part against the body close to its own joint,
    // rather than testing the unsplit pair as one rigid garment.
    const partReports=[];
    if(splitParts){
      const parts=outfitAttached.filter(m=>m.isMesh&&m.name.startsWith(piece.name+'-'));
      for(const part of parts){
        part.updateWorldMatrix(true,false);
        const parentBone=part.parent;
        const origin=parentBone.getWorldPosition(new THREE.Vector3());
        const q=parentBone.getWorldQuaternion(new THREE.Quaternion()).invert();
        const project=p=>p.clone().sub(origin).applyQuaternion(q);
        const vertices=[];
        const attr=part.geometry.attributes.position;
        const stride=Math.max(1,Math.floor(attr.count/2000));
        for(let vi=0;vi<attr.count;vi+=stride)
          vertices.push(project(new THREE.Vector3().fromBufferAttribute(attr,vi).applyMatrix4(part.matrixWorld)));
        // Only vertices influenced by this joint and adjacent joints.
        const owned=[];
        for(const [joint,points] of bodyByBone){
          if(joint===parentBone||joint.parent===parentBone||parentBone.parent===joint)
            owned.push(...points);
        }
        const bodyNear=owned.map(project);
        const minmax=(points,key)=>[Math.min(...points.map(p=>p[key])),Math.max(...points.map(p=>p[key]))];
        const vx=minmax(vertices,'x'),vz=minmax(vertices,'z');
        const lowY=Math.min(...vertices.map(p=>p.y)),highY=Math.max(...vertices.map(p=>p.y));
        const by=bodyNear.filter(v=>v.y>=lowY-bodyHeight*.03&&v.y<=highY+bodyHeight*.03);
        const bx=by.length>=4?minmax(by,'x'):null;
        const bz=by.length>=4?minmax(by,'z'):null;
        const width=vx[1]-vx[0],depth=vz[1]-vz[0];
        const overlap=(a,b)=>Math.max(0,Math.min(a[1],b[1])-Math.max(a[0],b[0]));
        const outside=bx&&bz?(overlap(vx,bx)<Math.min(width,bx[1]-bx[0])*.3||
          overlap(vz,bz)<Math.min(depth,bz[1]-bz[0])*.3):true;
        partReports.push({part:part.name,bone:parentBone.name,vertices:vertices.length,
          bodyPoints:by.length,ownedPoints:owned.length,outside,width:+width.toFixed(4),depth:+depth.toFixed(4)});
      }
    }
    if(splitParts){
      window.__outfitFitReport[window.__outfitFitReport.length-1].splitParts=splitParts;
      window.__outfitFitReport[window.__outfitFitReport.length-1].partReports=partReports;
      window.__outfitFitReport[window.__outfitFitReport.length-1].splitMethod='triangle-centroid-by-joint';
    }
    outfitAttached.push(pivot);attached++;
   }
   outfitGroup=group;
  }else{
   group.position.x+=Math.max(size.x,personSize.x,1)*1.6;
   scene.add(group);outfitGroup=group;
  }
  $('outfitStatus').textContent='衣装候補 '+jobName+' / '+$('sex').value+' / '+files.length+
    '点 / 骨追従 '+attached+'点'+(missing.length?' / 未対応 '+missing.join(', '):'')+
    '（部位別縮尺補正・剛体追従。貫通・布変形は未検証）';
 }catch(e){if(token===outfitRequest)$('outfitStatus').textContent='衣装候補読込失敗: '+e.message;}
}
$('outfitPreview').onchange=refreshOutfitPreview;
$('outfitFollow').onchange=refreshOutfitPreview;
$('job').addEventListener('change',()=>setTimeout(refreshOutfitPreview,0));
$('sex').addEventListener('change',()=>setTimeout(refreshOutfitPreview,0));

function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);mixer?.update(dt);soldierMixer?.update(dt);sharedCharacter?.update(dt);if(retargetEnabled&&sourceMixer&&soldierModel&&!sharedCharacter){sourceMixer.update(dt);sourceRig.updateMatrixWorld(true);soldierModel.updateMatrixWorld(true);applyRigPairs(THREE,bonePairs);soldierModel.updateMatrixWorld(true)}if(riggedOutfit&&$('outfitFollow').checked)riggedOutfit.sync();actionVfx.update(dt);skillObjectRenderer.sync(skillPreviewObjects,clock.elapsedTime);if(/歩行|walk|走|run|ダッシュ/.test(previewAction)){footEffectAt+=dt;if(footEffectAt>.45){footEffectAt=0;const actor=sharedCharacter?.object3D||baseModel;if(actor)actionVfx.emit('walk',{position:actor.getWorldPosition(new THREE.Vector3()),job:$('job').value,scale:.5})}}renderer.render(scene,camera)}tick();
</script></body></html>
