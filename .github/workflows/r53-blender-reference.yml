name: R53 Blender reference audit
on:
  push:
    branches: [r53-fixed-face-review]
    paths:
      - 'scripts/r53-blender-reference-audit.py'
      - 'scripts/r53-blender-male-head-reference.py'
      - 'scripts/r53-blender-male-sculpt-master.py'
      - 'scripts/r53-blender-male-sculpt-studies.py'
      - '.github/workflows/r53-blender-reference.yml'
      - 'assets/face-r53/source/**'
  workflow_dispatch:
concurrency:
  group: r53-blender-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install Blender and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-requests xvfb libgl1-mesa-dri xauth
          blender --version
          blender -b --python-exit-code 1 --python-expr 'import numpy; print(numpy.__version__)'
      - name: Audit separate male and female reference anatomy
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p review/r53
          blender --version > review/r53/blender-version.txt
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-reference-audit.py -- assets/character-review/HM08_adult_female_R36_review.glb review/r53/female-donor body
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-reference-audit.py -- assets/character-review/HM08_male-adult_R41.glb review/r53/male-donor body
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-male-head-reference.py -- assets/character-review/HM08_male-adult_R41.glb review/r53/male-head
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-reference-audit.py -- review/r53/male-head/male_anatomy_reference.glb review/r53/male-head-views head
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-male-sculpt-master.py -- review/r53/male-head/male_anatomy_reference.blend review/r53/male-sculpt
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-reference-audit.py -- review/r53/male-sculpt/male_sculpt_master.glb review/r53/male-sculpt-views head
          xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-male-sculpt-studies.py -- review/r53/male-sculpt/male_sculpt_master.blend review/r53/male-candidates
          source_dir=assets/face-r53/source
          if test -f "$source_dir/R20_reference_face.glb.gz"; then
            gzip -dc "$source_dir/R20_reference_face.glb.gz" > /tmp/R20_reference_face.glb
          elif test -f "$source_dir/R20_reference_face.glb"; then
            cp "$source_dir/R20_reference_face.glb" /tmp/R20_reference_face.glb
          fi
          if test -f /tmp/R20_reference_face.glb; then
            echo 'ec971a22bf996cb01b0047343bdde8678d227a8db15857d2506eb0a969998b56  /tmp/R20_reference_face.glb' | sha256sum -c -
            xvfb-run -a blender -b --python-exit-code 1 --python scripts/r53-blender-reference-audit.py -- /tmp/R20_reference_face.glb review/r53/R20 head
          else
            echo 'R20 source not in GitHub; donor audit only, no R53 release' | tee review/r53/R20-source-missing.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-blender-reference-audit
          path: review/r53/
          if-no-files-found: error
