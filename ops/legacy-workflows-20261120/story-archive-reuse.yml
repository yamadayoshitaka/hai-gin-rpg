name: Restore matching old story CG images without new generation
on:
  pull_request:
    paths:
      - 'src/story-archive-restored-art.js'
      - 'src/story-panel-registered-art.js'
      - 'src/story-manga-viewer.js'
      - 'scripts/restore-existing-story-art.mjs'
      - 'qa/story-archive-restoration.test.mjs'
      - 'assets/story/chapter1-provisional-live/**'
      - '.github/workflows/story-archive-reuse.yml'
  schedule:
    # After the free-generation period; no provider calls in this workflow.
    - cron: '10 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: story-archive-reuse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve only the existing same-repository original-art archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/story/chapter1-free-actual-art:refs/remotes/origin/story/chapter1-free-actual-art
          git worktree add --detach "$RUNNER_TEMP/hai-gin-story-archive" origin/story/chapter1-free-actual-art
      - name: Scan all playable 20-chapter scene IDs for archived exact matches
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/restore-existing-story-art.mjs
          node scripts/restore-existing-story-art.mjs --mode scan --archive "$RUNNER_TEMP/hai-gin-story-archive"
      - name: Provisional restoration of at most ten hash-verified exact scenes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/restore-existing-story-art.mjs --mode promote --max 10 --archive "$RUNNER_TEMP/hai-gin-story-archive"
      - name: Validate original artwork bytes, exact scene identities and safe game binding
        shell: bash
        run: |
          node qa/story-archive-restoration.test.mjs
          node qa/story-compact-art-reuse.test.mjs
      - name: Commit only real source WebPs, source proof, and provisional registry to main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/story-archive-restored-art.js assets/story/chapter1-provisional-live/
          if git diff --cached --quiet; then
            echo "No previously unused exact archived art remains" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "assets(story): restore exact historical scene CGs as reversible provisional images"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save machine-readable restoration queue for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-archive-reuse-audit
          path: qa-reports/story-archive-reuse-scan.json
          if-no-files-found: warn
          retention-days: 14
