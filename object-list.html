<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>オブジェクト一覧｜灰銀のレゾナンス</title>
 <style>
  *{box-sizing:border-box}
  body{margin:0;background:#101b2b;color:#eef4fa;font:15px system-ui}
  header{background:#1b3045;padding:12px;display:flex;gap:16px;align-items:center}
  a{color:#a5ddff}
  main{height:calc(100dvh - 51px);display:flex;flex-direction:column}
  nav{padding:10px;background:#17293c;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button,select{background:#295b7d;border:1px solid #6b9dbb;border-radius:7px;color:white;padding:10px;font-size:15px}
  button:disabled{opacity:.45;cursor:not-allowed}
  #view{position:relative;flex:1;min-height:280px;touch-action:none}
  canvas{display:block}
  #stats{position:absolute;top:8px;left:8px;background:#132b3cc9;border-radius:6px;padding:8px;font-size:12px;max-width:80%;pointer-events:none}
  #status{font-size:12px;color:#bfd3df}
  @media(max-width:650px){nav{padding:7px;gap:6px}nav label{font-size:12px}nav select,nav button{padding:7px;font-size:13px}#structure-preview-controls{bottom:6px!important}}
 </style>
 <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head>
<body>
 <header><a href="./index.html">← メニュー</a><b>オブジェクト一覧 <small style="font-size:11px;opacity:.75">v4.4.32</small></b></header>
 <main>
  <nav>
   <label>オブジェクト <select id="object"><option value="tree">木</option><option value="flower_tree">花木</option></select></label>
   <label>季節 <select id="season"><option value="spring">春</option><option value="summer" selected>夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label>
   <label>状態 <select id="effect"><option value="normal">通常</option><option value="break">崩落</option><option value="burn">燃える</option><option value="freeze">凍る</option></select></label>
   <button id="export">GLB保存</button>
   <span id="status">3Dモデルを生成中…</span>
   <span id="pbrStatus" style="font-size:12px;color:#ffd98e">実写PBR: 読込待ち</span>
  </nav>
  <div id="view"><div id="stats">回転：ドラッグ / 拡大：ピンチ</div></div>
 </main>
 <script type="module" src="./src/tree-seasons.js?v=4.4.32"></script>
 <script>
 window.addEventListener('cottage-texture-status',event=>{
  const entries=Object.entries(window.__cottageTextureStatus||{}),ok=entries.filter(([,value])=>value.ok).length,fail=entries.length-ok;
  const element=document.getElementById('pbrStatus');
  if(element){element.textContent='実写PBR: '+ok+'成功 / '+fail+'失敗'+(fail?'（従来テクスチャ表示）':'');element.style.color=fail?'#ff8e8e':'#a7f0b0';}
 });
 </script>
</body>
</html>
