name: Free Natural Battle Voices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-natural-voices.yml'
      - 'scripts/build-voicevox-clip-bank.mjs'
permissions:
  contents: write
concurrency:
  group: free-natural-battle-voices
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'yamadayoshitaka/hai-gin-rpg'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline natural voice safeguards
        run: node qa/natural-battle-voice.test.mjs
      - name: Start VOICEVOX Engine on free local CPU
        shell: bash
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name free-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:50021/speakers > /dev/null; then
              echo 'VOICEVOX Engine ready'; exit 0
            fi
            sleep 3
          done
          docker logs free-voicevox --tail 80
          exit 1
      - name: Generate expanded Japanese voice library WAV clips
        env:
          VOICEVOX_MAX_NEW: '440'
        run: node scripts/build-voicevox-clip-bank.mjs
      - name: Commit newly generated free voice assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The game is updated frequently by other workflows. Never rebase
          # generated WAV binaries: an add/add conflict would discard the batch.
          cp audio/voicevox/manifest.json "${RUNNER_TEMP}/voice-manifest.generated.json"
          git fetch origin main
          git reset --mixed origin/main
          # Preserve upstream audio with identical content-addressed names;
          # generated *new* (untracked) audio remains in the working tree.
          git restore --source=origin/main --worktree -- audio/voicevox/clips/
          node --input-type=module <<'MERGE_VOICE_MANIFEST'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const local=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/voice-manifest.generated.json','utf8'));
          const remote=JSON.parse(execFileSync('git',['show','origin/main:audio/voicevox/manifest.json'],{encoding:'utf8'}));
          const credits=[...new Set([...(remote.credits||[]),...(local.credits||[])])].sort();
          // An already-published sound always wins; just add missing variants.
          const clips={...local.clips,...remote.clips};
          writeFileSync('audio/voicevox/manifest.json',
            JSON.stringify({format:2,credits,clips},null,2)+'\n');
          console.log('Merged voice library entries: '+Object.keys(clips).length);
          MERGE_VOICE_MANIFEST
          git add audio/voicevox/manifest.json audio/voicevox/clips/
          if git diff --cached --quiet; then
            echo 'Existing natural voice clips are up to date'
            exit 0
          fi
          git commit -m 'Add reusable free VOICEVOX Japanese battle speech clips'
          # Normal game commits may arrive while the audio pack is uploading.
          # This commit changes audio assets only, so rebase on those code edits.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent main update; retry ${attempt}"
            git fetch origin main
            git rebase origin/main
          done
          echo 'Unable to push voice assets after safe retries'
          exit 1
