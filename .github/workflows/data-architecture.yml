name: RPG data architecture checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full replacement contract
        run: npm run test:full-replacement
      - name: Syntax and imports
        run: npm run test:syntax
      - name: Architecture and blueprint
        run: npm run test:comprehensive && npm run test:architecture && npm run test:blueprints && npm run test:actors && npm run test:components
      - name: Rules and object systems
        run: npm run test:data-systems && npm run test:entities && npm run test:gameplay && npm run test:town
      - name: Interior maps, floors, and carpets
        run: npm run test:interiors && npm run test:areas && npm run test:decor && npm run test:building-data
      - name: Castle, stairs, and conversations
        run: npm run test:castle-stairs && npm run test:interactions && npm run test:bom && npm run test:exterior-bom && npm run test:info-bom && npm run test:humans

      - name: Character job appearance and seven-action regression
        run: npm run test:actions

      - name: Audit six-point body rig and appearance requirements
        continue-on-error: true
        run: node qa/full-body-six-point-audit.test.mjs
