name: Nonhuman 3D model sculpt refinement every 15 minutes

# PAUSED: creature-by-creature anatomy research and mesh/rig redesign.
# Do not re-enable scheduled or push triggers without user approval.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: nonhuman-quality-refinement-main
  cancel-in-progress: false

jobs:
  refine-one-curated-stage:
    if: false # user requested stopping all automated geometry-stage batches
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out fresh main (prevents reusing an already merged PR branch)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce at least 15 minutes between approved model revisions
        id: cadence
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            echo 'Manual diagnostic run bypasses the time gate.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Use the main branch's latest actual model-quality commit, not
          # the latest unrelated NPC/story/tactics commit.
          LAST="$(gh api "repos/$GITHUB_REPOSITORY/commits?path=src/nonhuman-model-quality.js&per_page=1" --jq '.[0].commit.committer.date')"
          if [[ ! "$LAST" =~ ^[0-9]{4}- ]]; then
            echo "Cannot verify previous quality commit; fail closed." >&2
            exit 1
          fi
          LAST_EPOCH="$(date -u -d "$LAST" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          ELAPSED="$((NOW_EPOCH-LAST_EPOCH))"
          if (( ELAPSED < 900 )); then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate refinement: ${ELAPSED}s since last model-quality commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            echo "Refinement eligible: ${ELAPSED}s since last model-quality commit." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep one open quality PR at a time; halt on orphaned auto branches
        id: pending
        if: steps.cadence.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          # A failed PR creation/merge must not create unlimited orphan branches.
          # Already-merged branches may be retained by repository settings.
          # They are not unfinished work and must never block the next cycle.
          PENDING=0
          while IFS= read -r QUALITY_BRANCH; do
            [[ -n "$QUALITY_BRANCH" ]] || continue
            MERGED="$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --state merged --head "$QUALITY_BRANCH" --json number --jq 'length')"
            if (( MERGED > 0 )); then
              echo "Ignoring previously merged quality branch: $QUALITY_BRANCH" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            PENDING="$((PENDING+1))"
          done < <(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[] | select(.name | startswith("quality/nonhuman-auto-")) | .name')
          if (( PENDING > 0 )); then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "There are $PENDING unfinished auto-quality branches. Repair or merge the existing PR before another run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Advance exactly one human-excluded geometric quality stage
        id: refine
        if: steps.pending.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/advance-nonhuman-quality.mjs --check
          node scripts/advance-nonhuman-quality.mjs --apply
          CHANGED="$(git diff --name-only)"
          if [[ -z "$CHANGED" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'All pre-reviewed stages are complete; no artificial quality claims.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$CHANGED" = 'src/nonhuman-model-quality.js'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Install pinned geometry checker
        if: steps.refine.outputs.changed == 'true'
        run: npm install --no-save --package-lock=false three@0.180.0
      - name: Validate 3D meshes, UVs, LODs, and human exclusion
        if: steps.refine.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/advance-nonhuman-quality.mjs --check
          node --test \
            qa/nonhuman-quality-loop.test.mjs \
            qa/monster-bestiary.test.mjs \
            qa/canine-fur-face-regression.test.mjs \
            qa/creature-master-quality.test.mjs
          test "$(git diff --name-only)" = 'src/nonhuman-model-quality.js'
      - name: Publish verified nonhuman change via PR or guarded fast-forward fallback
        if: steps.refine.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'src/nonhuman-model-quality.js'
          BRANCH="quality/nonhuman-auto-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -- src/nonhuman-model-quality.js
          git diff --cached --check
          git commit -m 'quality(models): advance one bounded nonhuman detail stage'
          HEAD_SHA="$(git rev-parse HEAD)"
          # No --force: if another development task moved main, leave PR for review.
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Quality branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          # Prefer a reviewable PR where the repository permits the Actions bot.
          # A known GitHub permission denial has a narrowly scoped fast-forward
          # fallback because the user explicitly approved automatic main updates.
          if PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "$BRANCH" \
            --title 'quality(models): reviewed nonhuman 3D sculpt stage' \
            --body 'Automated bounded geometry update. Only src/nonhuman-model-quality.js is modified. Human and human-shared assets remain excluded. Four geometry suites passed; visual FPS and beauty are not yet certified.' 2> /tmp/quality-pr-error.log)"; then
            echo "Created quality PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            gh pr merge "$PR_URL" --squash --delete-branch \
              --match-head-commit "$HEAD_SHA"
            echo 'Merged reviewed, nonhuman geometry PR into main.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/quality-pr-error.log >&2
            if ! grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' \
              /tmp/quality-pr-error.log; then
              echo 'Unexpected PR creation error. Keeping branch for review, no direct write.' >&2
              exit 1
            fi
            # This fallback cannot touch a human model, another game subsystem,
            # or a moving main. It uses a non-force fast-forward push of the
            # exact single-file commit already checked by all four QA suites.
            BASE_SHA="$(git rev-parse HEAD^)"
            test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = 'src/nonhuman-model-quality.js'
            LIVE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$LIVE_MAIN" != "$BASE_SHA" ]]; then
              echo 'Main moved during QA. Refusing direct push; branch remains for recovery.' >&2
              exit 1
            fi
            git push origin "HEAD:refs/heads/main"
            echo 'Automated PR setting blocked PR creation; pushed only the verified nonhuman model profile as a fast-forward main commit.' >> "$GITHUB_STEP_SUMMARY"
            # GitHub does not trigger Pages on a GITHUB_TOKEN push, so start
            # the already-existing Pages workflow through a permitted dispatch.
            gh workflow run publish-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'Dispatched Pages build after the bot-authored quality commit.' >> "$GITHUB_STEP_SUMMARY"
            git push origin --delete "$BRANCH" || \
              echo 'Cleanup of temporary quality branch was deferred.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'No paid AI endpoints or human-model modifications.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Static geometry QA is not proof of photorealism.' >> "$GITHUB_STEP_SUMMARY"
