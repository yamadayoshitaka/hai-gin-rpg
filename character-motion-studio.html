<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>灰銀のレゾナンス | 職業別モーション制作</title><style>*{box-sizing:border-box}body{margin:0;background:#111b2c;color:#f5f5f5;font:14px system-ui}canvas{position:fixed;inset:0;touch-action:none}#panel{position:fixed;z-index:5;top:10px;left:10px;right:10px;background:#172b43ed;border-radius:13px;padding:12px;max-height:67vh;overflow:auto}#panel.hidden .details{display:none}#head{display:flex;justify-content:space-between;align-items:center;gap:10px}h3{margin:0;font-size:16px}select,button,a{background:#294968;color:white;border:1px solid #8aa9c8;border-radius:8px;padding:10px;font:inherit;text-decoration:none}label{display:grid;gap:4px;margin:8px 0}select{width:100%}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.links a{text-align:center}#msg{font-size:12px;color:#fbdc8c;white-space:pre-wrap}#foot{position:fixed;z-index:4;bottom:10px;left:10px;right:10px;background:#172b43dc;border-radius:10px;padding:10px;font-size:12px}</style></head><body><div id="panel"><div id="head"><h3>職業別モーション制作 v1.0</h3><button id="toggle">選択画面を隠す</button></div><div class="details"><label>人物モデル<select id="model"><option value="male">7頭身・男性</option><option value="female">7頭身・女性</option></select></label><label>職業<select id="job"><option>剣士</option><option>格闘家</option><option>魔法使い</option><option>弓使い</option><option>盾戦士</option><option>盗賊</option><option>忍者</option><option>僧侶</option><option>召喚士</option><option>農民・職人</option></select></label><label>モーション<select id="motion"><option value="idle">待機</option><option value="walk">歩行</option><option value="run">ダッシュ</option><option value="attack">通常攻撃</option><option value="jump">ジャンプ</option><option value="dead">戦闘不能</option></select></label><div class="links"><a href="./character-face.html">顔編集へ</a><a href="./character-outfit.html">衣装制作へ</a><a href="./character-weapon.html">武器制作へ</a><a href="./play-1210.html">ゲームを開く</a></div><p id="msg">7頭身モデルを読み込み中…</p><small>ゲーム反映は未接続です。モデルとモーションの検証用画面です。</small></div></div><div id="foot">指で回転・ピンチで拡大。7頭身の全身モデルを直接表示します。</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const $=s=>document.querySelector(s),scene=new THREE.Scene();scene.background=new THREE.Color('#111b2c');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);camera.position.set(0,1.3,4.8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x60718b,2.3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,6,5);scene.add(light);const grid=new THREE.GridHelper(12,24,0x426381,0x24374d);scene.add(grid);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1,0);orbit.enableDamping=true;const loader=new GLTFLoader();let model,mixer,clips=[],generation=0;const clock=new THREE.Clock();function chooseClip(){if(!mixer)return;const wanted=$('#motion').value;const keywords={idle:['idle','stand'],walk:['walk'],run:['run','sprint'],attack:['attack','slash','sword'],jump:['jump'],dead:['death','die','dead']};const found=clips.find(c=>keywords[wanted].some(k=>c.name.toLowerCase().includes(k)));mixer.stopAllAction();if(found){mixer.clipAction(found).reset().play();$('#msg').textContent='表示中：'+$('#model').selectedOptions[0].text+' / '+$('#job').value+' / '+found.name;}else{$('#msg').textContent='モデル表示中。選択した「'+$('#motion').selectedOptions[0].text+'」のモーションはこの素材に未収録です。';}}async function load(){const gen=++generation;$('#msg').textContent='7頭身モデルを読み込み中…';if(model){scene.remove(model);model=null;}mixer=null;clips=[];try{const sex=$('#model').value==='female'?'Female':'Male';const gltf=await loader.loadAsync('./assets/characters/quaternius-base/Superhero_'+sex+'_FullBody.gltf');if(gen!==generation)return;model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model);const size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());if(!Number.isFinite(size.y)||size.y<=0)throw Error('モデルの寸法が不正');model.scale.setScalar(1.8/size.y);model.position.set(-center.x*model.scale.x,-b.min.y*model.scale.y,-center.z*model.scale.z);mixer=new THREE.AnimationMixer(model);clips=gltf.animations||[];chooseClip();}catch(e){$('#msg').textContent='モデル読込失敗：'+e.message;console.error(e);}}$('#model').addEventListener('change',load);$('#motion').addEventListener('change',chooseClip);$('#job').addEventListener('change',chooseClip);$('#toggle').onclick=()=>{const hidden=$('#panel').classList.toggle('hidden');$('#toggle').textContent=hidden?'選択画面を開く':'選択画面を隠す';};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();mixer?.update(dt);orbit.update();renderer.render(scene,camera);}load();animate();</script></body></html>
