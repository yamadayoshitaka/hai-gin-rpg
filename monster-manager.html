<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>灰銀のレゾナンス | モンスター管理・50種</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#09141d;color:#edf5f8;min-height:100dvh}
header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 18px;background:#12293d;border-bottom:1px solid #48657d}
header h1{margin:0;font-size:19px}header small{color:#9db2c5}
a{color:#a6d9ef}main{display:grid;grid-template-columns:minmax(300px,365px) minmax(0,1fr);height:calc(100dvh - 65px)}
aside{overflow-y:auto;border-right:1px solid #426277;background:#102332;padding:12px}
label{display:block;font-size:12px;color:#c7dbe4;margin-bottom:4px}
input,select,button{background:#19374b;color:white;border:1px solid #547891;border-radius:8px;padding:9px;font:inherit;min-width:0}
input[type=color]{padding:1px;width:100%;height:34px}
button{cursor:pointer}button:hover,button:focus-visible{background:#275a72}
.search{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.search label:first-child{grid-column:1/-1}
.search input,.search select{width:100%}
#items{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}
.specimen{text-align:left;font-size:12px;line-height:1.4;min-height:62px}
.specimen strong{display:block;font-size:13px}
.specimen small{display:block;font-size:10px;color:#a2bbcc}
.specimen[aria-pressed=true]{background:#336078;border-color:#f0d595}
#count{font-size:12px;color:#b3c8d4;margin:8px 0 10px}
.workspace{position:relative;overflow:hidden;display:flex;flex-direction:column}
#view{position:relative;flex:1;min-height:230px;background:radial-gradient(ellipse at 40% 40%,#1f3743,#08111b 72%)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#info{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;text-shadow:0 2px 8px #000}
#info h2{margin:0;color:#f2d59d;font-size:21px}
#info p{margin:5px 0;font-size:13px}
#hud{font-size:11px;color:#cde2e9}
.tools{overflow-y:auto;max-height:43%;padding:12px;background:#11293c;border-top:1px solid #47657c}
.toolrow{display:flex;flex-wrap:wrap;gap:7px;margin:5px 0 10px}
.toolrow button{font-size:12px;padding:8px 11px}
fieldset{border:1px solid #38546b;border-radius:9px;margin:8px 0;padding:8px}
legend{font-size:12px;color:#e8d9b6;padding:0 6px}
#editor{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#editor label:first-child{grid-column:span 2}
#editor input{width:100%}
#notice{color:#bfe0c7;font-size:12px;min-height:17px}
#mobileTip{font-size:11px;color:#9aafc2}
@media(max-width:730px){
 header{gap:7px;padding:9px 12px}header h1{font-size:15px}main{display:flex;flex-direction:column;height:auto;min-height:calc(100dvh - 55px)}
 aside{order:2;max-height:35dvh;overflow-y:auto;border-right:0;border-top:1px solid #48657d}
 #items{grid-template-columns:repeat(3,minmax(0,1fr))}.workspace{order:1;height:65dvh;min-height:460px}
 .tools{max-height:48%;padding:8px}#editor{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body>
<header><a href="./index.html">← メニュー</a><h1>魔物図鑑・モンスター管理 <small>50種 / v4.4.78</small></h1>
 <a href="./summon-showcase.html?v=4.4.78">召喚獣一覧</a></header>
<main>
 <aside>
  <div class="search">
   <label>検索 <input id="search" placeholder="名前・技・IDで検索"></label>
   <label>系統 <select id="family"><option value="">すべて</option></select></label>
   <label>属性 <select id="element"><option value="">すべて</option></select></label>
  </div>
  <div id="count">読み込み中...</div>
  <div id="items" role="group" aria-label="モンスター選択"></div>
 </aside>
 <section class="workspace">
  <div id="view">
   <div id="info"><h2 id="name">モデルを読み込み中...</h2><p id="description"></p><div id="hud"></div></div>
  </div>
  <section class="tools">
   <div id="mobileTip">ドラッグ：回転 / ピンチ：拡大縮小。モデルは召喚獣と同じ3D方式で描画します。</div>
   <fieldset><legend>モーション検証（モンスター別）</legend><div id="actions" class="toolrow"></div></fieldset>
   <fieldset><legend>個体データ編集（この端末に保存）</legend>
    <div id="editor">
     <label>名称<input id="edit-name" maxlength="40"></label>
     <label>レベル<input id="edit-level" type="number" min="1" max="100"></label>
     <label>HP<input id="edit-hp" type="number" min="1" max="99999"></label>
     <label>攻撃<input id="edit-attack" type="number" min="1" max="9999"></label>
     <label>防御<input id="edit-defense" type="number" min="0" max="9999"></label>
     <label>速度<input id="edit-speed" type="number" min="1" max="999"></label>
     <label>体色<input id="edit-base" type="color"></label>
     <label>装飾色<input id="edit-highlight" type="color"></label>
     <label>発光・差色<input id="edit-accent" type="color"></label>
    </div>
    <div class="toolrow">
     <button id="save">この個体を保存</button><button id="reset">初期値に戻す</button>
     <button id="export">全50体のJSON出力</button><button id="importButton">JSON取込</button>
     <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div><div id="notice" aria-live="polite"></div>
   </fieldset>
  </section>
 </section>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {MONSTER_CATALOG,MONSTER_BY_ID,MONSTER_FAMILIES,MONSTER_ELEMENTS,monsterList} from './src/monster-catalog.js?v=4.4.78';
import {createMonsterModel,disposeMonsterSculpture} from './src/monster-geometry.js?v=4.4.78';
import {MONSTER_ACTIONS,startMonsterAction,animateMonsterModel} from './src/monster-animation.js?v=4.4.78';
const byId=id=>document.getElementById(id);
const storeKey='hai-gin.monster-manager.v1';
let changes={};
try{const parsed=JSON.parse(localStorage.getItem(storeKey)||'{}');if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed))changes=parsed;}catch{}
const number=(v,f,min,max)=>Number.isFinite(Number(v))?Math.max(min,Math.min(max,Math.round(Number(v)))):f;
const clean=(id,edit)=>{
 const base=MONSTER_BY_ID[id];if(!base||!edit||typeof edit!=='object')return {};
 const validColor=c=>typeof c==='string'&&/^#[a-f0-9]{6}$/i.test(c);
 const out={};
 if(typeof edit.name==='string')out.name=edit.name.slice(0,40).trim()||base.name;
 if(edit.level!=null)out.level=number(edit.level,base.level,1,100);
 if(edit.stats&&typeof edit.stats==='object')out.stats={
   hp:number(edit.stats.hp,base.stats.hp,1,99999),
   attack:number(edit.stats.attack,base.stats.attack,1,9999),
   defense:number(edit.stats.defense,base.stats.defense,0,9999),
   speed:number(edit.stats.speed,base.stats.speed,1,999),
 };
 if(edit.colors&&typeof edit.colors==='object')out.colors={
   base:validColor(edit.colors.base)?edit.colors.base:base.colors.base,
   highlight:validColor(edit.colors.highlight)?edit.colors.highlight:base.colors.highlight,
   accent:validColor(edit.colors.accent)?edit.colors.accent:base.colors.accent,
 };
 return out;
};
function specimen(id){
 const base=MONSTER_BY_ID[id],edited=clean(id,changes[id]);
 return {...base,...edited,colors:{...base.colors,...edited.colors},
   stats:{...base.stats,...edited.stats}};
}
function persist(){try{localStorage.setItem(storeKey,JSON.stringify(changes));return true}
 catch(e){notice('保存できません: '+e.message);return false}}
function notice(message){byId('notice').textContent=message}
for(const [id,title] of Object.entries(MONSTER_FAMILIES)){
 const option=document.createElement('option');option.value=id;option.textContent=title;byId('family').append(option);
}
for(const [id,title] of Object.entries(MONSTER_ELEMENTS)){
 const option=document.createElement('option');option.value=id;option.textContent=title;byId('element').append(option);
}
const view=byId('view'),scene=new THREE.Scene();
scene.background=new THREE.Color('#0d1a25');
const camera=new THREE.PerspectiveCamera(42,1,.12,100);
camera.position.set(4,3.5,7);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.33;renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
view.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdce7f6,0x30343a,2.4));
const sun=new THREE.DirectionalLight(0xffdfa6,3.0);sun.position.set(-3,10,7);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const fill=new THREE.DirectionalLight(0x72bdff,1.65);fill.position.set(4,5,-5);scene.add(fill);
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,60),new THREE.MeshStandardMaterial({color:'#263a42',roughness:.96}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(14,18,0x4b737c,0x243943);grid.position.y=.008;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.minDistance=2.2;controls.maxDistance=45;
controls.maxPolarAngle=Math.PI*.54;controls.target.set(0,1.3,0);
const clock=new THREE.Clock();
let selected='m001',model=null,currentAction='idle';
function renderList(){
 const list=monsterList({family:byId('family').value,element:byId('element').value,keyword:byId('search').value});
 const root=byId('items');root.replaceChildren();
 for(const entry of list){
   const m=specimen(entry.id),btn=document.createElement('button');
   btn.className='specimen';btn.dataset.id=entry.id;btn.type='button';
   btn.setAttribute('aria-pressed',String(entry.id===selected));
   const name=document.createElement('strong');name.textContent=m.name;
   const desc=document.createElement('small');desc.textContent=MONSTER_FAMILIES[m.family]+' / '+MONSTER_ELEMENTS[m.element]+' / '+m.rarity;
   btn.append(name,desc);btn.onclick=()=>selectSpecies(entry.id);root.append(btn);
 }
 byId('count').textContent=list.length+' / 50体 表示中';
}
function loadEditor(m){
 for(const [id,v] of Object.entries({'name':m.name,'level':m.level,'hp':m.stats.hp,
   'attack':m.stats.attack,'defense':m.stats.defense,'speed':m.stats.speed,
   'base':m.colors.base,'highlight':m.colors.highlight,'accent':m.colors.accent}))
   byId('edit-'+id).value=v;
}
function selectSpecies(id){
 if(!MONSTER_BY_ID[id])return;
 selected=id;
 const m=specimen(id);
 if(model)disposeMonsterSculpture(model);
 model=createMonsterModel(m,{detail:'high'});scene.add(model);
 startMonsterAction(model,'idle',clock.getElapsedTime());
 currentAction='idle';loadEditor(m);
 byId('name').textContent=m.name+' ('+m.rarity+')';
 byId('description').textContent=m.description+' — '+m.skill;
 const bounds=new THREE.Box3().setFromObject(model);
 const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
 controls.target.set(center.x,Math.max(.7,center.y),center.z);
 const dist=Math.max(4,size.length()/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*.70);
 camera.position.set(center.x+dist*.38,center.y+dist*.30,center.z+dist);
 controls.update();
 renderList();
 notice('選択中: '+id+' — 種族ごとのモデルと専用技を表示');
}
function editFromUi(){
 const original=MONSTER_BY_ID[selected];
 return clean(selected,{
  name:byId('edit-name').value,level:byId('edit-level').value,
  stats:{hp:byId('edit-hp').value,attack:byId('edit-attack').value,
    defense:byId('edit-defense').value,speed:byId('edit-speed').value},
  colors:{base:byId('edit-base').value,highlight:byId('edit-highlight').value,
    accent:byId('edit-accent').value}
 });
}
byId('save').onclick=()=>{
 changes[selected]=editFromUi();
 if(persist()){selectSpecies(selected);notice('保存しました: '+selected)}
};
byId('reset').onclick=()=>{
 delete changes[selected];if(persist()){selectSpecies(selected);notice('初期値に戻しました')}
};
byId('export').onclick=()=>{
 const payload={schema:'hai-gin.monster-bestiary/v1',
   species:MONSTER_CATALOG.map(m=>specimen(m.id))};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='hai-gin-monsters-50.json';link.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 notice('50体のJSONを出力しました');
};
byId('importButton').onclick=()=>byId('importFile').click();
byId('importFile').onchange=async event=>{
 const file=event.target.files?.[0];event.target.value='';if(!file)return;
 if(file.size>2_000_000){notice('ファイルが大きすぎます（上限2MB）');return}
 try{
   const parsed=JSON.parse(await file.text());
   if(parsed?.schema!=='hai-gin.monster-bestiary/v1'||!Array.isArray(parsed.species))
     throw Error('対応していないJSON形式');
   if(parsed.species.length!==50||new Set(parsed.species.map(s=>s.id)).size!==50)
     throw Error('50体すべてが必要です');
   const imported={};
   for(const entry of parsed.species){
     if(!MONSTER_BY_ID[entry.id])throw Error('未知のID: '+String(entry.id));
     imported[entry.id]=clean(entry.id,entry);
   }
   changes=imported;
   if(persist()){selectSpecies(selected);notice('50体の設定を取り込みました')}
 }catch(e){notice('取込エラー: '+e.message)}
};
for(const id of ['family','element','search'])byId(id).addEventListener(id==='search'?'input':'change',renderList);
for(const [id,title] of MONSTER_ACTIONS){
 const button=document.createElement('button');button.textContent=title;button.title=id;
 button.onclick=()=>{
   if(!model)return;
   startMonsterAction(model,id,clock.getElapsedTime());
   currentAction=id;
   notice(specimen(selected).name+'：'+title+' を再生');
 };
 byId('actions').append(button);
}
const resize=()=>{
 const width=view.clientWidth,height=view.clientHeight;
 if(width<=0||height<=0)return;
 camera.aspect=width/height;camera.updateProjectionMatrix();
 renderer.setSize(width,height,false);
};
new ResizeObserver(resize).observe(view);
function frame(){
 requestAnimationFrame(frame);
 const time=clock.getElapsedTime();
 if(model){
   const state=animateMonsterModel(model,time);
   const entry=specimen(selected);
   byId('hud').textContent='ID '+entry.id+' · Lv'+entry.level+
    ' · HP '+entry.stats.hp+' · 攻 '+entry.stats.attack+
    ' · 防 '+entry.stats.defense+' · 速 '+entry.stats.speed+
    ' · 動作 '+state.action+' · 3Dモデル';
 }
 controls.update();renderer.render(scene,camera);
}
selectSpecies(selected);resize();frame();
</script></body></html>
