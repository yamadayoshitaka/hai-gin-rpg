<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>灰銀｜R53 主人公 新旧顔比較</title><style>
*{box-sizing:border-box}body{margin:0;background:#141b25;color:#edf1f7;font:15px system-ui}main{max-width:960px;margin:auto;padding:12px}h1{font-size:22px;margin:5px 0}p{line-height:1.5;color:#c5cfdd}button,select{font:inherit;padding:10px;background:#27374a;border:1px solid #687b92;border-radius:6px;color:#fff}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}a{color:#9ecbff}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}figure{margin:0;background:#202938;border-radius:8px;overflow:hidden}figcaption{padding:8px;text-align:center}img{display:block;width:100%;height:auto}#stage{height:54vh;min-height:260px;touch-action:none;background:#202938}#stage canvas{display:block;touch-action:none}#status{white-space:pre-wrap}small{color:#b1bed0}.notice{border:1px solid #61728b;padding:10px;border-radius:8px}
</style></head><body><main><a href="../../">ゲームに戻る</a><h1>R53 主人公｜新旧顔比較</h1><p>ダウンロード不要。実際のBlenderレンダリングを直接表示します。</p><div class="notice">新頭部は確認用の未承認候補です。ゲームのモデルは変更していません。首・口腔・髪の再調整は未完了です。</div><div class="controls"><label>人物 <select id="person"><option value="commander-male">男性主人公</option><option value="commander-female">女性主人公</option></select></label><label>方向 <select id="view"><option value="front">正面</option><option value="left">左側面</option><option value="right">右側面</option><option value="rear">背面</option><option value="crown">頭頂</option></select></label><label>新モデル <select id="hair"><option value="master">頭部のみ</option><option value="with_old_hair">既存髪との比較</option></select></label></div><div class="pair"><figure><figcaption>旧モデル</figcaption><a id="oldLink" target="_blank"><img id="oldImg" alt="旧モデルの実レンダリング"></a></figure><figure><figcaption>新モデル</figcaption><a id="newLink" target="_blank"><img id="newImg" alt="新モデルの実レンダリング"></a></figure></div><div class="controls"><label>表情画像 <select id="expr"></select></label></div><figure><figcaption>新モデル・表情</figcaption><a id="exprLink" target="_blank"><img id="exprImg" alt="表情レンダリング" style="max-width:450px;margin:auto"></a></figure><div class="controls"><button id="start3d">3Dで回転・拡大</button></div><section id="interactive" hidden><div class="controls"><label>モデル <select id="version"><option value="new">新頭部</option><option value="old">旧全身</option></select></label><label>表情 <select id="morph"></select></label><button id="reset">正面に戻す</button></div><div id="stage"></div><p id="status"></p><small>1本指で回転、2本指で拡大・縮小。3Dが動かない場合は上の画像で確認できます。</small></section><p><small>出典：Blender Studio Human Base Meshes (CC0)。実際のActions成果物を表示。本番採用は未承認。</small></p></main><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script><script>
const $=id=>document.getElementById(id);const exprs=[['jawOpen','口を開く'],['viseme_A','あ'],['viseme_I','い'],['viseme_U','う'],['viseme_E','え'],['viseme_O','お'],['smile','笑顔'],['blink_L','左まばたき'],['blink_R','右まばたき'],['browRaise','眉を上げる'],['browFrown','眉を寄せる'],['sad','悲しい'],['laugh','笑う']];
$('morph').add(new Option('無表情',''));for(const [id,label] of exprs){$('expr').add(new Option(label,id));$('morph').add(new Option(label,id))}
function updateImages(){let root='./assets/'+$('person').value+'/',v=$('view').value;for(const [key,path] of [['old',root+'original_'+v+'.png'],['new',root+$('hair').value+'_'+v+'.png'],['expr',root+'expression_'+$('expr').value+'.png']]){$(key+'Img').src=path;$(key+'Link').href=path}}for(const n of ['person','view','hair','expr'])$(n).addEventListener('change',updateImages);updateImages();
$('start3d').onclick=async()=>{$('interactive').hidden=false;$('start3d').disabled=true;$('status').textContent='3D読み込み中…';try{const m=await import('./viewer.mjs');await m.start()}catch(e){window.r53ReviewError=e.message;$('status').textContent='3D表示できません: '+e.message;console.error(e);$('start3d').disabled=false}};window.r53ImagesReady=true;
</script></body></html>
