name: Chapter 1 complete art - approved page promotion and game-registration gate

# Approval is never generated by Actions. Signed per-image P0 evidence is
# provided by a real visual reviewer after inspecting the actual image.
# This job promotes only pages in which every new scene is human-approved.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/story-chapter1-formal-promotion.yml'
      - 'scripts/promote-story-chapter1-reviewed-drafts.mjs'
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: chapter1-formal-human-reviewed-promotions
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main code; never release unreviewed draft branch directly
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for review-only contact sheets
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch draft assets and separate formal-registration branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin story/chapter1-free-actual-art
          git fetch origin story/chapter1-formal-reviewed-art
          git switch -c story/chapter1-formal-reviewed-art --track origin/story/chapter1-formal-reviewed-art
          git restore --source=origin/main --worktree -- scripts/build-story-chapter1-review-sheets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=origin/story/chapter1-free-actual-art --worktree -- \
            assets/story/chapter-drafts/c01/cloudflare-chapter1-free/
      - name: Validate actual draft image provenance independently
        run: |
          node qa/story-chapter1-draft-regression.mjs --strict
          node qa/story-chapter-page-loop.test.mjs
      - name: Build separate five-panel contact sheets for human visual review
        run: python3 scripts/build-story-chapter1-review-sheets.py
      - name: Report how many canonical pages have ACTUAL human visual approval
        run: node scripts/promote-story-chapter1-reviewed-drafts.mjs --plan
      - name: Copy only signed and verified native images; formally register and commit per 1-5 scenes
        run: node scripts/promote-story-chapter1-reviewed-drafts.mjs --apply --all-ready --commit
      - name: Push only actual approved-game-asset commits, never draft images
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:story/chapter1-formal-reviewed-art
          node scripts/audit-story-art-coverage.mjs --chapters 1
      - name: Final chapter1 release gate - publish ONLY after 462 human P0 approved frames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-story-chapter1-release.mjs --plan
          if ! node scripts/verify-story-chapter1-release.mjs --require-all; then
            echo "Chapter 1 is incomplete or lacks human P0 proofs; main and public game unchanged"
            exit 0
          fi
          node qa/story-chapter-page-loop.test.mjs
          node scripts/audit-story-art-coverage.mjs --chapters 1
          node -e "const r=require('./qa-reports/story-stage-production/live-art-coverage/chapters-1.json');if(r.totals.expected!==462||r.totals.missing!==0||r.totals.invalidRegistration!==0)process.exit(5)"
          git fetch origin main
          git merge --no-ff origin/main -m "merge: chapter1 formally approved art with current game"
          node scripts/verify-story-chapter1-release.mjs --require-all
          git push origin HEAD:main
          # GitHub Actions pushes do NOT trigger ordinary push workflows.
          # Explicit dispatch is necessary to deploy the approved main SHA.
          gh workflow run publish-pages.yml --ref main
      - name: Publish regression and approval-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-formal-promotions-${{ github.run_id }}
          path: |
            qa-reports/story-stage-production/chapter1-free-render/c01-regression.json
            qa-reports/story-stage-production/chapter1-review-sheets/
            qa-reports/story-stage-production/chapter1-free-render/c01-promotion-readiness.json
            qa-reports/story-stage-production/chapter1-free-render/c01-final-live-release-gate.json
            qa-reports/story-stage-production/chapter-page-loop/c01-queue.json
            qa-reports/story-stage-production/live-art-coverage/chapters-1.json
          retention-days: 30
          if-no-files-found: warn
