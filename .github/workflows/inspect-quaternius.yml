name: Inspect existing Quaternius animations
on:
  workflow_dispatch:
  push:
    paths:
      - tools/inspect-quaternius-glb.py
      - tools/audit-motion-gaps.py
      - motion-quaternius-job-candidates.json
      - .github/workflows/inspect-quaternius.yml
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse GLB animations
        run: python tools/inspect-quaternius-glb.py
      - name: Audit job motion gaps
        run: python tools/audit-motion-gaps.py
      - name: Publish audit summary
        run: |
          echo '## Quaternius motion audit' >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json; d=json.load(open("motion-gap-report.json")); print("Source clips:",d["sourceCount"]); [print(k, "missing:", ", ".join(v["missing"])) for k,v in d["families"].items()]' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-quaternius-inventory.json motion-gap-report.json
          git diff --cached --quiet || (git commit -m "Record Quaternius animation inventory" && git push)
