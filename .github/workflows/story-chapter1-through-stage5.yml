name: Story chapter 1 through stage 5 (P0 locked)

on:
  pull_request:
    paths:
      - 'assets/story/stage-manifests/**'
      - 'assets/story/characters/c01-s0*-reference-bible.json'
      - 'scripts/run-story-stage-range.mjs'
      - 'scripts/run-story-stage.mjs'
      - 'scripts/prepare-story-stage-posters.mjs'
      - 'scripts/assemble-story-bulk-100.py'
      - 'qa/story-stage2-through5-production.test.mjs'
      - 'src/story-c01-stage45-art-guard.js'
      - 'qa/story-c01-stage45-generation-guard.test.mjs'
      - 'qa/story-stage3-owner-provisional-completion.test.mjs'
      - 'scripts/generate-story-chapter1-free-batch.mjs'
      - 'src/story-chapter1-provisional-live.js'
      - '.github/workflows/story-chapter1-through-stage5.yml'
  push:
    branches: [main]
    paths:
      - 'assets/story/stage-manifests/**'
      - 'scripts/run-story-stage-range.mjs'
      - 'scripts/assemble-story-bulk-100.py'
      - 'qa/story-stage2-through5-production.test.mjs'
      - 'src/story-c01-stage45-art-guard.js'
      - 'qa/story-c01-stage45-generation-guard.test.mjs'
      - 'qa/story-stage3-owner-provisional-completion.test.mjs'
      - 'scripts/generate-story-chapter1-free-batch.mjs'
      - 'src/story-chapter1-provisional-live.js'
      - '.github/workflows/story-chapter1-through-stage5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter1-through-stage5:
    name: Stage 2-5 script/cast integrity, native image review and 100-frame queues
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free WebP validation (Pillow)
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify four stage-specific manifest contracts, 192 exact canonical shots and P0 quality gates
        run: node qa/story-stage2-through5-production.test.mjs
      - name: Verify stage3 adopted 48/48 art bindings and 96 per-shot locked generator instructions
        run: |
          node qa/story-stage3-owner-provisional-completion.test.mjs
          node qa/story-c01-stage45-generation-guard.test.mjs
      - name: Process each locked stage and review only eligible native panels
        run: node scripts/run-story-stage-range.mjs --start c01-s02 --through c01-s05
      - name: Upload exact screenplay-to-shot references and native 100-frame review reports
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-stage2-through5-production-${{ github.run_id }}
          path: |
            qa-reports/story-stage-production/range-c01-s02-through-c01-s05/
            qa-reports/story-stage-production/batches/c01-s02/
            qa-reports/story-stage-production/batches/c01-s03/
            qa-reports/story-stage-production/batches/c01-s04/
            qa-reports/story-stage-production/batches/c01-s05/
          if-no-files-found: error
          retention-days: 30
