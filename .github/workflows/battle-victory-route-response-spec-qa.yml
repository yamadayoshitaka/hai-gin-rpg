name: Victory objective route response hierarchy QA
on:
  push:
    branches:
      - 'feat/victory-route-response-job-tree-*'
  pull_request:
    paths:
      - 'src/battle-victory-route-response-spec.js'
      - 'docs/battle-victory-route-response-spec.md'
      - 'qa/battle-victory-route-response-spec.test.mjs'
      - '.github/workflows/battle-victory-route-response-spec-qa.yml'
  workflow_dispatch:
jobs:
  victory-route-response:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Victory condition to route to three job-labeled response layers
        run: node qa/battle-victory-route-response-spec.test.mjs
      - name: Existing strategy and scenario hierarchy contracts
        run: |
          node qa/battle-strategy-countertree-spec.test.mjs
          node qa/battle-situation-countermeasure-matrix.test.mjs
          node qa/battle-coordinated-tactics-counters.test.mjs
          node qa/battle-tactics-preset.test.mjs
      - name: Battle victory and formation regression
        run: |
          node qa/battle-stage-objective-job-squads.test.mjs
          node qa/battle-objective-opposed-sides.test.mjs
          node qa/mass-battle-formations.test.mjs
          node qa/squad-formation-three-types.test.mjs
      - name: Story and core integration
        run: node --experimental-vm-modules qa/game-core-contract.test.mjs
