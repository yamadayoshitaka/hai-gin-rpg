name: Fast wardrobe regression and quality feedback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'outfit-maintenance.html'
      - 'motion-external-test.html'
      - 'src/character-system/**'
      - 'data/character-system/**'
      - 'assets/characters/**'
      - 'assets/textures/**'
      - 'qa/wardrobe-xyz-image-regression.cjs'
      - 'qa/outfit-surface-regression.test.mjs'
      - 'qa/eyebrow-surface-regression.test.mjs'
      - 'qa/helmet-faceguard-regression.test.mjs'
      - 'qa/helmet-heraldry-placement.test.mjs'
      - 'qa/wardrobe-inspection-pose.test.mjs'
      - 'qa/outfit-rarity-regression.test.mjs'
      - 'qa/wardrobe-quality-feedback.cjs'
      - '.github/workflows/wardrobe-fast-regression.yml'
permissions:
  contents: read
  actions: read
jobs:
  representative-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate automatic quality feedback rules
        run: node qa/wardrobe-quality-feedback.test.cjs
      - name: Prevent black limb patches and skin-atlas retexturing
        run: node qa/outfit-surface-regression.test.mjs
      - name: Prevent detached eyebrows on male and female faces
        run: node qa/eyebrow-surface-regression.test.mjs
      - name: Prevent eye-level visor bars and hanging cheek guards
        run: node qa/helmet-faceguard-regression.test.mjs
      - name: Recover previous completed visual baseline, if available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh run list --workflow wardrobe-fast-regression.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -n "$previous" ]; then
            mkdir -p qa-previous
            gh run download "$previous" --name wardrobe-fast-report --dir qa-previous || true
          fi
      - name: Install screenshot analysis
        run: npm install --no-save playwright@1.56.0 pngjs@7.0.0 three@0.160.1
      - name: Check three wardrobe rarities across four character roles
        run: node qa/outfit-rarity-regression.test.mjs
      - name: Check independent helmet cuirass and crest forward-axis alignment
        run: node tools/test-segmented-armor.mjs
      - name: Prevent battle-only loss of armor silhouette and garment panels
        run: node tools/test-rigged-outfits.mjs
      - name: Verify helmet and hair geometry
        run: |
          node qa/hair-headwear-occlusion.test.mjs
          node qa/helmet-fit-policy.test.mjs
          node qa/helmet-heraldry-placement.test.mjs
          node qa/wardrobe-inspection-pose.test.mjs
      # Chromium binaries are versioned and reusable. Installing all apt
      # packages on every screenshot run dominated the "fast" feedback loop.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-wardrobe-chromium-playwright-1.56.0
      - name: Install cached browser with dependency fallback
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch({headless:true}).then(b=>b.close()).catch(()=>process.exit(1))" || npx playwright install --with-deps chromium
      - name: Start local asset host
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rpg-wardrobe-fast-test.log 2>&1 &
          sleep 2
      - name: Check two models on pushes, six on manual runs, and expand on recurring failure
        env:
          QA_MODE: ${{ github.event_name == 'push' && 'smoke' || 'fast' }}
          QA_SHARDS: 1
          QA_PREVIOUS_FEEDBACK: qa-previous/quality-feedback.json
        run: node qa/wardrobe-xyz-image-regression.cjs
      - name: Detect regressions and automatically pivot the next investigation
        if: always()
        run: |
          if [ -f qa-screenshots/wardrobe-xyz/shard-0/report.json ]; then
            node qa/wardrobe-quality-feedback.cjs \
              --current qa-screenshots/wardrobe-xyz/shard-0/report.json \
              --previous qa-previous/report.json \
              --previous-feedback qa-previous/quality-feedback.json \
              --out qa-screenshots/wardrobe-xyz/shard-0/quality-feedback.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wardrobe-fast-report
          path: |
            qa-screenshots/wardrobe-xyz/shard-0/report.json
            qa-screenshots/wardrobe-xyz/shard-0/quality-feedback.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wardrobe-helmet-profile
          path: qa-screenshots/wardrobe-xyz/shard-0/*-helmet-*.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wardrobe-fast-failure-screenshots
          path: qa-screenshots/wardrobe-xyz/shard-0/*.png
          if-no-files-found: ignore
          retention-days: 7
