name: Hair reselect and scalp continuity
on:
  pull_request:
    paths:
      - 'face-mesh-studio.html'
      - 'face-body-studio.html'
      - 'src/face-scalp-wig.js'
      - 'qa/hair-sadako-buzz-reselect-v49.test.mjs'
      - 'qa/hair-sadako-master-v52.test.mjs'
      - 'qa/hair-sadako-parting-v54.test.mjs'
      - 'qa/hair-sadako-ear-crown-bust-v55.test.mjs'
      - 'qa/hair-sadako-ear-density-crown-v56.test.mjs'
      - 'qa/hair-sadako-crown-canopy-v57.test.mjs'
      - 'qa/hair-sadako-headhug-rear-v58.test.mjs'
      - 'qa/hair-sadako-curved-dynamic-v59.test.mjs'
      - 'qa/hair-sadako-mantle-crown-v60.test.mjs'
      - 'qa/hair-shared-scalp-temple-v61.test.mjs'
      - 'qa/hair-costume-scalp-mask-v62.test.mjs'
      - 'qa/hair-costume-neck-crown-v63.test.mjs'
      - 'qa/hair-sadako-side-ribbons-v64.test.mjs'
      - 'qa/hair-sadako-five-variants-v65.test.mjs'
      - 'src/face-wig-styles.js'
      - 'src/face-part-catalog-v32.js'
      - 'src/hero-hair-controls-v43.js'
      - 'src/heroine-battle-costume-bridge.js'
      - 'src/face-costume-scalp-mask.js'
      - 'src/face-mantle-hair-collision.js'
      - '.github/workflows/hair-reselect-regression.yml'
  push:
    branches: [main]
    paths:
      - 'face-mesh-studio.html'
      - 'face-body-studio.html'
      - 'src/face-scalp-wig.js'
      - 'qa/hair-sadako-buzz-reselect-v49.test.mjs'
      - 'qa/hair-sadako-master-v52.test.mjs'
      - 'qa/hair-sadako-parting-v54.test.mjs'
      - 'qa/hair-sadako-ear-crown-bust-v55.test.mjs'
      - 'qa/hair-sadako-ear-density-crown-v56.test.mjs'
      - 'qa/hair-sadako-crown-canopy-v57.test.mjs'
      - 'qa/hair-sadako-headhug-rear-v58.test.mjs'
      - 'qa/hair-sadako-curved-dynamic-v59.test.mjs'
      - 'qa/hair-sadako-mantle-crown-v60.test.mjs'
      - 'qa/hair-shared-scalp-temple-v61.test.mjs'
      - 'qa/hair-costume-scalp-mask-v62.test.mjs'
      - 'qa/hair-costume-neck-crown-v63.test.mjs'
      - 'qa/hair-sadako-side-ribbons-v64.test.mjs'
      - 'qa/hair-sadako-five-variants-v65.test.mjs'
      - 'src/face-wig-styles.js'
      - 'src/face-part-catalog-v32.js'
      - 'src/hero-hair-controls-v43.js'
      - 'src/heroine-battle-costume-bridge.js'
      - 'src/face-costume-scalp-mask.js'
      - 'src/face-mantle-hair-collision.js'
permissions:
  contents: read
jobs:
  hair-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js used by the actual wig generator
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Verify hair module syntax and buzz/Sadako re-selection contract
        run: |
          node --check src/face-scalp-wig.js
          node --check src/face-wig-styles.js
          node --check src/face-part-catalog-v32.js
          node --check src/hero-hair-controls-v43.js
          node --check src/face-mantle-hair-collision.js
          node --check src/face-costume-scalp-mask.js
          node --check src/heroine-battle-costume-bridge.js
          node --test qa/hair-sadako-buzz-reselect-v49.test.mjs qa/hair-sadako-master-v52.test.mjs qa/hair-sadako-parting-v54.test.mjs qa/hair-sadako-ear-crown-bust-v55.test.mjs qa/hair-sadako-ear-density-crown-v56.test.mjs qa/hair-sadako-crown-canopy-v57.test.mjs qa/hair-sadako-headhug-rear-v58.test.mjs qa/hair-sadako-curved-dynamic-v59.test.mjs qa/hair-sadako-mantle-crown-v60.test.mjs qa/hair-shared-scalp-temple-v61.test.mjs qa/hair-costume-scalp-mask-v62.test.mjs qa/hair-costume-neck-crown-v63.test.mjs qa/hair-sadako-side-ribbons-v64.test.mjs qa/hair-sadako-five-variants-v65.test.mjs
