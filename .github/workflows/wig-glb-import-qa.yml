name: Wig-only CC0 GLB Import QA
on:
  pull_request:
    paths:
      - 'wig-studio.html'
      - 'hair-asset-studio.html'
      - 'src/wig-glb-fit-v1.js'
      - 'scripts/import-cc0-wigs.py'
      - 'qa/wig-glb-import.test.mjs'
      - '.github/workflows/wig-glb-import-qa.yml'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wig-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate the new wig-only viewer and head fit
        run: node --test qa/wig-glb-import.test.mjs
      - name: Download only license-reviewed CC0 hair GLB files and check blob identity
        run: python3 scripts/import-cc0-wigs.py --out /tmp/hai-gin-wig-cc0
      - name: Inspect upstream GLB geometry, axes and spike triangles
        run: python3 scripts/audit-wig-glb.py /tmp/hai-gin-wig-cc0/hair_long01.glb /tmp/hai-gin-wig-cc0/hair_bob01.glb /tmp/hai-gin-wig-cc0/hair_ponytail01.glb
      - name: Validate imported GLB files and upstream provenance
        env:
          WIG_IMPORT_DIR: /tmp/hai-gin-wig-cc0
        run: node --test qa/wig-glb-import.test.mjs
