name: Batch rig verified aligned outfits
on:
  workflow_dispatch:
jobs:
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Process aligned outfit manifest
        run: python3 tools/batch_rig_outfits.py -- data/character-system/aligned-outfits.json
      - name: Validate exported skin bindings
        if: success()
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          rows=json.load(open('outfit-rig-report.json',encoding='utf-8'))
          if not rows: raise SystemExit('No outfits exported')
          for row in rows:
              if row['status']!='skinned-unverified': raise SystemExit('Rigging failed')
              subprocess.run([sys.executable,'tools/validate-rigged-glb.py',row['output']],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rigging-report
          path: |
            outfit-rig-report.json
            output/rigged/*.glb
          if-no-files-found: warn
