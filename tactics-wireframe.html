  const near=Math.min(edgeDistance(focusX,focusZ),edgeDistance(cameraX,cameraZ))<threshold;
  // Only follow explicit indoor travel. A 1,000-person outdoor army can stand
  // inside the castle footprint without making every distant roof disappear.
  const occupants=actors.filter(a=>!a.defeated&&a.floorTravel?.building===b);
  const selectedInside=selected&&!selected.defeated&&selected.indoorFloor>1&&
   Math.abs(selected.cell.x-b.data.x)<b.data.w/2&&Math.abs(selected.cell.z-b.data.z)<b.data.d/2;
  const cutaway=near||occupants.length>0||selectedInside;
  if(b.cutaway!==cutaway){
   buildingBatchStats.setBuildingShellCutaway(b.model,cutaway);
   b.cutaway=cutaway;
  }
  if(b.roof)b.roof.visible=!cutaway;
  buildingBatchStats.setBuildingRoofVisible(b.model,!cutaway);
  // The catalogue preview enables this exact group when touring floor 1.
  // It was permanently hidden in battle, leaving the castle's 48 rooms and
  // monumental hall columns absent even though all geometry was loaded.
  const groundFurnishings=b.groundFurnishings;
  if(groundFurnishings)groundFurnishings.visible=cutaway;
  const decks=b.upperDecks;
  const furnishings=b.upperFurnishings;
  if(!decks)continue;
  const cameraFloor=near&&b.structure?.floors?.length>1?
   Math.max(1,Math.min(b.structure.floors.length,
    1+Math.floor((controls.target.y-b.model.position.y+.1)/b.structure.floors[0].height))):1;
  const highestVisibleFloor=Math.max(cameraFloor,
   ...occupants.map(a=>a.floorTravel?.phase==='climb'?Math.max(a.floorTravel.fromFloor,a.floorTravel.toFloor):a.indoorFloor??1),
   selectedInside?selected.indoorFloor:1);
  decks.visible=highestVisibleFloor>1;
  for(const slab of decks.children){
   const floor=Number(slab.name.match(/^floor_(\d+)_slab$/)?.[1]??99);
   slab.visible=floor<=highestVisibleFloor;
  }
  if(furnishings){
   furnishings.visible=decks.visible;
   for(const detail of furnishings.children){
    const floor=Number(detail.name.match(/^floor_(\d+)_details$/)?.[1]??99);
    detail.visible=floor<=highestVisibleFloor;
   }
  }
 }
}
function animate(){
 framePerformance.begin();
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);simAccumulator+=dt;
 if(!paused)creatureVisualTime+=dt;
 while(simAccumulator>=.05){tickAI(.05);simAccumulator-=.05}
 if(!paused)actionVfx.update(dt);
 updateSquadMarkerPositions(dt);
 if(riverFlow)riverFlow.offset.y-=dt*.07;
 interiorVisibilityTimer+=dt;
 if(interiorVisibilityTimer>=.24){updateTownInteriorVisibility();interiorVisibilityTimer=0}
 uiTimer+=dt;if(uiTimer>.25){updateUI();uiTimer=0}
  actorVisibility.beginFrame(performance.now()/1000);
  const massAlpha=massSim?(massWorker?.active?Math.min(1,Math.max(0,(performance.now()-lastMassSnapshotMs)/100)):Math.min(1,massAccumulator/.1)):0;
  for(const a of actors){
   if(massSim&&!a.defeated){
    const u=massSim.units[a.massUnitId],p=massWorldPositionFn(u,{},massAlpha);
    a.root.position.set(p.x,p.y,p.z);a.root.rotation.y=Math.atan2(u.facingX,u.facingZ);
   }
   const visual=actorVisibility.sample(a);
   if(a.defeated){a.deathElapsed=Math.min(.85,a.deathElapsed+dt);const t=a.deathElapsed/.85;a.root.rotation.z=(a.team===0?-1:1)*t*1.35;a.root.position.y=a.deathBaseY-.35*t;if(visual.update&&a.character&&a.deathElapsed<.85){a.character.update(visual.delta);a.outfit?.sync()}continue}
   if(a.hp<=0)continue;
   if(!massSim&&!a.nextCell&&!a.jumping&&!a.floorTravel&&!(a.indoorFloor>1))
    a.root.position.y=terrainY(a.root.position.x,a.root.position.z)+riderElevation(a);
   if(!visual.visible)continue;
   if(a.character){
    if(a.crowdSampling)continue;
    if(!massSim){
     if(a.mountId)requestMotion(a,'idle');
     else if((a.attackPoseUntil&&elapsed<a.attackPoseUntil)||(a.hitPoseUntil&&elapsed<a.hitPoseUntil)){}
     else if(a.jumping?'jump':a.nextCell||(a.lastMovedAt!=null&&elapsed-a.lastMovedAt<.22))requestMotion(a,a.jumping?'jump':a.speed>=4.5?'run':'walk');
     else requestMotion(a,'idle');
    }
    if(visual.update){a.character.update(visual.delta);applyCreatureRidingPose(a);a.outfit?.sync()}
    a.poseMoving=false;
   }else if(visual.update){if(a.mixer)a.mixer.update(visual.delta);else updateBattlePose(a,visual.delta)}
  }
  if(followCamera){
   const anchor=automaticFloorGuide?.root.position||selected?.root.position||actors[0]?.root.position;
   if(anchor){const shift=anchor.clone().sub(controls.target);controls.target.add(shift);camera.position.add(shift)}
  }
  controls.update();
  // Rendering is independent of AI ticks: everyone smoothly walks between tiles.
  if(massRenderer){
   if(finished)massEndElapsed+=dt;
   // Per-visible-soldier matrices and walk poses now advance with EVERY
   // display frame, including fast camera pans and intermediate AI steps.
   massRenderer.update(massAlpha,massEndElapsed,creatureVisualTime);
  }
  combatObjectRenderer?.sync(massSim?.objects||skirmishActions?.objects||[],creatureVisualTime,massSim?.units||actors,elapsed);
 // Keep the camera above the target and terrain even during drag, zoom and follow.
 const minCameraY=controls.target.y+Math.max(7,Math.hypot(camera.position.x-controls.target.x,camera.position.z-controls.target.z)*.18);
 if(camera.position.y<minCameraY){camera.position.y=minCameraY;controls.update()}
 // Focus shadow resolution on the area currently being viewed.
 const focus=controls.target;sun.position.set(focus.x-100,focus.y+170,focus.z+80);sun.target.position.copy(focus);sun.target.updateMatrixWorld();
 renderBattleFrame();
 framePerformance.end();
 if(massSim){fpsFrames++;const now=performance.now();if(now-fpsStart>=1000){const perf=framePerformance.getStats(),fps=perf.fps;fpsFrames=0;fpsStart=now;$('massGamePerf').textContent=massRenderer?MASS_SIZE+'対'+MASS_SIZE+'｜FPS '+fps+'｜P95 '+perf.frameP95Ms+'ms｜GPU '+(perf.gpuFrameMs??'--')+'ms｜描画 '+renderer.info.render.calls+'｜AI '+massSim.lastAiMs.toFixed(1)+'ms ('+(massWorker?.backend??'main-thread')+')｜GPU共有 '+massRenderer.sharedGpuBatches+'組｜実体 '+massRenderer.fullMeshVisibleSoldiers+' / 実体撮影LOD '+massRenderer.impostorVisibleSoldiers+'｜画面内 '+(massRenderer.visibleSoldiers+actorVisibility.stats.visible)+'体｜省略 '+actorVisibility.stats.culled+'体｜建物 '+buildingBatchStats.sourceMeshes+'→'+buildingBatchStats.batches+'｜橋通過 '+massSim.crossings.join('/'):'実物衣装ロード中｜'+actors.filter(a=>a.outfit).length+'/'+actors.length+'種類の元モデル';}}
}
window.getBattleStartupStats=()=>({ready:battleReady,error:loadingFailure?String(loadingFailure):null,
 resolutionScale:BATTLE_RESOLUTION_SCALE,pixelRatio:renderer.getPixelRatio(),antiAliasing:fxaaComposer?'GPU FXAA':'WebGL MSAA',bufferWidth:renderer.domElement.width,bufferHeight:renderer.domElement.height,
 actors:actors.length,dressed:actors.filter(a=>a.outfit).length,buildingBatchStats,stageBatchStats,
 massModelBatches:massRenderer?.drawMeshes??0,bodyDrawLayers:massRenderer?.bodyDrawLayers??0,visibility:actorVisibility.stats,elapsed});
async function finishBattleLoading(){
 try{
  loadingProgress('人物モデルと衣装をロード中…',42);
  await installBattleModels();
  if(massSim)await prepareMassRenderer();
  loadingProgress('戦闘AIの起動を確認中…',96);
  if(massWorker){
   const limit=performance.now()+6000;
   while(massWorker.active&&!massWorker.ready&&performance.now()<limit)
    await new Promise(resolve=>setTimeout(resolve,50));
   if(massWorker.active&&!massWorker.ready){
    console.warn('戦闘AI Workerの起動が遅いためメインスレッドに切り替えます');
    massWorker.terminate();massWorker=null;
   }
  }
  loadingProgress('GPUシェーダーと地形・モデルを最終準備中…',98);
  await new Promise(resolve=>requestAnimationFrame(resolve));
  renderer.compile(scene,camera);
  renderBattleFrame();
  loadingProgress('準備完了。戦闘を開始します',100);
  await new Promise(resolve=>requestAnimationFrame(resolve));
  battleReady=true;
  loading.hidden=true;
  clock.getDelta();
  log(storyRequest?storyRequest.territoryName+' 攻略戦を開始 · 出撃'+storyRequest.units.length+'人':(MASS_SIZE||50)+'対'+(MASS_SIZE||50)+'のランダム職業リアルタイム自動戦闘を開始');
  updateUI();animate();
 }catch(error){

  showRuntimeError('起動時最適化: '+(error?.stack||error?.message||String(error)));
 }
}
