name: Visual Regression Capture (Manual Only)
on:
  workflow_dispatch:
concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve the game
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hai-gin-http.log 2>&1 &
      - name: Capture consistent building viewpoints
        timeout-minutes: 5
        run: node qa/capture.cjs
      - name: Test player and resident movement, initial entry and re-entry
        if: success()
        timeout-minutes: 3
        run: node qa/self-repair.cjs
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: qa-screenshots/
          retention-days: 14
