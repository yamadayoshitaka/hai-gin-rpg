               grep -Fq 'sculptV117ReferencePortrait' /tmp/public-face-v117-sculpt.js &&
               grep -Fq 'v114-natural-realistic-eyes' /tmp/public-face-studio.html &&
               grep -Fq 'v=20261123-v115-eye-liner-lashes' /tmp/public-face-studio.html &&
               grep -Fq 'v97BuildSignature' /tmp/public-face-expression.js &&
               grep -Fq 'fitTopologyNasalSideProfile' /tmp/public-face-topology.js &&
               grep -Fq 'refineV106CheekMouthTopology' /tmp/public-face-v106-retopo.js &&
