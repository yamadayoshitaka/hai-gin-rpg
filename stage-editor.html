<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ステージ作成｜灰銀のレゾナンス</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1725;color:#eef5ff;font:14px system-ui}header{padding:10px 14px;background:#1b3046;display:flex;gap:14px;align-items:center}a{color:#a4ddff}main{display:grid;grid-template-columns:220px minmax(0,1fr);height:calc(100dvh - 46px)}aside{padding:12px;background:#17293c;overflow:auto;display:grid;align-content:start;gap:9px}button,select{background:#284763;color:#fff;border:1px solid #7092a9;border-radius:7px;padding:9px;font:inherit}button{cursor:pointer}button.active{background:#71552b;border-color:#f4c26e}#palette{display:grid;grid-template-columns:1fr 1fr;gap:5px}#stage{overflow:hidden;position:relative;background:#263a4c;touch-action:none}#stage canvas{display:block;touch-action:none}#hint{position:absolute;left:9px;bottom:9px;background:#132638d9;padding:9px;border-radius:8px;pointer-events:none}small{color:#b4cddd}@media(max-width:700px){main{display:flex;flex-direction:column;height:calc(100dvh - 46px)}aside{display:flex;flex-wrap:wrap;gap:5px;max-height:210px;overflow:auto}aside label{display:flex;align-items:center;gap:5px}#palette{display:flex;overflow-x:auto;width:100%}#palette button{white-space:nowrap}#stage{flex:1;min-height:200px}}</style></head><body><header><a href="./index.html">← メニュー</a><b>ステージ作成</b><small>58×58マス（旧13×13の約20倍）</small></header><main><aside><label>配置対象 <select id="layer"><option value="tile">マップチップ</option><option value="object">オブジェクト</option></select></label><div id="palette"></div><label>季節 <select id="season"><option value="spring">春</option><option value="summer" selected>夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label><button id="save">ステージをゲームへ反映</button><button id="download">JSON保存</button><button id="reset">初期地形に戻す</button><a href="./tactics-wireframe.html">▶ タクティクス画面</a><small>道に沿った木柵を配置できます。木・花木は既存の登録IDを使用します。</small></aside><div id="stage"><div id="hint">左ドラッグ：マスを塗る / 右ドラッグ：移動 / ホイール：拡大縮小</div></div></main><script type="module" src="./src/stage-editor.js?v=1"></script></body></html>
