<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰銀のレゾナンス | オブジェクト作成</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#eef4fc;font:14px system-ui}header{padding:12px 16px;background:#14253a;display:flex;align-items:center;gap:14px}a{color:#92d9ff}main{display:grid;grid-template-columns:minmax(230px,290px) 1fr;height:calc(100dvh - 53px)}aside{padding:14px;background:#17253a;overflow:auto}label{display:block;margin:12px 0 4px}input,select,button{width:100%;padding:9px;border:1px solid #6485a6;border-radius:6px;background:#243b56;color:white}input[type=range]{padding:0}button{margin-top:10px;cursor:pointer;background:#285a80}#view{position:relative;min-width:0}canvas{display:block;touch-action:none}#info{position:absolute;bottom:12px;left:12px;background:#101b2ad9;padding:8px;border-radius:5px;pointer-events:none}small{color:#a6c2da} @media(max-width:680px){main{display:flex;flex-direction:column-reverse;height:auto}aside{height:auto}#view{height:55dvh;min-height:300px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><a href="./index.html">← メニュー</a><strong>オブジェクト作成｜高密度ポリゴンの木</strong></header><main><aside><label>オブジェクト</label><select id="type"><option value="tree">樹木</option></select><label>樹高 <span id="heightValue"></span></label><input id="height" type="range" min="3" max="18" step=".5" value="9"><label>幹の太さ <span id="trunkValue"></span></label><input id="trunk" type="range" min=".2" max="1.5" step=".05" value=".55"><label>枝の段数 <span id="levelsValue"></span></label><input id="levels" type="range" min="2" max="8" value="5"><label>枝の本数 / 段 <span id="branchesValue"></span></label><input id="branches" type="range" min="3" max="12" value="7"><label>ポリゴン細分化 <span id="detailValue"></span></label><input id="detail" type="range" min="8" max="64" step="8" value="32"><label>葉の密度 <span id="leavesValue"></span></label><input id="leaves" type="range" min="2" max="20" value="10"><label>乱数シード</label><input id="seed" type="number" value="42"><button id="build">木を再生成</button><button id="export">GLBで保存</button><button id="json">設計データ(JSON)保存</button><small>回転：ドラッグ / 拡大：ピンチ。高密度化するとスマホでは処理が重くなります。GLBはゲーム用の3D素材として利用できます。</small></aside><div id="view"><div id="info">生成中…</div></div></main><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';const $=id=>document.getElementById(id),view=$('view');const scene=new THREE.Scene();scene.background=new THREE.Color(0x102034);const camera=new THREE.PerspectiveCamera(45,1,.1,150);camera.position.set(15,12,19);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));view.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x415a67,2));const sun=new THREE.DirectionalLight(0xffedcc,2.5);sun.position.set(9,18,12);scene.add(sun);const grid=new THREE.GridHelper(40,40,0x446b84,0x294259);scene.add(grid);let tree=new THREE.Group(),count=0;scene.add(tree);const ids=['height','trunk','levels','branches','detail','leaves'];function config(){const c={type:'tree',seed:Number($('seed').value)||42};for(const id of ids)c[id]=Number($(id).value);return c}function random(seed){let n=seed>>>0;return()=>{n=(1664525*n+1013904223)>>>0;return n/4294967296}}function build(){tree.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose()}});scene.remove(tree);tree=new THREE.Group();scene.add(tree);count=0;const c=config(),rnd=random(c.seed),bark=new THREE.MeshStandardMaterial({color:0x70503a,roughness:.93}),leafMats=[0x326c37,0x428347,0x579447,0x265f38].map(color=>new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,roughness:.85}));function cylinder(a,b,r1,r2,mat){const d=new THREE.Vector3().subVectors(b,a),m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),c.detail,Math.max(1,Math.floor(c.detail/8))),mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());tree.add(m);count+=m.geometry.index?m.geometry.index.count/3:m.geometry.attributes.position.count/3}function foliage(pos,size){const geometry=new THREE.IcosahedronGeometry(size,c.detail>=48?3:c.detail>=24?2:1);const mesh=new THREE.Mesh(geometry,leafMats[Math.floor(rnd()*leafMats.length)].clone());mesh.position.copy(pos);mesh.scale.set(.75+rnd()*.6,.7+rnd()*.8,.75+rnd()*.6);tree.add(mesh);count+=geometry.index?geometry.index.count/3:geometry.attributes.position.count/3}const H=c.height;const base=new THREE.Vector3(0,0,0),tip=new THREE.Vector3(0,H*.76,0);cylinder(base,tip,c.trunk,c.trunk*.16,bark.clone());for(let l=0;l<c.levels;l++){const f=(l+.55)/c.levels,y=H*(.15+f*.56),len=H*(.32-f*.18);for(let j=0;j<c.branches;j++){const angle=(j+(l%2)*.5)/c.branches*Math.PI*2+(rnd()-.5)*.28,reach=len*(.7+rnd()*.5),a=new THREE.Vector3(0,y,0),b=new THREE.Vector3(Math.cos(angle)*reach,y+reach*(.25+rnd()*.45),Math.sin(angle)*reach);cylinder(a,b,c.trunk*(.33-f*.18),.035,bark.clone());for(let k=0;k<c.leaves;k++){const t=.45+rnd()*.65,p=a.clone().lerp(b,t).add(new THREE.Vector3((rnd()-.5)*1.5,(rnd()-.5)*1.2,(rnd()-.5)*1.5));foliage(p,.3+H*.035+rnd()*.35)}}}for(let k=0;k<c.leaves*2;k++)foliage(new THREE.Vector3((rnd()-.5)*H*.16,H*(.68+rnd()*.24),(rnd()-.5)*H*.16),.35+H*.035);tree.userData={objectType:'tree',parameters:c};$('info').textContent='推定 '+Math.round(count).toLocaleString()+' 三角形 / '+tree.children.length+' メッシュ';for(const id of ids)$(id+'Value').textContent=$(id).value}function save(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}$('build').onclick=build;$('json').onclick=()=>save(new Blob([JSON.stringify(config(),null,2)],{type:'application/json'}),'tree-config.json');$('export').onclick=()=>{const exporter=new GLTFExporter();exporter.parse(tree,data=>save(new Blob([data],{type:'model/gltf-binary'}),'tree.glb'),err=>alert('GLB出力失敗: '+err.message),{binary:true,onlyVisible:true})};function resize(){const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(view);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}build();resize();animate();</script></body></html>
