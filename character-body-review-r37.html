<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>R37 人体・顔接続確認工房</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><style>*{box-sizing:border-box}body{margin:0;background:#111722;color:#edf2f7;font:14px system-ui}main{max-width:1000px;margin:auto;padding:10px}h1{font-size:21px;margin:6px 0}p{line-height:1.5}#stage{height:54dvh;min-height:260px;border:1px solid #485369;border-radius:10px;overflow:hidden;background:#222a35}canvas{display:block;touch-action:none}button,select,input{font:inherit;color:inherit;background:#29384b;border:1px solid #60738d;border-radius:7px;min-height:44px;padding:8px}button[aria-pressed=true]{background:#24687c;border-color:#9de2ee}.buttons{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.buttons button{flex:1 1 90px}label{display:block;margin:8px 0}input[type=file],select{max-width:100%}input[type=range]{width:100%}small{color:#b8c6d8}#status{white-space:pre-wrap}a{color:#b1ddff}.panel{border:1px solid #465367;border-radius:10px;padding:12px;margin-top:10px}</style></head><body><main><h1>R37 人体・顔接続確認工房</h1><small>検証専用／静止接続試作・既存登録は変更しません</small><div id="stage"></div><div class="buttons" id="angles"></div><div class="buttons" id="modes"></div><p id="status" role="status">人体GLBを読み込み中…</p><section class="panel"><label>登録済み顔（端末内） <select id="faces"><option value="">選択してください</option></select></label><label>顔GLB（R20）を直接選択 <input id="faceFile" type="file" accept=".glb"></label><label>登録済み髪（端末内） <select id="wigs"><option value="">髪なし</option></select></label><label>髪GLB（R35等） <input id="hairFile" type="file" accept=".glb"></label><label>顔の表情 <select id="expression"><option value="">通常</option></select></label><label>表情強度 <input id="strength" type="range" min="0" max="100" value="100"></label><label><input type="checkbox" id="wire"> ワイヤーフレーム</label><label>接続の目印 <input type="checkbox" id="highlight"></label><small>人体はR36のMakeHuman実メッシュ。首の接続は静止表示用、骨格への一体化・衣装・動作・GLB統合出力は未完成です。</small></section><p><a href="./face-precision-r18.html?v=3.12">従来の顔編集工房に戻る</a></p></main><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),status=$('status'),loader=new GLTFLoader(),stage=$('stage');
const scene=new T.Scene();scene.background=new T.Color(0x222a35);const cam=new T.PerspectiveCamera(32,1,.01,20),ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.7));ren.outputColorSpace=T.SRGBColorSpace;ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.04;ren.localClippingEnabled=true;stage.append(ren.domElement);
const orbit=new OrbitControls(cam,ren.domElement);orbit.enableDamping=true;orbit.minDistance=.20;orbit.maxDistance=7;
scene.add(new T.HemisphereLight(0xffffff,0x8c8079,2.2));for(const [x,y,z,power] of [[2,3,4,2.0],[-3,2,2,1.1],[0,2,-3,1.6]]){const l=new T.DirectionalLight(0xffffff,power);l.position.set(x,y,z);scene.add(l)}
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(stage);
const BODY_URL="https://raw.githubusercontent.com/yamadayoshitaka/hai-gin-rpg/d6001349fe1fc3253b62b3b87cdbb9142ebfe1df/assets/character-review/HM08_adult_female_R36_review.glb",bodyCut=1.417,faceCut=1.429,faceY=1.46511052;let body,bodyMesh,head,skin,hair,bridge,mode='full',bodyColor=new T.Color(.64,.48,.40),generation=0;
const bodyPlane=new T.Plane(new T.Vector3(0,-1,0),bodyCut),headPlane=new T.Plane(new T.Vector3(0,1,0),-faceCut);
function view(a=0,e=0){let target=mode==='full'?new T.Vector3(0,.825,.065):mode==='neck'?new T.Vector3(0,1.405,.040):new T.Vector3(0,1.55,.045);let d=mode==='full'?Math.max(3.15,2.1/Math.min(1,stage.clientWidth/Math.max(1,stage.clientHeight))):mode==='neck'?.85:.65;let A=a*Math.PI/180,E=e*Math.PI/180;orbit.target.copy(target);cam.position.copy(target).add(new T.Vector3(d*Math.cos(E)*Math.sin(A),d*Math.sin(E),d*Math.cos(E)*Math.cos(A)));orbit.update()}
for(const [a,e,n] of [[0,0,'正面'],[45,0,'斜め'],[90,0,'側面'],[-90,0,'反対側'],[180,0,'背面'],[0,55,'上'],[0,-38,'斜め下']]){let b=document.createElement('button');b.textContent=n;b.onclick=()=>view(a,e);$('angles').append(b)}
for(const [id,n] of [['full','全身'],['neck','首・鎖骨'],['head','顔アップ']]){let b=document.createElement('button');b.textContent=n;b.dataset.mode=id;b.onclick=()=>{mode=id;for(let el of $('modes').children)el.setAttribute('aria-pressed',String(el===b));view()};b.setAttribute('aria-pressed',String(mode===id));$('modes').append(b)}view();
function eachMat(o,f){o?.traverse(m=>{if(m.isMesh)for(let mat of [m.material].flat())f(mat,m)})}
function remove(o){if(o){o.removeFromParent();o.traverse(m=>{if(m.isMesh){m.geometry?.dispose();for(let mat of [m.material].flat())mat?.dispose()}})}}
function sections(mesh,y){mesh.updateWorldMatrix(true,false);const p=mesh.geometry.attributes.position,idx=mesh.geometry.index,out=[];const q=[new T.Vector3(),new T.Vector3(),new T.Vector3()];for(let i=0;i<(idx?idx.count:p.count);i+=3){for(let k=0;k<3;k++)q[k].fromBufferAttribute(p,idx?idx.getX(i+k):i+k).applyMatrix4(mesh.matrixWorld);let a=[];for(let k=0;k<3;k++){let u=q[k],v=q[(k+1)%3];if((u.y<y)===(v.y<y))continue;let t=(y-u.y)/(v.y-u.y);a.push([u.x+(v.x-u.x)*t,u.z+(v.z-u.z)*t])}if(a.length===2)out.push(a)}if(out.length<12)throw Error('首の断面を抽出できません');return out}
function bounds(seg){let p=seg.flat(),x=p.map(a=>a[0]),z=p.map(a=>a[1]);return {minX:Math.min(...x),maxX:Math.max(...x),minZ:Math.min(...z),maxZ:Math.max(...z),cx:(Math.min(...x)+Math.max(...x))/2,cz:(Math.min(...z)+Math.max(...z))/2}}
function radial(seg,cx,cz,n=160){let out=[];for(let i=0;i<n;i++){let a=2*Math.PI*i/n,dx=Math.cos(a),dz=Math.sin(a),best=-1;for(const [[ax,az],[bx,bz]] of seg){let vx=bx-ax,vz=bz-az,wx=ax-cx,wz=az-cz,den=dx*vz-dz*vx;if(Math.abs(den)<1e-10)continue;let t=(wx*vz-wz*vx)/den,u=(wx*dz-wz*dx)/den;if(t>=0&&u>=-1e-6&&u<=1+1e-6)best=Math.max(best,t)}if(best<0)throw Error('首断面に欠損があります');out.push([cx+best*dx,cz+best*dz])}return out}
function neckBridge(lower,upper){let a=bounds(lower),b=bounds(upper),l=radial(lower,a.cx,a.cz),u=radial(upper,b.cx,b.cz),N=l.length,pos=[],inds=[];const rows=12;for(let k=0;k<=rows;k++){let t=k/rows;for(let i=0;i<N;i++)pos.push(l[i][0]*(1-t)+u[i][0]*t,bodyCut+(faceCut-bodyCut)*t,l[i][1]*(1-t)+u[i][1]*t)}for(let k=0;k<rows;k++)for(let i=0;i<N;i++){let a=k*N+i,b=k*N+(i+1)%N,c=a+N,d=b+N;inds.push(a,c,b,b,c,d)}let g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setIndex(inds);g.computeVertexNormals();return new T.Mesh(g,new T.MeshStandardMaterial({color:bodyColor,roughness:.78,side:T.DoubleSide}))}
function updateStatus(t){status.textContent=t}
function readFaceColor(mesh){const c=mesh.geometry.attributes.color,p=mesh.geometry.attributes.position;if(!c)return new T.Color(.64,.48,.40);let sum=new T.Color(0,0,0),n=0;for(let i=0;i<p.count;i++)if(Math.abs(p.getY(i)-(faceCut-faceY))<.007){sum.r+=c.getX(i);sum.g+=c.getY(i);sum.b+=c.getZ(i);n++}return n?sum.multiplyScalar(1/n):new T.Color(.64,.48,.40)}
async function loadBody(){const g=await loader.loadAsync(BODY_URL);body=g.scene;body.traverse(m=>{if(m.isSkinnedMesh&&!bodyMesh)bodyMesh=m});if(!bodyMesh)throw Error('人体スキンメッシュがありません');scene.add(body);eachMat(body,m=>{m.color.copy(bodyColor);m.roughness=.78});body.updateMatrixWorld(true);updateStatus('R36人体 読込完了。R20顔を選択してください。')}
const ready=loadBody().catch(e=>{updateStatus('人体GLB読込失敗：'+e.message);throw e});ready.catch(()=>{});
async function loadFace(buf){const id=++generation;await ready;let g=await loader.parseAsync(buf,'');if(id!==generation){remove(g.scene);return}let candidate=g.scene,mesh=candidate.getObjectByName('R8_SKIN');if(!mesh?.isMesh){remove(candidate);throw Error('R20互換の顔GLBを選択してください')}candidate.position.set(0,faceY,.043);candidate.updateMatrixWorld(true);let low=sections(bodyMesh,bodyCut),upper=sections(mesh,faceCut),bc=bounds(low),fc=bounds(upper);candidate.position.z+=bc.cz-fc.cz;candidate.updateMatrixWorld(true);upper=sections(mesh,faceCut);bodyColor=readFaceColor(mesh);let seam=neckBridge(low,upper);if(id!==generation){remove(candidate);remove(seam);return}if(hair)hair.removeFromParent();remove(head);remove(bridge);head=candidate;skin=mesh;bridge=seam;scene.add(head,bridge);eachMat(body,m=>{m.color.copy(bodyColor);m.clippingPlanes=[bodyPlane];m.needsUpdate=true});eachMat(head,m=>{m.clippingPlanes=[headPlane];m.needsUpdate=true});if(hair)head.add(hair);$('expression').replaceChildren(new Option('通常',''),...Object.keys(skin.morphTargetDictionary||{}).map(k=>new Option(k,k)));applyExpression();syncWire();let fw=bounds(upper);updateStatus('R37 接続試作表示中\n顔・人体の実断面を接続（首幅：人体 '+((bc.maxX-bc.minX)*1000).toFixed(1)+'mm／顔 '+((fw.maxX-fw.minX)*1000).toFixed(1)+'mm）\n静止表示のみ。接続メッシュは未統合です。')}
function applyExpression(){const key=$('expression').value,w=+$('strength').value/100;head?.traverse(m=>{if(!m.morphTargetInfluences)return;m.morphTargetInfluences.fill(0);const i=m.morphTargetDictionary?.[key];if(i!==undefined)m.morphTargetInfluences[i]=w})}
$('expression').onchange=applyExpression;$('strength').oninput=applyExpression;
function syncWire(){for(const o of [body,head,bridge])eachMat(o,m=>{m.wireframe=$('wire').checked});if(bridge)bridge.material.color.copy($('highlight').checked?new T.Color(0x4ec1f0):bodyColor)}
$('wire').onchange=syncWire;$('highlight').onchange=syncWire;
function faceDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open('hai-gin-face-models-v2',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('models'))q.result.createObjectStore('models',{keyPath:'id'})};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function readStored(fn){const db=await faceDB();try{return await new Promise((resolve,reject)=>{let tx=db.transaction('models','readonly'),q=fn(tx.objectStore('models'));tx.oncomplete=()=>resolve(q.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('読込中断'))})}finally{db.close()}}
async function initFaces(){try{let keys=await readStored(s=>s.getAllKeys());for(let id of keys)$('faces').append(new Option(id,id));let r=keys.find(id=>/R20/.test(id));if(r){$('faces').value=r;await selectStored()}}catch(e){updateStatus('端末内登録の読込不可：'+e.message+'。GLBを直接選択してください')}}
async function selectStored(){try{let id=$('faces').value;if(!id)return;let rec=await readStored(s=>s.get(id));if(!rec?.glb)throw Error('登録顔がありません');await loadFace(await rec.glb.arrayBuffer())}catch(e){updateStatus('顔読込失敗：'+e.message)}}
$('faces').onchange=selectStored;$('faceFile').onchange=async e=>{try{const f=e.target.files[0];if(f)await loadFace(await f.arrayBuffer())}catch(e){updateStatus('顔読込失敗：'+e.message)}};
$('hairFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(!head)throw Error('先に顔を選択してください');let g=await loader.parseAsync(await f.arrayBuffer(),'');remove(hair);hair=g.scene;head.add(hair);syncWire()}catch(e){updateStatus('髪読込失敗：'+e.message)}};
async function readWig(fn){let db=await new Promise((ok,no)=>{let q=indexedDB.open('hai-gin-wig-library-v1',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('wigs'))q.result.createObjectStore('wigs',{keyPath:'id'})};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});try{return await new Promise((ok,no)=>{let tx=db.transaction('wigs','readonly'),q=fn(tx.objectStore('wigs'));tx.oncomplete=()=>ok(q.result);tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error||Error('読込中断'))})}finally{db.close()}}
async function initWigs(){try{for(const id of await readWig(x=>x.getAllKeys()))$('wigs').append(new Option(id,id));}catch(e){console.warn(e)}}
$('wigs').onchange=async()=>{try{const id=$('wigs').value;if(!id){remove(hair);hair=null;return}if(!head)throw Error('先に顔を選択してください');let rec=await readWig(x=>x.get(id));if(!rec?.glb)throw Error('登録髪がありません');let g=await loader.parseAsync(await rec.glb.arrayBuffer(),'');remove(hair);hair=g.scene;head.add(hair);syncWire()}catch(e){updateStatus('登録髪読込失敗：'+e.message)}};
ready.then(()=>Promise.all([initFaces(),initWigs()])).catch(()=>{});ren.setAnimationLoop(()=>{orbit.update();ren.render(scene,cam)});
</script></body></html>
