<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灰銀のレゾナンス | 衣装基準の自動着せ替え</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#e9eff9;font:15px system-ui;padding:14px}
a{color:#c0e5ff}main{max-width:900px;margin:12px auto}h1{font-size:23px}
section{background:#192b43;border:1px solid #45617d;border-radius:12px;padding:15px;margin:12px 0}
label{display:block;margin:9px 0}input,button{font:inherit}
input[type=file]{display:block;width:100%;font-size:13px;padding:10px;background:#233b58;color:white;border:1px solid #7896b3;border-radius:8px}
input[type=range]{width:100%;accent-color:#9bc7ff}
button{padding:10px 14px;background:#294968;color:white;border:1px solid #7896b3;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}.buttons{display:flex;gap:8px;flex-wrap:wrap}
#status{white-space:pre-wrap;color:#ffe1a2;line-height:1.6;overflow-wrap:anywhere}
#view canvas{width:100%;height:52vh;min-height:310px;display:block;border-radius:9px;touch-action:none}
small{color:#b7cbe0;line-height:1.6}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
@media(max-width:560px){.controls{grid-template-columns:1fr}h1{font-size:20px}}
</style></head><body>
<a href="./motion-external-test.html">← 職業別モーション実機確認へ戻る</a>
<main>
<h1>衣装基準の自動着せ替え（GLB検証）</h1>
<section>
 <p>素体（裸体）と衣装を別々に読み込み、衣装は変形させずに<strong>素体だけ</strong>を自動フィットします。</p>
 <label>① 素体GLB<input id="bodyAsset" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"></label>
 <label>② 衣装GLB<input id="garmentAsset" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"></label>
 <div class="buttons">
  <button id="loadGenerated" type="button">無料モデル：素体＋騎士鎧を自動読込</button>
  <button id="fit" disabled>衣装基準で自動フィット</button>
  <button id="mask" disabled>隠れた身体をカット</button>
  <button id="undo" disabled>カットを戻す</button>
 </div>
 <p id="status" role="status">GLBを選択してください。1ファイルだけでも表示できます。</p>
 <small>カットは骨格・衣装表面の整合が確認できる箇所だけに限定します。外部GLBの骨構造が異なる場合、戦闘アニメーション用リギングは別途必要です。</small>
</section>
<section>
 <div class="controls">
  <label>左右位置 X <output id="ox">0.000</output><input id="dx" type="range" min="-0.3" max="0.3" value="0" step="0.005"></label>
  <label>上下位置 Y <output id="oy">0.000</output><input id="dy" type="range" min="-0.3" max="0.3" value="0" step="0.005"></label>
  <label>前後位置 Z <output id="oz">0.000</output><input id="dz" type="range" min="-0.3" max="0.3" value="0" step="0.005"></label>
  <label>素体の回転 <output id="orot">0°</output><input id="yaw" type="range" min="-180" max="180" value="0" step="5"></label>
 </div>
 <div class="buttons">
  <button id="showBoth">両方表示</button>
  <button id="showBody">素体だけ</button>
  <button id="showGarment">衣装だけ</button>
 </div>
</section>
<section><div id="view"></div><small>ドラッグ：回転／ピンチ：拡大縮小。補正値はこの画面の一時プレビューです。GitHubへのアップロード、戦闘への置換、モデルの恒久変更は実施しません。</small></section>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {autoFitNudeToGarment,maskImportedNude,assessImportedRig} from './src/character-system/garment-first-import-runtime.js?v=4.4.94';
const $=id=>document.getElementById(id);
const view=$('view'),status=$('status'),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x172335);
scene.add(new THREE.HemisphereLight(0xffffff,0x667b98,2.4));
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,6,5);scene.add(sun);
const camera=new THREE.PerspectiveCamera(42,1,.01,1000);camera.position.set(2,2,4);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const loader=new GLTFLoader();
let body=null,garment=null,maskHandle=null,fitResult=null,baseBodyTransform=null;
let fittedPosition=new THREE.Vector3(),fittedRotation=new THREE.Quaternion();
let bodyFile='',garmentFile='',visibleMode='both';
const fields=['dx','dy','dz','yaw'];
function canFit(){return !!(body&&garment)}
function refreshButtons(){
 $('fit').disabled=!canFit();$('mask').disabled=!canFit();$('undo').disabled=!maskHandle;
}
function clearMask(){if(maskHandle){maskHandle.restore();maskHandle=null}refreshButtons()}
function disposeModel(root){
 if(!root)return;
 root.traverse(o=>{if(o.isMesh){o.geometry?.dispose();
  const mats=Array.isArray(o.material)?o.material:[o.material];
  for(const m of mats){if(m){for(const key of ['map','normalMap','roughnessMap','metalnessMap','emissiveMap','aoMap'])m[key]?.dispose();m.dispose()}}
 }});
 scene.remove(root);
}
function clearOffsets(){for(const id of fields)$(id).value='0';renderOffsetValues()}
function renderOffsetValues(){
 $('ox').textContent=(+$('dx').value).toFixed(3);
 $('oy').textContent=(+$('dy').value).toFixed(3);
 $('oz').textContent=(+$('dz').value).toFixed(3);
 $('orot').textContent=$('yaw').value+'°';
}
function restoreBodyTransform(){
 if(!body||!baseBodyTransform)return;
 body.position.copy(baseBodyTransform.position);body.scale.copy(baseBodyTransform.scale);
 body.quaternion.copy(baseBodyTransform.quaternion);body.updateMatrixWorld(true);
}
function applyOffsets(){
 renderOffsetValues();if(!body||!fitResult)return;
 body.position.copy(fittedPosition).add(new THREE.Vector3(+$('dx').value,+$('dy').value,+$('dz').value));
 body.quaternion.copy(fittedRotation).multiply(
  new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),THREE.MathUtils.degToRad(+$('yaw').value)));
 body.updateMatrixWorld(true);
}
function focusModels(){
 const box=new THREE.Box3();
 for(const root of [body,garment])if(root)box.expandByObject(root,true);
 if(box.isEmpty())return;
 const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 controls.target.copy(center);
 camera.position.copy(center).add(new THREE.Vector3(size.length()*.52,size.length()*.28,size.length()*.72));
 camera.near=Math.max(.001,size.length()/1000);camera.far=Math.max(100,size.length()*100);
 camera.updateProjectionMatrix();controls.update();
}
function setMode(mode){visibleMode=mode;if(body)body.visible=mode!=='garment';if(garment)garment.visible=mode!=='body'}
function fitNow(){
 if(!canFit())return;
 clearMask();restoreBodyTransform();clearOffsets();
 try{
  fitResult=autoFitNudeToGarment(body,garment);
  fittedPosition.copy(body.position);fittedRotation.copy(body.quaternion);
  const r=fitResult.rig;
  const warning=!fitResult.fullLength?'部分衣装の可能性：上下・前後位置を検証してください。':'';
  const animation=r.animatedOutfitReady?'骨格名の対応は概ね良好（動作確認は別途必要）':'骨格互換は未確認：アニメーション利用にはリターゲット／スキニングが必要です。';
  status.textContent='衣装基準のフィット完了（プレビュー）\n素体：'+bodyFile+'\n衣装：'+garmentFile+
   '\n基準：'+fitResult.method+'\n素体倍率：'+fitResult.scale+
   '\n中心距離：'+fitResult.centerError+'\n共通骨数：'+r.sharedBones+'/'+r.garmentBones+
   '\n'+animation+(warning?'\n'+warning:'')+
   '\nカットは未実行です。「隠れた身体をカット」で検証できます。';
  setMode('both');focusModels();
 }catch(e){status.textContent='フィット失敗：'+e.message;console.error(e)}
 refreshButtons();
}
async function installBuffer(buffer,key,name){
 const gltf=await new Promise((resolve,reject)=>loader.parse(buffer,'',resolve,reject));
 const model=gltf.scene;
 if(new THREE.Box3().setFromObject(model,true).isEmpty())throw Error('表示可能なメッシュがありません');
 clearMask();
 if(key==='body'){
  disposeModel(body);body=model;bodyFile=name;
  baseBodyTransform={position:body.position.clone(),quaternion:body.quaternion.clone(),scale:body.scale.clone()};
 }else{disposeModel(garment);garment=model;garmentFile=name}
 scene.add(model);fitResult=null;
 if(canFit())fitNow();
 else{
  setMode('both');focusModels();
  status.textContent='プレビュー成功：'+name+'\nもう一方のGLBを選ぶと自動フィットします。';
 }
 refreshButtons();
}
async function loadAsset(id,key){
 const file=$(id).files?.[0];if(!file)return;
 status.textContent='読み込み中：'+file.name;
 try{await installBuffer(await file.arrayBuffer(),key,file.name)}
 catch(e){status.textContent='読み込み失敗：'+e.message;console.error(e)}
}
async function loadGeneratedPair(){
 const base='assets/characters/free-knight/';
 status.textContent='無料ライセンス素材で生成した素体＋騎士鎧の登録状況を確認中…';
 $('loadGenerated').disabled=true;
 try{
  const response=await fetch('./'+base+'manifest.json',{cache:'no-store'});
  if(!response.ok)throw Error('無料モデルは未生成です（HTTP '+response.status+'）。GitHub Actionsの「Build free knight body + armor GLBs」を実行してください。');
  const manifest=await response.json();
  if(manifest.schema!=='free-knight-import-v1')throw Error('無料モデルのmanifest形式が不正です');
  for(const [name,key] of [['body','body'],['armor','garment']]){
   const relative=manifest[name]?.file;
   if(typeof relative!=='string'||!relative.startsWith(base)||relative.includes('..'))throw Error(name+'の登録情報が不正です');
   status.textContent='無料素材モデルを取得中：'+name;
   const file=await fetch('./'+relative);
   if(!file.ok)throw Error(name+' のGLB取得に失敗しました（HTTP '+file.status+'）');
   await installBuffer(await file.arrayBuffer(),key,name==='body'?'knight_male_body.glb':'knight_full_plate_armor.glb');
  }
  status.textContent+='\n無料のCC0/MIT素材を組み合わせた2モデルです。AI生成ではありません。騎士鎧の前後位置・サイズ・継ぎ目を確認してください。';
 }catch(e){
  status.textContent='無料モデル読込不可：'+e.message;console.error(e);
 }finally{$('loadGenerated').disabled=false}
}
$('loadGenerated').addEventListener('click',loadGeneratedPair);
$('bodyAsset').addEventListener('change',()=>loadAsset('bodyAsset','body'));
$('garmentAsset').addEventListener('change',()=>loadAsset('garmentAsset','garment'));
$('fit').addEventListener('click',fitNow);
$('mask').addEventListener('click',()=>{
 if(!canFit())return;
 clearMask();
 try{
  maskHandle=maskImportedNude(body,garment,{fullPlate:garmentFile==='knight_full_plate_armor.glb'});
  const d=maskHandle.diagnostics;
  status.textContent+='\n身体カット：'+(d.removedTriangles||0)+' 三角形を非表示化 / 部位：'+
    (maskHandle.coverage.regions.join('、')||'認識なし')+
    (d.reason?'\n'+d.reason:'')+
    '\n結果を拡大し、顔・首・手・衣装の継ぎ目を確認してください。';
  refreshButtons();
 }catch(e){status.textContent+=' \nカット失敗：'+e.message;console.error(e)}
});
$('undo').addEventListener('click',()=>{clearMask();status.textContent+='\nカットを元に戻しました。'});
for(const id of fields){
 $(id).addEventListener('input',()=>{if(maskHandle)clearMask();applyOffsets()});
}
$('showBoth').addEventListener('click',()=>setMode('both'));
$('showBody').addEventListener('click',()=>setMode('body'));
$('showGarment').addEventListener('click',()=>setMode('garment'));
function resize(){const width=Math.max(260,view.clientWidth),height=Math.max(310,Math.round(window.innerHeight*.52));
 renderer.setSize(width,height);camera.aspect=width/height;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera)}render();
</script></body></html>
