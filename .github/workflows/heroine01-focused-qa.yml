name: Heroine 01 100k hair face and wire QA
on:
  pull_request:
    paths:
      - 'src/master-heroine-long-hair.js'
      - 'src/master-swordsman-assembly.js'
      - 'qa/master-swordsman-assembly.test.mjs'
      - 'src/master-swordsman-face-proportions.js'
      - 'src/master-swordsman-featured-profiles.js'
      - 'master-swordsman-prototype.html'
      - 'qa/heroine01-focused-browser.cjs'
      - '.github/workflows/heroine01-focused-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/master-heroine-long-hair.js'
      - 'src/master-swordsman-face-proportions.js'
      - 'src/master-swordsman-featured-profiles.js'
      - 'master-swordsman-prototype.html'
      - 'qa/heroine01-focused-browser.cjs'
      - '.github/workflows/heroine01-focused-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heroine-face-wire-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real 3D browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Verify scalp, real-body clearance and face geometry without browser
        run: node --test qa/master-swordsman-assembly.test.mjs qa/master-swordsman-face-proportions.test.mjs
      - name: Host genuine CC0 3D masters
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/heroine01-qa-http.log 2>&1 &
          sleep 2
      - name: Capture genuine heroine face zoom and wire geometry
        run: node qa/heroine01-focused-browser.cjs
      - name: Archive face and wire screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heroine01-100k-face-wire
          path: qa-screenshots/heroine01-focused/
          retention-days: 14
          if-no-files-found: warn
