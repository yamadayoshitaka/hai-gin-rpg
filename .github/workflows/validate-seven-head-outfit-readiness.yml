name: Check outfit readiness
on:
  workflow_dispatch:
  push:
    paths:
      - tools/validate-seven-head-outfit-readiness.py
      - .github/workflows/validate-seven-head-outfit-readiness.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/validate-seven-head-outfit-readiness.py
      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/character-system/seven-head-outfit-readiness.json
          git diff --cached --quiet || (git commit -m "Report outfit readiness" && git push)
