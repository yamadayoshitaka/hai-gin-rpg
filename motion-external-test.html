try{const response=await fetch('motion-external-inventory.json?cache='+Date.now());if(!response.ok)throw Error('HTTP '+response.status);data=(await response.json()).filter(x=>x.clips.length);const jobs={ '剣士':['Melee_','Sword_','Walking_','Running_','Dodge_','Hit_','Death_'],'格闘家':['Unarmed','Melee_Hook','Dodge_','Walking_','Running_','Hit_','Death_'],'魔法使い':['Ranged_Magic','Idle_','Walking_','Running_','Hit_','Death_'],'弓使い':['Ranged_Bow','HoldingBow','Walking_','Running_','Dodge_','Hit_','Death_'],'盾戦士':['Shield_','Sword_Block','Melee_Block','Walking_','Running_','Hit_','Death_'],'盗賊':['Sneaking','Lockpick','Dodge_','Walking_','Running_','Melee_Dualwield','Hit_','Death_'],'忍者':['NinjaJump','Melee_Dualwield','Dodge_','Running_','Hit_','Death_'],'農民・職人':['Farm_','Chop','Hammer','Dig','Saw','Work_','Fishing_','Walking_'],'共通動作':['Walking_','Running_','Idle_','Death_','Hit_','Jump_','Dodge_']};$('job').replaceChildren(...Object.keys(jobs).map(x=>new Option(x,x)));commandMap=await (await fetch('./job-command-motion-map.json?v=external-audio-01',{cache:'no-store'})).json().then(j=>j.jobs);$('job').replaceChildren(...Object.keys(commandMap).map(x=>new Option(x,x)));function filterJob(){const commands=commandMap[$('job').value]||[];filtered=commands.map(c=>data.find(d=>d.file===c.asset)).filter(Boolean);$('asset').replaceChildren(...filtered.map((x,i)=>new Option(x.file.split('/').slice(-2).join('/'),i)));const valid=commands.filter(c=>c.available&&data.some(d=>d.file===c.asset&&d.clips.includes(c.clip)));$('action').replaceChildren(...valid.map((c,i)=>new Option(c.command,i)));$('action').onchange=()=>{const c=valid[+$('action').value];if(!c)return;const i=filtered.findIndex(x=>x.file===c.asset);if(i<0)return;$('asset').value=String(i);pendingClip=c.clip;load()};if(valid.length){$('action').value='0';$('action').onchange()}else status('この職業に対応するモーションはありません')} $('job').onchange=()=>{filterJob();if($('body').value==='soldier')setBody()};$('asset').onchange=()=>{pendingClip $('pause').onclick=()=>{const a=$('body').value==='soldier'?(retargetEnabled?sourceAction:soldierAction):action;if(a){a.paused=!a.paused;$('pause').textContent=a.paused?'再開':'一時停止'}};$('reset').onclick=play;function mark(result){const key=filtered[+$('asset').value]?.file+' :: '+$('clip').value;records[key]=result;$('qa').textContent='判定記録 '+Object.keys(records).length+'件'}$('pass').onclick=()=>mark('PASS');$('fail').onclick=()=>mark('FAIL');$('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(records,null,2)).then(()=>status('検証結果をコピーしました')).catch(e=>status('コピー失敗: '+e.message));window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setBody();
// Outfit candidates are STATIC meshes. Keep them separate from the animated character:
// binding them to bones without weights would cause penetration and false validation.
const outfitLoader=new GLTFLoader();
let outfitManifest=null,outfitGroup=null,outfitRequest=0,outfitAttached=[];
async function refreshOutfitPreview(){
 const token=++outfitRequest;
 window.__outfitFitReport=[];
 for(const piece of outfitAttached)piece.parent?.remove(piece);outfitAttached=[];
 if(outfitGroup){scene.remove(outfitGroup);outfitGroup=null;}
 if(!$('outfitPreview').checked){$('outfitStatus').textContent='衣装候補: 非表示';return;}
 try{
  if(!outfitManifest){
   const response=await fetch('./assets/characters/seven-head-equipment-candidates/manifest.json',{cache:'no-store'});
   if(!response.ok)throw Error('manifest HTTP '+response.status);
   outfitManifest=await response.json();
  }
  const jobName=$('job').selectedOptions[0]?.textContent||$('job').value;
  const candidates=outfitManifest.jobs[jobName]||outfitManifest.jobs[$('job').value];
  if(!candidates)throw Error('ジョブ対応なし: '+jobName);
  const files=candidates[$('sex').value];
  const gltfs=await Promise.all(files.map(f=>outfitLoader.loadAsync('./assets/characters/seven-head-equipment-candidates/'+encodeURIComponent(f))));
  if(token!==outfitRequest)return;
  const group=new THREE.Group();group.name='static-outfit-reference';
  for(let i=0;i<gltfs.length;i++){gltfs[i].scene.name=files[i];group.add(gltfs[i].scene);}
  const character=sharedCharacter?.model||soldierModel;
  const characterBox=character?new THREE.Box3().setFromObject(character):null;
  const outfitBox=new THREE.Box3().setFromObject(group);
  const size=outfitBox.getSize(new THREE.Vector3());
  const personSize=characterBox?.getSize(new THREE.Vector3())||new THREE.Vector3(1,2,1);
  let attached=0,missing=[];
  if($('outfitFollow').checked&&character&&characterBox&&!characterBox.isEmpty()){
   // Fit each garment to its corresponding anatomical region, not to the whole body.
   // Source assets have unrelated origins and scales; normalize against the source outfit bounds.
   // Attach each piece in its own local space. Do not use the entire outfit group's
   // source origin or its world-space offset as the garment's anatomical anchor.
   const bones=[];character.traverse(n=>{if(n.isBone)bones.push(n)});
   const findBone=(patterns)=>bones.find(b=>patterns.some(p=>p.test(b.name.toLowerCase())));
   const bodyBox=new THREE.Box3().setFromObject(character);
   const bodyHeight=bodyBox.getSize(new THREE.Vector3()).y;
   const bodyWidth=bodyBox.getSize(new THREE.Vector3()).x;
   const configs={
    head:{patterns:[/head/],h:.18,w:.24},
    hands:{patterns:[/hand/,/wrist/],h:.20,w:.24},
    feet:{patterns:[/foot/,/ankle/],h:.16,w:.27},
    legs:{patterns:[/hips/,/pelvis/,/thigh/],h:.43,w:.49},
    chest:{patterns:[/chest/,/spine2/,/spine1/,/spine/,/hips/],h:.41,w:.53}
   };
   const bodyMeshes=[];character.traverse(n=>{if(n.isSkinnedMesh&&n.geometry?.attributes?.position)bodyMeshes.push(n)});
   // Estimate the visible body envelope near each garment's joint, rather than
   // assuming the center of a bone is the outer surface.
   const surfaceRadius=(bone)=>{
    const joint=new THREE.Vector3();bone.getWorldPosition(joint);
    let radius=0;
    for(const mesh of bodyMeshes){
     const box=new THREE.Box3().setFromObject(mesh);
     if(box.isEmpty()||joint.y<box.min.y-.15*bodyHeight||joint.y>box.max.y+.15*bodyHeight)continue;
     radius=Math.max(radius,Math.min(box.getSize(new THREE.Vector3()).x*.48,bodyHeight*.30));
    }
    return Math.max(radius,bodyHeight*.085);
   };
   for(const piece of [...group.children]){
    const f=piece.name.toLowerCase();
    const cfg=/head/.test(f)?configs.head:/hands/.test(f)?configs.hands:/feet/.test(f)?configs.feet:/legs/.test(f)?configs.legs:configs.chest;
    const bone=findBone(cfg.patterns);
    if(!bone){missing.push(piece.name);continue;}
    // Rebase the geometry around its OWN bounding box. Original source mesh origins
    // may be metres away from the visible vertices.
    piece.updateMatrixWorld(true);
    const bounds=new THREE.Box3().setFromObject(piece);
    const dims=bounds.getSize(new THREE.Vector3());
    const factor=Math.max(bodyHeight*cfg.h/Math.max(dims.y,.001),bodyHeight*cfg.w/Math.max(dims.x,.001));
    if(!Number.isFinite(factor)||factor<=0||factor>100){missing.push(piece.name);continue;}
    // Use a clean local pivot. bone.attach() preserves the asset's unrelated
    // source-world transform, which previously left clothing below the floor.
    const pivot=new THREE.Group();pivot.name='armor-anchor-'+piece.name;
    bone.add(pivot);
    pivot.position.set(0,0,0);
    pivot.quaternion.identity();
    const center=bounds.getCenter(new THREE.Vector3());
    const localCenter=piece.worldToLocal(center.clone());
    group.remove(piece);
    pivot.add(piece);
    piece.position.set(-localCenter.x*factor,-localCenter.y*factor,-localCenter.z*factor);
    piece.quaternion.identity();
    piece.scale.setScalar(factor);
    // Keep clothing above the floor: body-envelope sizing is a provisional
    // approximation, not skinning or a substitute for rig-compatible assets.
    const radius=surfaceRadius(bone);
    const requiredWidth=radius*2*(/head/.test(f)?1.12:1.18);
    const scaledWidth=dims.x*factor;
    if(scaledWidth>0&&scaledWidth<requiredWidth){
      const extra=requiredWidth/scaledWidth;
      piece.scale.x*=extra;piece.scale.z*=extra;
    }
    // Stable fitting: each correction uses the current WORLD-space bounds.
    // Convert the world-space delta to the bone parent's local vector; do not
    // repeatedly transform the target through a moving pivot.
    const region=/head/.test(f)?'head':/hands/.test(f)?'hands':/feet/.test(f)?'feet':/legs/.test(f)?'legs':'chest';
    const yFractions={head:.91,hands:.57,feet:.08,legs:.34,chest:.69};
    const hFractions={head:.20,hands:.18,feet:.16,legs:.43,chest:.41};
    const wFractions={head:.27,hands:.22,feet:.25,legs:.52,chest:.56};
    const boneWorld=new THREE.Vector3();bone.getWorldPosition(boneWorld);
    const target=new THREE.Vector3(boneWorld.x,bodyBox.min.y+bodyHeight*yFractions[region],boneWorld.z);
    if(region==='chest'||region==='legs')target.x=bodyBox.getCenter(new THREE.Vector3()).x;
    const fitBounds=()=>{pivot.updateWorldMatrix(true,true);return new THREE.Box3().setFromObject(piece)};
    const measured=fitBounds().getSize(new THREE.Vector3());
    const maxH=bodyHeight*hFractions[region],maxW=bodyHeight*wFractions[region];
    const shrink=Math.min(1,maxH/Math.max(measured.y,.001),maxW/Math.max(measured.x,.001));
    if(Number.isFinite(shrink)&&shrink>0)piece.scale.multiplyScalar(shrink);
    const fittedCenter=fitBounds().getCenter(new THREE.Vector3());
    const deltaWorld=target.clone().sub(fittedCenter);
    bone.updateWorldMatrix(true,false);
    const parentRotation=new THREE.Quaternion();bone.getWorldQuaternion(parentRotation);
    const parentScale=new THREE.Vector3();bone.getWorldScale(parentScale);
    const localDelta=deltaWorld.applyQuaternion(parentRotation.invert());
    localDelta.set(localDelta.x/Math.max(Math.abs(parentScale.x),.0001),
      localDelta.y/Math.max(Math.abs(parentScale.y),.0001),
      localDelta.z/Math.max(Math.abs(parentScale.z),.0001));
    pivot.position.add(localDelta);
    const finalBox=fitBounds(),finalSize=finalBox.getSize(new THREE.Vector3());
    const offset=finalBox.getCenter(new THREE.Vector3()).distanceTo(target)/Math.max(bodyHeight,.001);
    const oversized=finalSize.y>maxH*1.25||finalSize.x>maxW*1.25;
    window.__outfitFitReport.push({file:piece.name,region,offset:+offset.toFixed(3),oversized,
      width:+(finalSize.x/bodyHeight).toFixed(3),height:+(finalSize.y/bodyHeight).toFixed(3)});
    outfitAttached.push(pivot);attached++;
   }
   outfitGroup=group;
  }else{
   group.position.x+=Math.max(size.x,personSize.x,1)*1.6;
   scene.add(group);outfitGroup=group;
  }
  $('outfitStatus').textContent='衣装候補 '+jobName+' / '+$('sex').value+' / '+files.length+
    '点 / 骨追従 '+attached+'点'+(missing.length?' / 未対応 '+missing.join(', '):'')+
    '（部位別縮尺補正・剛体追従。貫通・布変形は未検証）';
 }catch(e){if(token===outfitRequest)$('outfitStatus').textContent='衣装候補読込失敗: '+e.message;}
}
$('outfitPreview').onchange=refreshOutfitPreview;
$('outfitFollow').onchange=refreshOutfitPreview;
$('job').addEventListener('change',()=>setTimeout(refreshOutfitPreview,0));
$('sex').addEventListener('change',()=>setTimeout(refreshOutfitPreview,0));

function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);mixer?.update(dt);soldierMixer?.update(dt);sharedCharacter?.update(dt);if(retargetEnabled&&sourceMixer&&soldierModel&&!sharedCharacter){sourceMixer.update(dt);sourceRig.updateMatrixWorld(true);soldierModel.updateMatrixWorld(true);applyRigPairs(THREE,bonePairs);soldierModel.updateMatrixWorld(true)}renderer.render(scene,camera)}tick();
</script></body></html>
