<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>灰銀のレゾナンス | 職業アクションテスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f2e5cb;font:14px system-ui;overflow:hidden}canvas{position:fixed;top:0;left:0;width:100%;height:45vh;touch-action:none}
header{position:fixed;top:0;left:0;right:0;padding:10px;z-index:3;background:#13243be8;display:flex;justify-content:space-between;gap:8px;align-items:center}a,button,select{color:white;background:#304967;border:1px solid #9caecc;border-radius:8px;padding:10px;font:600 14px system-ui}a{text-decoration:none}main{position:fixed;bottom:0;left:0;right:0;z-index:3;background:#142338ed;padding:10px;max-height:52vh;overflow-y:auto}#actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}#actions button{padding:10px 2px;min-height:47px}button.active{background:#94713c}label{display:inline-flex;gap:5px;align-items:center;margin:3px}select{max-width:165px}#diagnostics{font-size:12px;color:#c9e8e4;margin:7px 0 1px;min-height:17px}#hint{position:fixed;top:70px;left:10px;right:10px;text-align:center;pointer-events:none;color:#e4e8ff;text-shadow:0 2px 4px #000}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body><canvas id="view"></canvas><header><strong>職業別アクションテスト v127.41</strong><a href="./play-1210.html?v=127.31">ゲームへ戻る</a></header>
<div id="hint">本編と同じ衣装付き3D人物モデル＋共通関節BOM</div>
<main><div><label>職業 <select id="job"></select></label><label>性別 <select id="sex"><option value="male">男性</option><option value="female">女性</option></select></label><label>速度 <select id="speed"><option value="1">標準</option><option value=".5">0.5倍</option><option value="1.5">1.5倍</option></select></label></div>
<div id="actions"></div><div id="editor" style="display:flex;flex-wrap:wrap;gap:5px;margin:8px 0"></div><div><label>反映先 <select id="target"><option value="hero">主人公</option><option value="companion-0">仲間1</option><option value="companion-1">仲間2</option><option value="companion-2">仲間3</option></select></label><button id="save">保存してゲームに反映</button><button id="load">保存値を読込</button><button id="export">JSON出力</button></div><div id="diagnostics"></div><button id="all">全動作を連続テスト</button> <button id="repeat">繰返し：OFF</button></main>
<script type="module">
import * as THREE from 'three';
import {createHumanBomRig} from './src/human-bom-renderer.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {attachTownOutfitNpc} from './src/cc0-town-npc-visuals.js';
import {sampleHumanClip} from './src/human-motion-clips.js';
import {resolveFantasyActor} from './src/fantasy-job-roster.js';
import {resolveJobVisual,resolveJobIdentity} from './src/job-visual-bom.js';
import {HUMAN_REST_POSE} from './src/human-action-bom.js';
import {PLAYER_JOBS} from './src/game-content.js';
import {characterAssetRecipe} from './src/character-asset-registry.js';
import {CHARACTER_EDIT_FIELDS,readCharacterPresets,saveCharacterPreset} from './src/character-preset-store.js';
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#344457');scene.add(new THREE.HemisphereLight(0xe9efff,0x38404e,2.5));
const key=new THREE.DirectionalLight(0xffe3bd,2.7);key.position.set(-4,10,6);scene.add(key);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,1.35,3.2);camera.lookAt(0,1.15,0);
function fitCharacterCamera(){
 if(!rig)return;
 rig.root.updateMatrixWorld(true);
 const visual=host.children.find(c=>c.userData?.sourceModelId&&c.visible)||rig.root;
 const box=new THREE.Box3().setFromObject(visual,true),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 const height=Math.max(.8,size.y),width=Math.max(.55,size.x);
 const vertical=(camera.fov*Math.PI/180)/2,dist=Math.max(1.2,height/(2*Math.tan(vertical))*1.45,width/(2*Math.tan(vertical)*Math.max(.65,camera.aspect))*1.25);
 camera.position.set(dist*.16,center.y+height*.12,dist);
 camera.lookAt(0,center.y,0);
}

function resizePreview(){const headerBottom=document.querySelector('header').getBoundingClientRect().bottom;const panelTop=document.querySelector('main').getBoundingClientRect().top;const height=Math.max(180,Math.floor(panelTop-headerBottom));const canvas=$('view');canvas.style.top=headerBottom+'px';canvas.style.height=height+'px';renderer.setSize(innerWidth,height);camera.aspect=innerWidth/height;camera.updateProjectionMatrix();fitCharacterCamera();}
window.addEventListener('resize',resizePreview);if(window.ResizeObserver)new ResizeObserver(resizePreview).observe(document.querySelector('main'));
const ground=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:0x59665f,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);
const grid=new THREE.GridHelper(12,12,0x8996a7,0x65757e);grid.position.y=.005;scene.add(grid);
let editValues={};let host,rig,action='idle',clock=0,cycle=false,queue=[],last=performance.now(),result=null,modelGeneration=0,modelStatus='読込準備中',sequence=false;
const motions=['idle','walk','run','attack','guard','hit','dead'];
const labels={idle:'待機',walk:'歩行',run:'ダッシュ',attack:'職業特技',guard:'防御',hit:'被弾',dead:'戦闘不能'};
for(const [job,data] of Object.entries(PLAYER_JOBS)){const o=document.createElement('option');o.value=job;o.textContent=data.label;$('job').appendChild(o)}
function build(){
 // Single transaction: resolve JSON first, initialize a fresh actor off-scene,
 // attach ONE visual, then publish the finished actor. Old loads cannot overwrite it.
 const generation=++modelGeneration;
 const job=$('job').value,sex=$('sex').value;
 const actor=resolveFantasyActor(job,sex);
 const contract=characterAssetRecipe(job,sex,editValues);
 const preset={...actor,...contract.slots,modelId:contract.modelId,jobId:job};
 const nextHost=new THREE.Group();
 nextHost.rotation.y=Math.PI;
 nextHost.userData.actorId='test-'+job+'-'+sex;
 nextHost.userData.characterBOM=preset;
 const nextRig=createHumanBomRig(THREE,nextHost,{id:'test-'+job,role:'hero',assembly:contract.slots});
 // Never hide the existing actor until the replacement is initialized.
 nextRig.root.traverse(part=>{
  if(part.name==='weapon-bom-mount')part.visible=contract.slots.equipment!=='none';
  if(part===nextRig.skin)part.visible=false;
  if(part.isMesh&&['torso','pelvis','head','upperArm','forearm','hand','thigh','shin','chest-shell','waist-shell','shoulder-cap','thigh-shell','calf-shell','cheek','chin','hair-lock','fringe'].includes(part.userData?.partId))part.visible=true;
 });
 const oldHost=host;
 host=nextHost;rig=nextRig;
 scene.add(host);
 if(oldHost)scene.remove(oldHost);
 // Imported rigged skin is the production visual authority; never overlay it with BOM.
 // While it loads the complete procedural actor remains visible.
 modelStatus='モデル初期化中';
 fitCharacterCamera();
 attachTownOutfitNpc({host:nextHost,rig:nextRig,preset,loader:new GLTFLoader(),THREE}).then(ok=>{
  if(generation!==modelGeneration||host!==nextHost)return;
  const model=nextHost.children.find(c=>c.userData?.sourceModelId);
  if(ok&&model){
   nextHost.userData.externalNpcSync?.();
   nextRig.root.visible=false;
   model.visible=true;
   modelStatus='外部3Dモデル表示中（編集内容は保存データに保持）';
  }else{
   nextRig.root.visible=true;
   modelStatus='BOM代替モデル表示中';
  }
  fitCharacterCamera();
 }).catch(err=>{
  if(generation!==modelGeneration||host!==nextHost)return;
  nextRig.root.visible=true;
  modelStatus='モデル読込失敗: '+String(err.message||err).slice(0,90);
  fitCharacterCamera();
 });
 action='idle';clock=0;result=null;sequence=false;queue=[];drawButtons();
}
function start(name){action=name;clock=0;result=null;drawButtons()}
function drawButtons(){
 const root=$('actions');root.replaceChildren();
 for(const motion of motions){const b=document.createElement('button');b.textContent=motion==='attack'?(PLAYER_JOBS[$('job').value]?.skill||'特技'):labels[motion];if(action===motion)b.className='active';b.onclick=()=>{queue=[];sequence=false;start(motion)};root.appendChild(b)}
}
function poseFrame(dt){
 const job=$('job').value,actor=resolveFantasyActor(job,$('sex').value),visual=resolveJobVisual(job),identity=resolveJobIdentity(job);
 const motionClock=clock*(actor.motion.tempo||1);
 const pose=sampleHumanClip(action,motionClock,{...visual,...identity,...actor.motion,tempo:1,attack:actor.motion.attack});
 const j=rig.joints;
 const apply=(bone,axis,n)=>{bone.rotation[axis]=THREE.MathUtils.damp(bone.rotation[axis],n,18,dt)};
 for(let i=0;i<2;i++){
  apply(j.hips[i],'x',pose.hips[i]);apply(j.knees[i],'x',pose.knees[i]);apply(j.ankles[i],'x',pose.ankles[i]);
  apply(j.shoulders[i],'x',pose.shoulders[i]);apply(j.shoulders[i],'z',(i===0?1:-1)*HUMAN_REST_POSE.shoulderSpread);
  apply(j.elbows[i],'x',pose.elbows[i]);if(j.wrists?.[i])apply(j.wrists[i],'x',pose.wrists[i]);
 }
 apply(j.spine,'y',pose.spineY||0);apply(j.spine,'z',pose.spineZ||0);apply(j.neck,'x',pose.headX||0);
 rig.root.position.y=(pose.bob||0)*(action==='run'?1.4:1);
 // Preserve job-specific motion character without creating a second animation owner.
 if(action==='attack'){const swing=Math.sin(Math.min(1,clock/.9)*Math.PI);j.spine.rotation.y=(actor.motion.stance||0)+swing*(actor.motion.attack==='cast'?.16:actor.motion.attack==='shoot'?.10:actor.motion.attack==='combo'?.28:.24);}
 else j.spine.rotation.y=THREE.MathUtils.damp(j.spine.rotation.y,actor.motion.stance||0,10,dt);
 host.userData.externalNpcSync?.();
 const moving=action==='walk'||action==='run',distance=moving?(action==='run'?5.2:2.5)*clock:0;
 // Motion preview loops in a confined test lane; displacement and limb movement use one clock.
 host.position.z=-Math.min(2.6,distance%5.2)+1.5;
 if(!moving)host.position.z=THREE.MathUtils.damp(host.position.z,0,8,dt);
 const limit=sequence?({idle:1.1,walk:2,run:2,attack:1.3,guard:1.4,hit:.9,dead:1.25}[action]):({attack:.9,hit:.58,dead:1.15}[action]);
 if(limit&&clock>=limit){
  result='完了';
  if(sequence){
   if(queue.length)start(queue.shift());
   else if(cycle){queue=[...motions];start(queue.shift());}
   else {sequence=false;start('idle');result='全動作完了';}
  }else if(!cycle&&action!=='dead')start('idle');
  else if(cycle)clock=0;
 }
 $('diagnostics').textContent='職業 '+PLAYER_JOBS[job].label+' / '+labels[action]+' / '+clock.toFixed(2)+'秒 / '+(result||'実行中')+' / '+modelStatus+' / 共通BOMクリップ';
}
$('job').onchange=()=>{editValues={};build()};$('sex').onchange=()=>{editValues={};build()};
const jp={body:'体格',face:'顔',hair:'髪',outfit:'衣装',equipment:'武器'};
for(const key of ['body','face','hair','outfit','equipment']){const label=document.createElement('label');label.textContent=jp[key];const select=document.createElement('select');select.id='edit-'+key;for(const v of CHARACTER_EDIT_FIELDS[key]){const option=document.createElement('option');option.value=v;option.textContent=v;select.appendChild(option)}select.onchange=()=>{editValues={...editValues,[key]:select.value};build();for(const field of Object.keys(jp))if(editValues[field])$('edit-'+field).value=editValues[field];};label.append(select);$('editor').append(label)}
function readEditor(){const p=readCharacterPresets()[$('target').value]||{};editValues={...p};if(p.jobId&&PLAYER_JOBS[p.jobId])$('job').value=p.jobId;if(p.sex)$('sex').value=p.sex;build();for(const key of Object.keys(jp))if(editValues[key])$('edit-'+key).value=editValues[key];}
$('target').onchange=readEditor;$('load').onclick=readEditor;
$('save').onclick=()=>{const p={...editValues,jobId:$('job').value,sex:$('sex').value};saveCharacterPreset($('target').value,p);modelStatus='保存済み：ゲーム再起動で反映';alert('保存しました。ゲームに戻って再起動すると反映されます。')};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(readCharacterPresets(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='character-presets.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
$('all').onclick=()=>{queue=[...motions];sequence=true;start(queue.shift());};
$('repeat').onclick=()=>{cycle=!cycle;$('repeat').textContent='繰返し：'+(cycle?'ON':'OFF')};
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt*Number($('speed').value);poseFrame(dt);renderer.render(scene,camera)}

readEditor();resizePreview();requestAnimationFrame(loop);
window.__actionTestQA=()=>({job:$('job').value,action,seconds:clock,hasRig:!!rig?.joints,jointCount:rig?.root?.userData?.jointCount,queue:queue.length,sequence,modelStatus});
</script></body></html>
