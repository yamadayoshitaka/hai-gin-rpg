name: Three-team sortie regression
on:
  pull_request:
    paths:
      - 'src/three-team-sortie*.js'
      - 'src/sortie-formation-logic.js'
      - 'src/three-step-strategy-catalog.js'
      - 'src/three-team-sortie-ui.css'
      - 'src/three-team-core-bridge.js'
      - 'src/targeted-strategy-runtime.js'
      - 'src/mass-battle-grid-sim.js'
      - 'src/mass-battle-worker-client.js'
      - 'src/mass-battle-worker-runtime.js'
      - 'src/core-battle-bridge.js'
      - 'town-hub.html'
      - 'tactics-wireframe.html'
      - 'qa/three-team-sortie.test.mjs'
      - 'qa/level99-targeted-strategy.test.mjs'
      - 'qa/formation-and-three-step-strategy.test.mjs'
      - '.github/workflows/three-team-sortie.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-team-sortie:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new module syntax
        run: |
          node --check src/sortie-formation-logic.js
          node --check src/three-step-strategy-catalog.js
          node --check src/three-team-sortie.js
          node --check src/three-team-core-bridge.js
          node --check src/three-team-sortie-ui.js
          node --check src/targeted-strategy-runtime.js
          node --check src/mass-battle-grid-sim.js
          node --check src/mass-battle-worker-client.js
          node --check src/mass-battle-worker-runtime.js
          node --check src/core-battle-bridge.js
      - name: Verify three-team allocations and legacy battle
        run: |
          node --experimental-vm-modules qa/three-team-sortie.test.mjs
          node --experimental-vm-modules qa/level99-targeted-strategy.test.mjs
          node --experimental-vm-modules qa/formation-and-three-step-strategy.test.mjs
          node --experimental-vm-modules qa/inn-deployment-command-effects.test.mjs
          node --experimental-vm-modules qa/inn-commander-autoplace-gameover.test.mjs
