name: R53 four independent female named cast candidate assemblies
on:
  push:
    branches: [r53-fixed-face-review]
    paths:
      - 'data/r53-cast-female-plan.json'
      - 'scripts/r53-cast-female-study.py'
      - 'scripts/r53-cast-female-stage.py'
      - 'scripts/r53-cast-female-inventory.py'
      - 'scripts/r53-cast-female-reference.py'
      - '.github/workflows/r53-cast-female.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: commander-female
            shard: female-early
            style: Ranger
          - id: lucia
            shard: female-middle
            style: Peasant
          - id: selika
            shard: female-early
            style: Peasant
          - id: elne
            shard: female-middle
            style: Peasant
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            data
            assets/story/characters
            assets/story-cinema/cast
            assets/animations
            assets/characters/hair-fitted-v1
            assets/characters/quaternius-outfits
            docs/wig-production-standard-v1.md
      - run: |
          python3 -m py_compile scripts/r53-cast-female-study.py scripts/r53-cast-female-reference.py scripts/r53-cast-female-inventory.py
          python3 scripts/r53-cast-female-stage.py --check
          python3 -m pip install pillow
      - uses: actions/download-artifact@v4
        with:
          name: r53-age90-${{ matrix.shard }}
          run-id: 45637676131
          github-token: ${{ github.token }}
          path: /tmp/r53-bodies
      - run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri xauth
      - name: Generate individual female study, wig, expressions and fitted outfit
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          MESA_GLTHREAD: 'false'
          ID: ${{ matrix.id }}
          STYLE: ${{ matrix.style }}
        run: |
          mkdir -p review/{reference,study,wig,motion,first,second,third,assembly}
          python3 scripts/r53-cast-female-reference.py . data/r53-cast-female-plan.json review/reference "$ID"
          cp assets/characters/hair-fitted-v1/ATTRIBUTION.md review/wig/
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python scripts/r53-cast-female-study.py -- /tmp/r53-bodies data/r53-cast-female-plan.json review/study "$ID"
          run() { xvfb-run -a blender -b -t 2 --python-exit-code 1 --python scripts/r53-cast-female-stage.py -- "$@"; }
          run wig review/study assets/characters/hair-fitted-v1 review/wig "$ID"
          run motion assets/animations/UAL1_Standard.glb review/study review/motion "$ID"
          run fit review/study assets/characters/quaternius-outfits review/first "$ID" "$STYLE"
          run refine review/study review/first review/second "$ID" "$STYLE"
          run third review/study review/second review/third "$ID" "$STYLE"
          run audit review/study review/third review/motion review/third "$ID" "$STYLE"
          run assemble review/motion review/wig review/third review/assembly "$ID" "$STYLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-cast-female-candidate-${{ matrix.id }}
          path: review/
          if-no-files-found: warn
  inventory:
    needs: integrate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: r53-cast-female-candidate-*
          path: review/shards
      - run: |
          python3 -m pip install pillow
          python3 scripts/r53-cast-female-inventory.py review/shards review/summary
      - uses: actions/upload-artifact@v4
        with:
          name: r53-cast-female-summary
          path: review/summary/
          if-no-files-found: error
