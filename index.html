 const field=document.createElement('input');field.placeholder='住人に質問する（例：遺跡は？）';field.maxLength=240;field.style.cssText='min-width:0;flex:1;background:#e8edf2;color:#202937;padding:9px;border:0;border-radius:7px;font-size:13px';
 const send=document.createElement('button');send.type='submit';send.textContent='聞く';send.style.cssText='padding:8px 13px;background:#a08351;color:#fff;border:0;border-radius:7px';
 ask.append(field,send);ask.onsubmit=async e=>{e.preventDefault();let q=field.value.trim();if(!q||send.disabled)return;field.value='';send.disabled=true;send.textContent='思考中';body.textContent+='\n\nあなた：'+q+'\n'+npc.name+'：…';try{let res=await fetch((apiBase||'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({npcId:npc.id,npcName:npc.name,message:q,memory:npc.memory.slice(-8)})});let data=await res.json();if(!res.ok)throw Error(data.error||'通信エラー');body.textContent=body.textContent.slice(0,-1)+data.reply;speakNpc(data.reply,npc);}catch(err){let topic=/噂|ニュース|事件|最近/.test(q)?'rumor':/冒険|遺跡|旅|水晶|武器|戦/.test(q)?'adventure':/仕事|職業|何者|名前|商売/.test(q)?'work':'town';let answer=reply(npc,topic);speakNpc(answer,npc);body.textContent=body.textContent.slice(0,-1)+answer+'\n（AI接続失敗：' + (err.message||'中継サーバーを確認') + ' ／オフライン応答）';}npc.memory.push({q,reply:body.textContent.split(npc.name+'：').pop()});npc.memory=npc.memory.slice(-8);body.scrollTop=body.scrollHeight;send.disabled=false;send.textContent='聞く'};dialog.append(ask)}
 const bye=document.createElement('button');bye.textContent='閉じる ×';bye.style.cssText='display:block;margin-top:10px;padding:6px 14px;background:#566c80;color:white;border:0;border-radius:8px';bye.onclick=e=>{e.stopPropagation();closeDialog()};dialog.append(bye);dialog.style.display='block';

dialog.onclick=()=>{};
function interact(){if(speaking){closeDialog();return}let nearest=null,dist=3.9;for(const n of npcs){const d=n.g.position.distanceTo(player.position);if(d<dist){nearest=n;dist=d}}if(nearest){nearest.wait=5.5;showDialog(nearest,nearest.line)}else if(player.position.distanceTo(new THREE.Vector3(fx,0,fz))<5.7)showDialog(null,'噴水の水がきらめいている。');else showDialog(null,'町の人に近づいて話しかけよう。')}$('#talk').onclick=interact;
$('#quality').onclick=()=>{high=!high;renderer.setPixelRatio(Math.min(devicePixelRatio,high?(mobile?1.6:2):1));sun.shadow.mapSize.set(high?(mobile?1024:2048):512,high?(mobile?1024:2048):512);sun.shadow.map?.dispose();sun.shadow.map=null;$('#quality').textContent='画質：'+(high?'高':'軽量')};
function staticFree(x,z,r=.34){if(Math.abs(x)>34-r||z>17-r||z< -59+r)return false;for(const c of colliders)if(Math.abs(x-c.x)<c.w/2+r&&Math.abs(z-c.z)<c.d/2+r)return false;return true}
function free(x,z){if(!staticFree(x,z))return false;for(const n of npcs)if(Math.abs(n.g.position.x-x)<.73&&Math.abs(n.g.position.z-z)<.73)return false;return true}
// Townsfolk stay on walkable streets, separate from each other and avoid the player.
let npcTick=0;
function updateCitizens(dt){npcTick++;for(let i=0;i<npcs.length;i++){const n=npcs[i],p=n.g.position;
 if(n.wait>0){n.wait-=dt;setMotion(n.animation,false);continue}
 if(Math.hypot(p.x-player.position.x,p.z-player.position.z)<1.65){n.wait=.3;setMotion(n.animation,false);continue}
 if(Math.hypot(p.x-n.homeX,p.z-n.homeZ)>8)n.heading=Math.atan2(n.homeX-p.x,n.homeZ-p.z);
 if(npcTick%16===i%16&&Math.random()<.12)n.heading+=(Math.random()-.5)*1.2;
 const step=n.pace*dt,dx=Math.sin(n.heading)*step,dz=Math.cos(n.heading)*step;
 const nx=p.x+dx,nz=p.z+dz;
 let open=staticFree(nx,nz,.43)&&Math.hypot(nx-player.position.x,nz-player.position.z)>1.3;
 if(open){for(let j=0;j<npcs.length;j++){if(i===j)continue;const q=npcs[j].g.position;if(Math.abs(nx-q.x)<.8&&Math.abs(nz-q.z)<.8){open=false;break}}}
 if(open){p.x=nx;p.z=nz;n.g.rotation.y+=Math.atan2(Math.sin(n.heading-n.g.rotation.y),Math.cos(n.heading-n.g.rotation.y))*Math.min(1,dt*6);setMotion(n.animation,true)}else{n.heading+=(Math.random()-.5)*2.8;n.wait=.5+Math.random()*1.8;setMotion(n.animation,false)}
 if(Math.random()<dt*.05)n.wait=.7+Math.random()*2.2;
 }}
// Explicitly fade geometry that blocks the camera instead of letting foliage cover the player.
const fadeItems=[];for(const obj of scene.children){if(!(obj instanceof THREE.Group))continue;if(obj===player||npcs.some(n=>n.g===obj))continue;let meshes=[];obj.traverse(child=>{if(child.isMesh){child.material=child.material.clone();child.material.transparent=true;meshes.push(child)}});if(meshes.length)fadeItems.push({obj,meshes})}
let frameCount=0;function updateVisibility(cam){if((frameCount++%5)!==0)return;const a=player.position,b=cam;let vx=b.x-a.x,vz=b.z-a.z,length2=vx*vx+vz*vz;for(let item of fadeItems){const o=item.obj;let wx=o.position.x-a.x,wz=o.position.z-a.z;let t=length2>0?(wx*vx+wz*vz)/length2:0;t=Math.max(0,Math.min(1,t));let distance=Math.hypot(wx-t*vx,wz-t*vz);let between=t>.05&&t<.95&&distance<2.0;let fade=between?.20:1;for(let mesh of item.meshes){mesh.material.opacity=fade;mesh.material.depthWrite=!between}}}
const clock=new THREE.Clock();let camPos=new THREE.Vector3(0,6.1,12);function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;let dx=((pressed.has('right')||keyDown.has('right'))?1:0)-((pressed.has('left')||keyDown.has('left'))?1:0),dz=((pressed.has('down')||keyDown.has('down'))?1:0)-((pressed.has('up')||keyDown.has('up'))?1:0);let walking=!speaking&&(dx!==0||dz!==0);$('#input-status').textContent='方向：'+(dx>0?'右':dx<0?'左':'')+(dz>0?'下':dz<0?'上':'')+(dx===0&&dz===0?'停止':'')+' · 30人の街';if(walking){let norm=Math.hypot(dx,dz);dx/=norm;dz/=norm;let speed=5.5;let nx=player.position.x+dx*speed*dt,nz=player.position.z+dz*speed*dt;if(free(nx,player.position.z))player.position.x=nx;if(free(player.position.x,nz))player.position.z=nz;let face=Math.atan2(dx,dz);player.rotation.y+=Math.atan2(Math.sin(face-player.rotation.y),Math.cos(face-player.rotation.y))*Math.min(1,dt*12)}setMotion(playerAnim,walking);updateCitizens(dt);for(const entry of mixers){const motion=!!entry.group.userData.chibi?.moving;if(entry.walkAction&&entry.walkAction!==entry.idleAction){entry.walkAction.setEffectiveWeight(motion?1:0);entry.idleAction.setEffectiveWeight(motion?0:1)}entry.mixer.update(dt);}
let target=new THREE.Vector3(player.position.x,6.1,player.position.z+8.9);camPos.lerp(target,Math.min(1,dt*3.2));camera.position.copy(camPos);camera.lookAt(player.position.x,1.9,player.position.z-5.0);updateVisibility(camera.position);updateModels(dt);renderer.render(scene,camera)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setupCharacters();loop();
