name: Six-category regression recovery and commit evidence
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
concurrency:
  group: hai-gin-quality-regression-recovery
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all seven watcher paths, scripts, and stale-batch UI contract
        run: |
          node --check scripts/batch-regression-recovery.mjs
          node --test qa/batch-regression-recovery.test.mjs
  recover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression policy tests
        run: |
          node --check scripts/batch-regression-recovery.mjs
          node --test qa/batch-regression-recovery.test.mjs
      - name: Audit all six quality categories and attempt bounded recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/batch-regression-recovery.mjs
      - name: Save exact execution and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-regression-recovery-${{ github.run_id }}
          path: data/batch-regression-runtime.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit audited run state (NOT a model-quality approval)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/batch-regression-runtime.json
          if git diff --cached --quiet; then
            echo 'No recovery status changes to commit' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'chore(batch): persist verified recovery run evidence'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              break
            fi
            if git push origin HEAD:main; then
              echo "Recovery status committed to main: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main changed or push restricted; retry $attempt" >> "$GITHUB_STEP_SUMMARY"
          done
          branch="batch/recovery-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'chore(batch): verified run health and recovery evidence' \
            --body 'Status-only recovery evidence. This does not mean a game model, manga image or visual QA passed.'
          echo 'Direct main commit unavailable; created status PR for review.' >> "$GITHUB_STEP_SUMMARY"
