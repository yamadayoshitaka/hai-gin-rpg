<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追加モーション実機検証</title><style>body{margin:0;background:#101824;color:white;font:14px system-ui}#ui{position:fixed;z-index:3;top:8px;left:8px;right:8px;background:#16283deF;padding:12px;border-radius:12px;max-height:34vh;overflow:auto}select,button{background:#294764;color:white;border:1px solid #7896b3;border-radius:7px;padding:8px;margin:3px;max-width:100%}select{width:98%}#ui label{display:block;font-size:12px}#ui select{padding:6px;margin:2px 0 5px}#ui details{margin-top:3px}#ui summary{cursor:pointer;color:#bde0ff}#status{font-size:11px;max-height:38px;overflow:auto}#bottom{font-size:11px;opacity:.85}#status{white-space:pre-wrap;color:#ffdd91}#bottom{position:fixed;bottom:8px;left:8px;right:8px;z-index:3;background:#16283deF;padding:8px;border-radius:10px}canvas{display:block}small{color:#bdd1e1}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="ui"><b>職業別モーション実機確認</b> <small>v1.2</small><label>職業<select id="job"></select></label><label>職業別アクション<select id="clip"></select></label><details id="advanced"><summary>素材・検証メニューを開く</summary><label>素材ファイル<select id="asset"></select></label><div><button id="pause">一時停止</button><button id="reset">再生</button><button id="pass">正常</button><button id="fail">不具合</button><button id="copy">結果コピー</button></div><small>素材のプレビューです。正式な職業実装は未検証。</small></details><div id="status">読み込み中...</div></div><div id="bottom">指で回転・ピンチで拡大。<span id="qa">判定記録 0件</span></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s,renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x172335);scene.add(new THREE.HemisphereLight(0xffffff,0x667799,2.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,8,5);scene.add(sun);scene.add(new THREE.GridHelper(10,20,0x5a7896,0x33475b));const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,10000);camera.position.set(3,2,5);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.update();let data=[],filtered=[],model,mixer,action,clock=new THREE.Clock(),records={};const loader=new GLTFLoader();
function frame(obj){const box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())return false;const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),radius=Math.max(size.x,size.y,size.z,1);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(radius*1.4,radius*.7,radius*3.8));camera.near=Math.max(.001,radius/1000);camera.far=radius*1000;camera.updateProjectionMatrix();controls.update();return true}
const actionName=n=>{const exact={Dodge_Backwards:'後方回避',Dodge_Backward:'後方回避',Dodge_Forward:'前方回避',Dodge_Left:'左回避',Dodge_Right:'右回避',Walking_A:'歩行A',Walking_B:'歩行B',Walking_C:'歩行C',Running_A:'ダッシュA',Running_B:'ダッシュB',Melee_Block:'防御',Melee_Blocking:'防御姿勢',Melee_Block_Hit:'防御被弾',Melee_Block_Attack:'防御反撃',Sword_Block:'剣防御',Sword_Heavy_Combo:'剣・強連撃',Sword_Regular_Combo:'剣・通常連撃',Ranged_Bow_Draw:'弓を引く',Ranged_Bow_Release:'矢を放つ',Ranged_Bow_Idle:'弓待機',Ranged_Bow_Aiming_Idle:'弓照準',Ranged_Magic_Summon:'召喚魔法',Ranged_Magic_Spellcasting:'魔法詠唱',Ranged_Magic_Spellcasting_Long:'長詠唱',Ranged_Magic_Shoot:'魔法発射',Melee_Unarmed_Attack_Kick:'蹴り攻撃',Melee_Unarmed_Kick:'蹴り攻撃',Melee_Unarmed_Attack_Punch_A:'拳攻撃',Melee_Unarmed_Punch:'拳攻撃',Melee_1H_Stab:'片手剣・突き',Melee_1H_Slash:'片手剣・斬撃',Melee_2H_Idle:'両手武器待機',Death_A:'戦闘不能A',Hit_A:'被弾A',Hit_B:'被弾B',Idle_A:'待機A',Idle_B:'待機B',Sneaking:'忍び歩き',Lockpick:'解錠',Lockpicking:'解錠動作',NinjaJump_Start:'忍者跳躍開始',NinjaJump_Land:'忍者着地',Shield_Dash:'盾突進',Shield_OneShot:'盾攻撃'};if(exact[n])return exact[n];return n.replace(/^Melee_1H_Attack_/,'片手剣・').replace(/^Melee_2H_Attack_/,'両手武器・').replace(/^Melee_Dualwield_/,'二刀流・').replace(/^Sword_Regular_/,'剣・通常').replace(/^Ranged_Bow_/,'弓・').replace(/^Ranged_Magic_/,'魔法・').replace(/^Melee_Unarmed_/,'格闘・').replace(/_/g,' ')};function play(){if(!mixer)return;action?.stop();const clip=mixer._root.userData.animations.find(x=>x.name===$('clip').value);if(!clip)return;action=mixer.clipAction(clip);action.reset().play();status('再生中: '+clip.name+'\n※メッシュが見えない場合は素材の骨格のみの可能性があります。')}
function load(){const row=filtered[+$('asset').value];if(!row)return;status('GLBを読み込み中...');if(model){scene.remove(model);mixer?.stopAllAction()}loader.load(encodeURI(row.file),g=>{model=g.scene;scene.add(model);model.userData.animations=g.animations;mixer=new THREE.AnimationMixer(model);const hasMesh=frame(model);if(!hasMesh){const helper=new THREE.SkeletonHelper(model);scene.add(helper);model.userData.helper=helper;frame(helper)}$('clip').replaceChildren(...g.animations.filter(a=>row.clips.includes(a.name)).map(a=>new Option(actionName(a.name),a.name)));if(!g.animations.length){status('モーションなし（モデル専用）');return}play();if(!hasMesh)status('骨格のみ／表示メッシュなし。'+g.animations.length+'クリップ読み込み済み。')},undefined,e=>status('読み込み失敗: '+(e?.message||e)))}
try{const response=await fetch('motion-external-inventory.json?cache='+Date.now());if(!response.ok)throw Error('HTTP '+response.status);data=(await response.json()).filter(x=>x.clips.length);const jobs={ '剣士':['Melee_','Sword_','Walking_','Running_','Dodge_','Hit_','Death_'],'格闘家':['Unarmed','Melee_Hook','Dodge_','Walking_','Running_','Hit_','Death_'],'魔法使い':['Ranged_Magic','Idle_','Walking_','Running_','Hit_','Death_'],'弓使い':['Ranged_Bow','HoldingBow','Walking_','Running_','Dodge_','Hit_','Death_'],'盾戦士':['Shield_','Sword_Block','Melee_Block','Walking_','Running_','Hit_','Death_'],'盗賊':['Sneaking','Lockpick','Dodge_','Walking_','Running_','Melee_Dualwield','Hit_','Death_'],'忍者':['NinjaJump','Melee_Dualwield','Dodge_','Running_','Hit_','Death_'],'農民・職人':['Farm_','Chop','Hammer','Dig','Saw','Work_','Fishing_','Walking_'],'共通動作':['Walking_','Running_','Idle_','Death_','Hit_','Jump_','Dodge_']};$('job').replaceChildren(...Object.keys(jobs).map(x=>new Option(x,x)));function filterJob(){const prefixes=jobs[$('job').value];filtered=data.map(row=>({...row,clips:row.clips.filter(name=>prefixes.some(p=>name.includes(p)))})).filter(row=>row.clips.length);$('asset').replaceChildren(...filtered.map((x,i)=>new Option(x.file.split('/').slice(-2).join('/')+' ('+x.clips.length+')',i)));load()}$('job').onchange=filterJob;$('asset').onchange=load;$('clip').onchange=play;filterJob()}catch(e){status('一覧取得エラー: '+e.message)}
$('pause').onclick=()=>{if(action){action.paused=!action.paused;$('pause').textContent=action.paused?'再開':'一時停止'}};$('reset').onclick=play;function mark(result){const key=filtered[+$('asset').value]?.file+' :: '+$('clip').value;records[key]=result;$('qa').textContent='判定記録 '+Object.keys(records).length+'件'}$('pass').onclick=()=>mark('PASS');$('fail').onclick=()=>mark('FAIL');$('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(records,null,2)).then(()=>status('検証結果をコピーしました')).catch(e=>status('コピー失敗: '+e.message));window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);mixer?.update(dt);renderer.render(scene,camera)}tick();
</script></body></html>
