name: Battle strategy response hierarchy specification QA
on:
  push:
    branches:
      - 'feat/strategy-response-hierarchy-spec-*'
  pull_request:
    paths:
      - 'src/battle-strategy-countertree-spec.js'
      - 'docs/battle-strategy-response-hierarchy-spec.md'
      - 'qa/battle-strategy-countertree-spec.test.mjs'
      - '.github/workflows/battle-strategy-response-tree-spec-qa.yml'
  workflow_dispatch:
jobs:
  response-hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strategy -> situation -> counter -> enemy reply -> counter-counter
        run: node qa/battle-strategy-countertree-spec.test.mjs
      - name: Existing situation and job-aware counter QA
        run: |
          node qa/battle-situation-countermeasure-matrix.test.mjs
          node qa/battle-coordinated-tactics-counters.test.mjs
          node qa/battle-tactics-preset.test.mjs
      - name: Existing battle results, squads and commander contracts
        run: |
          node qa/battle-stage-objective-job-squads.test.mjs
          node qa/battle-objective-opposed-sides.test.mjs
          node qa/mass-battle-formations.test.mjs
          node qa/squad-formation-three-types.test.mjs
      - name: Story and core compatibility
        run: node --experimental-vm-modules qa/game-core-contract.test.mjs
