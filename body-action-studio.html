<header><h1>全身アクション工房 v4.0</h1><a href="./glb-viewer-v2.0.html">顔ビューアーへ戻る</a></header>
<main><section id="display"><div id="stage"></div><div class="buttons"><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="hand">手元</button><button data-view="full">全身</button></div><p id="status" role="status">人体を読み込み中…</p></section>
<section id="settings"><h2>人物設定</h2><label>顔GLB（ビューアーから引き継ぎ）<input type="file" id="faceFile" accept=".glb"></label><div class="buttons"><button id="nativeFace">人体標準の顔に戻す</button></div><p id="faceStatus" role="status">標準の顔</p><div class="grid"><label>性別<select id="sex"><option value="female">女性</option><option value="male">男性</option></select></label><label>年代<select id="age"></select></label><label>体型<select id="build"></select></label><label>速度<input id="speed" type="range" min=".35" max="1.6" value="1" step=".05"></label></div>

<h2>関節ポーズ</h2><label>関節<select id="joint"></select></label><div class="grid"><label>X軸<input id="rx" type="range" min="-90" max="90" value="0"></label><label>Y軸<input id="ry" type="range" min="-90" max="90" value="0"></label><label>Z軸<input id="rz" type="range" min="-90" max="90" value="0"></label><button id="resetJoint">関節補正解除</button></div><label><input id="skeleton" type="checkbox"> 骨格を表示</label>
<small>独自13動作・163骨人体。足首目標IK・拳の向き・動作スタイル・日本語口パク対応。実機の接地、衝突、精密な加齢表現は検証中です。</small></section></main>

function supportHeight(s){const names=['foot_'+s,'ball_'+s,'ball_leaf_'+s];return Math.min(...names.map(n=>bones.get(n)?.getWorldPosition(v(0,0,0)).y??Infinity))}
function reachHand(s,target){const shoulder=bones.get('upperarm_'+s),elbow=bones.get('lowerarm_'+s),hand=bones.get('hand_'+s);if(!shoulder||!elbow||!hand)return;actor.updateMatrixWorld(true);const A=shoulder.getWorldPosition(v(0,0,0)),E=elbow.getWorldPosition(v(0,0,0)),H=hand.getWorldPosition(v(0,0,0)),l1=A.distanceTo(E),l2=E.distanceTo(H);const delta=target.clone().sub(A),d=T.MathUtils.clamp(delta.length(),Math.abs(l1-l2)+.008,l1+l2-.008),axis=delta.normalize();if(!Number.isFinite(d)||axis.lengthSq()<.1)return;const pole=v(s==='l'?1:-1,-.4,-.1);pole.addScaledVector(axis,-pole.dot(axis)).normalize();const along=(l1*l1+d*d-l2*l2)/(2*d),height=Math.sqrt(Math.max(0,l1*l1-along*along)),mid=A.clone().addScaledVector(axis,along).addScaledVector(pole,height);aim('upperarm_'+s,'lowerarm_'+s,mid.clone().sub(A));const actual=elbow.getWorldPosition(v(0,0,0));aim('lowerarm_'+s,'hand_'+s,A.clone().addScaledVector(axis,d).sub(actual))}
function updatePose(dt){if(!ready)return;const style=$('style').value,st=STYLES[style]||STYLES.natural;if(!paused)t+=dt*Number($('speed').value)*st.tempo;poseRest();const p=sampleOriginal(action,t,{age:$('age').value,build:$('build').value,side:$('side').value});const locomotion=action==='walk'||action==='run';lastGait=null;
rotateWorld('spine_01',p.b*.45,0,0);rotateWorld('spine_02',p.b*.55,p.tw,0);rotateWorld('neck_01',-p.b*.34,-p.tw*.22,0);actor.position.y=p.y*baseHeight*actor.scale.y;actor.updateMatrixWorld(true);
if(locomotion)applyGait(p,style);for(const [i,s] of ['l','r'].entries()){if(!locomotion)leg(s,p.h[i],p.k[i],p.spread*.23,p.ankle[i]);arm(s,p.a[i]*st.gesture,p.e[i],action==='wave'&&chosen(s)?.48:p.spread);if(chosen(s)&&action==='wave')rotateWorld('hand_'+s,0,0,p.w*st.gesture);if(chosen(s)&&action==='punch'&&p.g>.30)orientFist(s)}
// Anchor the lowest supporting foot to its rest height; do not suppress airborne phases.
const grounded=['l','r'].filter((s,i)=>p.contact[i]);if(!locomotion&&grounded.length){const y=Math.min(...grounded.map(s=>supportHeight(s)));if(Number.isFinite(y)){actor.position.y+=groundRef*actor.scale.y-y;actor.updateMatrixWorld(true)}}
if(['grasp','pickup'].includes(action)&&!grabDone&&p.reach>0){for(const [i,s] of ['l','r'].entries())if(chosen(s)){const h=bones.get('hand_'+s);if(!h)continue;const start=h.getWorldPosition(v(0,0,0)),target=v(s==='l'?.25:-.25,action==='pickup'?.10:baseHeight*actor.scale.y*.56,.36);reachHand(s,start.lerp(target,p.reach))}if(p.attach){grabDone=true;held=true;syncProps()}}
if(!manualGrip){if(['grasp','pickup','punch','point','openclose','walk','run'].includes(action))gripTarget=p.g;else if(action==='wave')gripTarget=0;if(held)gripTarget=Math.max(.82,gripTarget)}
if(!paused)gripValue+=(gripTarget-gripValue)*Math.min(1,dt*12);
for(const s of ['l','r'])if(chosen(s))fingerCurl(s,gripValue,action==='point');
for(const [n,angles] of overrides){const b=bones.get(n);if(b)b.quaternion.multiply(q().setFromEuler(new T.Euler(...angles.map(x=>x*rad))))}const jaw=speech.tick(dt);if(!faceMount&&jaw>0)rotateWorld('jaw',jaw,0,0);actor.updateMatrixWorld(true);updateFacePlane()}
function cameraView(mode){viewMode=mode;const h=baseHeight*actor.scale.y;let target=v(0,h*.51,0),dist=Math.max(2.8,h*1.9);if(mode==='hand'&&ready){const s=$('side').value==='l'?'l':'r';target=bones.get('hand_'+s).getWorldPosition(v(0,0,0));dist=.62}controls.target.copy(target);camera.position.copy(target).add(mode==='side'?v(dist,0,0):mode==='back'?v(0,.08,-dist):mode==='hand'?v(.24,.12,dist):v(0,.08,dist));controls.update()}
async function load(){const id=++generation;ready=false;status('人体GLB相当のスキンモデルを読み込み中…');const path=donorPath($('sex').value,$('age').value);let next,nextBody;try{const g=await loader.loadAsync(path);next=g.scene;if(id!==generation){dispose(next);return}const map=new Map(),bind=new Map();let skins=0;next.traverse(o=>{if(o.isSkinnedMesh){skins++;o.frustumCulled=false;nextBody=o}if(o.isBone){const name=canonicalBone(o.name);map.set(name,o);bind.set(name,{pos:o.position.clone(),rot:o.quaternion.clone(),scale:o.scale.clone()})}});if(!skins||map.size!==163||!map.has('thumb_03_r')||!map.has('pinky_03_l'))throw Error('全身・手指骨格が不足しています');clearProps();if(helper){scene.remove(helper);helper.geometry.dispose();helper.material.dispose()}if(faceRoot)faceRoot.removeFromParent();if(model){actor.remove(model);dispose(model);bodySource?.dispose()}model=next;bodyMesh=nextBody;bodySource=bodyMesh.geometry;bodyMesh.material=new T.MeshStandardMaterial({vertexColors:true,roughness:.83,side:T.DoubleSide});activeDonor=path;bones=map;rest=bind;actor.add(model);actor.scale.setScalar(1);actor.position.set(0,0,0);model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model);baseHeight=box.max.y-box.min.y;model.position.y-=box.min.y;actor.updateMatrixWorld(true);groundRef=Math.min(supportHeight('l'),supportHeight('r'));cacheFeet();helper=new T.SkeletonHelper(model);helper.visible=$('skeleton').checked;scene.add(helper);overrides.clear();$('joint').replaceChildren(...[...bones.keys()].filter(n=>!/leaf/.test(n)).map(n=>new Option(n,n)));$('joint').value='hand_r';syncJoint();ready=true;changeAge();selectAction(action);cameraView('full');window.__bodyActionAudit=()=>({ready,sex:$('sex').value,age:$('age').value,build:$('build').value,action,source:'original-v4-hm08',style:$('style').value,expression:speech.audit(),gait:lastGait,donor:activeDonor,face:faceMount?faceName:'',faceAttached:!!faceMount,faceScale:faceMount?[faceMount.sx,faceMount.sy,faceMount.sz]:null,faceShape:faceSkin?Array.from(faceSkin.geometry.attributes.position.array.slice(0,120)):null,bones:bones.size,skins,props:props.length,held,grip:gripValue,hand: bones.get('hand_r')?.getWorldPosition(v(0,0,0)).toArray(),finger:bones.get('index_02_r')?.quaternion.toArray(),height:actor.scale.y,finite:[...bones.values()].every(b=>b.quaternion.toArray().every(Number.isFinite))})}catch(e){if(next&&next!==model)dispose(next);if(id===generation)status('人体読み込み失敗：'+e.message)}}
function syncJoint(){const a=overrides.get($('joint').value)||[0,0,0];['rx','ry','rz'].forEach((id,i)=>$(id).value=a[i])}
$('sex').onchange=load;$('age').onchange=()=>{if(activeDonor!==donorPath($('sex').value,$('age').value))load();else{changeAge();cameraView('full')}};$('build').onchange=changeAge;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};$('reset').onclick=()=>selectAction(action);
$('side').onchange=()=>{syncProps();if(viewMode==='hand')cameraView('hand')};$('item').onchange=syncProps;$('grip').oninput=()=>{manualGrip=true;gripTarget=Number($('grip').value);if(paused)gripValue=gripTarget};$('open').onclick=()=>{manualGrip=true;gripTarget=0;$('grip').value=0;held=false;grabDone=true;syncProps();if(paused)gripValue=0};$('close').onclick=()=>{manualGrip=true;gripTarget=1;$('grip').value=1;if(paused)gripValue=1};$('carry').onclick=()=>{manualGrip=true;if($('item').value==='none')$('item').value='cup';held=true;grabDone=true;gripTarget=.86;$('grip').value=.86;if(paused)gripValue=.86;syncProps()};$('release').onclick=$('open').onclick;$('joint').onchange=syncJoint;for(const id of ['rx','ry','rz'])$(id).oninput=()=>overrides.set($('joint').value,['rx','ry','rz'].map(k=>Number($(k).value)));$('resetJoint').onclick=()=>{overrides.clear();syncJoint()};$('skeleton').onchange=()=>{if(helper)helper.visible=$('skeleton').checked};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>cameraView(b.dataset.view));
new ResizeObserver(()=>{const w=$('stage').clientWidth,h=$('stage').clientHeight;if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}}).observe($('stage'));
renderer.setAnimationLoop(now=>{if(now<nextFrame)return;nextFrame=now+1000/30-1;const dt=Math.min(.08,(now-last)/1000);last=now;updatePose(Math.max(0,dt));controls.update();renderer.render(scene,camera)});
cameraView('full');load();if(new URLSearchParams(location.search).has('face'))readHandoff().then(r=>{if(r?.blob)return importFace(r.blob,r.name,r.base||'');$('faceStatus').textContent='引継ぎ顔がありません。GLBを選択してください'}).catch(e=>$('faceStatus').textContent='顔引継ぎ失敗: '+e.message);
