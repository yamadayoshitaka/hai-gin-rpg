name: One-shot three-team battle HUD verification
on:
  push:
    branches:
      - fix/battle-team-hud-all-entrypoints-20261120
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false linkedom@0.18.12
      - run: node --check src/battle-rpg-squad-source.js && node --check src/battle-rpg-squad-hud.js
      - run: node --test qa/battle-rpg-squad-hud.test.mjs qa/battle-three-team-hud-dom.test.mjs
