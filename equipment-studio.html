<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>灰銀｜ジョブ装備管理 v1.0</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><style>*{box-sizing:border-box}body{background:#101722;color:#eaf2ff;font:15px system-ui;margin:0}header,main{max-width:900px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:19px;margin:0}a{color:#a7dbff}section{background:#182638;padding:14px;border:1px solid #3a5066;border-radius:12px;margin-bottom:12px}label{display:block;margin:10px 0}select,button{display:block;width:100%;background:#27435a;color:white;padding:10px;border:1px solid #59768e;border-radius:7px;font:inherit;min-height:44px}button{cursor:pointer}#stage{height:270px;background:#293746;border-radius:8px;overflow:hidden}#stage canvas{display:block;touch-action:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.part{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #36495a}.part a{margin-left:auto}small,p{color:#b9c9d9}h2{font-size:16px;margin:0 0 10px}@media(max-width:480px){header,main{padding:8px}.grid{grid-template-columns:1fr}}</style></head><body><header><h1>ジョブ装備管理 v1.0</h1><a id="back" href="./body-action-studio.html?v=5.0">全身工房へ戻る</a></header><main><section><h2>装備セット</h2><label>ジョブ<select id="job"></select></label><div class="grid"><label>武器<select id="weapon"></select></label><label>衣装・防具<select id="outfit"></select></label><label>武器を持つ手<select id="hand"><option value="r">右手</option><option value="l">左手</option></select></label></div><p id="status" role="status">設定を選択してください</p><button id="apply">保存して全身工房で装備する</button></section><section><h2>3Dパーツ確認</h2><div id="stage"></div><label>確認するパーツ<select id="preview"></select></label><p id="previewStatus"></p><a id="download" download>選択パーツGLB</a></section><section><h2>防具パーツ管理</h2><div id="parts"></div><small>チェックした部位を装備します。革鎧は同じ形状の材質違いです。剣士以外のジョブ用装備は未作成です。ゲームの戦闘・所持品にはまだ反映しません。</small></section></main><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {JOBS,WEAPONS,OUTFITS,PARTS,assetUrl,readSelection,saveSelection,normalize,fillChoices} from './src/equipment-studio-catalog.mjs';
const $=id=>document.getElementById(id);let state=readSelection(),seq=0,preview=null;
const back=new URL('./body-action-studio.html?v=5.0',location.href);if(new URLSearchParams(location.search).has('face'))back.searchParams.set('face','1');$('back').href=back.href;
const scene=new T.Scene();scene.background=new T.Color(0x293746);const camera=new T.PerspectiveCamera(35,1,.01,20),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));$('stage').append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x9ca9b7,2.6));for(const [x,y,z] of [[2,3,4],[-3,2,-2]]){const l=new T.DirectionalLight(0xffffff,3);l.position.set(x,y,z);scene.add(l)}const loader=new GLTFLoader();
new ResizeObserver(()=>{const w=$('stage').clientWidth,h=$('stage').clientHeight;if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}}).observe($('stage'));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
async function show(){const id=$('preview').value,n=++seq;if(!id){$('download').removeAttribute('href');if(preview){scene.remove(preview);preview=null}return}try{$('previewStatus').textContent='読み込み中…';const g=(await loader.loadAsync(assetUrl(id))).scene;if(n!==seq)return;if(preview){scene.remove(preview);preview.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose()}})}preview=g;scene.add(g);const b=new T.Box3().setFromObject(g),center=b.getCenter(new T.Vector3()),size=b.getSize(new T.Vector3()),r=Math.max(size.x,size.y,size.z);controls.target.copy(center);camera.position.copy(center).add(new T.Vector3(r*.7,r*.45,r*2.4));controls.update();$('download').href=assetUrl(id);$('previewStatus').textContent='GLB読込成功：'+id}catch(e){$('previewStatus').textContent='読み込み失敗：'+e.message}}
function render(){fillChoices($('job'),$('weapon'),$('outfit'),state);$('hand').value=state.hand;const j=JOBS[state.job],ids=[...(j.weapons||[]),...(j.outfits?Object.keys(PARTS):[])],old=$('preview').value;$('preview').replaceChildren(...ids.map(id=>new Option(WEAPONS[id]?.label||PARTS[id],id)));if(ids.includes(old))$('preview').value=old;else if(state.weapon!=='none')$('preview').value=state.weapon;$('parts').replaceChildren(...(j.outfits?Object.entries(PARTS).map(([id,label])=>{const row=document.createElement('div');row.className='part';const c=document.createElement('input');c.type='checkbox';c.checked=!state.hidden.includes(id);c.onchange=()=>{state.hidden=c.checked?state.hidden.filter(x=>x!==id):[...state.hidden,id]};const a=document.createElement('a');a.href=assetUrl(id);a.download=id+'.glb';a.textContent='GLB';row.append(c,document.createTextNode(label),a);return row}):[]));$('status').textContent=j.weapons?'剣士用武器・衣装を選べます。':'このジョブの装備は準備中です。';show()}
$('job').onchange=()=>{state=normalize({...state,job:$('job').value,weapon:'none',outfit:'none'});render()};$('weapon').onchange=()=>{state.weapon=$('weapon').value;if(state.weapon!=='none'){$('preview').value=state.weapon;show()}};$('outfit').onchange=()=>{state.outfit=$('outfit').value};$('hand').onchange=()=>state.hand=$('hand').value;$('preview').onchange=show;$('apply').onclick=()=>{try{saveSelection(state);location.href=back.href}catch(e){$('status').textContent='保存失敗：'+e.message}};render();
</script></body></html>
