<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灰銀のレゾナンス｜剣士の顔と瞬き</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0d1725;color:#edf5ff;font-size:14px}
header{padding:12px 15px;background:#1b3046;border-bottom:1px solid #496079;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
a{color:#c2e4ff}h1{margin:0;font-size:18px}h2{font-size:15px;margin:0 0 8px}
main{max-width:1180px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(330px,1fr) minmax(280px,340px);gap:12px}
.panel{background:#182b3d;border:1px solid #486078;border-radius:12px;padding:12px;min-width:0}
#viewport{width:100%;height:min(75dvh,750px);min-height:430px;background:#142335;border-radius:9px;overflow:hidden;position:relative}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:absolute;top:9px;left:9px;right:9px;padding:7px 9px;background:#0b1c2cbd;pointer-events:none;border-radius:7px;font-size:12px;white-space:pre-wrap}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}
button,input{font:inherit;border-radius:7px;border:1px solid #7694b0;background:#24415c;color:#f3f7fd;padding:9px}
button{cursor:pointer}button:hover{background:#3b5d79}button[aria-pressed=true]{background:#51708c;border-color:#ffe4aa}
label{display:block;margin:12px 0;line-height:1.5}
input[type=checkbox]{width:18px;height:18px;vertical-align:middle;margin-right:8px}
input[type=range]{width:100%;padding:0}
small,p{color:#b8cbdb;line-height:1.6}
#status,#diagnostics{white-space:pre-wrap;overflow-wrap:anywhere;background:#0e1f31;padding:10px;border-radius:8px;font-size:12px;line-height:1.6;max-height:260px;overflow:auto}
@media(max-width:760px){main{display:block;padding:7px}.panel{margin-bottom:9px;padding:9px}#viewport{height:56dvh;min-height:350px;max-height:560px}header{padding:10px}h1{font-size:16px}}
</style></head>
<body>
<header><h1>剣士｜顔の高品質化＋瞬き</h1><a href="./index.html">ゲームメニューに戻る</a></header>
<main>
<section class="panel">
 <div id="viewport"><div id="overlay">実際のゲーム用男性65骨モデルをロード中…</div></div>
 <p>顔をドラッグして回転、ピンチで拡大縮小できます。既存の顔テクスチャ・目・眉を維持したまま、頭骨に追従する両まぶたと眼球のPBR反射を追加しています。</p>
 <div class="controls">
  <button id="faceView" aria-pressed="true">顔アップ</button>
  <button id="bodyView" aria-pressed="false">全身</button>
  <button id="frontView">正面</button>
  <button id="sideView">側面</button>
 </div>
</section>
<aside class="panel">
 <h2>瞬きアニメーション</h2>
 <div class="controls">
  <button id="blinkNow">今すぐ瞬き</button>
  <button id="closeEyes">目を閉じる（比較）</button>
  <button id="openEyes">目を開ける</button>
 </div>
 <label><input type="checkbox" id="autoBlink" checked>自然な瞬きを自動再生（約2.4〜6秒間隔）</label>
 <label>まぶたの閉じ具合：<output id="lidValue">自動</output>
  <input id="lidAmount" type="range" min="0" max="100" step="1" value="0">
 </label>
 <h2>衣装を付けて確認</h2>
 <label><input type="checkbox" id="outfitEnabled">現行剣士の衣装を表示</label>
 <label><input type="checkbox" id="helmetEnabled">兜を表示（衣装装着時）</label>
 <p>兜で顔が隠れる問題を避けるため、最初は人体の顔だけを拡大表示します。身体・モーション・衣装データの置換は行いません。</p>
 <h2>描画・骨格の診断</h2>
 <div id="status">ロード中</div>
 <div id="diagnostics">目の位置を計測中</div>
 <p><a href="./swordsman-ai-test.html?v=faceblink-1">現行剣士とAI人体・鎧の品質比較</a></p>
</aside>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createCharacter} from './src/character-system/shared-character-runtime.js?v=faceblink-1';
const $=id=>document.getElementById(id),v=$('viewport');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.13;
v.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x122537);
scene.add(new THREE.HemisphereLight(0xffffff,0x60798b,2.05));
const key=new THREE.DirectionalLight(0xffe5d2,2.0);key.position.set(2,5,5);scene.add(key);
const fill=new THREE.DirectionalLight(0xc5e4ff,.8);fill.position.set(-3,2,-4);scene.add(fill);
try{
 const pmrem=new THREE.PMREMGenerator(renderer);
 const room=new RoomEnvironment(renderer),env=pmrem.fromScene(room,.05);
 scene.environment=env.texture;pmrem.dispose();room.dispose();
}catch(e){console.warn('Eye reflection fallback',e)}
const camera=new THREE.PerspectiveCamera(37,1,.005,50);
const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;orbit.minDistance=.12;orbit.maxDistance=8;
let character=null,wardrobe=null,lastFrame=performance.now(),faceMode=true,loadError=null;
function resize(){
 const w=Math.max(1,v.clientWidth),h=Math.max(1,v.clientHeight);
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(v);resize();
function focus(front=true){
 if(!character)return;
 const eye=character.face?.eyeCenterWorld?.()||
  new THREE.Box3().setFromObject(character.object3D).getCenter(new THREE.Vector3());
 orbit.target.copy(eye);
 const length=faceMode?.30:3.35;
 const position=eye.clone().add(new THREE.Vector3(front?0:length*.82,faceMode?.008:.20,
  front?length:length*.70));
 if(!faceMode)orbit.target.set(0,.93,0);
 camera.position.copy(position);
 camera.near=.003;camera.far=50;camera.updateProjectionMatrix();
 orbit.update();
 for(const el of ['faceView','bodyView'])
  $(el).setAttribute('aria-pressed',String((el==='faceView')===faceMode));
}
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,Math.max(0,(t-lastFrame)/1000));lastFrame=t;
 character?.update(dt);
 wardrobe?.sync();
 orbit.update();renderer.render(scene,camera);
}
requestAnimationFrame(frame);
function diagnostics(){
 const face=character?.face?.diagnostics?.()||{supported:false};
 return {loaded:!!character,face,bodyBones:character?.diagnostics().boneCount||0,
  outfitLoaded:!!wardrobe,view:faceMode?'face':'body',error:loadError};
}
window.__faceBlinkQA=()=>diagnostics();
window.__forceFaceBlink=()=>character?.face?.forceBlink()||false;
window.__stepFaceBlink=dt=>{character?.face?.update(dt);return character?.face?.diagnostics?.()||null};
window.__holdFaceBlink=v=>character?.face?.holdBlink(v)??null;
$('blinkNow').onclick=()=>{character?.face?.holdBlink(null);character?.blink();$('lidValue').textContent='瞬き中'};
$('closeEyes').onclick=()=>{character?.face?.holdBlink(1);$('lidValue').textContent='100％'};
$('openEyes').onclick=()=>{character?.face?.holdBlink(0);$('lidAmount').value='0';$('lidValue').textContent='0％'};
$('autoBlink').onchange=()=>{character?.face?.setAutoBlink($('autoBlink').checked);character?.face?.holdBlink(null);$('lidValue').textContent='自動'};
$('lidAmount').oninput=()=>{const n=Number($('lidAmount').value)/100;
 character?.face?.holdBlink(n);$('lidValue').textContent=Math.round(n*100)+'％'};
$('faceView').onclick=()=>{faceMode=true;focus()};
$('bodyView').onclick=()=>{faceMode=false;focus()};
$('frontView').onclick=()=>focus(true);
$('sideView').onclick=()=>focus(false);
$('helmetEnabled').onchange=()=>{wardrobe?.setHelmetVisible($('helmetEnabled').checked)};
$('outfitEnabled').onchange=async()=>{
 if(!character)return;
 if(!$('outfitEnabled').checked){wardrobe?.dispose();wardrobe=null;return}
 $('status').textContent='本物の剣士衣装を装着中…';
 try{
  const module=await import('./src/character-system/rigged-outfit-runtime.js?v=faceblink-1');
  const rig=await module.buildRiggedJobOutfit({
   characterModel:character.model,parent:character.object3D,job:'job01',
   sex:'male',quality:'preview',preserveBody:false
  });
  wardrobe?.dispose();wardrobe=rig;
  wardrobe.setHelmetVisible($('helmetEnabled').checked);
  wardrobe.sync();
  $('status').textContent='衣装を装着しました。まぶたは顔の頭骨に追従しています。';
 }catch(e){loadError=e.message;$('status').textContent='衣装読込失敗：'+e.message;$('outfitEnabled').checked=false}
};
async function init(){
 try{
  character=await createCharacter({job:'剣士',sex:'male',height:1.78});
  if(!character.face?.supported)throw Error('Eye geometry unsuitable for eyelid animation: '+character.face?.reason);
  scene.add(character.object3D);
  focus();
  $('overlay').textContent='65骨の現行男性モデル｜目の形状を実測し上下4つのまぶたを追加';
  $('status').textContent='実モデルの顔PBR／両目まぶた4メッシュ／自動瞬きを有効化';
  $('diagnostics').textContent=JSON.stringify(diagnostics(),null,2);
  setInterval(()=>{$('diagnostics').textContent=JSON.stringify(diagnostics(),null,2)},500);
 }catch(e){
  loadError=e.message;
  $('overlay').textContent='顔の読み込みに失敗：'+e.message;
  $('status').textContent='エラー：'+e.message;
  console.error(e);
 }
}
init();
</script></body></html>
