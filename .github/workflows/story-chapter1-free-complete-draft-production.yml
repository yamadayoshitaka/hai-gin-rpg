name: Chapter 1 all 462 shots - resumed Free-only real draft images

# Finite first-chapter production queue; outputs are review drafts only.
# Manual-only generation. No scheduled jobs, no paid endpoints, no automatic API retries.
# Trigger through workflow_dispatch or the explicit operator trigger file; strict per-run estimate cap.
on:
  push:
    branches: [main]
    paths:
      - 'ops/start-chapter1-full-free-actual-art-once-20261114.trigger'
      - 'ops/resume-c01-from-stage3-20261114.trigger'
      - 'ops/resume-c01-stage3-through5-20261114.trigger'
      - 'ops/owner-request-stage4-through10-free-20261115.trigger'
  workflow_dispatch:
    inputs:
      start_stage:
        description: 'First Chapter 1 stage (c01-s01 through c01-s10)'
        type: string
        required: false
        default: c01-s05
      through_stage:
        description: 'Last Chapter 1 stage'
        type: string
        required: false
        default: c01-s10

permissions:
  contents: write
  actions: read

concurrency:
  group: chapter1-free-one-batch-per-day
  cancel-in-progress: false

jobs:
  chapter1:
    name: Resume up to 12 review-pages, max 7500 estimated Neurons
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout canonical main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image IO dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Validate source and canonical chapter queue
        run: |
          node --check scripts/generate-story-chapter1-free-batch.mjs
          node qa/story-chapter-page-loop.test.mjs
          node qa/story-chapter1-stage-priority.test.mjs
          node qa/story-stage3-owner-provisional-completion.test.mjs
          node qa/story-c01-stage45-generation-guard.test.mjs
          node qa/story-generation-fallback.test.mjs
          node qa/story-free-spend-policy.test.mjs
      - name: Fail before generation unless Free confirmed and both secrets available
        shell: bash
        env:
          FREE_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
        run: |
          set -euo pipefail
          [ "$FREE_CONFIRMED" = "true" ] || { echo "::error::Workers Free not confirmed"; exit 4; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_WORKERS_AI_API_TOKEN" ] || \
            { echo "::error::Missing credentials"; exit 5; }
          echo "Free confirmation and credentials are present (values redacted)"
      - name: Refuse another Cloudflare production attempt on the same UTC date
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          raw=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/story-chapter1-free-complete-draft-production.yml/runs?per_page=100")
          duplicate=$(printf '%s' "$raw" | jq --arg today "$today" --argjson self "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(.id != $self) | select(.event=="workflow_dispatch" or .event=="push") |
              select(.created_at | startswith($today))] | length')
          if [ "$duplicate" -gt 0 ]; then
            echo "::error::Cloudflare Free daily invocation already used; no more provider calls until next UTC date"
            exit 7
          fi
      - name: Checkout persistent review-only branch
        run: |
          set -euo pipefail
          git fetch origin story/chapter1-free-actual-art
          git switch -c story/chapter1-free-actual-art --track origin/story/chapter1-free-actual-art
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore current main game registration and latest stage-order generator for accurate missing-image checks
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:scripts/generate-story-chapter1-free-batch.mjs > scripts/generate-story-chapter1-free-batch.mjs
          git show origin/main:src/story-generation-fallback.js > src/story-generation-fallback.js
          git show origin/main:data/story-generation-spend-policy.json > data/story-generation-spend-policy.json
          # The review branch predates the compact format: always restore its
          # canonical scene selection manifest from main before any provider call.
          git show origin/main:data/story-compact-20chapters.json > data/story-compact-20chapters.json
          git show origin/main:src/story-c01-stage45-art-guard.js > src/story-c01-stage45-art-guard.js
          git show origin/main:qa/story-chapter1-draft-regression.mjs > qa/story-chapter1-draft-regression.mjs
          git show origin/main:assets/story/stage-manifests/c01-s04.manifest.json > assets/story/stage-manifests/c01-s04.manifest.json
          git show origin/main:assets/story/stage-manifests/c01-s05.manifest.json > assets/story/stage-manifests/c01-s05.manifest.json
          git show origin/main:src/story-chapter1-provisional-live.js > src/story-chapter1-provisional-live.js
          git show origin/main:src/story-panel-registered-art.js > src/story-panel-registered-art.js
          while IFS= read -r asset; do
            mkdir -p "$(dirname "$asset")"
            git show "origin/main:$asset" > "$asset"
          done < <(git ls-tree -r --name-only origin/main -- assets/story/chapter1-provisional-live)
          node --check scripts/generate-story-chapter1-free-batch.mjs
      - name: Preserve reuse-only scope for stages 1-4 and NEW-only stage5 onward
        run: node qa/story-stage-art-sourcing-boundary.test.mjs
      - name: Audit exact native-stage gaps for stages 1 through 4
        run: node scripts/audit-story-c01-s01-s04-compact.mjs
      - name: Count stage1 through later stage missing real artworks
        env:
          START_STAGE: ${{ inputs.start_stage || 'c01-s05' }}
          THROUGH_STAGE: ${{ inputs.through_stage || 'c01-s10' }}
        run: node scripts/generate-story-chapter1-free-batch.mjs --mode plan --start-stage "$START_STAGE" --through-stage "$THROUGH_STAGE"
      - name: Generate real review images with strict budget and page commits
        env:
          START_STAGE: ${{ inputs.start_stage || 'c01-s05' }}
          THROUGH_STAGE: ${{ inputs.through_stage || 'c01-s10' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
          CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED }}
          CLOUDFLARE_CHAPTER1_DAILY_ESTIMATE_CAP: '7500'
        run: node scripts/generate-story-chapter1-free-batch.mjs --mode generate --max-pages 12 --start-stage "$START_STAGE" --through-stage "$THROUGH_STAGE"
      - name: Independently regress every canonical image and physical actor master (NO automatic visual approval)
        if: always()
        run: |
          node qa/story-chapter1-draft-regression.mjs --strict
      - name: Assemble at most five authentic panels per visual review sheet (never game art)
        if: always()
        run: |
          if [ -f qa-reports/story-stage-production/chapter1-free-render/c01-regression.json ]; then
            python3 scripts/build-story-chapter1-review-sheets.py
          fi
      - name: Save full chapter regression report to review branch
        if: always()
        shell: bash
        run: |
          if [ -f qa-reports/story-stage-production/chapter1-free-render/c01-regression.json ]; then
            git add -- qa-reports/story-stage-production/chapter1-free-render/c01-regression.json
            if ! git diff --cached --quiet; then
              git commit -m "qa(story): checkpoint 462-scene image integrity and manual visual QA gaps"
              git push origin HEAD:story/chapter1-free-actual-art
            fi
          fi
      - name: Publish verified image counts and Cloudflare to ChatGPT fallback status
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const load=(p)=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const run=load('qa-reports/story-stage-production/chapter1-free-render/last-run.json');
          const qa=load('qa-reports/story-stage-production/chapter1-free-render/c01-regression.json');
          const counts=qa?.counts||{};
          const show=(value)=>value===null||value===undefined?'unknown':String(value);
          const lines=[
            '## Chapter 1: real image production (not an approval claim)',
            '',
            '| Item | Actual result |',
            '|---|---:|',
            '| New images in THIS run | '+show(run?.newRealDraftImages)+' |',
            '| New page commits in THIS run | '+show(run?.newDraftPageCommits)+' |',
            '| Cloudflare API requests in THIS run | '+show(run?.apiRequests)+' |',
            '| Run stop reason | '+show(run?.stopReason)+' |',
            '| ChatGPT manual handoff | '+show(run?.chatGPTManualHandoff)+' |',
            '| Handoff shot (not rendered) | '+show(run?.chatGPTHandoffShotKey)+' |',
            '| Canonical shots | '+show(counts.expected)+' |',
            '| Native real draft images (not visually approved) | '+show(counts.validRealReviewDraft)+' |',
            '| Pre-existing registered art (P0 not certified) | '+show(counts.existingRegistrationNotP0Approved)+' |',
            '| Missing images | '+show(counts.missing)+' |',
            '| Legacy images requiring regeneration | '+show(counts.legacyNativeRegenerationRequired)+' |',
            '| Provider safety-blocked shots | '+show(counts.providerBlocked)+' |',
            '',
            'A green workflow run does NOT mean all artwork is generated, approved, or published.',
            'On Cloudflare Free quota exhaustion there is no paid API switch and no automatic retry. A ChatGPT Plus handoff link is issued for manual image creation, not an automatically generated image.',
            ''
          ];
          if(qa?.stages?.length){
            lines.push('### Per-stage native drafts and remaining work','','| Stage | Drafts | Missing / rework / blocked |','|---|---:|---:|');
            for(const stage of qa.stages){
              const all=stage.scenes||[];
              const drafts=all.filter(s=>s.status==='VALID_REAL_DRAFT_VISUAL_QA_PENDING').length;
              const remaining=all.filter(s=>['MISSING_REAL_ART','LEGACY_NATIVE_REGEN_REQUIRED','PROVIDER_SAFETY_BLOCKED'].includes(s.status)).length;
              lines.push('| '+stage.stageId+' | '+drafts+' | '+remaining+' |');
            }
          }
          const content=lines.join('\n')+'\n';
          console.log(content);
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,content);
          NODE
      - name: Upload per-scene review and progress proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-free-actual-art-progress-${{ github.run_id }}
          path: |
            qa-reports/story-stage-production/chapter1-free-render/
            qa-reports/story-stage-production/chapter1-review-sheets/
          retention-days: 30
          if-no-files-found: warn
