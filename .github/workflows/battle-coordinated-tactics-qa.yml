name: Coordinated tactics and reactive command pacing QA
on:
  push:
    branches:
      - 'feat/coordinated-tactics-reactive-orders-*'
  pull_request:
    paths:
      - 'src/battle-reactive-command-policy.js'
      - 'src/battle-tactics-preset-policy.js'
      - 'tactics-wireframe.html'
      - 'qa/battle-coordinated-tactics-counters.test.mjs'
      - '.github/workflows/battle-coordinated-tactics-qa.yml'
  workflow_dispatch:
jobs:
  coordinated-tactics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Army-wide tactics, countermeasures and command pacing
        run: node qa/battle-coordinated-tactics-counters.test.mjs
      - name: Existing single-job squad tactics
        run: node qa/battle-tactics-preset.test.mjs
      - name: Victory, defeat and formation regression
        run: |
          node qa/battle-objective-opposed-sides.test.mjs
          node qa/battle-stage-objective-job-squads.test.mjs
          node qa/mass-battle-formations.test.mjs
      - name: Game-core story integration
        run: node --experimental-vm-modules qa/game-core-contract.test.mjs
