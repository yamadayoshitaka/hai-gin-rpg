name: Experimental male chest fitting
on:
  push:
    paths:
      - 'tools/experimental-fit-chest.py'
      - '.github/workflows/experimental-chest-fit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          set -euxo pipefail
          timeout 180s sudo apt-get update -o Acquire::Retries=1
          timeout 420s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy
          blender --version
      - name: Produce inspectable chest alignment (not production rig)
        run: |
          blender -b --python-exit-code 1 --python tools/experimental-fit-chest.py -- \
            assets/characters/quaternius-base/Superhero_Male_FullBody.gltf \
            assets/characters/seven-head-equipment-candidates/plate_chest-male.glb \
            output/experimental/plate_chest-male.glb
      - name: Check output GLB structure
        run: |
          python3 -c "import pathlib,struct,json; p=pathlib.Path('output/experimental/plate_chest-male.glb'); b=p.read_bytes(); assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b); assert json.loads(pathlib.Path(str(p)+'.json').read_text())['skinned_vertices']>0 and json.loads(pathlib.Path(str(p)+'.json').read_text())['pose_check']['max_displacement']>1e-6; print('Experimental asset exported; NOT approved for release')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-chest-alignment
          path: output/experimental/
          if-no-files-found: warn
      - name: Publish experimental GLB for browser preview
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.request,urllib.error
          file=pathlib.Path('output/experimental/plate_chest-male.glb')
          path='assets/characters/experimental/plate_chest-male.glb'
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+path
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(api,headers=headers)) as response:
                  sha=json.load(response)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          payload={'message':'Publish experimental chest preview GLB [skip ci]','content':base64.b64encode(file.read_bytes()).decode(),'branch':'main'}
          if sha:payload['sha']=sha
          request=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(request) as response:
              print('Published preview GLB',json.load(response)['content']['path'])
          PY
