name: Monster anatomy, joints and mesh quality (50 species)
on:
  pull_request:
    paths:
      - 'src/monster-anatomy-reference.js'
      - 'src/creature-wolf-hybrid.js'
      - 'src/monster-summon-registry.js'
      - 'src/monster-summon-renderer.js'
      - 'src/creature-game-model-routing.js'
      - 'src/battle-registered-monster-model.js'
      - 'src/creature-mesh-adoption.js'
      - 'src/combat-world-object-renderer.js'
      - 'tactics-wireframe.html'
      - 'creature-model-adoption.html'
      - 'qa/creature-game-model-routing.test.mjs'
      - 'qa/monster-canine-quality-rollout.test.mjs'
      - 'src/feline-master-variants.js'
      - 'src/beast-reference-quality.js'
      - 'qa/feline-master-m007-m010.test.mjs'
      - 'src/combat-action-spec.js'
      - 'src/creature-dragon-hybrids.js'
      - 'src/combat-creature-geometry.js'
      - 'src/creature-summon-humanoid-anatomy.js'
      - 'src/combat-creature-performance.js'
      - 'src/combat-world-object-renderer.js'
      - 'src/female-summon-forms.js'
      - 'qa/summon-source-hybrid-colors-scale.test.mjs'
      - 'qa/monster-summon-bestiary-regression.test.mjs'
      - 'src/monster-joint-motion.js'
      - 'src/monster-animation.js'
      - 'src/m001-action-effects.js'
      - 'src/beast-action-effects.js'
      - 'qa/beast-m002-feline-gait-face-fx-regression.test.mjs'
      - 'qa/m001-crown-action-vfx.test.mjs'
      - 'src/monster-geometry.js'
      - 'src/wolf-king-clone-source.js'
      - 'qa/beast-mother-clone-source.test.mjs'
      - 'src/creature-real-source-audit.js'
      - 'qa/creature-real-source-audit.test.mjs'
      - 'creature-master-studio.html'
      - 'src/monster-source-composite.js'
      - 'qa/monster-source-composite-regression.test.mjs'
      - 'src/monster-beastfolk-manifest.js'
      - 'src/monster-beastfolk-geometry.js'
      - 'qa/monster-beastfolk-wolf-regression.test.mjs'
      - 'monster-manager.html'
      - 'src/monster-shape-kit.js'
      - 'src/monster-humanoid-hair.js'
      - 'src/monster-character-cosplay.js'
      - 'src/monster-cosplay-pigmentation.js'
      - 'src/monster-humanoid-combat-poses.js'
      - 'src/monster-studio-base-intake.js'
      - 'src/monster-studio-skinned-rig-audit.js'
      - 'qa/monster-studio-skinned-rig-audit.test.mjs'
      - 'qa/monster-studio-base-intake.test.mjs'
      - 'src/monster-gothic-sculpt.js'
      - 'src/monster-regal-garments.js'
      - 'src/female-summon-costumes.js'
      - 'src/dragonkin-native-scalp.js'
      - 'src/female-summon-scalp-cut.js'
      - 'qa/female-summon-scalp-cut-regression.test.mjs'
      - 'qa/dragonkin-native-scalp-regression.test.mjs'
      - 'qa/demon-female-summon-mobile-viewer.test.mjs'
      - 'qa/monster-humanoid-combat-poses.test.mjs'
      - 'qa/nonhuman-monster-wardrobe.test.mjs'
      - 'qa/monster-regal-wardrobe-batch.test.mjs'
      - 'qa/forest-spirit-emerald-regression.test.mjs'
      - 'qa/monster-gothic-sculpt-regression.test.mjs'
      - 'qa/monster-humanoid-hair-orientation-regression.test.mjs'
      - 'qa/monster-anatomy-motion.test.mjs'
      - 'qa/monster-m002-flame-wolf-rig.test.mjs'
      - 'qa/monster-m003-fenrir-rig.test.mjs'
      - 'qa/monster-m004-thunderwolf-gallop.test.mjs'
      - 'docs/monster-research/**'
      - 'data/monster-realism-progress.json'
      - 'qa/monster-realism-progress.test.mjs'
      - '.github/workflows/monster-anatomy-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: monster-anatomy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry-and-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and lint real mesh and motion modules
        shell: bash
        run: |
          set -euo pipefail
          for file in src/monster-beastfolk-manifest.js src/monster-beastfolk-geometry.js src/monster-summon-registry.js src/monster-summon-renderer.js src/creature-wolf-hybrid.js src/creature-dragon-hybrids.js src/combat-creature-geometry.js src/creature-summon-humanoid-anatomy.js src/combat-creature-performance.js src/monster-anatomy-reference.js src/monster-joint-motion.js src/monster-animation.js src/beast-action-effects.js src/monster-geometry.js src/wolf-king-clone-source.js src/feline-master-variants.js src/beast-reference-quality.js src/creature-game-model-routing.js src/battle-registered-monster-model.js src/monster-humanoid-hair.js src/monster-character-cosplay.js src/monster-cosplay-pigmentation.js src/monster-humanoid-combat-poses.js src/monster-studio-base-intake.js src/monster-studio-skinned-rig-audit.js src/monster-gothic-sculpt.js src/monster-regal-garments.js src/female-summon-costumes.js src/dragonkin-native-scalp.js src/female-summon-scalp-cut.js; do
            node --check "$file"
          done
      - name: Install pinned Three.js geometry runtime
        run: npm install --no-save --package-lock=false three@0.180.0
      - name: Run every-monster anatomy / action / reference test and baseline mesh contracts
        run: |
          node --test qa/monster-anatomy-motion.test.mjs qa/m001-crown-action-vfx.test.mjs qa/beast-m002-feline-gait-face-fx-regression.test.mjs qa/monster-canine-quality-rollout.test.mjs qa/beast-mother-clone-source.test.mjs qa/feline-master-m007-m010.test.mjs qa/creature-game-model-routing.test.mjs qa/creature-mesh-adoption.test.mjs qa/monster-bestiary.test.mjs qa/monster-realism-progress.test.mjs qa/monster-m002-flame-wolf-rig.test.mjs qa/monster-m003-fenrir-rig.test.mjs qa/monster-m004-thunderwolf-gallop.test.mjs
      - name: Reject fake photoreal certification, cover all 108 source anatomy baselines
        run: |
          node --check src/monster-shape-kit.js
          node --check src/creature-real-source-audit.js
          node --test qa/creature-real-source-audit.test.mjs qa/creature-master-studio.test.mjs qa/creature-reconstruction-plan.test.mjs
      - name: Regress all humanoid instances, cloak, hair, skeleton and fitted outfit geometry
        env:
          NODE_OPTIONS: '--import=./qa/node-progress-event-polyfill.mjs'
        run: |
          npm run test:humanoid-monster-cosplay
          npm run test:monster-studio-base-intake
          npm run test:monster-gothic-sculpt
          npm run test:humanoid-orientation-hair
          npm run test:regal-humanoid-wardrobe
          npm run test:creature-variants-mobile-viewer
          npm run test:humanoid-spell-motion
          npm run test:nonhuman-monster-outfits
          npm run test:monster-source-rebuild
          npm run test:summon-source-hybrid
          npm run test:monster-summon-catalog
          node qa/monster-beastfolk-wolf-regression.test.mjs
          npm run test:forest-spirit-emerald
          node qa/dragonkin-native-scalp-regression.test.mjs
          node qa/female-summon-scalp-cut-regression.test.mjs
      - name: Assert no human-character assets entered PR patch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PR_NUMBER: '${{ github.event.pull_request.number }}'
        shell: bash
        run: |
          set -euo pipefail
          # actions/checkout uses the synthetic PR merge commit. Comparing
          # base.sha to HEAD incorrectly flags unrelated concurrent main
          # merges as if they were part of this PR. Query only PR filenames.
          if [[ -n "$GH_PR_NUMBER" ]]; then
            FILES="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${GH_PR_NUMBER}/files?per_page=100" --paginate --jq '.[].filename')"
            echo "PR changed files:"
            printf '%s\n' "$FILES"
            if grep -E '(^src/(master-heroine|character-|humanoid|facial-|combat-humanoid)|\.glb$|^assets/humans/)' <<<"$FILES"; then
              echo 'Forbidden human model or mesh change' >&2
              exit 1
            fi
          fi
