const occupiedTrees=new Set();for(const o of stageData.objects||[]){if(o.id!=='tree_deciduous_001'&&o.id!=='flower_tree_001')continue;for(let dz=0;dz<2;dz++)for(let dx=0;dx<2;dx++)occupiedTrees.add((o.x+dx)+','+(o.z+dz))}
const isBlocked=(x,z)=>occupiedTrees.has(x+','+z)||['river','water'].includes(stageData.tiles[z*58+x]);
const stageObjects=new THREE.Group();stageObjects.name='RegisteredStageObjects';scene.add(stageObjects);const treeTemplates=new Map(),fenceTemplate=makeFenceAsset();for(const o of stageData.objects||[]){let asset;if(o.id==='wood_fence')asset=fenceTemplate.clone(true);else if(o.id==='tree_deciduous_001'||o.id==='flower_tree_001'){if(!treeTemplates.has(o.id))treeTemplates.set(o.id,makeTreeAsset(o.id,stageData.season));asset=treeTemplates.get(o.id).clone(true)}else continue;asset.userData.assetId=o.id;asset.position.set((o.x-5.5)*CELL,(elevation(Math.min(57,o.x),Math.min(57,o.z))*HEIGHT_UNIT)-.35,(o.z-5.5)*CELL);if(o.id==='tree_deciduous_001'||o.id==='flower_tree_001')asset.scale.setScalar(1.75);stageObjects.add(asset)}

const actors=[],clock=new THREE.Clock(),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const JOBS=[
 {name:'盾戦士',role:'front',speed:2.0,hp:180,range:2.1,damage:12,cooldown:1.6,color:0x7299bc},
 {name:'剣士',role:'front',speed:3.0,hp:130,range:2.5,damage:18,cooldown:1.2,color:0xc5b6a2},
 {name:'格闘家',role:'front',speed:4.1,hp:105,range:2.0,damage:15,cooldown:.85,color:0xe5a675},
 {name:'忍者',role:'flank',speed:5.5,hp:80,range:2.2,damage:21,cooldown:.9,color:0x695b86},
 {name:'盗賊',role:'flank',speed:5.0,hp:85,range:2.0,damage:13,cooldown:.8,color:0x8f9c67},
 {name:'弓使い',role:'rear',speed:3.4,hp:75,range:15,damage:14,cooldown:1.9,color:0x7da36d},
 {name:'魔法使い',role:'rear',speed:2.5,hp:70,range:12,damage:22,cooldown:2.5,color:0x8669bd},
 {name:'僧侶',role:'support',speed:2.7,hp:90,range:9,damage:0,cooldown:2.3,color:0xe4d8ad},

let globalOrder='balanced',selected=null,paused=false,finished=false,elapsed=0,uiTimer=0,simAccumulator=0;
const teamCounts=()=>[0,1].map(team=>actors.filter(a=>a.team===team&&a.hp>0).length);
const log=message=>{$('log').textContent=message};
const skinMat=new THREE.MeshStandardMaterial({color:0xc89a79,roughness:.9});
const metalMat=new THREE.MeshStandardMaterial({color:0xadb8bc,metalness:.45,roughness:.5});
const sphere=new THREE.SphereGeometry(.24,7,6),box=new THREE.BoxGeometry(1,1,1);
function mesh(geo,mat,parent,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m}
function createSoldier(job,team){
 const root=new THREE.Group(),material=new THREE.MeshStandardMaterial({color:job.color,roughness:.85});
 mesh(box,material,root,0,.85,0,.48,.75,.3);
 mesh(sphere,skinMat,root,0,1.43,0,1.02,1.02,1.02);
 for(const side of [-1,1]){mesh(box,material,root,side*.35,.86,0,.17,.64,.18);mesh(box,material,root,side*.14,.31,0,.18,.54,.19)}
 if(job.role==='front')mesh(box,metalMat,root,.5,.78,.13,.10,.82,.12);
 if(job.name==='弓使い')mesh(box,material,root,-.48,.94,.06,.07,.9,.08);
 if(job.role==='rear')mesh(sphere,material,root,0,1.68,0,.8,.35,.8);
 const ring=new THREE.Mesh(new THREE.RingGeometry(.36,.46,16),new THREE.MeshBasicMaterial({color:team===0?0x52cfff:0xff6b72,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.045;root.add(ring);

}
// Replace primitive placeholders with the existing seven-head-proportion rigged GLTF assets.
const modelLoader=new GLTFLoader();
const modelCache=new Map();
function loadBattleModel(sex){if(!modelCache.has(sex)){modelCache.set(sex,modelLoader.loadAsync(CHARACTER_MODEL_REGISTRY[sex].url))}return modelCache.get(sex)}
// Procedural fallback for GLTF assets without usable animation clips.
// Never leave the bind-pose T stance visible during realtime combat.
function setupBattlePose(a,model){
 const names=['upperarm_l','upperarm_r','lowerarm_l','lowerarm_r','thigh_l','thigh_r','calf_l','calf_r','spine_01'];
 const bones={};model.traverse(o=>{if(o.isBone&&names.includes(o.name))bones[o.name]={bone:o,rest:o.quaternion.clone()}});
 a.poseBones=bones;a.poseTime=a.id*.31;a.poseMoving=false;
}
const poseZ=new THREE.Quaternion(),poseX=new THREE.Quaternion();
function updateBattlePose(a,dt){
 if(!a.poseBones)return;
 a.poseTime+=dt*(a.poseMoving?Math.max(2,a.speed*2.2):1.3);
 const phase=a.poseTime,swing=a.poseMoving?Math.sin(phase)*.38:0;
 const b=a.poseBones;
 const rotate=(name,z=0,x=0)=>{const item=b[name];if(!item)return;item.bone.quaternion.copy(item.rest);
 poseZ.setFromAxisAngle(new THREE.Vector3(0,0,1),z);poseX.setFromAxisAngle(new THREE.Vector3(1,0,0),x);
 item.bone.quaternion.multiply(poseZ).multiply(poseX)};
 // T-pose upper arms are lowered into a relaxed combat-ready stance.
 rotate('upperarm_l',1.02,-.13-swing*.28);
 rotate('upperarm_r',-1.02,-.13+swing*.28);
 rotate('lowerarm_l',.22,-.38);
 rotate('lowerarm_r',-.22,-.38);
 rotate('thigh_l',0,swing);
 rotate('thigh_r',0,-swing);
 rotate('calf_l',0,Math.max(0,-swing)*.6);
 rotate('calf_r',0,Math.max(0,swing)*.6);
 rotate('spine_01',Math.sin(phase*.5)*.025,Math.sin(phase*.4)*.02);

}
async function installBattleModels(){
 const results=await Promise.allSettled(['male','female'].map(sex=>loadBattleModel(sex)));
 const sources={male:results[0].status==='fulfilled'?results[0].value:null,female:results[1].status==='fulfilled'?results[1].value:null};
 let installed=0;
 for(const a of actors){const sex=a.id%5===0?'female':'male',source=sources[sex]||sources.male||sources.female;if(!source)continue;
 try{const model=cloneSkinned(source.scene);model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),height=bounds.getSize(new THREE.Vector3()).y;
 if(!Number.isFinite(height)||height<=.01)continue;
 const targetHeight=1.7;model.scale.multiplyScalar(targetHeight/height);model.updateMatrixWorld(true);model.position.y-=new THREE.Box3().setFromObject(model).min.y;
 model.traverse(o=>{if(o.isSkinnedMesh){o.frustumCulled=false;o.castShadow=false}});
 // Keep the selectable team ring but remove the temporary box-and-sphere body.
 for(const child of [...a.root.children])if(child!==a.root.userData.ring)a.root.remove(child);
 a.root.add(model);a.model=model;setupBattlePose(a,model);
 const clips=source.animations||[],clip=clips.find(c=>/idle|stand/i.test(c.name));
 if(clip){a.mixer=new THREE.AnimationMixer(model);a.mixer.clipAction(clip).play();a.poseBones=null}

 }catch(e){console.warn('model install',a.id,e)}
 }

 if(!installed)showRuntimeError('人物GLTFモデルを読み込めませんでした。アセットのパスとネットワークを確認してください');
}
installBattleModels().catch(e=>showRuntimeError('人物モデル読込: '+(e.stack||e.message)));
function terrainY(x,z){return smoothHeight(x/CELL+6,z/CELL+6)}
function placeFormation(team,idx,job){
 // Each class occupies a different formation band; both armies face each other.
 const rank=job.role==='front'?0:job.role==='flank'?1:job.role==='support'?3:2;
 const count=idx,side=team===0?1:-1;
 const xCell=(team===0?11:46)+side*rank*2;
 const row=count%13,depth=Math.floor(count/13);
 const zCell=12+row*2.45+(depth%2)*.7;
 const flank=job.role==='flank'?(row%2===0?-3:3):0;
 return new THREE.Vector3((xCell+flank-6)*CELL,0,(zCell-6)*CELL)
}
const jobCounts=[new Map(),new Map()];
for(let team=0;team<2;team++)for(let i=0;i<1;i++){
 const job=JOBS[1],count=jobCounts[team].get(job.role)||0;
 jobCounts[team].set(job.role,count+1);
 const root=createSoldier(job,team),pos=new THREE.Vector3((team===0?8:14)*CELL,0,8*CELL);
 root.position.set(pos.x,terrainY(pos.x,pos.z),pos.z);root.rotation.y=team===0?Math.PI/2:-Math.PI/2;scene.add(root);
 actors.push({id:team+i,team,job,root,hp:job.hp,maxHp:job.hp,mp:30,speed:job.speed,attackTimer:Math.random()*2,thinkTimer:Math.random()*.4,order:null,targetId:null,home:pos.clone(),velocity:new THREE.Vector3(),walkPhase:0})
}
function nearestEnemy(actor,range=Infinity){let nearest=null,best=range*range;const p=actor.root.position;for(const other of actors){if(other.team===actor.team||other.hp<=0)continue;const q=other.root.position,dx=q.x-p.x,dz=q.z-p.z,d=dx*dx+dz*dz;if(d<best){best=d;nearest=other}}return nearest}
function nearestWounded(actor){let target=null,best=Infinity;for(const a of actors){if(a.team!==actor.team||a.hp<=0||a.hp>=a.maxHp*.92)continue;const d=actor.root.position.distanceToSquared(a.root.position);if(d<best){best=d;target=a}}return target}
function desiredOrder(a){return a.team===0?(a.order||globalOrder):'balanced'}
function moveActor(a,goal,dt,stop){
 const p=a.root.position,dx=goal.x-p.x,dz=goal.z-p.z,d=Math.hypot(dx,dz);
 if(d<=stop)return;
 const speed=a.speed*CELL*.48,step=Math.min(d-stop,speed*dt),nx=p.x+dx/d*step,nz=p.z+dz/d*step;
 if(nx<(-6.5)*CELL||nx>(51.5)*CELL||nz<(-6.5)*CELL||nz>(51.5)*CELL)return;
 // Nearby ally separation, without O(n²) every rendered frame.
 for(const b of actors){if(b===a||b.hp<=0)continue;const bx=b.root.position.x-nx,bz=b.root.position.z-nz;if(bx*bx+bz*bz<.38*.38)return}

}
function tickAI(dt){
 if(paused||finished)return;elapsed+=dt;
 for(const a of actors){if(a.hp<=0)continue;a.attackTimer=Math.max(0,a.attackTimer-dt);a.thinkTimer-=dt;
 if(a.thinkTimer>0)continue;a.thinkTimer=.13+(a.id%5)*.016;
 const order=desiredOrder(a),enemy=nearestEnemy(a),p=a.root.position;if(!enemy)continue;
 let goal=enemy.root.position,range=a.job.range;
 if(a.team===0&&a.targetId!=null){const target=actors[a.targetId];if(target?.hp>0&&target.team!==a.team)goal=target.root.position}
 if(a.job.role==='support'){const wounded=nearestWounded(a);if(wounded){goal=wounded.root.position;range=5;if(p.distanceTo(goal)<range&&a.attackTimer<=0){wounded.hp=Math.min(wounded.maxHp,wounded.hp+14);a.attackTimer=a.job.cooldown;continue}}}
 if(order==='defend'&&a.team===0){const home=a.home;if(p.distanceTo(home)>CELL*5){moveActor(a,home,.18,CELL*1.5);continue}if(p.distanceTo(goal)>CELL*4)continue}
 if(order==='retreat'&&a.team===0){const home=a.home.clone();home.x-=CELL*9;moveActor(a,home,.18,.6);continue}
 if(order==='hold'&&a.team===0){if(p.distanceTo(goal)>range)continue}
 const d=Math.hypot(goal.x-p.x,goal.z-p.z);
 if(d>range){const multiplier=order==='charge'?1.25:order==='defend'?.65:1;moveActor(a,goal,.16*multiplier,range*.83);continue}
 if(a.attackTimer>0)continue;
 const target=a.job.role==='support'?nearestEnemy(a):actors.find(b=>b.hp>0&&b.team!==a.team&&b.root.position.distanceToSquared(p)<=range*range) || enemy;
 if(target.root.position.distanceToSquared(p)>range*range)continue;
 target.hp=Math.max(0,target.hp-a.job.damage);a.attackTimer=a.job.cooldown;
 a.root.rotation.y=Math.atan2(target.root.position.x-p.x,target.root.position.z-p.z);
 if(target.hp===0){target.root.visible=false;if(selected===target)selected=null}
 }
 const [ally,foe]=teamCounts();if(!ally||!foe){finished=true;paused=true;$('outcome').textContent=ally?'勝利':'敗北';$('resultDetail').textContent='戦闘時間 '+Math.floor(elapsed)+'秒';$('endScreen').style.display='flex'}
}
function updateUI(){
 const [ally,foe]=teamCounts();$('allyStats').innerHTML='<strong>味方 '+ally+'/50</strong><span class="values">作戦：'+({'balanced':'均衡','charge':'突撃','defend':'防御','hold':'陣地維持','retreat':'後退'}[globalOrder])+'</span>';

 $('unitInfo').textContent=selected?'選択 '+selected.job.name+' / HP '+selected.hp+'/'+selected.maxHp+' / 速度 '+selected.speed:'味方ユニットをタップして個別指示';

}
$('strategy').onchange=e=>{globalOrder=e.target.value;log('全軍作戦：'+e.target.selectedOptions[0].text);updateUI()};
$('unitOrder').onchange=e=>{if(selected&&selected.team===0){selected.order=e.target.value==='inherit'?null:e.target.value;log(selected.job.name+'：個別命令 '+e.target.selectedOptions[0].text)}};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止';updateUI()};
const cameraHome=new THREE.Vector3(11*CELL,0,8*CELL);
controls.target.copy(cameraHome);camera.position.set(cameraHome.x+13,24,cameraHome.z+30);controls.maxDistance=95;controls.update();
$('camOverview').onclick=()=>{controls.target.copy(cameraHome);camera.position.set(cameraHome.x+55,95,cameraHome.z+90);controls.update()};
$('camFollow').onclick=()=>{const p=selected?.root.position||actors[0].root.position;controls.target.copy(p);camera.position.set(p.x+12,p.y+20,p.z+25);controls.update()};
$('camReset').onclick=()=>{const p=actors[0].root.position;controls.target.copy(p);camera.position.set(p.x+12,p.y+23,p.z+28);controls.update()};
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{
 if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>16)return;

 const found=hits.length?actors.find(a=>{let o=hits[0].object;while(o){if(o===a.root)return true;o=o.parent}return false}):null;
 if(found){selected=found;updateUI();return}
 const hit=raycaster.intersectObject(ground,false)[0];if(hit&&selected&&selected.team===0){

});
addEventListener('resize',()=>{const h=Math.max(200,innerHeight-145);camera.aspect=innerWidth/h;camera.updateProjectionMatrix();renderer.setSize(innerWidth,h)});
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);simAccumulator+=dt;

}
log('50対50のリアルタイム自動戦闘を開始');updateUI();animate();
