<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰銀のレゾナンス・ネットモーション</title><style>html,body{margin:0;height:100%;background:#101722;color:white;font-family:system-ui}#ui{position:absolute;top:12px;left:12px;right:12px;z-index:3}h2{font-size:17px;margin:0 0 8px}p{font-size:12px;color:#d1dae5}button{background:#2a4058;border:1px solid #8fa7bf;border-radius:8px;color:white;padding:10px}#controls{display:flex;gap:8px;flex-wrap:wrap;position:absolute;bottom:12px;left:12px;right:12px}#error{color:#ffb9a9}</style></head><body><div id="ui"><h2>剣士・インターネット実測モーション v1</h2><p id="status">CMUのBVH歩行データをネットから取得中…</p><p id="error"></p><p>実測モーション／速度1.5倍／片手剣（検証用骨格）</p></div><div id="controls"><button id="play">一時停止</button><button id="turn">回転</button><button id="reset">正面</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {BVHLoader} from 'three/addons/loaders/BVHLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101722);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1.4,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1,0);orbit.update();scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(2,5,3);scene.add(key);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:0x273447}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const group=new THREE.Group();scene.add(group);const bonesGroup=new THREE.Group();group.add(bonesGroup);const steel=new THREE.MeshStandardMaterial({color:0xa7b8c9,metalness:.6,roughness:.3}),skin=new THREE.MeshStandardMaterial({color:0xcba082}),blue=new THREE.MeshStandardMaterial({color:0x2c4968}),gold=new THREE.MeshStandardMaterial({color:0xc9a46a,metalness:.6});const segments=[];const v=(x,y,z)=>new THREE.Vector3(x,y,z);
const defs=[['hips','hip','chest',.14,blue],['head','neck','head',.11,skin],['leftUpperArm','leftShoulder','leftElbow',.075,blue],['leftForearm','leftElbow','leftHand',.06,steel],['rightUpperArm','rightShoulder','rightElbow',.075,blue],['rightForearm','rightElbow','rightHand',.06,steel],['leftThigh','leftHip','leftKnee',.10,blue],['leftShin','leftKnee','leftFoot',.08,steel],['rightThigh','rightHip','rightKnee',.10,blue],['rightShin','rightKnee','rightFoot',.08,steel]];
for(const [name,a,b,r,m] of defs){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,12),m);group.add(mesh);segments.push({name,a,b,mesh})}const blade=new THREE.Mesh(new THREE.BoxGeometry(.06,.75,.025),steel),handle=new THREE.Mesh(new THREE.CylinderGeometry(.027,.027,.22,10),blue),guard=new THREE.Mesh(new THREE.BoxGeometry(.28,.04,.07),gold);group.add(blade,handle,guard);
let root=null,mixer=null,playing=true,turning=false,last=performance.now(),jointMap={};const aliases={hip:['hips','hip','root'],chest:['chest','spine2','upperback','spine1','spine'],neck:['neck'],head:['head'],leftShoulder:['leftarm','leftshoulder','lshoulder'],leftElbow:['leftforearm','leftelbow','lelbow'],leftHand:['lefthand','lwrist'],rightShoulder:['rightarm','rightshoulder','rshoulder'],rightElbow:['rightforearm','rightelbow','relbow'],rightHand:['righthand','rwrist'],leftHip:['leftupleg','lefthip','lhip'],leftKnee:['leftleg','leftknee','lknee'],leftFoot:['leftfoot','lfoot'],rightHip:['rightupleg','righthip','rhip'],rightKnee:['rightleg','rightknee','rknee'],rightFoot:['rightfoot','rfoot']};const status=document.querySelector('#status');function findBone(list){for(const q of list){const b=root.getObjectByProperty('name',q);if(b)return b;const found=[];root.traverse(o=>{if(o.isBone&&o.name.toLowerCase()===q)found.push(o)});if(found.length)return found[0]}return null}
function apply(){if(!root)return;root.updateMatrixWorld(true);const pos={};for(const k in jointMap){const b=jointMap[k];if(b)pos[k]=b.getWorldPosition(new THREE.Vector3())}if(!pos.hip)return;const base=pos.hip;let height=pos.head?pos.head.distanceTo(base):60;const scale=height>0? .85/height:.01;const point=k=>pos[k]?pos[k].clone().sub(base).multiplyScalar(scale).add(v(0,1.02,0)):null;for(const seg of segments){const a=point(seg.a),b=point(seg.b);if(!a||!b){seg.mesh.visible=false;continue}seg.mesh.visible=true;const d=b.clone().sub(a);seg.mesh.position.copy(a).addScaledVector(d,.5);seg.mesh.scale.set(1,d.length(),1);seg.mesh.quaternion.setFromUnitVectors(v(0,1,0),d.normalize())}const hand=point('rightHand'),elbow=point('rightElbow');if(hand&&elbow){const dir=hand.clone().sub(elbow).normalize();for(const [mesh,offset] of [[handle,.05],[guard,.17],[blade,.55]]){mesh.position.copy(hand).addScaledVector(dir,offset);mesh.quaternion.setFromUnitVectors(v(0,1,0),dir)}blade.visible=handle.visible=guard.visible=true}else blade.visible=handle.visible=guard.visible=false}
const url='https://raw.githubusercontent.com/una-dinosauria/cmu-mocap/master/data/001/01_01.bvh';new BVHLoader().load(url,result=>{root=result.skeleton.bones[0];root.updateMatrixWorld(true);for(const k in aliases)jointMap[k]=findBone(aliases[k]);mixer=new THREE.AnimationMixer(root);mixer.clipAction(result.clip).play();const found=Object.values(jointMap).filter(Boolean).length;status.textContent='ネット取得成功：CMU BVH / '+result.clip.duration.toFixed(1)+'秒 / 関節対応 '+found+'/'+Object.keys(aliases).length+' / 再生1.5倍';if(found<8)document.querySelector('#error').textContent='関節名の一致が少ないため表示が不完全です';apply()},undefined,e=>{status.textContent='取得に失敗しました';document.querySelector('#error').textContent=String(e?.message||e)});
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'一時停止':'再生'};document.querySelector('#turn').onclick=()=>turning=!turning;document.querySelector('#reset').onclick=()=>{camera.position.set(0,1.4,5);orbit.target.set(0,1,0);orbit.update();group.rotation.y=0};function tick(t){requestAnimationFrame(tick);const dt=Math.min((t-last)/1000,.1);last=t;if(mixer&&playing){mixer.update(dt*1.5);apply()}if(turning)group.rotation.y+=dt*.4;orbit.update();renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
