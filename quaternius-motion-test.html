<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quaternius実機モーション検証</title><style>body{margin:0;background:#111b2b;color:#fff;font:14px system-ui}canvas{display:block}#panel{position:fixed;top:8px;left:8px;right:8px;z-index:2;background:#111b2be8;border-radius:12px;padding:12px;max-height:38vh;overflow:auto}select,button{font:inherit;background:#294560;color:#fff;border:1px solid #7896b3;border-radius:7px;padding:8px;margin:3px}#status{white-space:pre-wrap;color:#ffdd91}#buttons{position:fixed;bottom:12px;left:8px;right:8px;z-index:2;display:flex;flex-wrap:wrap;gap:4px}#buttons button{flex:1}a{color:#9de0ff}</style></head><body><div id="panel"><b>Quaternius GLB 実動作検証 v1</b><div id="status">読み込み中…</div><label>職業系統 <select id="family"></select></label><label>動作 <select id="clip"></select></label><div id="details"></div><small>元GLBの実クリップを直接再生。職業への割当・武器同期・品質合格を保証するものではありません。</small></div><div id="buttons"><button id="play">停止</button><button id="reset">正面</button><button id="ok">この動作は正常</button><button id="ng">問題あり</button><button id="report">結果をコピー</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const status=document.querySelector('#status'),family=document.querySelector('#family'),clip=document.querySelector('#clip'),details=document.querySelector('#details');const results={};let mixer,actions=[],active,model,playing=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0x152238);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,500);camera.position.set(2,2,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,8,5);scene.add(light);const grid=new THREE.GridHelper(10,10,0x667788,0x344456);scene.add(grid);const marker=new THREE.Mesh(new THREE.BoxGeometry(.15,.15,.15),new THREE.MeshBasicMaterial({color:0x00ff88}));marker.position.set(0,.1,0);scene.add(marker);const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);if(mixer&&playing)mixer.update(dt);orbit.update();renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let map;function updateClips(){const familyData=map.families[family.value];clip.replaceChildren();for(const [key,name] of Object.entries(familyData.clips)){const opt=document.createElement('option');opt.value=name;opt.textContent=key+' / '+name;clip.append(opt)}details.textContent='不足動作: '+familyData.missingSpecialties.join('、');selectClip()}
function selectClip(){if(!mixer)return;active?.stop();const name=clip.value;const animation=actions.find(a=>a.name===name);if(!animation){status.textContent='未収録: '+name;return}active=mixer.clipAction(animation);active.reset().play();playing=true;document.querySelector('#play').textContent='停止';status.textContent='実GLB再生: '+name+'（'+animation.duration.toFixed(2)+'秒）\n表示の良否を確認してください'}
family.onchange=updateClips;clip.onchange=selectClip;document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'停止':'再開'};document.querySelector('#reset').onclick=()=>{orbit.reset()};for(const [id,val] of [['ok','pass'],['ng','fail']])document.querySelector('#'+id).onclick=()=>{if(!clip.value)return;results[family.value+':'+clip.value]=val;status.textContent=clip.value+'：'+(val==='pass'?'正常と記録':'問題ありと記録')+'（このページ内のみ）'};document.querySelector('#report').onclick=async()=>{const payload=JSON.stringify({source:map.source,results},null,2);try{await navigator.clipboard.writeText(payload);status.textContent='結果をコピーしました'}catch(e){status.textContent=payload}};
try{const response=await fetch('./motion-quaternius-job-candidates.json',{cache:'no-store'});if(!response.ok)throw Error('候補JSON HTTP '+response.status);map=await response.json();for(const key of Object.keys(map.families)){const option=document.createElement('option');option.value=key;option.textContent=({sword:'剣士',martial:'格闘家',caster:'魔法使い',dance:'踊り子',ranged:'弓使い（専用射撃なし）'})[key]||key;family.append(option)}const loader=new GLTFLoader();const gltf=await loader.loadAsync('./'+map.source+'?v=1');model=gltf.scene;scene.add(model);actions=gltf.animations;mixer=new THREE.AnimationMixer(model);const bounds=new THREE.Box3().setFromObject(model);if(bounds.isEmpty())throw Error('モデルの描画メッシュがありません');const size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());const height=Math.max(size.y,.1);model.position.y-=bounds.min.y;orbit.target.set(center.x,Math.max(height*.5,.3),center.z);camera.position.set(center.x+height*.9,height*.75,center.z+height*1.8);camera.near=Math.max(height*.001,.001);camera.far=Math.max(height*20,100);camera.updateProjectionMatrix();orbit.update();orbit.saveState();updateClips();status.textContent='GLB読込成功：'+actions.length+'クリップ、モデル寸法 '+size.toArray().map(x=>x.toFixed(2)).join(' × ');selectClip()}catch(e){status.textContent='読み込み失敗：'+(e?.message||e)+'\nGitHub Pagesへの反映、WebGL、通信を確認してください';console.error(e)}
</script></body></html>
