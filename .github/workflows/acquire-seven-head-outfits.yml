name: Acquire seven-head outfit candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/acquire-seven-head-outfits.yml'
      - 'tools/acquire-seven-head-outfits.py'
permissions:
  contents: write
concurrency:
  group: acquire-seven-head-outfits
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and validate candidate GLBs
        run: python tools/acquire-seven-head-outfits.py
      - name: Preserve upstream MIT license
        run: |
          curl -fLsS --retry 3 https://raw.githubusercontent.com/holokat/game-assets/main/LICENSE -o assets/characters/seven-head-equipment-candidates/LICENSE.upstream
      - name: Commit candidate assets without activating them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/seven-head-equipment-candidates/
          if ! git diff --cached --quiet; then
            git commit -m "Acquire MIT armor GLB candidates for ten jobs"
            git push
          fi
