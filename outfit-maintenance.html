<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灰銀のレゾナンス | 16衣装メンテナンス</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101925;color:#edf3fb;font:14px system-ui}header{padding:12px 16px;background:#1c3047;display:flex;align-items:center;justify-content:space-between;gap:10px}a{color:#a8d8ff}main{display:grid;grid-template-columns:minmax(270px,340px) 1fr;height:calc(100dvh - 55px)}aside{padding:12px;background:#1a293b;overflow:auto}section{padding:10px 0;border-bottom:1px solid #43546a}h1{font-size:17px;margin:0}h2{font-size:14px;margin:0 0 8px}label{display:block;margin:9px 0 3px}select,input,textarea,button{width:100%;padding:9px;border-radius:7px;background:#2b435e;color:#fff;border:1px solid #6683a2}button{cursor:pointer;margin-top:7px}button:hover{background:#42658a}input[type=checkbox]{width:auto}input[type=range]{padding:0}textarea{min-height:85px}#viewport{position:relative;min-height:300px}canvas{display:block;width:100%;height:100%}#overlay{position:absolute;bottom:10px;left:10px;right:10px;background:#172536d9;padding:8px;border-radius:8px;pointer-events:none;white-space:pre-wrap}small{color:#b7c9da}#jobList{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}#jobList button{margin:0;padding:7px;font-size:12px}#jobList button.active{background:#367a94;border-color:#a6e5ff}#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#file{font-size:12px}@media(max-width:740px){main{display:flex;flex-direction:column;height:calc(100dvh - 55px)}#viewport{order:0;height:54%;min-height:0;flex:none}aside{order:1;height:46%;max-height:none;flex:none}header{min-height:55px}#overlay{font-size:11px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head>
<body><header><h1>16衣装メンテナンス <small>v1.0</small></h1><a href="./motion-external-test.html">外部モーション検証へ</a></header>
<main><aside><section><h2>対象衣装（10職業＋6役職）</h2><select id="jobList" aria-label="職業・役職を選択"></select><label>性別・素体</label><select id="sex"><option value="male">男性</option><option value="female">女性</option></select><label>表示</label><label><input id="showBody" type="checkbox" checked> 人体を表示</label><label><input id="showOutfit" type="checkbox" checked> 衣装を表示</label><label><input id="wire" type="checkbox"> ワイヤーフレーム</label></section>
<section><h2>衣装GLBを読み込む</h2><small>GitHub Actions「body-first-all-jobs-prototypes」のZIPを展開し、該当するGLBを選択してください。未公開の生成物を表示済みとは扱いません。</small><label>衣装GLB（ローカル）</label><input id="file" type="file" accept=".glb,model/gltf-binary"><button id="autoLoad">公開GLBを再検索</button><div id="status">素体を読み込み中</div></section>
<section><h2>フィット調整（プレビューのみ）</h2><label>衣装スケール <output id="scaleValue">1.000</output></label><input id="scale" type="range" min="0.8" max="1.2" step="0.005" value="1"><label>上下位置 <output id="heightValue">0.000</output></label><input id="height" type="range" min="-0.3" max="0.3" step="0.005" value="0"><label>前後位置 <output id="depthValue">0.000</output></label><input id="depth" type="range" min="-0.3" max="0.3" step="0.005" value="0"><button id="reset">調整をリセット</button><small>この画面のスケール・位置調整は検証用です。骨ウェイトやGLB自体は変更しません。</small></section>
<section><h2>検証記録</h2><label>判定</label><select id="verdict"><option value="unverified">未検証</option><option value="pass">正常</option><option value="fail">不具合あり</option></select><label>メモ</label><textarea id="notes" placeholder="肩の浮き、首への干渉、腰の貫通など"></textarea><button id="save">この衣装の記録を保存</button><button id="export">16件の検証結果をJSON出力</button><button id="shot">画面をPNG保存</button><small>検証記録はこのページ内の一時データです。JSONを保存して管理してください。</small></section></aside>
<div id="viewport"><div id="overlay">ドラッグで回転、ホイール・ピンチで拡大</div></div></main>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const jobs=[['job01','剣士'],['job02','格闘家'],['job03','魔法使い'],['job04','弓使い'],['job05','盾戦士'],['job06','盗賊'],['job07','忍者'],['job08','農民・職人'],['job09','僧侶'],['job10','召喚士'],['king','王様'],['minister','大臣'],['servant','召使い'],['princess','姫'],['prince','王子'],['queen','女王']];
const $=id=>document.getElementById(id);const viewport=$('viewport');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));viewport.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x142336);scene.add(new THREE.HemisphereLight(0xffffff,0x607c99,2.4));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(3,7,5);scene.add(sun);scene.add(new THREE.GridHelper(10,20,0x60809c,0x31455b));
const camera=new THREE.PerspectiveCamera(43,1,.01,200);camera.position.set(2.8,2,4.6);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.update();const loader=new GLTFLoader();
let job=jobs[0][0],body=null,outfit=null,records={},loadToken=0;
function status(t){$('status').textContent=t}function clear(obj){if(obj){scene.remove(obj)}}function apply(){if(body)body.visible=$('showBody').checked;if(outfit){outfit.visible=$('showOutfit').checked;outfit.scale.setScalar(+$('scale').value);outfit.position.y=+$('height').value;outfit.position.z=+$('depth').value;outfit.traverse(o=>{if(o.isMesh){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if(m)m.wireframe=$('wire').checked})}})}for(const id of ['scale','height','depth'])$(id+'Value').textContent=(+$(id).value).toFixed(3)}
function fitCamera(obj){const box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())return;const center=box.getCenter(new THREE.Vector3());const size=box.getSize(new THREE.Vector3());const extent=Math.max(size.y,1);controls.target.copy(center);const aspect=Math.max(viewport.clientWidth,1)/Math.max(viewport.clientHeight,1);const vfov=THREE.MathUtils.degToRad(camera.fov);const hfov=2*Math.atan(Math.tan(vfov/2)*aspect);const distance=extent*.65/Math.tan(Math.min(vfov,hfov)/2);camera.position.copy(center).add(new THREE.Vector3(distance*.25,distance*.10,distance));camera.near=.01;camera.far=200;camera.updateProjectionMatrix();controls.update()}
async function loadBody(){const token=++loadToken;clear(body);body=null;const sex=$('sex').value;const url='./assets/characters/quaternius-base/Superhero_'+(sex==='female'?'Female':'Male')+'_FullBody.gltf';status('素体を読み込み中…');try{const gltf=await loader.loadAsync(url);if(token!==loadToken)return;body=gltf.scene;scene.add(body);fitCamera(body);apply();status('素体読込成功。衣装は別途読み込みます。')}catch(e){status('素体読込失敗: '+e.message)}}
async function loadOutfit(url){clear(outfit);outfit=null;status('衣装を読み込み中…');try{const gltf=await loader.loadAsync(url);outfit=gltf.scene;scene.add(outfit);apply();status('衣装GLB読込成功。骨追従・干渉は画面で確認してください。')}catch(e){status('衣装GLBが見つからないか読み込めません: '+e.message)}}
async function autoLoad(){await loadOutfit('./assets/characters/body-first/'+job+'.glb')}
function selectJob(id){job=id;$('jobList').value=id;$('verdict').value=records[id]?.verdict||'unverified';$('notes').value=records[id]?.notes||'';clear(outfit);outfit=null;status('選択: '+jobs.find(x=>x[0]===id)[1]+'。公開GLBを確認します。');autoLoad()}
for(const [id,name] of jobs){const option=document.createElement('option');option.value=id;option.textContent=name;$('jobList').append(option)}$('jobList').onchange=()=>selectJob($('jobList').value);
$('sex').onchange=loadBody;$('autoLoad').onclick=autoLoad;
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;const url=URL.createObjectURL(f);loadOutfit(url).finally(()=>URL.revokeObjectURL(url))};
for(const id of ['showBody','showOutfit','wire','scale','height','depth'])$(id).addEventListener('input',apply);
$('reset').onclick=()=>{for(const id of ['scale','height','depth'])$(id).value=id==='scale'?'1':'0';apply()};
$('save').onclick=()=>{records[job]={name:jobs.find(x=>x[0]===job)[1],sex:$('sex').value,verdict:$('verdict').value,notes:$('notes').value,scale:+$('scale').value,height:+$('height').value,depth:+$('depth').value};status('検証記録を一時保存しました。JSON出力してください。')};
function download(blob,name){const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('export').onclick=()=>download(new Blob([JSON.stringify({schema:'outfit-maintenance-v1',records},null,2)],{type:'application/json'}),'outfit-maintenance.json');
$('shot').onclick=()=>renderer.domElement.toBlob(b=>{if(b)download(b,'outfit-'+job+'.png')});
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix()}new ResizeObserver(()=>{resize();if(body)fitCamera(body)}).observe(viewport);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}resize();animate();loadBody();selectJob(job);
</script></body></html>
