<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰銀｜R18 顔面精密工房</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>body{background:#141b25;color:#edf3f7;font:15px system-ui;margin:0}main{max-width:900px;margin:auto;padding:16px}h1{font-size:22px}section{border:1px solid #415268;border-radius:12px;padding:12px;margin:12px 0;background:#1d2836}model-viewer{width:100%;height:min(58vh,550px);background:#232730}button,select,input{padding:10px;max-width:100%;border-radius:8px;background:#304459;color:#fff;border:1px solid #71849a}button{margin:3px;cursor:pointer}a{color:#9bd8ff}small{color:#b3c2d2}</style></head><body><main><small>灰銀のレゾナンス / ゲーム本体から独立</small><h1>女性 v121 v28 · R18 顔面精密工房</h1><section><p id="status" role="status">R18公開ファイルを確認しています。</p><model-viewer id="viewer" camera-controls touch-action="pan-y" camera-orbit="0deg 90deg auto" shadow-intensity="0.5" alt="R18女性顔モデル"></model-viewer><div id="angles"></div><p>表情 <select id="animations" disabled><option value="">通常</option></select></p><p>GLBを読み込む <input id="input" type="file" accept=".glb,model/gltf-binary"></p><a id="save" hidden download="female_v121_v28_R18.glb">表示中のGLBを保存</a></section><section><h2>生成工程</h2><p>R14：目・鼻・口 / R16：耳・首 / R17：顔輪郭 / R18：顎・表情 / 再読込検証</p><p>GitHub Pagesは閲覧専用です。実メッシュの一括生成は配布されたローカル生成工房で実行し、生成されたGLBをこの画面で確認してください。</p><small>公開モデルが未登録の場合、手元のR18 GLBを選択できます。旧モデルへの自動切替は行いません。</small></section><a href="./">ゲームトップへ</a></main><script>
const v=document.getElementById('viewer'),s=document.getElementById('status'),a=document.getElementById('animations'),save=document.getElementById('save');let obj=null,source=null;
function load(url){source=url;v.setAttribute('src',url);s.textContent='GLB読込中';a.disabled=true;save.hidden=true}
v.addEventListener('load',()=>{s.textContent='GLB読込完了';a.replaceChildren(new Option('通常',''),...v.availableAnimations.map(x=>new Option(x,x)));a.disabled=false;save.href=source;save.hidden=false});
v.addEventListener('error',()=>{s.textContent='GLBの読み込みに失敗しました。ファイルを選択してください。';save.hidden=true});
a.onchange=()=>{if(a.value){v.animationName=a.value;v.play()}else{v.pause();v.currentTime=0;v.animationName=undefined;v.removeAttribute('src');requestAnimationFrame(()=>v.src=source)}};
for(const [angle,name] of [[0,'正面'],[-30,'30°'],[-45,'45°'],[-60,'60°'],[-90,'側面'],[90,'反対側']]){let b=document.createElement('button');b.textContent=name;b.onclick=()=>v.cameraOrbit=angle+'deg 90deg auto';document.getElementById('angles').append(b)}
document.getElementById('input').onchange=async e=>{const f=e.target.files[0];if(!f)return;const h=new DataView(await f.slice(0,12).arrayBuffer());if(h.byteLength!==12||h.getUint32(0,true)!==0x46546c67||h.getUint32(4,true)!==2||h.getUint32(8,true)!==f.size){s.textContent='有効なGLB v2ではありません';return}if(obj)URL.revokeObjectURL(obj);obj=URL.createObjectURL(f);load(obj);save.download=f.name};
(async()=>{try{let gz=await fetch('female_v121_v28_R18.glb.gz',{cache:'no-cache'});if(gz.ok&&!gz.headers.get('content-type')?.includes('text/html')&&typeof DecompressionStream==='function'){let blob=await new Response(gz.body.pipeThrough(new DecompressionStream('gzip'))).blob();if(!obj){obj=URL.createObjectURL(new Blob([blob],{type:'model/gltf-binary'}));load(obj)}return}let path='https://raw.githubusercontent.com/yamadayoshitaka/hai-gin-rpg/main/assets/face-r18/female_v121_v28_R18.glb';let r=await fetch(path,{method:'HEAD',cache:'no-cache'});if(!r.ok)throw Error();if(!obj)load(path)}catch{if(!obj)s.textContent='R18公開GLBは未登録です。手元のGLBを選択してください。'}})();
customElements.whenDefined('model-viewer').then(()=>{});</script></body></html>
