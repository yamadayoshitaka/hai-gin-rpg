name: Objective turn phone-map and end-turn item regression
on:
  push:
    branches: [main]
    paths:
      - 'src/battle-objective-turns.js'
      - 'src/battle-objective-turn-panel.js'
      - 'src/battle-objective-turn-panel.css'
      - 'tactics-wireframe.html'
      - 'qa/turn-map-paging-regression.test.mjs'
      - '.github/workflows/turn-map-enditem-regression.yml'
  pull_request:
    paths:
      - 'src/battle-objective-turns.js'
      - 'src/battle-objective-turn-panel.js'
      - 'src/battle-objective-turn-panel.css'
      - 'tactics-wireframe.html'
      - 'qa/turn-map-paging-regression.test.mjs'
      - '.github/workflows/turn-map-enditem-regression.yml'
permissions:
  contents: read
jobs:
  turn-mobile-map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of turn modules
        run: |
          node --check src/battle-objective-turns.js
          node --check src/battle-objective-turn-panel.js
      - name: Regression for tap, paging, report items and HUD isolation
        run: node --test qa/turn-map-paging-regression.test.mjs
