<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body data-qa-ready="false"><script type="module">
import * as THREE from 'three';
import {OBJECT_CATALOG,createCatalogObject} from './src/object-catalog.js?v=world60-physical-20261117';
const args=new URLSearchParams(location.search);
const asset=args.get('object')||'cottage_barrel_001';
const scale=Number(args.get('roughnessScale')||1);
if(!OBJECT_CATALOG[asset]||!(scale>=0.75&&scale<=1.15))throw Error('Invalid quality preview input');
try{
 const scene=new THREE.Scene();scene.background=new THREE.Color(0xabb8bc);
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
 renderer.setPixelRatio(1);renderer.setSize(1024,576,false);
 renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.body.appendChild(renderer.domElement);
 const model=createCatalogObject(asset);
 let materials=0;
 model.traverse(node=>{if(!node.isMesh)return;
  const apply=m=>{if(m&&Number.isFinite(m.roughness)&&m.roughness>=0){m.roughness=Math.min(1,Math.max(.05,m.roughness*scale));m.needsUpdate=true;materials++}};
  if(Array.isArray(node.material))node.material.forEach(apply);else apply(node.material);
 });
 scene.add(model);
 const bbox=new THREE.Box3().setFromObject(model);
 if(bbox.isEmpty())throw Error('Object has no geometry');
 const center=bbox.getCenter(new THREE.Vector3()),size=bbox.getSize(new THREE.Vector3());
 if(!Number.isFinite(size.length())||size.length()<=.001)throw Error('Zero/NaN model');
 const radius=Math.max(size.length()*.7,2),cam=new THREE.PerspectiveCamera(35,1024/576,.1,Math.max(500,radius*30));
 cam.position.copy(center).add(new THREE.Vector3(radius*.95,radius*.65,radius*1.32));cam.lookAt(center);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(Math.max(80,radius*12),Math.max(80,radius*12)),
  new THREE.MeshStandardMaterial({color:0x8d9791,roughness:1}));
 floor.rotation.x=-Math.PI/2;floor.position.y=bbox.min.y-.07;floor.receiveShadow=true;scene.add(floor);
 const hemi=new THREE.HemisphereLight(0xe9f2ff,0x52534c,2);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xffe7bf,3);
 sun.position.copy(center).add(new THREE.Vector3(radius*.7,radius*2,radius*.5));sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-radius*2;
 sun.shadow.camera.right=radius*2;sun.shadow.camera.top=radius*2;sun.shadow.camera.bottom=-radius*2;
 scene.add(sun);
 await new Promise(resolve=>requestAnimationFrame(resolve));
 renderer.render(scene,cam);await new Promise(resolve=>requestAnimationFrame(resolve));renderer.render(scene,cam);
 document.body.dataset.qaReady='true';document.body.dataset.asset=asset;
 document.body.dataset.materials=String(materials);document.body.dataset.geometry=String(size.length());
 document.body.dataset.drawCalls=String(renderer.info.render.calls);
 document.body.dataset.triangles=String(renderer.info.render.triangles);
}catch(error){document.body.dataset.qaReady='error';document.body.dataset.qaError=error.message;throw error}
</script></body></html>
