<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>灰銀のレゾナンス｜ヘアスタジオのキャッシュ更新</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#111e2e;color:#ebf3f9}
body{max-width:560px;padding:28px 18px;margin:auto}
h1{font-size:22px}p{color:#c1d0e2}
#state{background:#1b3046;padding:16px;border-radius:10px;white-space:pre-wrap}
a{color:#afd8ff}button{font:inherit;background:#287e8a;border:0;color:white;padding:12px 16px;border-radius:9px;cursor:pointer}
</style>
</head>
<body>
<h1>ヘアスタジオのキャッシュ更新</h1>
<p>このゲームの古いService Workerと保存済みページを消し、最新版のURLで読み直します。他のサイトやブラウザ履歴は消しません。</p>
<div id="state" role="status" aria-live="polite">確認中…</div>
<p><a id="continue" href="./hair-asset-studio.html?v=5">ヘアスタジオを開く</a></p>
<script>
'use strict';
(async function clearGameCache() {
 const state=document.getElementById('state');
 const link=document.getElementById('continue');
 const scope=new URL('./',location.href);
 const target=new URL('hair-asset-studio.html',scope);
 target.searchParams.set('v','5');
 target.searchParams.set('cache_reset',String(Date.now()));
 let removedWorkers=0,removedEntries=0,failures=0;
 state.textContent='ゲーム専用のService Workerとキャッシュを確認しています…';
 try{
  if('serviceWorker' in navigator){
   const registrations=await navigator.serviceWorker.getRegistrations();
   for(const registration of registrations){
    if(registration.scope===scope.href||registration.scope.startsWith(scope.href)){
     try{if(await registration.unregister())removedWorkers++;}
     catch(e){failures++;console.warn('Service Worker解除失敗',e);}
    }
   }
  }
 }catch(e){failures++;console.warn('Service Worker列挙不可',e);}
 try{
  if('caches' in window){
   const names=await caches.keys();
   for(const name of names){
    try{
     const cache=await caches.open(name);
     const entries=await cache.keys();
     let deleted=0;
     for(const request of entries){
      // Never touch cached entries belonging to other GitHub Pages projects.
      if(new URL(request.url).href.startsWith(scope.href)){
       if(await cache.delete(request))deleted++;
      }
     }
     removedEntries+=deleted;
     if(entries.length===deleted&&deleted>0)await caches.delete(name);
     else if(entries.length===0&&name.includes('hai-gin-rpg'))
      await caches.delete(name);
    }catch(e){failures++;console.warn('対象キャッシュ削除失敗',e);}
   }
  }
 }catch(e){failures++;console.warn('CacheStorage利用不可',e);}
 try{
  const releaseUrl=new URL('release.json',scope);
  releaseUrl.searchParams.set('refresh',String(Date.now()));
  const response=await fetch(releaseUrl,{cache:'no-store',credentials:'same-origin'});
  if(response.ok){
   const release=await response.json();
   if(typeof release.sha==='string'&&/^[0-9a-f]{40}$/.test(release.sha))
    target.searchParams.set('release',release.sha.slice(0,12));
  }
 }catch(e){console.warn('リリース番号取得不可',e);}
 state.textContent='対象ゲームの保存データを更新しました。\n'
  +'Service Worker解除：'+removedWorkers+'件\n'
  +'サイト内キャッシュ削除：'+removedEntries+'件\n'
  +(failures?'一部操作は端末の制限で未完了：'+failures+'件\n':'')
  +'新しいURLでヘアスタジオを開きます。';
 link.href=target.href;
 setTimeout(()=>location.replace(target.href),900);
})();
</script>
</body></html>
