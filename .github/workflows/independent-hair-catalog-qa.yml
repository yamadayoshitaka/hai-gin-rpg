name: Independent hair catalog QA
on:
  pull_request:
    paths:
      - 'src/independent-hair-*.js'
      - 'hair-asset-studio.html'
      - 'hair-cache-reset.html'
      - 'qa/hair-cache-reset.test.mjs'
      - 'scripts/prepare-pages-site.py'
      - 'src/v121-anatomical-hair-cap.js'
      - 'src/hair-island-cleanup-v1.js'
      - 'qa/hair-island-cleanup.test.mjs'
      - 'qa/real-hair-glb-cleanup.test.mjs'
      - 'qa/hair-crown-underlay-v121.test.mjs'
      - 'src/female-hair-01-resculpt-v2.js'
      - 'qa/female-hair-01-resculpt-v2.test.mjs'
      - 'src/female-hair-01-native-v4.js'
      - 'qa/female-hair-01-native-v4.test.mjs'
      - 'src/female-hair-01-solid-v5.js'
      - 'src/head-derived-hair-sculpt-v6.js'
      - 'src/head-derived-hair-sculpt-v7.js'
      - 'src/head-derived-hair-sculpt-v8.js'
      - 'src/head-derived-hair-sculpt-v9.js'
      - 'src/head-derived-hair-reference-v10.js'
      - 'src/head-derived-hair-modular-v11.js'
      - 'qa/head-derived-hair-modular-v11.test.mjs'
      - 'qa/head-derived-hair-reference-v10.test.mjs'
      - 'qa/head-derived-hair-sculpt-v9.test.mjs'
      - 'qa/head-derived-hair-sculpt-v8.test.mjs'
      - 'qa/head-derived-hair-sculpt-v7.test.mjs'
      - 'qa/head-derived-hair-sculpt-v6.test.mjs'
      - 'qa/female-hair-01-solid-v5.test.mjs'
      - 'data/v121-adjusted-head-audit.json'
      - 'qa/independent-hair-catalog-motion.test.mjs'
      - '.github/workflows/independent-hair-catalog-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/independent-hair-*.js'
      - 'hair-asset-studio.html'
      - 'hair-cache-reset.html'
      - 'qa/hair-cache-reset.test.mjs'
      - 'scripts/prepare-pages-site.py'
      - 'src/v121-anatomical-hair-cap.js'
      - 'qa/hair-crown-underlay-v121.test.mjs'
      - 'src/female-hair-01-resculpt-v2.js'
      - 'qa/female-hair-01-resculpt-v2.test.mjs'
      - 'src/female-hair-01-native-v4.js'
      - 'qa/female-hair-01-native-v4.test.mjs'
      - 'src/female-hair-01-solid-v5.js'
      - 'src/head-derived-hair-sculpt-v6.js'
      - 'src/head-derived-hair-sculpt-v7.js'
      - 'src/head-derived-hair-sculpt-v8.js'
      - 'src/head-derived-hair-sculpt-v9.js'
      - 'src/head-derived-hair-reference-v10.js'
      - 'src/head-derived-hair-modular-v11.js'
      - 'qa/head-derived-hair-modular-v11.test.mjs'
      - 'qa/head-derived-hair-reference-v10.test.mjs'
      - 'qa/head-derived-hair-sculpt-v9.test.mjs'
      - 'qa/head-derived-hair-sculpt-v8.test.mjs'
      - 'qa/head-derived-hair-sculpt-v7.test.mjs'
      - 'qa/head-derived-hair-sculpt-v6.test.mjs'
      - 'qa/female-hair-01-solid-v5.test.mjs'
      - 'qa/independent-hair-catalog-motion.test.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modules and isolated source assets
        run: |
          node --check src/independent-hair-library-v1.js
          node --check src/independent-hair-mesh-v1.js
          node --check src/v121-anatomical-hair-cap.js
          node --check src/female-hair-01-resculpt-v2.js
          node --check src/hair-island-cleanup-v1.js
          node --test qa/hair-island-cleanup.test.mjs
          node --test qa/real-hair-glb-cleanup.test.mjs
          node --test qa/hair-crown-underlay-v121.test.mjs
          node --test qa/female-hair-01-resculpt-v2.test.mjs
          node --check src/female-hair-01-native-v4.js
          node --test qa/female-hair-01-native-v4.test.mjs
          node --check src/female-hair-01-solid-v5.js
          node --test qa/female-hair-01-solid-v5.test.mjs
          node --check src/head-derived-hair-sculpt-v6.js
          node --test qa/head-derived-hair-sculpt-v6.test.mjs
          node --check src/head-derived-hair-sculpt-v7.js
          node --test qa/head-derived-hair-sculpt-v7.test.mjs
          node --check src/head-derived-hair-sculpt-v8.js
          node --test qa/head-derived-hair-sculpt-v8.test.mjs
          node --check src/head-derived-hair-sculpt-v9.js
          node --test qa/head-derived-hair-sculpt-v9.test.mjs
          node --check src/head-derived-hair-reference-v10.js
          node --test qa/head-derived-hair-reference-v10.test.mjs
          node --check src/head-derived-hair-modular-v11.js
          node --test qa/head-derived-hair-modular-v11.test.mjs
          node --test qa/independent-hair-catalog-motion.test.mjs
          node --test qa/hair-cache-reset.test.mjs
