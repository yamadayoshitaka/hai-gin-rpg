name: Install CC0 Creature Voices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/install-cc0-creature-voices.mjs'
      - '.github/workflows/install-cc0-creature-voices.yml'
permissions:
  contents: write
concurrency:
  group: free-creature-voices
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'yamadayoshitaka/hai-gin-rpg'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified CC0 creature vocals
        run: node scripts/install-cc0-creature-voices.mjs
      - name: Commit reusable summon voices and licenses
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/creatures/cc0/
          if git diff --cached --quiet; then echo 'CC0 sounds up to date'; exit 0; fi
          git commit -m 'Add freely reusable CC0 summon creature voices'
          git pull --rebase origin main
          git push origin HEAD:main
