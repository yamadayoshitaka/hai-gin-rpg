<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>R53 男女表情検証工房 v2</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<style>body{margin:0;background:#151a23;color:#e7ecf3;font:15px system-ui}main{max-width:900px;margin:auto;padding:12px}h1{font-size:1.35rem}h2{font-size:1.1rem}section{padding:12px;border:1px solid #455164;border-radius:10px;margin:12px 0}button,input{font:inherit;background:#28384b;color:#fff;border:1px solid #596c80;border-radius:6px;padding:8px;margin:3px}button[aria-pressed=true]{background:#336b81}button:disabled{opacity:.4}a{color:#9bd0ff}#stage{height:min(52vh,480px);min-height:240px;background:#303946;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}#status{min-height:2em}#notice{border-left:3px solid #e0b272;padding-left:10px}small{color:#b9c4d0}</style></head>
<body><main><h1>R53 男女表情検証工房</h1><p id="notice">試作確認専用。顔形状は固定GLBを選択し、表情だけを変更します。男性は新しい11モーフ対応版、女性はR5完全版ZIPを登録すると、両方の確認工房で自動復元されます。外観・全身適合は未承認です。</p>
<section><h2>モデル選択</h2><button id="male">男性</button><button id="female">女性</button><div id="local" hidden><label>女性GLB（複数選択可）<input id="files" type="file" multiple accept=".glb"></label><small>個別GLBの読込は任意です。R5は保存済みならそのまま利用できます。目元の修正版はR6 ZIPを選択してください。端末外へは送信しません。</small></div><div id="models"></div><p id="status" role="status">初期化中…</p><div id="stage"></div><div id="views"><button data-angle="0">正面</button><button data-angle="90">側面</button><button data-angle="45">斜め</button></div></section>
<section><h2>表情</h2><div id="expressions"></div><div id="strengths"></div><p id="motionStatus"></p><small>形状スライダーはありません。表情は実GLBのモーフを適用します。</small></section>
<p><a href="./r53-blender-review.html?v=4">顔比較工房へ戻る</a> ｜ <a href="https://github.com/yamadayoshitaka/hai-gin-rpg/actions/runs/45617028110">男性の出力GLB検査結果</a></p>
<script type="module">
import {bindFemalePack} from './src/r53-female-pack.mjs?v=R6';
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),status=$('status'),stage=$('stage'),folder='./preview/r53-expression/';
const expressions=[['通常',{}],['開口',{jawOpen:1}],['あ',{viseme_A:1}],['い',{viseme_I:1}],['う',{viseme_U:1}],['え',{viseme_E:1}],['お',{viseme_O:1}],['笑顔',{smile:1}],['左瞬き',{blink_L:1}],['右瞬き',{blink_R:1}],['両目瞬き',{blink_L:1,blink_R:1}],['驚き眉',{browRaise:1}],['怒り眉',{browFrown:1}],['笑顔＋瞬き',{smile:.65,blink_L:1,blink_R:1}],['走行時',{jawOpen:.5,browFrown:.35}],['手振り時',{smile:.7,browRaise:.35}]];
const expected=['jawOpen','viseme_A','viseme_I','viseme_U','viseme_E','viseme_O','smile','blink_L','blink_R','browRaise','browFrown'];
const files=new Map(),male=new Map();let sex='male',current='',request=0,root=null,morphMeshes=[],expr=0,strength=1,center=new T.Vector3(),distance=1;
const scene=new T.Scene();scene.background=new T.Color(0x303946);const camera=new T.PerspectiveCamera(32,1,.001,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;stage.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x55515a,2));let l=new T.DirectionalLight(0xffffff,2.2);l.position.set(2,3,5);scene.add(l);l=new T.DirectionalLight(0xffffff,1);l.position.set(-3,1,2);scene.add(l);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;const resize=()=>{renderer.setSize(stage.clientWidth,stage.clientHeight,false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()};new ResizeObserver(resize).observe(stage);resize();renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera)});
function dispose(o){if(!o)return;const mats=new Set(),geos=new Set(),tex=new Set();o.traverse(n=>{if(n.geometry)geos.add(n.geometry);for(const m of [n.material].flat())if(m)mats.add(m)});for(const m of mats)for(const v of Object.values(m))if(v?.isTexture)tex.add(v);for(const t of tex)t.dispose();for(const g of geos)g.dispose();for(const m of mats)m.dispose()}
function clear(){request++;if(root){scene.remove(root);dispose(root)}root=null;morphMeshes=[];current='';expr=0;apply();renderChoices()}
function renderChoices(){const grid=$('models');grid.replaceChildren();for(let i=1;i<=10;i++){const id=sex+'_face_'+String(i).padStart(2,'0'),b=document.createElement('button');b.textContent=(sex==='male'?'男':'女')+id.slice(-2);b.disabled=!(sex==='male'?male.has(id):files.has(id));b.setAttribute('aria-pressed',String(current===id));b.onclick=()=>load(id);grid.append(b)}}
function apply(){let missing=new Set(Object.keys(expressions[expr][1]));for(const mesh of morphMeshes){mesh.morphTargetInfluences.fill(0);for(const [name,v]of Object.entries(expressions[expr][1])){const i=mesh.morphTargetDictionary[name];if(i!==undefined){mesh.morphTargetInfluences[i]=v*strength;missing.delete(name)}}}$('motionStatus').textContent=root?(expressions[expr][0]+' '+Math.round(strength*100)+'%'+(missing.size?' / 未対応: '+[...missing].join(', '):'')):'モデル未読込';for(const [i,b]of [...$('expressions').children].entries()){b.disabled=!root;b.setAttribute('aria-pressed',String(i===expr))}for(const b of $('strengths').children){b.disabled=!root;b.setAttribute('aria-pressed',String(+b.dataset.w===strength))}}
function view(angle){const r=angle*Math.PI/180;orbit.target.copy(center);camera.position.copy(center).add(new T.Vector3(Math.sin(r)*distance,0,Math.cos(r)*distance));orbit.update()}
function validate(b){const h=new DataView(b);if(b.byteLength<20||h.getUint32(0,true)!==0x46546c67||h.getUint32(4,true)!==2||h.getUint32(8,true)!==b.byteLength)throw Error('GLB不正')}
async function load(id){clear();const n=request;current=id;renderChoices();status.textContent=id+' 検証・読み込み中…';let parsed;try{let b;if(sex==='male'){const r=await fetch(folder+id+'.glb');if(!r.ok)throw Error('HTTP '+r.status);b=await r.arrayBuffer();const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');if(digest!==male.get(id).sha256)throw Error('SHA256不一致')}else b=await files.get(id).arrayBuffer();if(n!==request)return;validate(b);parsed=await new GLTFLoader().parseAsync(b,'');if(n!==request){dispose(parsed.scene);return}let names=new Set(),meshes=[];parsed.scene.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary&&o.morphTargetInfluences){meshes.push(o);Object.keys(o.morphTargetDictionary).forEach(k=>names.add(k))}});if(!expected.every(k=>names.has(k)))throw Error('11種類の表情モーフが揃っていません');root=parsed.scene;morphMeshes=meshes;scene.add(root);root.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(root,true);bounds.getCenter(center);distance=Math.max(bounds.getSize(new T.Vector3()).length(),.01)*2.1;orbit.minDistance=distance*.15;orbit.maxDistance=distance*4;view(0);apply();status.textContent=id+' 読込完了・11種類のモーフを確認（試作）'}catch(e){if(parsed?.scene&&parsed.scene!==root)dispose(parsed.scene);if(n===request){clear();status.textContent='読込失敗：'+e.message}}}
function setSex(s){clear();sex=s;$('male').setAttribute('aria-pressed',String(s==='male'));$('female').setAttribute('aria-pressed',String(s==='female'));$('local').hidden=s!=='female';renderChoices();status.textContent=s==='male'?(male.size?'男性10体から選択':'男性データ未配信'):(files.size?'女性 '+files.size+'/10体から選択':'女性R6完全版ZIPを選択')}
$('male').onclick=()=>setSex('male');$('female').onclick=()=>setSex('female');$('files').onchange=async e=>{for(const f of e.target.files){const id=f.name.replace(/\.glb$/i,'');if(!/^female_face_(0[1-9]|10)$/.test(id))continue;try{const h=new DataView(await f.slice(0,20).arrayBuffer());if(h.byteLength===20&&h.getUint32(0,true)===0x46546c67&&h.getUint32(8,true)===f.size)files.set(id,f)}catch{}}renderChoices();status.textContent='女性 '+files.size+'/10体を選択可能'};
for(const [i,[label]]of expressions.entries()){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{expr=i;apply()};$('expressions').append(b)}for(const w of [.25,.5,.75,1]){const b=document.createElement('button');b.textContent=Math.round(w*100)+'%';b.dataset.w=w;b.onclick=()=>{strength=w;apply()};$('strengths').append(b)}for(const b of $('views').children)b.onclick=()=>{if(root)view(+b.dataset.angle)};
bindFemalePack($('local'),files,()=>{if(sex==='female'){clear();status.textContent=files.size?'女性 '+files.size+'/10体から選択':'女性R6完全版ZIPを選択'}});
setSex('male');try{const r=await fetch(folder+'male-motion-audit.json',{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);const doc=await r.json();if(doc.faces?.length!==10)throw Error('男性10体が揃っていません');for(const f of doc.faces){if(!/^male_face_(0[1-9]|10)$/.test(f.id)||f.sourceSex!=='male'||f.visualApproved!==false||!/^[0-9a-f]{64}$/.test(f.sha256))throw Error('試作カタログ不正');male.set(f.id,f)}if(male.size!==10)throw Error('重複');if(sex==='male'){renderChoices();status.textContent='男性10体から選択してください'}}catch(e){male.clear();if(sex==='male'){renderChoices();status.textContent='男性データ未配信：'+e.message}}
</script></main></body></html>
