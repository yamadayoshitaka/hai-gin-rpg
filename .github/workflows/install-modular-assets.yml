name: Install Quaternius modular character parts (CC0)
on:
  push:
    paths:
      - '.github/workflows/install-modular-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-modular-visual-assets
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published CC0 modular outfits and textures
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/OpenAgentsInc/openagents.git /tmp/quaternius-asset-source
          git -C /tmp/quaternius-asset-source sparse-checkout set assets/verse/characters/quaternius/parts assets/verse/characters/quaternius/textures
          mkdir -p assets/characters/quaternius-modular
          cp -R /tmp/quaternius-asset-source/assets/verse/characters/quaternius/parts assets/characters/quaternius-modular/
          cp -R /tmp/quaternius-asset-source/assets/verse/characters/quaternius/textures assets/characters/quaternius-modular/
          test -s assets/characters/quaternius-modular/parts/Male_Ranger_Acc_Pauldron.gltf
          test -s assets/characters/quaternius-modular/parts/Male_Ranger_Acc_Pauldron.bin
          test -s assets/characters/quaternius-modular/parts/Female_Ranger_Head_Hood.gltf
          find assets/characters/quaternius-modular/parts -name '*.gltf' | wc -l
      - name: Commit runtime assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/quaternius-modular
          if ! git diff --cached --quiet; then
            git commit -m "Install Quaternius modular character parts and textures (CC0)"
            git push
          fi
