    /* Small bottom inspector, away from the model's face and wings. */
    #controlsDrawer .extraControls{
      position:fixed;right:10px;left:auto;top:auto;
      bottom:calc(72px + env(safe-area-inset-bottom));display:grid;
      gap:9px;padding:11px;width:min(365px,calc(100vw - 20px));
      max-height:min(52dvh,470px);overflow-y:auto;overflow-x:hidden;
      overscroll-behavior:contain;background:#0f1d2cf7;
      border:1px solid #728c9f;border-radius:14px;
      box-shadow:0 14px 36px #000b
    }
    #controlsDrawer:not([open]) .extraControls{display:none}
    .inspectorHeading{display:flex;align-items:center;justify-content:space-between;
      gap:10px;font-size:14px;color:#ead5a5}
    #dismissControls{min-width:0;width:auto;padding:6px 11px;font-size:12px}
    .inspectorGroup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      gap:7px;align-items:center;padding:9px;background:#172d40b9;
      border:1px solid #4e6a7e;border-radius:9px}
    .inspectorGroup strong{grid-column:1/-1;color:#b7d9e5;font-size:12px}
    .inspectorGroup button{min-width:0;width:100%;padding:8px 5px;

    #info{padding:0;overflow-y:auto;max-height:55dvh}

    }

      font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap

      header{
        top:8px;left:8px;right:8px;display:flex;flex-wrap:nowrap;

      }

      }

        position:fixed;left:8px;right:8px;top:auto;
        bottom:calc(71px + env(safe-area-inset-bottom));width:auto;
        max-height:min(49dvh,430px);gap:7px;padding:10px
      }

      .inspectorGroup button{font-size:12px}
      #info{bottom:72px;left:8px;right:8px;max-width:none;max-height:40dvh}

    }

<body>
  <header id="galleryHeader">
    <div class="galleryHeading"><h1>召喚獣57種・軍馬 3D鑑賞 v4.6.93</h1><small>森の精霊弓士・光翼の守護天使 / CC0 Quaternius人体の顔・弓・羽毛の翼・回復・蘇生</small></div>
    <label for="type" class="speciesPicker"><span class="typeCaption">種類</span><select id="type">

            <input id="personalSummonGlb" type="file" accept=".glb,model/gltf-binary"></label>

        <div class="inspectorGroup">
          <strong>関連画面</strong>

          <a href="./motion-external-test.html">人間の動作</a>
          <a href="./tactics-wireframe.html" class="inspectorWide">戦闘画面</a>

    </details>
  </header>

  <details id="info">
    <summary aria-label="召喚獣の詳細を表示・非表示"><strong id="species">森の精霊弓士</strong>
      <span class="infoHint hintOpen">詳細を見る ▴</span>
      <span class="infoHint hintClose">説明を閉じる ▾</span></summary>
    <div id="infoBody">
      <div id="desc">金髪、長いエルフ耳、森の衣装、弓・矢筒。精霊の矢で遠距離攻撃。</div>
      <div id="metrics">モデルを読み込み中...</div>
      <small>ドラッグで回転・ピンチ/ホイールで拡大。近距離では写実的な毛・鱗を貼った精細モデル、遠距離では軽量モデルに自動切替。騎乗者は戦場画面で確認。</small>
    </div>

  <script type="module">
    import * as THREE from 'three';
    import {summonGalleryActions}
      from './src/summon-gallery-action-catalog.js?v=actions-v1-20261122';
    import {sampleSummonPreviewRoute}
      from './src/summon-gallery-motion-route.js?v=continuous-walk-v1-20261122';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {femaleSummonCosplayFor,FEMALE_SUMMON_FORM_IDS,MALE_DRAGON_LORD_FORM,MALE_DRAGON_LORD_HUMAN_FORM} from './src/female-summon-forms.js?v=dragon-original-default-20261121';
    import {createCosplayedHumanoidMonster} from './src/monster-character-cosplay.js?v=summon-walk-and-spells-v1-20261122';
    import {COMBAT_OBJECT_SPECS} from './src/combat-action-spec.js?v=4.6.51';
    import {MONSTER_CATALOG,MONSTER_BY_ID,MONSTER_FAMILIES} from './src/monster-catalog.js';
    import {loadSpeciesSourceComposite} from './src/monster-source-composite.js?v=4.6.92';
    import {MONSTER_SUMMON_BY_TYPE,isMonsterSummonType,MONSTER_SUMMON_MODEL_HEIGHT}
      from './src/monster-summon-registry.js?v=1';
    import {creatureSize,SUMMON_WORLD_SCALE,LARGE_SUMMON_IDS} from './src/combat-creature-performance.js?v=natural-size-20261116';
    import {createCombatWorldObjectRenderer} from './src/combat-world-object-renderer.js?v=natural-size-20261116';
    import {startCreaturePose} from './src/combat-creature-actions.js?v=4.4.92';
    import {createCreatureSoundRuntime} from './src/combat-creature-sounds.js?v=4.4.74';
    import {ActionVfxRuntime} from './src/character-system/action-vfx-runtime.js?v=4.4.23';
    import {fetchCreatureRegistry,loadExternalCreature,loadPersonalGLB} from './src/creature-external-runtime.js?v=4.4.92';
    import {adoptedCreatureMesh} from './src/creature-mesh-adoption.js?v=web-mesh-26-v1';
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0b1823);
    scene.fog=new THREE.Fog(0x0b1823,220,730);
    const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,900);
    camera.position.set(6,6,13);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.35;
    document.body.insertBefore(renderer.domElement,document.body.firstChild);
    const ambient=new THREE.HemisphereLight(0xdbeaff,0x4b443b,2.1);scene.add(ambient);
    const sun=new THREE.DirectionalLight(0xffe0ab,3.2);
    sun.position.set(-5,11,6);sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024);
    sun.shadow.camera.left=-160;sun.shadow.camera.right=160;sun.shadow.camera.top=160;sun.shadow.camera.bottom=-160;
    scene.add(sun);
    const rim=new THREE.DirectionalLight(0x83b9ff,2.4);rim.position.set(7,5,-8);scene.add(rim);
    const ground=new THREE.Mesh(new THREE.CircleGeometry(190,96),new THREE.MeshStandardMaterial({color:0x293d42,roughness:1,metalness:.05}));
    ground.rotation.x=-Math.PI/2;ground.position.y=-.035;ground.receiveShadow=true;scene.add(ground);
    const rings=new THREE.GridHelper(180,24,0x64838d,0x2d4855);rings.position.y=.006;scene.add(rings);
    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;controls.minDistance=.65;controls.maxDistance=850;
    controls.maxPolarAngle=Math.PI*.49;controls.target.set(0,2.1,0);controls.update();
    const objects=createCombatWorldObjectRenderer(scene,{camera,offset:0,cellSize:1,
      terrainY:()=>0,highDetailDistance:65});
    const creatureSounds=createCreatureSoundRuntime();
    const vfx=new ActionVfxRuntime(scene,{maxEffects:32,maxArrows:10});
    const descriptions={
       forest_archer:'森に仕える成人の精霊弓士。長い金髪・尖った耳・重なった緑の衣装、可動する弓と矢。自然属性の遠距離攻撃。',
       seraph_guardian:'人型の守護天使。白い衣装と後光、幾重にも重なる巨大な羽翼。光槍・範囲回復・蘇生を担う。',
      wolf:'成体の狼の細い頭骨・長い鼻筋・小さな目。胴体の側面・胸・腹・4本の脚・足先まで長さの異なる立体毛を追加。メニューの「全身の毛を拡大」で毛並みを確認できます。',
      wyvern:'頭部の体積と丸い眼球を縮小。鋭い眉骨・長い鼻筋・深い眼窩と、指骨・翼膜・尾・鱗。',
      dragon:'成体の頭身比で小さくした頭骨と深い眼窩。長い鼻筋・鋭い顎・牙・角・鱗・大翼。',
      elder_dragon:'頭部を絞り、瞳を細くした威圧的な成体の顔。白金の角冠、筋肉質の四肢、立体鱗。',
      dragon_lord:'参考画像のように二足直立。肩から広がる巨大な六指骨の翼、握れる四本指、長くうねる尾、重なる胸鱗、角冠と光沢のある赤い目。',
      horse:'子馬風の大きな顔・丸い目を廃止。小さな頭骨と長い鼻梁、自然な赤茶の濡れた目、長い管骨と蹄鉄。',
    };
    const phoneLayout=matchMedia('(max-width:619px)');
    const helpPanel=document.getElementById('info');
    // Use native details so folding works without custom animation handlers.
    // On wide screens the information panel starts expanded.
    if(!phoneLayout.matches)helpPanel.open=true;
    const clock=new THREE.Clock();
    let selected='forest_archer';
    let femaleSummonHandle=null,femaleRequest=0;
    let femaleFlightAltitude=0;
    const femaleMode=document.getElementById('humanoidForm');
    const femaleModeLabel=document.getElementById('femaleSummonModeLabel');
    const disposeFemaleSummon=()=>{
      ++femaleRequest;
      if(femaleSummonHandle){femaleSummonHandle.dispose();femaleSummonHandle=null;}
      femaleFlightAltitude=0;
    };
    function selectFemaleSummonForm(){
      disposeFemaleSummon();
      if(femaleMode.value==='original')return;
      const id=selected;
      const form=id==='dragon_lord'?(femaleMode.value==='male'?
        MALE_DRAGON_LORD_FORM:femaleMode.value==='human'?
        MALE_DRAGON_LORD_HUMAN_FORM:null):femaleSummonCosplayFor(id);
      if(!form||(femaleMode.value==='female'&&form.sex!=='female')||
        (['male','human'].includes(femaleMode.value)&&form.sex!=='male'))return;
      const ticket=++femaleRequest;
      // Keep original battle summon on-screen until the sex-correct
      // Superhero skinned GLB is loaded; no gender swap on the same actor.
      const spec={id,name:COMBAT_OBJECT_SPECS[id].name,
        size:SUMMON_WORLD_SCALE,variant:0,family:'summon'};
      const handle=createCosplayedHumanoidMonster(spec,{
        detail:'high',profileOverride:form,withoutFallback:true
      });
      femaleSummonHandle=handle;scene.add(handle.root);
      document.getElementById('metrics').textContent=
        (femaleMode.value==='human'?'人間型竜王':form.sex==='male'?'龍人型竜王':'女性人型')+'を読み込み中…（元の召喚獣を表示）';
      handle.ready.then(result=>{
        if(ticket!==femaleRequest||handle!==femaleSummonHandle||selected!==id)return;
        if(result.source==='canonical-character-cosplay'){
          const distance=(id==='seraph_guardian'?8.6:id==='dragon_lord'?7.3:4.5)*SUMMON_WORLD_SCALE;
          controls.target.set(0,(id==='seraph_guardian'?1.95:1.18)*SUMMON_WORLD_SCALE,0);
          camera.position.set(1.5*SUMMON_WORLD_SCALE,
            (id==='seraph_guardian'?2.9:2.3)*SUMMON_WORLD_SCALE,distance);
          controls.update();
        }else if(result.source!=='cancelled'){
          document.getElementById('metrics').textContent=
            (femaleMode.value==='human'?'人間型竜王':form.sex==='male'?'龍人型竜王':'女性人型')+'が読込めないため元の姿を表示：'+(result.reason||'');
        }
      });
    }
    let licensedRegistry={entries:{}},externalPreview=null,externalRequest=0,externalPreviewMode='licensed';
    const compareDragon=document.getElementById('compareDragon');
    const closeExternalPreview=()=>{
      externalRequest++;
      if(externalPreview){externalPreview.dispose();externalPreview=null;}
      externalPreviewMode='licensed';
      compareDragon.textContent='CC0外部ドラゴンを比較';
    };
    // CC0 donor GLBs in the source registry are opt-in for the original
    // battle renderer; the summon showroom can display the same source
    // composite as the newly published bestiary without allocating it in
    // every 50v50/1000v1000 battlefield.
    async function showNewWolfSource(){
      if(selected!=='wolf'||!licensedRegistry.entries.q022||
         new URLSearchParams(location.search).get('source')==='legacy')return;
      const ticket=++externalRequest;
      try{
        const handle=await loadSpeciesSourceComposite(
          MONSTER_BY_ID.m001,licensedRegistry,{detail:'high'});
        if(ticket!==externalRequest||selected!=='wolf'){
          handle.dispose();return;
        }
        // The base CC0 dog GLB is a normal-sized source. Match the existing
        // giant summon scale (17m) without changing its anatomical nodes.
        const bounds=new THREE.Box3().setFromObject(handle.root);
        const height=bounds.getSize(new THREE.Vector3()).y;
        if(!Number.isFinite(height)||height<=0){
          handle.dispose();throw Error('Empty canine model');
        }
        handle.root.scale.multiplyScalar(
          MONSTER_SUMMON_MODEL_HEIGHT/height);
        handle.root.userData.summonWolfSource='m001';
        externalPreview=handle;
        externalPreviewMode='source-composite';
        scene.add(handle.root);
        controls.target.set(0,MONSTER_SUMMON_MODEL_HEIGHT*.43,0);
        camera.position.set(7,11,43);
        controls.update();
      }catch(error){
        if(ticket!==externalRequest)return;
        console.warn('CC0 wolf source unavailable, retain proven summon wolf',error);
      }
    }
    fetchCreatureRegistry().then(reg=>{
      licensedRegistry=reg;
      compareDragon.disabled=!reg.entries.dragon||selected!=='dragon';
      if(selected==='wolf'&&new URLSearchParams(location.search).get('source')==='source-composite')showNewWolfSource();
    }).catch(()=>{compareDragon.disabled=true;});
    compareDragon.onclick=async()=>{
      if(selected!=='dragon')return;
      if(externalPreview){closeExternalPreview();return}
      const entry=licensedRegistry.entries.dragon;if(!entry)return;
      const ticket=++externalRequest;

         externalPreviewMode==='source-composite'?'CC0犬型GLB＋狼王のPBR外観':
         'CC0外部候補')+'・独立3Dアニメ':'')+
        (femaleSummonHandle?' / '+(femaleSummonHandle.profile.sex==='male'?'男性竜王':'女性人型')+
          ' '+(isFemaleReady?'キャラGLB・骨格連動':'読み込み中・元の姿'):'')+
        (femaleFlightAltitude>0?' / 空中飛行 '+femaleFlightAltitude.toFixed(2)+'m・羽ばたき':'')+
        (adoptedCreatureMesh(selected)!=='legacy'?' / 採用メッシュ '+adoptedCreatureMesh(selected):'');
    }
    // Diagnose the actual skinned forest wardrobe, not only a hex-code
    // present somewhere in the source. The old black velvet albedo passed
    // source-level color checks while the phone still showed a black dress.
    const forestSurfaceAudit=()=>{
      if(selected!=='forest_archer'||femaleSummonHandle?.source!=='canonical-character-cosplay')
        return null;
      const result={leafPanels:0,emeraldMeshes:0,donorClothMeshes:0,
       darkPhotoSurfaceMeshes:0,skin:0xe1b496};
      femaleSummonHandle.root.traverse(node=>{
        if(!node.isMesh)return;
        if(node.userData.forestCanopyOuterLayer)result.leafPanels++;
        const material=Array.isArray(node.material)?node.material:[node.material];
        for(const m of material){
          if(m?.userData?.forestVisibleGreen)result.emeraldMeshes++;
          if(m?.userData?.forestOpaqueEmeraldOutfit)result.donorClothMeshes++;
          if(m?.userData?.forestVisibleGreen&&
             m.userData.photoSurface==='velvet')result.darkPhotoSurfaceMeshes++;
        }
      });
      return result;
    };
    const canonicalMovementAudit=()=>{
      const root=femaleSummonHandle?.root;
      const host=root?.getObjectByName('character-cosplay-host');
      const motion=host?.userData?.canonicalMotion;
      const legs=[];
      root?.traverse(node=>{
        if(node.isBone&&/^(thigh|calf|shin|upperleg)[_\d-]*[lr]?$/i.test(node.name)&&legs.length<6)
          legs.push({name:node.name,quaternion:node.quaternion.toArray().map(n=>+n.toFixed(5))});
      });
      return {requested:root?.userData?.action??null,
        activeClip:motion?.active?.getClip?.()?.name??null,
        hasWalkClip:!!motion?.actions?.walk,
        position:root?{x:root.position.x,z:root.position.z}:null,
        legs};
    };
    window.__summonGalleryLayoutQA=()=>({
      speciesActionIds:[...motionStrip.querySelectorAll('.speciesSkill')].map(x=>x.dataset.skill),
      selectedSkill,
      walking,running,previewX:previewObject.x,previewZ:previewObject.z,
      canonicalMovement:canonicalMovementAudit(),
      motionStripVisible:getComputedStyle(document.getElementById('summonMotionStrip')).display!=='none',
      actionButtons:document.querySelectorAll('#summonMotionStrip button').length,
      activeMotion:document.querySelector('#summonMotionStrip button[aria-pressed=true]')?.dataset.pose||
        (document.getElementById('walk').getAttribute('aria-pressed')==='true'?'walk':
         document.getElementById('attack').getAttribute('aria-pressed')==='true'?'attack':'other'),
      mobile:phoneLayout.matches,
      controlsOpen:document.getElementById('controlsDrawer').open,
      infoOpen:helpPanel.open,
      selected,
      femaleMode:femaleMode.value,
      actorSex:femaleSummonHandle?.profile?.sex??null,
      dragonLordForm:selected==='dragon_lord'?femaleMode.value:null,
      dragonLordCostume:femaleSummonHandle?.profile?.costume??null,
      angelNoBeard:femaleSummonHandle?.metadata?.noBeard??null,
      angelSkinColor:femaleSummonHandle?.metadata?.skinColor??null,
      angelBeardMeshesSuppressed:femaleSummonHandle?.metadata?.beardSourceMeshesSuppressed??0,
      inspectorWidth:document.querySelector('#controlsDrawer .extraControls')?.getBoundingClientRect().width??0,
      inspectorHeight:document.querySelector('#controlsDrawer .extraControls')?.getBoundingClientRect().height??0,
      femaleReady:femaleSummonHandle?.source==='canonical-character-cosplay',
      forestSurfaceAudit:forestSurfaceAudit(),
      femaleSource:femaleSummonHandle?.profile?.modelId||null,
      dragonCraniumNativeTopology:
       femaleSummonHandle?.metadata?.dragonCraniumNativeTopology??null,
      dragonNativeScalpTriangles:
       femaleSummonHandle?.metadata?.dragonNativeScalpTriangles??0,
      hairStrands:femaleSummonHandle?.metadata?.hairStrands??null,
      combatMotionLayer:femaleSummonHandle?.metadata?.combatMotionLayer??null,
      sourceCraniumWigCut:
       femaleSummonHandle?.metadata?.sourceCraniumWigCut??null,
      sourceCraniumCutMode:
       femaleSummonHandle?.metadata?.sourceCraniumCutMode??null,
      sourceCraniumRemovedTriangles:
       femaleSummonHandle?.metadata?.sourceCraniumRemovedTriangles??0,
      sourceCraniumPreservedTriangles:
       femaleSummonHandle?.metadata?.sourceCraniumPreservedTriangles??0,
      femaleFlightAltitude,
      seraphOriginalWingCount:femaleSummonHandle?.root?.getObjectByName?
        [-1,1].filter(side=>!!femaleSummonHandle.root.getObjectByName(
         'female-seraph-original-wing-pivot-'+side)).length:0,
      summonWorldScale:SUMMON_WORLD_SCALE,
      summonSpeciesCount:7+MONSTER_CATALOG.length,
      catalogSummonCount:MONSTER_CATALOG.length,
      monsterSourceType:MONSTER_SUMMON_BY_TYPE[selected]?.monsterId??null,
      monsterRendered:!!objects.monsterSourceModel(previewObject.id),
      monsterFramed:frameMonsterType===selected,
      wolfHybridPrimary:'combat-summon-wolf',
      wolfSourceActive:selected==='wolf'&&externalPreviewMode==='source-composite'
        &&!!externalPreview,
      wolfSourceDonor:externalPreview?.sourceComposite?.donor??null,
      wolfHybridSecondary:'m001',
      cameraDistance:camera.position.distanceTo(controls.target)
    });
    tick();
    window.addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
