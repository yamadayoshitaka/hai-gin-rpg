name: Lucia original art free 3D API capability probe
on:
  push:
    branches: [feat/lucia-ai-3d-from-original-20261111]
    paths: ['.github/workflows/lucia-zero-gpu-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official TRELLIS.2 Gradio API without consuming GPU
        shell: bash
        run: |
          node <<'JS'
          const host='https://microsoft-trellis-2.hf.space';
          for(const endpoint of ['/gradio_api/info','/config']){
            try{
              const c=new AbortController(),timer=setTimeout(()=>c.abort(),20000);
              let res;
              try{res=await fetch(host+endpoint,{signal:c.signal});}finally{clearTimeout(timer)}
              const txt=await res.text();
              console.log('API',endpoint,'status',res.status,'length',txt.length);
              if(!res.ok){console.log(txt.slice(0,250));continue}
              const j=JSON.parse(txt);
              if(endpoint.endsWith('/info')){
                const named=j.named_endpoints||j;
                console.log('named_endpoints',JSON.stringify(named).slice(0,12000));
              }else{
                console.log('components',JSON.stringify((j.components||[]).map(c=>({id:c.id,type:c.type,props:{label:c.props?.label,type:c.props?.type,format:c.props?.format,value:c.props?.value}}))).slice(0,9000));
                console.log('deps',JSON.stringify((j.dependencies||[]).filter(d=>d.api_name&&!String(d.api_name).startsWith('_')).map(d=>({id:d.id,api_name:d.api_name,inputs:d.inputs,outputs:d.outputs,queue:d.queue}))).slice(0,9000));
              }
            }catch(e){console.log('API',endpoint,'error',e.message)}
          }
          JS
