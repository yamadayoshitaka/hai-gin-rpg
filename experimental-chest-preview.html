<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>胸鎧装備・人物3Dプレビュー</title><style>body{margin:0;background:#111827;color:#f1f5f9;font:15px system-ui}header{padding:12px 16px}#view{height:75vh;min-height:420px;touch-action:none}#status{padding:12px;white-space:pre-wrap;color:#fbbf24}button{padding:10px;background:#334155;color:white;border:1px solid #64748b;border-radius:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><strong>男性素体＋胸鎧（実験モデル）</strong><p>ドラッグ：回転／ピンチ：拡大縮小。静止姿勢のみ。歩行・攻撃と見た目は未検証。</p><button id="reload">再読み込み</button> <button id="front">正面</button> <button id="side">側面</button></header><div id="view"></div><div id="status">モデルを読み込み中…</div><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const view=document.getElementById('view'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x1e293b);const camera=new THREE.PerspectiveCamera(42,1,.001,10000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(3,5,4);scene.add(sun);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let model;let centerPoint=new THREE.Vector3(),fitDistance=4;function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(view);async function load(){status.textContent='胸鎧付き人物GLBを読み込み中…';try{const g=await new GLTFLoader().loadAsync('./assets/characters/experimental/plate_chest-male.glb?v=3');if(model)scene.remove(model);model=g.scene;scene.add(model);model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model);if(bounds.isEmpty())throw Error('メッシュがありません');const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());controls.target.copy(center);const radius=Math.max(size.length(),1);centerPoint.copy(center);const fov=THREE.MathUtils.degToRad(camera.fov);fitDistance=Math.max(radius/(2*Math.tan(fov/2)),2);camera.position.copy(center).add(new THREE.Vector3(0,0,fitDistance*2.4));camera.near=.001;camera.far=Math.max(1000,radius*100);camera.updateProjectionMatrix();controls.update();let meshes=0,skins=0;model.traverse(o=>{if(o.isMesh)meshes++;if(o.isSkinnedMesh)skins++});status.textContent='GLB読込成功：人物＋胸鎧　メッシュ '+meshes+'／スキン '+skins+'／寸法 '+size.toArray().map(x=>x.toFixed(2)).join('×')+'\n※ 実験用・形状品質未承認。胸部回転時の貫通が残っています。'}catch(e){status.textContent='モデル未公開または読み込み失敗：'+e.message+'\nGitHub Actionsの胸鎧生成結果を確認してください。'}}document.getElementById('front').onclick=()=>{camera.position.copy(centerPoint).add(new THREE.Vector3(0,0,fitDistance*2.4));controls.target.copy(centerPoint);controls.update()};document.getElementById('side').onclick=()=>{camera.position.copy(centerPoint).add(new THREE.Vector3(fitDistance*2.4,0,0));controls.target.copy(centerPoint);controls.update()};document.getElementById('reload').onclick=load;load();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();</script></body></html>
