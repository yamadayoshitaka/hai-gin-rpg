name: 3DAI Studio auto-generate swordsman armor (free only)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = check site only; generate = submit exactly one textured request'
        required: true
        default: probe
        type: choice
        options: [probe, generate]
      request_path:
        description: 'Committed JSON request in data/ai-generation-requests/ (humans / monsters / summons / armor)'
        required: true
        default: data/ai-generation-requests/swordsman-armor-3dai-single-001.json
        type: string
  push:
    branches: [main]
    paths:
      - 'qa/3dai-swordsman-auto.cjs'
      - '.github/workflows/3dai-swordsman-auto.yml'
      - 'data/ai-generation-requests/**'
permissions:
  contents: write
concurrency:
  group: rpg-one-shot-3dai-swordsman
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser controller (free open source)
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check input images and script syntax
        run: |
          node --check qa/3dai-swordsman-auto.cjs
          test -s data/ai-generation-requests/swordsman-armor-3dai-001.json
      - name: Normal UI automation with textured-only quality gate
        env:
          AI_REQUEST_PATH: ${{ inputs.request_path || 'data/ai-generation-requests/swordsman-armor-3dai-single-001.json' }}
          AI_AUTOMATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (contains(github.event.head_commit.message, '[3dai-generate]') && 'generate' || 'probe') }}
        run: node qa/3dai-swordsman-auto.cjs
      - name: Preserve screenshots and exact generation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3dai-swordsman-auto-report
          path: qa-screenshots/3dai-auto/
          retention-days: 14
          if-no-files-found: warn
      - name: Archive generated candidate GLB, if one was actually downloaded
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3dai-swordsman-armor-glb
          path: assets/ai-model-inbox/*.glb
          if-no-files-found: ignore
      - name: Register downloaded GLB through standard AI inbox pipeline
        if: success()
        run: |
          if ls assets/ai-model-inbox/*.glb >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A assets/ai-model-inbox
            if ! git diff --cached --quiet; then
              git commit -m "Ingest 3DAI Studio swordsman armor GLB as QA-only candidate"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          else
            echo "No high-quality textured GLB was generated. Model unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
