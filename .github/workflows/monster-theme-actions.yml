name: Monster 50 families action & quality regression
on:
  pull_request:
    paths:
      - 'src/monster-*'
      - 'src/battle-registered-monster-model.js'
      - 'src/creature-game-model-routing.js'
      - 'qa/battle-monster-catalog-parity.test.mjs'
      - 'tactics-wireframe.html'
      - 'src/nonhuman-model-quality.js'
      - 'src/creature-master-runtime.js'
      - 'monster-manager.html'
      - 'summon-showcase.html'
      - 'src/female-summon-costumes.js'
      - 'qa/demon-female-summon-mobile-viewer.test.mjs'
      - 'qa/summon-gallery-mobile.spec.mjs'
      - 'qa/monster-all-50-theme-actions.test.mjs'
      - 'qa/m023-mantis-sculpt.test.mjs'
      - 'qa/monster-kraken-reference-parity.test.mjs'
      - '.github/workflows/monster-theme-actions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monster-themes:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned geometry runtime without lockfile changes
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Syntax check species, pose and viewer route
        run: |
          node --check src/monster-theme-actions.js
          node --check src/monster-theme-motion.js
          node --check src/monster-animation.js
          node --check src/monster-character-cosplay.js
          node --check src/monster-summon-renderer.js
          node --check src/battle-registered-monster-model.js
          node --check src/nonhuman-model-quality.js
      - name: Verify bestiary models match real enemy battle and summon mapping
        run: npm run test:monster-battle-sync
      - name: Verify 50 live low LODs, 250 theme actions and quality stages
        run: node --test qa/monster-all-50-theme-actions.test.mjs
      - name: Verify protected canonical humanoid joints and gargoyle
        run: node --test qa/monster-gargoyle-species.test.mjs qa/monster-humanoid-armor-articulation.test.mjs
      - name: Verify six-limbed articulated mantis mesh and mobile LOD
        run: node --test qa/m023-mantis-sculpt.test.mjs
      - name: Verify skeleton faces, angel material and CC0 native animations
        run: node --test qa/skeleton-seraph-summon-motion.test.mjs
      - name: Verify angel face has no whisker tubes and Dragon Lord original is default
        run: node qa/demon-female-summon-mobile-viewer.test.mjs
      - name: Verify Kraken and beetle parity without altering approved masters
        run: node --test qa/monster-kraken-reference-parity.test.mjs
