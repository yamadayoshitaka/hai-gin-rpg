name: AI swordsman photographic steel finish regression
on:
  pull_request:
    paths:
      - 'src/character-system/ai-swordsman-steel-finish.js'
      - 'swordsman-ai-test.html'
      - 'tactics-wireframe.html'
      - 'qa/ai-steel-finish.test.mjs'
      - 'qa/ai-steel-compare-smoke.cjs'
      - 'qa/ai-steel-battle-smoke.cjs'
      - 'qa/3dai-swordsman-auto.cjs'
      - '.github/workflows/ai-steel-finish-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/character-system/ai-swordsman-steel-finish.js'
      - 'swordsman-ai-test.html'
      - 'qa/ai-steel-finish.test.mjs'
      - 'qa/ai-steel-compare-smoke.cjs'
      - 'qa/ai-steel-battle-smoke.cjs'
      - '.github/workflows/ai-steel-finish-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  steel-finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js and browser
        run: npm install --no-save three@0.160.1 playwright@1.56.0
      - name: Structural and geometry projection tests
        run: |
          node --check src/character-system/ai-swordsman-steel-finish.js
          node --check qa/3dai-swordsman-auto.cjs
          node --test qa/ai-steel-finish.test.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Serve actual game assets
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ai-steel-smoke-server.log 2>&1 &
          sleep 2
      - name: Actual WebGL render and reversible steel finish
        run: node qa/ai-steel-compare-smoke.cjs
      - name: One real swordsman in battle - finish and rollback
        run: node qa/ai-steel-battle-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swordsman-photo-steel-preview-v1
          path: qa-screenshots/ai-steel-finish/
          if-no-files-found: warn
          retention-days: 14
