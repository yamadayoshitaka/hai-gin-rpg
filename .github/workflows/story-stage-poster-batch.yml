name: Story stage poster batch (free preflight)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/process-c01-s01-stage-batch.mjs'
      - 'qa/story-stage2-two-review-pages.test.mjs'
      - 'assets/story/chapter-drafts/c01/pending-art-review/**'
      - 'qa/story-stage1-complete-audit.test.mjs'
      - 'assets/story/stage-manifests/c01-s01.manifest.json'
      - 'scripts/prepare-story-stage-posters.mjs'
      - 'scripts/run-story-stage.mjs'
      - 'qa/story-stage2-cast-assignment.test.mjs'
      - 'assets/story/stage-manifests/c01-s02-shot-assignments.json'
      - 'scripts/check-c01-s02-pending-art.mjs'
      - 'src/story-stage2-reviewed-art.js'
      - 'src/story-panel-registered-art.js'
      - 'qa/story-stage2-25-gate.test.mjs'
      - 'qa/story-stage2-cast-assignment.test.mjs'
      - 'assets/story/stage-manifests/c01-s02-shot-assignments.json'
      - 'assets/story/characters/c01-s02-reference-bible.json'
      - 'scripts/ingest-story-stage-posters.py'
      - 'scripts/build-story-character-reference-pack.py'
      - 'qa/story-character-reference-pack.test.py'
      - 'assets/story/characters/c01-s02-reference-bible.json'
      - 'qa/story-stage-poster-ingestion.test.py'
      - 'assets/story/chapter-drafts/**/posters/*.webp'
      - 'qa/story-stage-poster-production.test.mjs'
      - 'docs/story-stage-poster-production-manifest-v2.md'
      - '.github/workflows/story-stage-poster-batch.yml'
      - 'assets/story/chapters/c01/stage2-stage3-production-queue.json'
  pull_request:
    paths:
      - 'qa/story-stage2-two-review-pages.test.mjs'
      - 'assets/story/chapter-drafts/c01/pending-art-review/**'
      - 'scripts/process-c01-s01-stage-batch.mjs'
      - 'qa/story-stage1-complete-audit.test.mjs'
      - 'assets/story/stage-manifests/c01-s01.manifest.json'
      - 'scripts/check-c01-s02-pending-art.mjs'
      - 'src/story-stage2-reviewed-art.js'
      - 'src/story-panel-registered-art.js'
      - 'qa/story-stage2-25-gate.test.mjs'
      - '.github/workflows/story-stage-poster-batch.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'First stage, e.g. c01-s02'
        type: string
        required: true
        default: c01-s02
      count:
        description: 'Consecutive stages, 1 to 10; does not generate or approve missing images'
        type: number
        required: true
        default: 2

permissions:
  contents: read

concurrency:
  group: story-poster-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  free-preflight:
    name: Prepare script, reference-image and reuse review queue (no paid API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all 30 existing Chapter 1 Stage 1 WebPs and run six five-frame one-shot slices
        run: |
          node --check scripts/process-c01-s01-stage-batch.mjs
          node qa/story-stage1-complete-audit.test.mjs
      - name: Verify five-frame page commits contain real distinct WebPs and remain unapproved
        run: node qa/story-stage2-two-review-pages.test.mjs
      - name: Verify all stage 2 and 3 versions have unique assets and truthfully report missing art
        run: |
          node --check scripts/prepare-story-stage-posters.mjs
          node qa/story-stage-poster-production.test.mjs
      - name: Guard all 25 stage2 canonical bindings; preserve 23 registered scenes
        run: |
          node --check scripts/check-c01-s02-pending-art.mjs
          node qa/story-stage2-25-gate.test.mjs
      - name: Check strict per-panel cast, dialogue, composition and real WebP source hashes
        run: |
          node qa/story-stage2-cast-assignment.test.mjs
      - name: Generate batch poster and individual-frame briefs
        env:
          STAGE_START: ${{ github.event.inputs.start || 'c01-s02' }}
          STAGE_COUNT: ${{ github.event.inputs.count || '2' }}
        run: node scripts/prepare-story-stage-posters.mjs --start "$STAGE_START" --count "$STAGE_COUNT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free on-runner crop validator
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Build actual reference-image attachment bundle for stage2
        run: |
          python scripts/build-story-character-reference-pack.py --stage c01-s02
          python qa/story-character-reference-pack.test.py
      - name: Validate native-resolution cropping and no-false-approval rule
        run: python qa/story-stage-poster-ingestion.test.py
      - name: Crop any supplied high-resolution poster sources into isolated per-image review packs
        run: python scripts/ingest-story-stage-posters.py
      - uses: actions/upload-artifact@v4
        with:
          name: story-poster-free-preflight-${{ github.run_id }}
          path: qa-reports/story-stage-production/
          if-no-files-found: error
          retention-days: 30
