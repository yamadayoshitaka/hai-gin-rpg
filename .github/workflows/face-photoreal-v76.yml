      - '.github/workflows/face-photoreal-v76.yml'
permissions:
  contents: read
jobs:
  face-realism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Three.js to validate both gender face meshes
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Verify 3D face feature and texture source syntax
        run: |
          node --check src/face-photo-microdetail-v76.js
          node --check src/face-optics-v76.js
          node --check src/face-feature-meshes.js
          node --check src/face-reference-skin-pbr-v90.js
          node --check src/face-portrait-fairing-v93.js
          node --check src/face-muscle-topology-v95.js
          node --check src/face-v96-smile-cosmetics.js
          node --check src/face-v98-feminine-profile.js
          node --check src/face-v99-malar-alar-fairing.js
          node --check src/face-v101-cheek-contour.js
          node --check src/face-v102-cheek-contour.js
          node --check src/face-v106-local-retopo.js
          node --check qa/face-v106-local-retopo.test.mjs
          node --check src/face-v104-cheek-microfair.js
          node --check qa/face-v102-cheek-contour.test.mjs qa/face-v106-local-retopo.test.mjs
          node --check qa/face-v105-cheek-geometry.test.mjs
          node --check qa/face-v104-cheek-microfair.test.mjs
          node --check qa/face-v96-smile-cosmetics.test.mjs
          node --check qa/face-v98-feminine-profile.test.mjs
          node --check qa/face-v99-malar-alar-fairing.test.mjs
          node --check qa/face-v95-topology-profile.test.mjs qa/face-v96-smile-cosmetics.test.mjs
          node --check qa/face-v93-portrait-fairing.test.mjs qa/face-v94-native-mouth-occlusion.test.mjs qa/face-v95-topology-profile.test.mjs qa/face-v96-smile-cosmetics.test.mjs
          node --check qa/face-v94-native-mouth-occlusion.test.mjs qa/face-v95-topology-profile.test.mjs qa/face-v96-smile-cosmetics.test.mjs
          node --check src/heroine-skin-material.js
          node --check qa/face-v91-live-skin-material.test.mjs
          node --check qa/face-v90-reference-grade.test.mjs
          node --check qa/face-v92-visual-quality-regression.test.mjs
          node --check src/face-mouth-seal-v86.js
          node --check src/face-native-oral-rig-v88.js
          node --check src/independent-face-masters.js
          node --check src/face-expression-animation-v48.js
          node --check src/face-integrated-mouth-v82.js
          node --check qa/face-v82-integrated-mouth.test.mjs
          node --check qa/face-v83-public-safe.test.mjs
          node --check qa/face-v82-real-glb-topology.test.mjs
          node --check qa/face-v88-native-oral.test.mjs
          node --check src/face-anatomy-rig-v80.js
          node --check src/face-oral-anatomy-v80.js
          node --check qa/face-v80-anatomy.test.mjs
          node --check src/face-age-detail-v49.js
          node --check qa/face-photoreal-v76.test.mjs
          node --check qa/face-v76-visible-preset-smooth.test.mjs
      # The legacy v50 preset catalogue tests require an obsolete 24-style
      # selector and unrelated armor proportions; they already fail on main.
      # This gate protects v76 photo/face anatomy plus current expression QA.
      - name: Validate source phototexture, real eye/lip meshes, expressions and ageing
        run: |
          node --test qa/face-photoreal-v76.test.mjs qa/face-expression-v48.test.mjs qa/face-v49-regression.test.mjs qa/eyebrow-surface-regression.test.mjs qa/face-v76-visible-preset-smooth.test.mjs qa/face-v80-anatomy.test.mjs
          # IMPORTANT: these were previously syntax-checked but never RUN.
          node --test qa/face-v82-integrated-mouth.test.mjs qa/face-v82-real-glb-topology.test.mjs qa/face-v83-public-safe.test.mjs qa/face-v88-native-oral.test.mjs qa/face-v90-reference-grade.test.mjs qa/face-v91-live-skin-material.test.mjs qa/face-v92-visual-quality-regression.test.mjs qa/face-v93-portrait-fairing.test.mjs qa/face-v94-native-mouth-occlusion.test.mjs qa/face-v95-topology-profile.test.mjs qa/face-v96-smile-cosmetics.test.mjs qa/face-v98-feminine-profile.test.mjs qa/face-v99-malar-alar-fairing.test.mjs qa/face-v102-cheek-contour.test.mjs qa/face-v104-cheek-microfair.test.mjs qa/face-v105-cheek-geometry.test.mjs

      - name: Diagnose current public face version before merging
        continue-on-error: true
        run: |
          set -euo pipefail
          html_url="https://yamadayoshitaka.github.io/hai-gin-rpg/face-mesh-studio.html?ci_probe=${GITHUB_SHA:0:12}"
          js_url="https://yamadayoshitaka.github.io/hai-gin-rpg/src/face-expression-animation-v48.js?ci_probe=${GITHUB_SHA:0:12}"
          if curl -fsSL --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "${html_url}" -o /tmp/live-face.html; then
            echo 'Public HTML face version:'
            grep -oE '顔品質 v[0-9]+' /tmp/live-face.html | sort -u || true
            echo 'Public HTML import code:'
            grep -oE 'v=[0-9]+-[a-z0-9-]+' /tmp/live-face.html | grep -E '(mouth|face|oral)' | sort -u || true
          else
            echo "::warning::Unable to read live face HTML from GitHub Pages"
          fi
          if curl -fsSL --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "${js_url}" -o /tmp/live-face.js; then
            echo 'Public runtime implementation markers:'
            grep -oE 'v8[345](BuildSignature|JawOpeningQuarantined|ProductionSafetyMode)' /tmp/live-face.js | sort -u || true
          else
            echo "::warning::Unable to read public face JavaScript"
          fi
