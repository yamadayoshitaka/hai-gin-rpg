name: Three-team sortie regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-team-sortie:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new module syntax
        run: |
          node --check src/battle-formation-integrity.js
          node --check src/battle-three-group-hierarchy.js
          node --check src/battle-three-group-panel.js
          node --check src/campaign-stage-plan.js
          node --check src/sortie-formation-logic.js
          node --check src/sortie-formation-template-rules.js
          node --check src/three-step-strategy-catalog.js
          node --check src/three-team-sortie.js
          node --check src/three-team-core-bridge.js
          node --check src/three-team-sortie-ui.js
          node --check src/three-team-strategy-presets.js
          node --check src/targeted-strategy-runtime.js
          node --check src/battle-objective-checkpoints.js
          node --check src/battle-plan-recommendations.js
          node --check src/battle-frame-pacing.js
          node --check src/battle-rigid-frustum-optimization.js
          node --check src/frame-performance.js
          node --check src/mass-battle-grid-sim.js
          node --check src/mass-battle-worker-client.js
          node --check src/mass-battle-worker-runtime.js
          node --check src/core-battle-bridge.js
      - name: Verify three-team allocations and legacy battle
        run: |
          node --experimental-vm-modules qa/three-team-sortie.test.mjs
          node --experimental-vm-modules qa/level99-targeted-strategy.test.mjs
          node --experimental-vm-modules qa/formation-and-three-step-strategy.test.mjs
          node --experimental-vm-modules qa/inn-strategy-three-team-wizard.test.mjs
          node --experimental-vm-modules qa/battle-stage-deployment-portraits.test.mjs
          node --experimental-vm-modules qa/formation-stage-collapse.test.mjs
          node --experimental-vm-modules qa/formation-template-rarity-quotas.test.mjs
          node --experimental-vm-modules qa/central-battle-orders.test.mjs
          node qa/battle-objective-checkpoints.test.mjs
          node qa/battle-frame-pacing.test.mjs
          node qa/battle-rigid-frustum-optimization.test.mjs
          node qa/inn-battle-plan-recommendations.test.mjs
          node --experimental-vm-modules qa/formation-minimum-deployment-radar.test.mjs
          node --experimental-vm-modules qa/strict-formation-three-group-summon-size.test.mjs
          node --experimental-vm-modules qa/inn-deployment-command-effects.test.mjs
          node --experimental-vm-modules qa/inn-commander-autoplace-gameover.test.mjs
