<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>胸鎧装備・人物3Dプレビュー</title><style>body{margin:0;background:#111827;color:#f1f5f9;font:15px system-ui}header{padding:12px 16px}#view{height:75vh;min-height:420px;touch-action:none;position:relative}#view canvas{display:block;width:100%;height:100%}#status{padding:12px;white-space:pre-wrap;color:#fbbf24}button{padding:10px;background:#334155;color:white;border:1px solid #64748b;border-radius:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><strong>男性素体＋胸鎧（元メッシュ保持フィット・実験版）</strong><p>ドラッグ：回転／ピンチ：拡大縮小。元の鎧メッシュを保持する方式へ切替中です。生成・公開が成功するまで旧モデルが表示されます。歩行・攻撃と見た目は未検証。</p><button id="reload">再読み込み</button> <button id="front">正面</button> <button id="side">側面</button> <button id="armsDown">腕を下ろす</button> <button id="tpose">Tポーズ</button></header><div id="view"></div><div id="status">モデルを読み込み中…</div><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const view=document.getElementById('view'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x1e293b);const camera=new THREE.PerspectiveCamera(42,1,.001,10000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(3,5,4);scene.add(sun);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let model;let armPose=[];let centerPoint=new THREE.Vector3(),fitDistance=4;function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,true);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(view);async function load(){status.textContent='胸鎧付き人物GLBを読み込み中…';try{const assetUrl='./assets/characters/experimental/plate_chest-male.glb?v='+Date.now();const response=await fetch(assetUrl,{cache:'no-store'});if(!response.ok)throw Error('GLB HTTP '+response.status);const bytes=await response.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('');const g=await new GLTFLoader().parseAsync(bytes,'./assets/characters/experimental/');window.__armorAssetHash=hash;if(model)scene.remove(model);model=g.scene;scene.add(model);armPose=[];model.traverse(o=>{if(!o.isBone)return;const n=o.name.toLowerCase();if(!/(upper.?arm|shoulder|arm_l|arm_r)/.test(n)||/(forearm|lowerarm|twist)/.test(n))return;armPose.push({bone:o,original:o.quaternion.clone(),side:/(left|_l|\\.l|l$)/.test(n)?1:/(right|_r|\\.r|r$)/.test(n)?-1:0});});model.updateMatrixWorld(true);const samples=[[],[],[]],point=new THREE.Vector3();model.traverse(o=>{if(!o.isMesh||!o.geometry?.attributes?.position)return;const count=o.geometry.attributes.position.count,step=Math.max(1,Math.floor(count/3000));for(let i=0;i<count;i+=step){if(o.isSkinnedMesh)o.getVertexPosition(i,point);else point.fromBufferAttribute(o.geometry.attributes.position,i);point.applyMatrix4(o.matrixWorld);for(let k=0;k<3;k++)if(Number.isFinite(point.getComponent(k)))samples[k].push(point.getComponent(k));}});if(!samples[0].length)throw Error('メッシュ頂点がありません');const low=[],high=[];for(let k=0;k<3;k++){samples[k].sort((a,b)=>a-b);low.push(samples[k][Math.floor(samples[k].length*.02)]);high.push(samples[k][Math.floor(samples[k].length*.98)]);}const center=new THREE.Vector3(...low).add(new THREE.Vector3(...high)).multiplyScalar(.5),size=new THREE.Vector3(...high).sub(new THREE.Vector3(...low));controls.target.copy(center);centerPoint.copy(center);const fov=THREE.MathUtils.degToRad(camera.fov),aspect=Math.max(camera.aspect,.2);fitDistance=Math.max(size.y/(2*Math.tan(fov/2)),size.x/(2*Math.tan(fov/2)*aspect),size.z/(2*Math.tan(fov/2)),1);camera.position.copy(center).add(new THREE.Vector3(0,0,fitDistance*2.4));camera.near=.001;camera.far=Math.max(1000,fitDistance*100);camera.updateProjectionMatrix();controls.update();controls.saveState();let meshes=0,skins=0;model.traverse(o=>{if(o.isMesh)meshes++;if(o.isSkinnedMesh)skins++});status.textContent='GLB SHA-256先頭16桁：'+window.__armorAssetHash+'\\nGLB読込成功：人物＋胸鎧　メッシュ '+meshes+'／スキン '+skins+'／寸法 '+size.toArray().map(x=>x.toFixed(2)).join('×')+'\n※ 実験用・形状品質未承認。胸部回転時の貫通が残っています。'}catch(e){status.textContent='モデル未公開または読み込み失敗：'+e.message+'\nGitHub Actionsの胸鎧生成結果を確認してください。'}}document.getElementById('front').onclick=()=>{camera.position.copy(centerPoint).add(new THREE.Vector3(0,0,fitDistance*2.4));controls.target.copy(centerPoint);controls.update()};document.getElementById('side').onclick=()=>{camera.position.copy(centerPoint).add(new THREE.Vector3(fitDistance*2.4,0,0));controls.target.copy(centerPoint);controls.update()};document.getElementById('armsDown').onclick=()=>{for(const p of armPose){p.bone.quaternion.copy(p.original);if(p.side)p.bone.rotateZ(-p.side*1.05);}status.textContent+='\\n腕下ろし姿勢（暫定回転・干渉は目視確認）';};document.getElementById('tpose').onclick=()=>{for(const p of armPose)p.bone.quaternion.copy(p.original);};document.getElementById('reload').onclick=load;load();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();</script></body></html>
