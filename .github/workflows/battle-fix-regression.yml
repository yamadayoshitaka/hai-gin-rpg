name: Battle pursuit, riding, stairs and zoom regression
on:
  pull_request:
    paths:
      - 'tactics-wireframe.html'
      - 'src/mass-battle-grid-sim.js'
      - 'src/combat-world-object-renderer.js'
      - 'src/mass-battle-worker*.js'
      - 'qa/long-battle-navigation-zoom-riding.test.mjs'
      - 'src/skirmish-elevation-targeting.js'
      - 'src/room-item-registry.js'
      - 'qa/loot-once-rooftop-contact.test.mjs'
      - 'src/mass-battle-room-loot.js'
      - 'src/combat-creature-performance.js'
      - 'src/building-structure.js'
      - 'src/room-item-registry.js'
      - 'src/battle-squad-intent.js'
      - 'qa/battle-riding-chest-floor-ui.test.mjs'
      - 'qa/mass-battle-parity-diagonal.test.mjs'
      - 'qa/mass-interior-unified-command-effects.test.mjs'
      - 'qa/gpu-run-grounding-regression.test.mjs'
      - 'qa/skirmish-dash-default.test.mjs'
      - 'qa/mass-dash-parity.test.mjs'
      - 'qa/damage-number-distance-gait.test.mjs'
      - 'src/confirmed-hit-overlay.js'
      - 'src/mass-visual-motion.js'
      - 'src/mass-dash-parity.js'
      - 'src/character-system/battle-motion-policy.js'
      - 'src/skirmish-dash-policy.js'
      - 'src/character-system/job-motion-source.js'
      - 'src/crowd-run-grounding.js'
      - 'src/crowd-impostor-atlas.js'
      - 'src/mass-battle-real-army.js'
      - 'src/character-system/shared-character-runtime.js'
      - 'src/battle-squad-intent.js'
      - 'src/mass-battle-vfx-policy.js'
      - 'src/mass-battle-highground.js'
      - 'src/mass-battle-directional-nav.js'
      - 'src/mass-battle-worker-protocol.js'
      - 'qa/flying-mount-rider-frame-sync.test.mjs'
      - 'src/mass-battle-grid-sim.js'
      - 'qa/mass-battle-loot-contact.test.mjs'
      - '.github/workflows/battle-fix-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and late-battle state tests
        run: |
          node --check src/mass-battle-grid-sim.js
          node --check src/combat-world-object-renderer.js
          node --check src/mass-battle-worker-runtime.js
          node qa/battle-riding-chest-floor-ui.test.mjs
          node qa/mass-battle-parity-diagonal.test.mjs
          node qa/mass-interior-unified-command-effects.test.mjs
          node qa/gpu-run-grounding-regression.test.mjs
          node qa/skirmish-dash-default.test.mjs
          node qa/mass-dash-parity.test.mjs
          node qa/damage-number-distance-gait.test.mjs
          node qa/flying-mount-rider-frame-sync.test.mjs
          node qa/mass-battle-loot-contact.test.mjs
          node qa/loot-once-rooftop-contact.test.mjs
          node qa/room-item-proximity-runtime.test.mjs
          node qa/room-item-inventory-ui.test.mjs
          node qa/skirmish-corridor-stair-regression.test.mjs
          node qa/long-battle-navigation-zoom-riding.test.mjs
          node qa/battle-message-oneclick.test.mjs
          node qa/mobile-camera-zoom-regression.test.mjs
      - name: Stair and riding contracts
        run: |
          node qa/building-floor-navigation.test.mjs
          node qa/rider-armor-coverage-regression.test.mjs
