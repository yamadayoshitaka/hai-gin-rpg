<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>灰銀｜R53 主人公 新旧比較</title><style>
*{box-sizing:border-box}body{margin:0;background:#141b25;color:#edf1f7;font:15px system-ui}main{max-width:1200px;margin:auto;padding:12px}h1{font-size:22px;margin:5px 0}p{line-height:1.5;color:#c5cfdd}button,select,input{font:inherit;padding:8px;background:#27374a;border:1px solid #687b92;border-radius:6px;color:#fff;max-width:100%}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}a{color:#9ecbff}.pair{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}figure{margin:0;background:#202938;border-radius:8px;overflow:hidden;min-width:0}figcaption{padding:8px;text-align:center;font-size:14px}img{display:block;width:100%;height:auto}#stage{height:54vh;min-height:260px;touch-action:none;background:#202938}#stage canvas{display:block;touch-action:none}#status{white-space:pre-wrap}small{color:#b1bed0}.notice{border:1px solid #61728b;padding:10px;border-radius:8px}#refEmpty{padding:12px;color:#b1bed0;text-align:center}#refImg[hidden],#refEmpty[hidden]{display:none}@media(max-width:650px){.pair{grid-template-columns:repeat(2,minmax(0,1fr))}.reference{grid-column:1/-1}.reference img{max-width:420px;margin:auto}}
</style></head><body><main><a href="../../">ゲームに戻る</a><h1>R53 主人公｜新旧顔比較</h1><p>実モデルの前回・最新版を同じ方向で比較できます。最新版：虹彩修正 45762954201。</p><div class="notice">確認用のみ。本番モデルは未変更。外観の合格は未承認です。見本は端末から選択できます（アップロードされません）。</div>
<div class="controls"><label>人物 <select id="person"><option value="commander-male">男性主人公</option><option value="commander-female">女性主人公</option></select></label><label>対象 <select id="mode"><option value="head">顔・頭部</option><option value="hair">髪型</option><option value="studio">PBR材質</option><option value="neck">首の接合</option><option value="full">全身・衣装</option><option value="expression">表情</option></select></label><label id="viewLabel">方向 <select id="view"></select></label><label id="exprLabel" hidden>表情 <select id="expr"></select></label><label id="baselineLabel">比較元 <select id="baseline"><option value="previous">前回成功版</option><option value="original">初期頭部</option></select></label></div>
<div class="pair"><figure><figcaption id="oldCaption">前回成功版</figcaption><a id="oldLink" target="_blank" rel="noopener"><img id="oldImg" alt="比較元の実レンダリング"></a></figure><figure><figcaption>最新版（虹彩修正後）</figcaption><a id="newLink" target="_blank" rel="noopener"><img id="newImg" alt="最新版の実レンダリング"></a></figure><figure class="reference"><figcaption>完成目標の見本</figcaption><div id="refEmpty">見本画像を選択してください</div><img id="refImg" hidden alt="端末から選択した見本画像"><div class="controls" style="padding:8px"><input id="refFile" type="file" accept="image/*" aria-label="見本画像"><button id="clearRef">解除</button></div></figure></div>
<p id="imageStatus" role="status"></p><div class="controls"><button id="start3d">3Dで回転・拡大・動作確認</button></div><section id="interactive" hidden><div class="controls"><label>モデル <select id="version"><option value="new">最新頭部</option><option value="hair">最新頭部＋髪</option><option value="full">最新全身</option><option value="previous">前回頭部</option><option value="old">初期全身</option></select></label><label>表情 <select id="morph"></select></label><label>動作 <select id="action"><option value="">停止</option></select></label><button id="reset">正面に戻す</button></div><div id="stage"></div><p id="status" role="status"></p><small>1本指で回転、2本指で拡大・縮小。動作は停止するとニュートラルに戻ります。</small></section><p><small>出典：Blender Studio Human Base Meshes (CC0) ほか、Actions実成果物。<a href="https://github.com/yamadayoshitaka/hai-gin-rpg/actions/runs/45762954201">最新検証</a></small></p></main><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script><script>
const $=id=>document.getElementById(id);const exprs=[['jawOpen','口を開く'],['viseme_A','あ'],['viseme_I','い'],['viseme_U','う'],['viseme_E','え'],['viseme_O','お'],['smile','笑顔'],['blink_L','左まばたき'],['blink_R','右まばたき'],['browRaise','眉を上げる'],['browFrown','眉を寄せる'],['sad','悲しい'],['laugh','笑う']];
$('morph').add(new Option('無表情',''));for(const [id,label] of exprs){$('expr').add(new Option(label,id));$('morph').add(new Option(label,id))}
const all=[['front','正面'],['left','左側面'],['right','右側面'],['rear','背面'],['crown','頭頂']];
const dirs={head:all,hair:all,studio:[['front','正面'],['threequarter','斜め']],neck:[['front','正面'],['side','側面'],['rear','背面']],full:[['front','正面'],['side','側面']],expression:[['front','正面']]};
function modeChanged(){const mode=$('mode').value,v=$('view').value;$('view').replaceChildren(...dirs[mode].map(([k,l])=>new Option(l,k)));if(dirs[mode].some(([k])=>k===v))$('view').value=v;$('exprLabel').hidden=mode!=='expression';$('viewLabel').hidden=mode==='expression';$('baselineLabel').hidden=mode!=='head';updateImages()}
function updateImages(){const mode=$('mode').value,v=$('view').value,root='./assets/'+$('person').value+'/',initial=mode==='head'&&$('baseline').value==='original',fn=mode==='head'?'master_'+v:mode==='expression'?'expression_'+$('expr').value:mode+'_'+v;const old=initial?'latest/original_'+v:'previous/'+fn;const next='latest/'+fn;$('oldCaption').textContent=initial?'初期頭部':'前回成功版';$('imageStatus').textContent='';for(const [key,path] of [['old',root+old+'.png'],['new',root+next+'.png']]){const img=$(key+'Img');img.src=path;$(key+'Link').href=path;img.onerror=()=>{$('imageStatus').textContent='画像の取得に失敗しました: '+path}}}
$('mode').addEventListener('change',modeChanged);for(const n of ['person','view','expr','baseline'])$(n).addEventListener('change',updateImages);modeChanged();
let refUrl;function clearRef(){if(refUrl)URL.revokeObjectURL(refUrl);refUrl=null;$('refImg').removeAttribute('src');$('refImg').hidden=true;$('refEmpty').hidden=false;$('refFile').value=''}$('clearRef').onclick=clearRef;$('refFile').onchange=()=>{const f=$('refFile').files[0];if(!f)return;if(refUrl)URL.revokeObjectURL(refUrl);refUrl=URL.createObjectURL(f);$('refImg').src=refUrl;$('refImg').hidden=false;$('refEmpty').hidden=true};
$('start3d').onclick=async()=>{$('interactive').hidden=false;$('start3d').disabled=true;$('status').textContent='3D読み込み中…';try{const m=await import('./viewer.mjs');await m.start()}catch(e){window.r53ReviewError=e.message;$('status').textContent='3D表示できません: '+e.message;console.error(e);$('start3d').disabled=false}};window.r53ImagesReady=true;
</script></body></html>
