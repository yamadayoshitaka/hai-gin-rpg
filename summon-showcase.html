<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>灰銀のレゾナンス | 召喚獣・軍馬 3D鑑賞</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
    body{margin:0;background:#08141b;color:#eff2ed;overflow:hidden}
    canvas{display:block;width:100vw;height:100dvh;touch-action:none}
    header{position:fixed;z-index:10;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 15px;background:#0f1d2ce8;border:1px solid #587489;border-radius:13px;box-shadow:0 9px 35px #0008}
    h1{margin:0;font-size:16px;line-height:1.2;color:#e2d7a8}
    small{display:block;color:#b5c9cf;font-size:11px;margin-top:5px}
    select,button{background:#1b3447;color:#fff;border:1px solid #708f9a;border-radius:8px;font:inherit;padding:9px;min-width:125px;cursor:pointer}
    #info{position:fixed;z-index:5;left:12px;bottom:12px;right:12px;max-width:530px;border:1px solid #708f9a;background:#0f1d2ce0;border-radius:12px;padding:13px;line-height:1.7}
    header details{position:relative;z-index:22}
    header summary{list-style:none;cursor:pointer;background:#1b3447;border:1px solid #708f9a;padding:10px;border-radius:8px;font-size:13px}
    header details[open] #poseButtons{position:absolute;right:0;top:calc(100% + 5px);display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#122f43;border:1px solid #708f9a;border-radius:10px;padding:8px;min-width:270px;max-height:55dvh;overflow-y:auto;box-shadow:0 7px 25px #0009}
    #poseButtons button{min-width:0;padding:8px;font-size:13px}
    #species{font-size:22px;font-weight:700;color:#f0d28f}
    #desc{font-size:13px;color:#cdd6dc}
    #metrics{color:#a6d7d1;font-size:12px}
    a{color:#a9dceb}
    .galleryHeading{min-width:0}
    .speciesPicker{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
    .speciesPicker select{min-width:0;max-width:100%}
    #controlsDrawer{position:relative;z-index:24}
    #controlsDrawer>summary{white-space:nowrap;user-select:none}
    #controlsDrawer>summary::-webkit-details-marker{display:none}
    #controlsDrawer>summary::after{content:' ▾'}
    #controlsDrawer[open]>summary::after{content:' ▴'}
    #controlsDrawer .extraControls{
      position:absolute;right:0;top:calc(100% + 9px);display:flex;
      flex-wrap:wrap;align-items:center;gap:9px;padding:12px;
      width:min(520px,calc(100vw - 16px));max-height:70dvh;overflow-y:auto;
      background:#0f1d2cf5;border:1px solid #587489;border-radius:12px;
      box-shadow:0 12px 30px #0009
    }
    #controlsDrawer:not([open]) .extraControls{display:none}
    #controlsDrawer .extraControls a{padding:7px 5px}
    #info{padding:0;overflow-y:auto;max-height:55dvh}
    #info>summary{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:9px 13px;cursor:pointer;user-select:none;list-style:none
    }
    #info>summary::-webkit-details-marker{display:none}
    #info>summary #species{
      font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
    }
    .infoHint{color:#b9dce7;white-space:nowrap;font-size:12px}
    #info:not([open]) .hintClose,#info[open] .hintOpen{display:none}
    #info:not([open]) #infoBody{display:none}
    #infoBody{padding:0 13px 13px}
    #infoBody #desc{margin-bottom:8px}
    @media(max-width:619px){
      header{
        top:8px;left:8px;right:8px;display:flex;flex-wrap:nowrap;
        align-items:center;gap:6px;padding:7px;border-radius:10px
      }
      header .galleryHeading{display:none}
      header .speciesPicker{flex:1;min-width:0}
      header .speciesPicker .typeCaption{display:none}
      header .speciesPicker select{width:100%;font-size:14px;padding:8px 5px;height:40px}
      header #controlsDrawer{flex:none}
      header #controlsDrawer>summary{
        padding:9px 7px;min-width:76px;text-align:center;font-size:13px;height:40px
      }
      header #controlsDrawer .extraControls{
        position:fixed;left:8px;right:8px;top:62px;width:auto;
        max-height:calc(100dvh - 135px);gap:8px;padding:10px
      }
      header #controlsDrawer .extraControls>button{
        flex:1 1 calc(50% - 8px);min-width:0;font-size:13px;padding:9px 5px
      }
      header #controlsDrawer .extraControls>a{font-size:13px}
      #info{bottom:8px;left:8px;right:8px;max-width:none;max-height:46dvh}
      #info>summary{padding:9px 10px}
      #info>summary #species{font-size:14px}
      #infoBody{padding:0 10px 10px}
    }
    @media(min-width:620px){
      header{right:auto;max-width:calc(100vw - 24px)}
      #info{right:auto;width:480px}
    }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head>
<body>
  <header id="galleryHeader">
    <div class="galleryHeading"><h1>召喚獣・軍馬 3D鑑賞 v4.4.91</h1><small>森の精霊弓士・光翼の守護天使 / CC0 Quaternius人体の顔・弓・羽毛の翼・回復・蘇生</small></div>
    <label for="type" class="speciesPicker"><span class="typeCaption">種類</span><select id="type">
      <option value="wolf">灰狼</option>
      <option value="wyvern">飛竜</option>
      <option value="dragon">古竜</option>
      <option value="elder_dragon">天竜</option>
      <option value="dragon_lord">竜王（新型・二足ドラゴン）</option>
      <option value="forest_archer" selected>森の精霊弓士（NEW）</option>
      <option value="seraph_guardian">光翼の守護天使（NEW）</option>
      <option value="horse">軍馬</option>
    </select></label>
    <details id="controlsDrawer">
      <summary aria-label="操作メニューを開く・閉じる">操作メニュー</summary>
      <div class="extraControls">
    <button id="cry" type="button">鳴き声</button>
    <button id="attack" type="button">攻撃モーション</button>
    <button id="walk" type="button">移動を再生</button>
    <button id="wireframe" type="button">ポリゴンを確認</button>
    <button id="faceCloseup" type="button">顔・継ぎ目を拡大</button>
    <button id="coatCloseup" type="button" disabled>全身の毛を拡大</button>
    <button id="compareDragon" type="button" disabled>CC0外部ドラゴンを比較</button>
    <label style="font-size:12px">手元GLBで外観比較
      <input id="personalSummonGlb" type="file" accept=".glb,model/gltf-binary"
      style="max-width:180px;font-size:12px"></label>
    <details><summary>追加アクション 7種</summary><div id="poseButtons">
      <button type="button" data-pose="roar">咆哮・鳴き声</button>
      <button type="button" data-pose="special">必殺技</button>
      <button type="button" data-pose="dodge">回避</button>
      <button type="button" data-pose="guard">防御</button>
      <button type="button" data-pose="hit">被弾</button>
      <button type="button" data-pose="leap">跳躍</button>
      <button type="button" data-pose="defeat">倒れる</button>
    </div></details>
    <a href="./monster-manager.html?v=4.4.91">魔物50体の管理</a>
    <a href="./motion-external-test.html">職業・アクション画面</a>
    <a href="./tactics-wireframe.html">戦場へ</a>
      </div>
    </details>
  </header>
  <details id="info">
    <summary aria-label="召喚獣の詳細を表示・非表示"><strong id="species">森の精霊弓士</strong>
      <span class="infoHint hintOpen">詳細を見る ▴</span>
      <span class="infoHint hintClose">説明を閉じる ▾</span></summary>
    <div id="infoBody">
      <div id="desc">金髪、長いエルフ耳、森の衣装、弓・矢筒。精霊の矢で遠距離攻撃。</div>
      <div id="metrics">モデルを読み込み中...</div>
      <small>ドラッグで回転・ピンチ/ホイールで拡大。近距離では写実的な毛・鱗を貼った精細モデル、遠距離では軽量モデルに自動切替。騎乗者は戦場画面で確認。</small>
    </div>
  </details>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {COMBAT_OBJECT_SPECS} from './src/combat-action-spec.js?v=4.4.74';
    import {createCombatWorldObjectRenderer} from './src/combat-world-object-renderer.js?v=4.4.91';
    import {startCreaturePose} from './src/combat-creature-actions.js?v=4.4.91';
    import {createCreatureSoundRuntime} from './src/combat-creature-sounds.js?v=4.4.74';
    import {ActionVfxRuntime} from './src/character-system/action-vfx-runtime.js?v=4.4.23';
    import {fetchCreatureRegistry,loadExternalCreature,loadPersonalGLB} from './src/creature-external-runtime.js?v=4.4.91';
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0b1823);
    scene.fog=new THREE.Fog(0x0b1823,25,70);
    const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,130);
    camera.position.set(6,6,13);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.35;
    document.body.insertBefore(renderer.domElement,document.body.firstChild);
    const ambient=new THREE.HemisphereLight(0xdbeaff,0x4b443b,2.1);scene.add(ambient);
    const sun=new THREE.DirectionalLight(0xffe0ab,3.2);
    sun.position.set(-5,11,6);sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024);
    sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
    scene.add(sun);
    const rim=new THREE.DirectionalLight(0x83b9ff,2.4);rim.position.set(7,5,-8);scene.add(rim);
    const ground=new THREE.Mesh(new THREE.CircleGeometry(12,96),new THREE.MeshStandardMaterial({color:0x293d42,roughness:1,metalness:.05}));
    ground.rotation.x=-Math.PI/2;ground.position.y=-.035;ground.receiveShadow=true;scene.add(ground);
    const rings=new THREE.GridHelper(16,24,0x64838d,0x2d4855);rings.position.y=.006;scene.add(rings);
    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;controls.minDistance=.65;controls.maxDistance=65;
    controls.maxPolarAngle=Math.PI*.49;controls.target.set(0,2.1,0);controls.update();
    const objects=createCombatWorldObjectRenderer(scene,{camera,offset:0,cellSize:1,
      terrainY:()=>0,highDetailDistance:65});
    const creatureSounds=createCreatureSoundRuntime();
    const vfx=new ActionVfxRuntime(scene,{maxEffects:32,maxArrows:10});
    const descriptions={
       forest_archer:'森に仕える成人の精霊弓士。長い金髪・尖った耳・重なった緑の衣装、可動する弓と矢。自然属性の遠距離攻撃。',
       seraph_guardian:'人型の守護天使。白い衣装と後光、幾重にも重なる巨大な羽翼。光槍・範囲回復・蘇生を担う。',
      wolf:'成体の狼の細い頭骨・長い鼻筋・小さな目。胴体の側面・胸・腹・4本の脚・足先まで長さの異なる立体毛を追加。メニューの「全身の毛を拡大」で毛並みを確認できます。',
      wyvern:'頭部の体積と丸い眼球を縮小。鋭い眉骨・長い鼻筋・深い眼窩と、指骨・翼膜・尾・鱗。',
      dragon:'成体の頭身比で小さくした頭骨と深い眼窩。長い鼻筋・鋭い顎・牙・角・鱗・大翼。',
      elder_dragon:'頭部を絞り、瞳を細くした威圧的な成体の顔。白金の角冠、筋肉質の四肢、立体鱗。',
      dragon_lord:'参考画像のように二足直立。肩から広がる巨大な六指骨の翼、握れる四本指、長くうねる尾、重なる胸鱗、角冠と光沢のある赤い目。',
      horse:'子馬風の大きな顔・丸い目を廃止。小さな頭骨と長い鼻梁、自然な赤茶の濡れた目、長い管骨と蹄鉄。',
    };
    const phoneLayout=matchMedia('(max-width:619px)');
    const helpPanel=document.getElementById('info');
    // Use native details so folding works without custom animation handlers.
    // On wide screens the information panel starts expanded.
    if(!phoneLayout.matches)helpPanel.open=true;
    const clock=new THREE.Clock();
    let selected='forest_archer';
    let licensedRegistry={entries:{}},externalPreview=null,externalRequest=0,externalPreviewMode='licensed';
    const compareDragon=document.getElementById('compareDragon');
    const closeExternalPreview=()=>{
      externalRequest++;
      if(externalPreview){externalPreview.dispose();externalPreview=null;}
      externalPreviewMode='licensed';
      compareDragon.textContent='CC0外部ドラゴンを比較';
    };
    fetchCreatureRegistry().then(reg=>{
      licensedRegistry=reg;
      compareDragon.disabled=!reg.entries.dragon||selected!=='dragon';
    }).catch(()=>{compareDragon.disabled=true;});
    compareDragon.onclick=async()=>{
      if(selected!=='dragon')return;
      if(externalPreview){closeExternalPreview();return}
      const entry=licensedRegistry.entries.dragon;if(!entry)return;
      const ticket=++externalRequest;
      compareDragon.textContent='GLB読込中...';
      try{
        const model=await loadExternalCreature(entry,'high');
        if(ticket!==externalRequest||selected!=='dragon'){model.dispose();return}
        externalPreview=model;externalPreviewMode='licensed';scene.add(model.root);
        compareDragon.textContent='従来ドラゴンに戻す';
        controls.target.set(0,2.2,0);
        camera.position.set(5,4.6,12);
        controls.update();
      }catch(error){
        compareDragon.textContent='外部GLB読込失敗';
        console.warn('Unable to compare licensed dragon GLB',error);
      }
    };
    document.getElementById('personalSummonGlb').addEventListener('change',async event=>{
      const file=event.target.files?.[0];if(!file)return;
      if(!/\.glb$/i.test(file.name)||file.size>35_000_000){
        document.getElementById('metrics').textContent='35MB以下のGLBのみ比較できます';
        return;
      }
      closeExternalPreview();
      const id=selected,ticket=++externalRequest;
      try{
        const height=['dragon','elder_dragon','dragon_lord'].includes(id)?6:
          id==='seraph_guardian'?3:id==='forest_archer'?2.6:
          id==='horse'?2.4:2.2;
        const instance=await loadPersonalGLB(file,{id,targetHeight:height});
        if(ticket!==externalRequest||id!==selected){instance.dispose();return;}
        externalPreview=instance;externalPreviewMode='local';
        scene.add(instance.root);
        compareDragon.textContent='従来ドラゴンに戻す';
        controls.target.set(0,height*.55,0);
        camera.position.set(4,height*.85,Math.max(8,height*3));
        controls.update();
      }catch(error){
        document.getElementById('metrics').textContent='GLBを読み込めません：'+error.message;
      }
    });
    let walking=false,nextStepAt=0,routeStep=0;
    const travelRoute=[{x:0,z:0},{x:1,z:0},{x:2,z:0},{x:2,z:1},{x:1,z:1},
      {x:0,z:1},{x:-1,z:1},{x:-2,z:1},{x:-2,z:0},{x:-1,z:0}];
    let previewObject={id:'gallery-creature',type:selected,x:0,z:0,alive:true,team:0,flying:false,mountedBy:null};
    const select=document.getElementById('type');
    // Species selection stays accessible while the large action menu is folded.
    select.addEventListener('change',()=>{
      document.getElementById('controlsDrawer').open=false;
    });
    function changeType(){
      closeExternalPreview();
      document.getElementById('personalSummonGlb').value='';
      selected=select.value;
      compareDragon.disabled=selected!=='dragon'||!licensedRegistry.entries.dragon;
      document.getElementById('faceCloseup').disabled=!['forest_archer','seraph_guardian','wolf'].includes(selected);
      document.getElementById('coatCloseup').disabled=selected!=='wolf';
      previewObject={id:'gallery-'+selected,type:selected,x:0,z:0,alive:true,team:0,
        flying:!!COMBAT_OBJECT_SPECS[selected].flying,mountedBy:null,cryStartedAt:clock.getElapsedTime()};
      walking=false;routeStep=0;
      document.getElementById('walk').textContent='移動を再生';
      document.getElementById('species').textContent=COMBAT_OBJECT_SPECS[selected].name;
      document.getElementById('desc').textContent=descriptions[selected];
      const focus=selected==='forest_archer'?1.3:selected==='seraph_guardian'?1.6:selected==='dragon_lord'?6.4:selected==='elder_dragon'?2.9:selected==='dragon'?2.6:selected==='wyvern'?2.2:1.2;
      controls.target.set(0,focus,0);
      // The bat wings are about 15 world units wide at summon scale. Fit
      // their entire span even on narrow portrait phone displays.
      const dragonDistance=Math.max(37,17/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect));
      // Previously every small creature started too far from the camera:
      // an elf occupied only a tiny fraction of a portrait mobile screen.
      // Magnify regular creatures, while fitting the giant dragon's full wings.
      const phone=phoneLayout.matches;
      const distance=selected==='seraph_guardian'?(phone?11:15):
        selected==='elder_dragon'?(phone?12:15):
        selected==='wyvern'?(phone?9:12):
        selected==='dragon'?(phone?11:13):
        selected==='forest_archer'?(phone?6.4:9):phone?7:9;
      camera.position.set(selected==='dragon_lord'?3:(phone?1.8:3.6),
        focus+(selected==='dragon_lord'?2:(phone?1.7:2.6)),
        selected==='dragon_lord'?dragonDistance:distance);
      controls.update();
    }
    select.addEventListener('change',changeType);changeType();
    document.getElementById('coatCloseup').onclick=()=>{
      if(selected!=='wolf')return;
      // Frame both forepaws and hind legs plus the coat beneath the torso.
      // Aim slightly from the side so back, belly and paw silhouettes show.
      controls.target.set(0,.99,.12);
      camera.position.set(3.20,1.83,3.92);
      camera.lookAt(controls.target);
      controls.update();
    };
    document.getElementById('faceCloseup').onclick=()=>{
      if(selected==='wolf'){
        // Focus on nose, eyes, cheeks and the new physical fur silhouette.
        controls.target.set(0,1.07,1.16);
        camera.position.set(1.34,1.44,3.55);
      }else if(['forest_archer','seraph_guardian'].includes(selected)){
        controls.target.set(0,2.35,0);
        camera.position.set(1.08,2.54,1.80);
      }else return;
      camera.lookAt(controls.target);
      controls.update();
    };
    document.getElementById('cry').onclick=()=>{
      creatureSounds.unlock();
      startCreaturePose(previewObject,'roar',clock.getElapsedTime());
      previewObject.cryStartedAt=clock.getElapsedTime();
      setTimeout(()=>creatureSounds.play(selected,'spawn',{objectId:previewObject.id,force:true}),70);
    };
    document.getElementById('attack').onclick=()=>{
      creatureSounds.unlock();
      const t=clock.getElapsedTime();
      previewObject.attackStartedAt=t;
      externalPreview?.play('attack');
      previewObject.attackTarget={x:0,z:5};
      setTimeout(()=>creatureSounds.play(selected,'attack',{objectId:previewObject.id,force:true}),70);
      const origin=new THREE.Vector3(0,selected==='dragon_lord'?9:
        (selected==='horse'?1.8:2.2)+(previewObject.flying?2.6:0),selected==='dragon_lord'?3:1);
      const target=new THREE.Vector3(0,.2,6);
      if(selected==='seraph_guardian')vfx.emitArea(target,2,{element:'nature',heal:true});
       else if(selected==='forest_archer')vfx.emit('arrow',{position:origin,target,job:selected,magic:'nature',scale:1.8});
       else if(selected.includes('dragon'))vfx.emitBreath(origin,target,{element:selected==='elder_dragon'?'arcane':'fire',radius:1.25});
      else vfx.emit(selected==='wolf'?'attack':'heavy',
        {position:origin,target,job:selected,magic:'arcane',scale:1.5});
    };
    document.querySelectorAll('[data-pose]').forEach(button=>{
      button.onclick=()=>{
        const pose=button.dataset.pose,t=clock.getElapsedTime();
        startCreaturePose(previewObject,pose,t);
        externalPreview?.play(pose);
        if(pose==='roar'){
          creatureSounds.unlock();previewObject.cryStartedAt=t;
          creatureSounds.play(selected,'attack',{objectId:previewObject.id,force:true});
        }
        if(pose==='special'){
          const y=(previewObject.flying?5.3:2.2),source=new THREE.Vector3(0,y,0);
          const target=new THREE.Vector3(0,.2,6);
          if(selected==='seraph_guardian')vfx.emitArea(target,3,{element:'nature',heal:true});
          else if(selected==='forest_archer')vfx.emit('arrow',{position:source,target,job:selected,magic:'nature',scale:2.4});
          else if(selected.includes('dragon'))vfx.emitBreath(source,target,{element:'fire',radius:2.2});
          else vfx.emit('heavy',{position:source,target,job:selected,magic:'arcane',scale:2.1});
        }
      };
    });
    document.getElementById('walk').onclick=()=>{
      walking=!walking;routeStep=0;
      nextStepAt=clock.getElapsedTime();
      document.getElementById('walk').textContent=walking?'移動を停止':'移動を再生';
    };
    let polygonInspection=false;
    document.getElementById('wireframe').onclick=()=>{
      polygonInspection=!polygonInspection;
      scene.traverse(child=>{
        if(child.isInstancedMesh&&child.name.startsWith('CombatWorldObject_'))
          child.material.wireframe=polygonInspection;
      });
      document.getElementById('wireframe').textContent=polygonInspection?'通常表示に戻す':'ポリゴンを確認';
    };
    function tick(){
      requestAnimationFrame(tick);
      const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
      const spec=COMBAT_OBJECT_SPECS[selected];
      if(walking&&t>=nextStepAt){
        routeStep=(routeStep+1)%travelRoute.length;
        Object.assign(previewObject,travelRoute[routeStep]);
        nextStepAt=t+1/spec.speed;
      }
      objects.sync(externalPreview?[]:[previewObject],t);
      if(externalPreview){
        externalPreview.root.position.x=previewObject.x;
        externalPreview.root.position.z=previewObject.z;
        externalPreview.update(dt);
      }
      vfx.update(dt);
      controls.update();
      renderer.render(scene,camera);
      const lod=objects.detailStats()[selected];
      document.getElementById('metrics').textContent=
        '耐久 '+spec.hp+' / 攻撃 '+spec.attack+' / '+(spec.category==='mount'?'騎乗物':'独立召喚オブジェクト')+
        ' / 描画 '+(lod.high?'精細':'軽量')+'LOD / GPUインスタンス'+
        (selected==='forest_archer'||selected==='seraph_guardian'?
        ' / 顔 '+(objects.faceLibraryReady(selected)?'Quaternius CC0実物':'軽量モデル（読込中・代替）'):'')+
        (externalPreview?' / '+(externalPreviewMode==='local'?'手元GLB':'CC0外部候補')+'・独立3Dアニメ':'');
    }
    window.__summonGalleryLayoutQA=()=>({
      mobile:phoneLayout.matches,
      controlsOpen:document.getElementById('controlsDrawer').open,
      infoOpen:helpPanel.open,
      selected,
      cameraDistance:camera.position.distanceTo(controls.target)
    });
    tick();
    window.addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
