</head><body><canvas id="view"></canvas><header><strong>職業別アクションテスト v127.87</strong><a href="./play-1210.html?v=127.65">ゲームへ戻る</a></header>

<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#344457');scene.add(new THREE.HemisphereLight(0xe9efff,0x38404e,2.5));
const key=new THREE.DirectionalLight(0xffe3bd,2.7);key.position.set(-4,10,6);scene.add(key);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,1.35,3.2);camera.lookAt(0,1.15,0);
// Drag the preview horizontally to orbit around the character.
let orbitYaw=0,orbitPitch=0,orbitDistance=3.2,orbitTargetY=1.1;
const orbitPointers=new Map();
const previewCanvas=$('view');
previewCanvas.addEventListener('pointerdown',e=>{
 orbitPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 previewCanvas.setPointerCapture(e.pointerId);
});
previewCanvas.addEventListener('pointermove',e=>{
 const prev=orbitPointers.get(e.pointerId);
 if(!prev)return;
 orbitYaw-=(e.clientX-prev.x)*.009;
 orbitPitch=THREE.MathUtils.clamp(orbitPitch+(e.clientY-prev.y)*.004,-.55,.55);

 updateOrbitCamera();
});

}
function updateOrbitCamera(){
 const horizontal=orbitDistance*Math.cos(orbitPitch);
 camera.position.set(Math.sin(orbitYaw)*horizontal,orbitTargetY+Math.sin(orbitPitch)*orbitDistance,Math.cos(orbitYaw)*horizontal);

}
let mannequinMode=true;let faceMode=false;const headParts={eyes:false,nose:false,mouth:false,ears:false,hair:true};function syncHeadParts(){if(!host?.userData.setFacePartEnabled)return;for(const [slot,enabled] of Object.entries(headParts))host.userData.setFacePartEnabled(slot,enabled)}
function fitCharacterCamera(){
 if(!rig)return;
 rig.root.updateMatrixWorld(true);
 const visual=host.children.find(c=>c.userData?.sourceModelId&&c.visible)||rig.root;
 const box=new THREE.Box3().setFromObject(visual,true),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 const height=Math.max(.8,size.y),width=Math.max(.55,size.x);
 const vertical=(camera.fov*Math.PI/180)/2,dist=Math.max(1.2,height/(2*Math.tan(vertical))*1.12,width/(2*Math.tan(vertical)*Math.max(.65,camera.aspect))*1.25);
 orbitDistance=faceMode?Math.max(.4,dist*.27):dist;
 orbitTargetY=faceMode?box.max.y-height*.12:center.y;
 updateOrbitCamera();
}

function resizePreview(){const headerBottom=document.querySelector('header').getBoundingClientRect().bottom;const panelTop=document.querySelector('main').getBoundingClientRect().top;const height=Math.max(180,Math.floor(panelTop-headerBottom));const canvas=$('view');canvas.style.top=headerBottom+'px';canvas.style.height=height+'px';renderer.setSize(innerWidth,height);camera.aspect=innerWidth/height;camera.updateProjectionMatrix();fitCharacterCamera();}
window.addEventListener('resize',resizePreview);if(window.ResizeObserver)new ResizeObserver(resizePreview).observe(document.querySelector('main'));
const ground=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:0x59665f,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);
const grid=new THREE.GridHelper(12,12,0x8996a7,0x65757e);grid.position.y=.005;scene.add(grid);
let editValues={};let host,rig,action='idle',clock=0,cycle=false,queue=[],last=performance.now(),result=null,modelGeneration=0,modelStatus='読込準備中',sequence=false;

for(const [job,data] of Object.entries(PLAYER_JOBS)){const o=document.createElement('option');o.value=job;o.textContent=data.label;$('job').appendChild(o)}
let selectedHairColor='#30211b';
function build(){
 // Single transaction: resolve JSON first, initialize a fresh actor off-scene,
 // attach ONE visual, then publish the finished actor. Old loads cannot overwrite it.
 const generation=++modelGeneration;
 const job=$('job').value,sex=$('sex').value;
 const actor=resolveFantasyActor(job,sex);
 const contract=characterAssetRecipe(job,sex,editValues);
 for(const [slot,value] of Object.entries(contract.slots)){const selector=$('edit-'+slot);if(selector)selector.value=value;}
 const preset={...actor,...contract.slots,modelId:contract.modelId,jobId:job,role:'hero',sex};
 const nextHost=new THREE.Group();
 // Keep the actor at the world identity orientation; place the preview camera
 // in front of the imported rig instead of rotating its physics/motion frame.
 nextHost.rotation.y=0;
 nextHost.userData.localForward=[0,0,-1];
 nextHost.userData.motionForward=[0,0,-1];
 nextHost.userData.actorId='test-'+job+'-'+sex;
 nextHost.userData.characterBOM=preset;
 const jobAppearance=resolveJobVisual(job),jobIdentity=resolveJobIdentity(job);
 const nextRig=createHumanBomRig(THREE,nextHost,{id:'test-'+job,role:'hero',assembly:contract.slots});
 // Never hide the existing actor until the replacement is initialized.
 nextRig.root.traverse(part=>{
  if(part.name==='weapon-bom-mount')part.visible=contract.slots.equipment!=='none';
  if(part===nextRig.skin)part.visible=false;
  if(part.isMesh&&['torso','pelvis','head','upperArm','forearm','hand','thigh','shin','chest-shell','waist-shell','shoulder-cap','thigh-shell','calf-shell','cheek','chin','hair-lock','fringe'].includes(part.userData?.partId))part.visible=true;
 });
 // Keep the outdated procedural mesh hidden; it must not flash while the imported model loads.
 nextRig.root.visible=false;
 nextHost.userData.visualSelection={...contract.slots,job,sex,modelId:contract.modelId};
 const oldHost=host;
 host=nextHost;rig=nextRig;
 scene.add(host);
 if(oldHost)scene.remove(oldHost);
 // Imported rigged skin is the production visual authority; never overlay it with BOM.
 // Keep the procedural fallback hidden while loading to avoid mannequin flashes.
 modelStatus='外部3Dモデル読込中（旧モデル非表示）';
 fitCharacterCamera();
 attachTownOutfitNpc({host:nextHost,rig:nextRig,preset,loader:new GLTFLoader(),THREE}).then(ok=>{
  if(generation!==modelGeneration||host!==nextHost)return;
  const model=nextHost.children.find(c=>c.userData?.sourceModelId);
  if(ok&&model){
   nextHost.userData.externalNpcSync?.();
   nextHost.userData.applyJobAppearance?.(jobAppearance,jobIdentity);
   nextHost.userData.syncVisibleWeapon?.();
   nextRig.root.visible=false;
   model.visible=true;
   nextHost.userData.setMannequinFace?.(mannequinMode);
   syncHeadParts();
   nextHost.userData.setHairColor?.(selectedHairColor);
   modelStatus='モデル '+contract.modelId+' / 衣装 '+contract.slots.outfit+' / 髪 '+contract.slots.hair+' / 武器 '+contract.slots.equipment;
  }else{
   nextRig.root.visible=true;
   modelStatus='外部モデル読込失敗・代替人物を表示';
  }
  fitCharacterCamera();
 }).catch(err=>{
  if(generation!==modelGeneration||host!==nextHost)return;
  nextRig.root.visible=true;
  modelStatus='外部モデル読込失敗・代替人物を表示: '+String(err.message||err).slice(0,90);
  fitCharacterCamera();
 });
 action='idle';clock=0;result=null;sequence=false;queue=[];drawButtons();
}
function start(name){action=name;clock=0;result=null;drawButtons()}
function drawButtons(){
 const root=$('actions');root.replaceChildren();
 for(const motion of motions){const b=document.createElement('button');b.textContent=motion==='attack'?(PLAYER_JOBS[$('job').value]?.skill||'特技'):labels[motion];if(action===motion)b.className='active';b.onclick=()=>{queue=[];sequence=false;start(motion)};root.appendChild(b)}
}
function poseFrame(dt){
 const job=$('job').value,actor=resolveFantasyActor(job,$('sex').value),visual=resolveJobVisual(job),identity=resolveJobIdentity(job);
 const motionClock=clock*(actor.motion.tempo||1);
 // Imported skeleton is the sole visual pose authority. Legacy procedural
 // joint rotations, fake body bob and attack spine overrides are removed.
 const j=rig.joints;
 host.userData.previewAction=action;
 host.userData.townWind={x:1.8+0.7*Math.sin(clock*.73),z:0.8*Math.cos(clock*.47)};
 host.userData.previewActionPhase=action==='attack'?Math.min(1,Math.max(0,motionClock/.9)):0;
 host.userData.motionContact={action,time:motionClock,period:action==='walk'?.88:action==='run'?.63:1};
 host.userData.externalNpcSync?.();
 host.userData.syncVisibleWeapon?.();
 // Preview stays in place; feet and body position belong to the rig/IK solver.
 host.position.set(0,0,0);
 const limit=sequence?({idle:1.1,walk:2,run:2,attack:1.3,guard:1.4,hit:.9,dead:1.25}[action]):({attack:.9,hit:.58,dead:1.15}[action]);
 if(limit&&clock>=limit){
  result='完了';
  if(sequence){
   if(queue.length)start(queue.shift());
   else if(cycle){queue=[...motions];start(queue.shift());}
   else {sequence=false;start('idle');result='全動作完了';}
  }else if(!cycle&&action!=='dead')start('idle');
  else if(cycle)clock=0;
 }
 const equipmentQA=host.userData.equipmentDiagnostics;
 const equippedInfo=equipmentQA?(' / 武器素材 '+(equipmentQA.loaded.join('+')||'読込待ち')+' / 手との誤差 '+(equipmentQA.handDistance===null?'未計測':equipmentQA.handDistance.toFixed(3)+'m')+(equipmentQA.error?' / 読込失敗 '+equipmentQA.error:'')):' / 武器検証未初期化';
 $('diagnostics').textContent='職業 '+PLAYER_JOBS[job].label+' / '+labels[action]+' / '+clock.toFixed(2)+'秒 / '+(result||'実行中')+' / '+modelStatus+' / 共通BOMクリップ'+equippedInfo;
}
const faceFields={eyes:{label:'目',params:[['size','大きさ',.5,1.8,.05],['spacing','左右間隔',.035,.09,.005]]},nose:{label:'鼻',params:[['width','幅',.5,1.8,.05],['height','高さ',.5,1.8,.05],['projection','突出量',.5,1.8,.05]]},mouth:{label:'口',params:[['width','幅',.5,1.8,.05],['fullness','厚み',.5,1.8,.05]]},ears:{label:'耳',params:[['size','大きさ',.5,1.8,.05]]},hair:{label:'髪',params:[]}};
const faceValues={eyes:{size:1,spacing:.061,color:'#654a32'},nose:{width:1,height:1,projection:1},mouth:{width:1,fullness:1,color:'#8b4c46'},ears:{size:1}};
function refreshFace(){if(mannequinMode){mannequinMode=false;host?.userData.setMannequinFace?.(false);$('mannequin').textContent='顔をデフォルトに'}host?.userData.updateFaceParts?.(faceValues);syncHeadParts()}
for(const [slot,def] of Object.entries(faceFields)){
 const group=document.createElement('section');group.style.cssText='padding:5px;border-bottom:1px solid #53647a;display:none';group.dataset.faceSlot=slot;
 const heading=document.createElement('button');heading.textContent=def.label+'を編集';heading.onclick=()=>{headParts[slot]=true;refreshFace()};group.append(heading);
 if(slot==='hair'){
  const styleLabel=document.createElement('label');styleLabel.textContent='髪型';
  const styleSelect=document.createElement('select');styleSelect.id='face-hair-style';
  for(const style of CHARACTER_EDIT_FIELDS.hair){const option=document.createElement('option');option.value=style;option.textContent=style;styleSelect.append(option)}
  styleSelect.onchange=()=>{headParts.hair=true;editValues={...editValues,hair:styleSelect.value};build();const lower=$('edit-hair');if(lower)lower.value=styleSelect.value;};
  styleLabel.append(styleSelect);group.append(styleLabel);
  const colorLabel=document.createElement('label');colorLabel.textContent='髪色';
  const colorInput=document.createElement('input');colorInput.type='color';colorInput.id='face-hair-color';colorInput.value='#30211b';
  colorInput.oninput=()=>{selectedHairColor=colorInput.value;host?.userData.setHairColor?.(selectedHairColor);};
  colorLabel.append(colorInput);group.append(colorLabel);
 }
 for(const [key,label,min,max,step] of def.params){const row=document.createElement('label');row.textContent=label;const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=faceValues[slot][key];input.oninput=()=>{faceValues[slot][key]=Number(input.value);headParts[slot]=true;refreshFace()};row.append(input);group.append(row)}
 if(slot==='eyes'||slot==='mouth'){const color=document.createElement('input');color.type='color';color.value=faceValues[slot].color;color.oninput=()=>{faceValues[slot].color=color.value;headParts[slot]=true;refreshFace()};group.append(color)}
 $('faceControls').append(group);
}
const faceTabs=document.createElement('nav');faceTabs.style.cssText='display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;background:#142338;padding:3px 0';$('headEditor').insertBefore(faceTabs,$('faceControls'));for(const [slot,def] of Object.entries(faceFields)){const b=document.createElement('button');b.textContent=def.label;b.style.cssText='flex:1;min-width:45px;padding:7px';b.onclick=()=>{for(const s of $('faceControls').children)s.style.display=s.dataset.faceSlot===slot?'block':'none';};faceTabs.append(b)}faceTabs.firstChild.click();
$('faceTab').onclick=()=>{const panel=$('headEditor');panel.style.display=panel.style.display==='none'?'block':'none';resizePreview();if(panel.style.display==='block'&&!faceMode){faceMode=true;$('faceZoom').textContent='全身に戻す';fitCharacterCamera()}};

$('mannequin').onclick=()=>{mannequinMode=!mannequinMode;host?.userData.setMannequinFace?.(mannequinMode);$('mannequin').textContent=mannequinMode?'元の顔を表示':'顔をデフォルトに'};
$('faceZoom').onclick=()=>{faceMode=!faceMode;$('faceZoom').textContent=faceMode?'全身に戻す':'顔を拡大';fitCharacterCamera()};
$('job').onchange=()=>{editValues={};build()};$('sex').onchange=()=>{editValues={};build()};
const jp={body:'体格',face:'顔',hair:'髪',outfit:'衣装',equipment:'武器'};
for(const key of ['body','face','hair','outfit','equipment']){const label=document.createElement('label');label.textContent=jp[key];const select=document.createElement('select');select.id='edit-'+key;for(const v of CHARACTER_EDIT_FIELDS[key]){const option=document.createElement('option');option.value=v;option.textContent=v;select.appendChild(option)}select.onchange=()=>{editValues={...editValues,[key]:select.value};build();for(const field of Object.keys(jp))if(editValues[field])$('edit-'+field).value=editValues[field];};label.append(select);$('editor').append(label)}
function readEditor(){const p=readCharacterPresets()[$('target').value]||{};editValues={...p};if(p.jobId&&PLAYER_JOBS[p.jobId])$('job').value=p.jobId;if(p.sex)$('sex').value=p.sex;build();for(const key of Object.keys(jp))if(editValues[key])$('edit-'+key).value=editValues[key];}
$('target').onchange=readEditor;$('load').onclick=readEditor;
$('save').onclick=()=>{const p={...editValues,jobId:$('job').value,sex:$('sex').value};saveCharacterPreset($('target').value,p);modelStatus='保存済み：ゲーム再起動で反映';alert('保存しました。ゲームに戻って再起動すると反映されます。')};

window.__actionTestQA=()=>({job:$('job').value,action,seconds:clock,hasRig:!!rig?.joints,jointCount:rig?.root?.userData?.jointCount,queue:queue.length,sequence,modelStatus,footContact:host?.userData?.footContactDiagnostics||null,visualError:host?.userData?.characterVisualError||null,availableBones:host?.userData?.characterAvailableBones?.length||0,mappedBones:host?.userData?.characterMappedBones||[],equipment:host?.userData?.equipmentDiagnostics||null,facialAlignment:host?.userData?.characterFacialAlignment||null,fingerGrip:host?.userData?.fingerGripDiagnostics||null,weaponActionPose:host?.userData?.visibleWeaponActionPose||null,attackPhase:host?.userData?.previewActionPhase??null,poseDiagnostics:rig?.joints?{spineX:rig.joints.spine.rotation.x,shoulders:rig.joints.shoulders.map(x=>x.rotation.x),knees:rig.joints.knees.map(x=>x.rotation.x),rootY:rig.root.position.y}:null,visibleModels:host?.children?.filter?.(x=>x.visible&&x.userData?.sourceModelId).map(x=>x.userData.sourceModelId)});
