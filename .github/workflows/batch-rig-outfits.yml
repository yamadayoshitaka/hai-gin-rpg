name: Batch rig verified aligned outfits
on:
  workflow_dispatch:
jobs:
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Process aligned outfit manifest
        run: blender -b --python tools/batch_rig_outfits.py -- data/character-system/aligned-outfits.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rigging-report
          path: |
            outfit-rig-report.json
            output/rigged/*.glb
          if-no-files-found: warn
