<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人体骨格データ検証</title><style>body{font:15px system-ui;background:#132033;color:#eaf2ff;margin:0;padding:18px}main{max-width:760px;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#22354d;padding:14px;border-radius:10px}button{background:#32639b;color:white;padding:10px;border:0;border-radius:8px}</style></head><body><main><h2>人体骨格BOM検証 v1.0</h2><p>男女モデルの関節名、親子構造、基準回転、装備スロット定義をデータで検査します。これは動作・衝突の実機テストではありません。</p><button id="run">再検証</button><pre id="result">検証中...</pre></main><script type="module">import {validateRigAudit} from './src/character-system/rig-validator.js';const output=document.querySelector('#result');async function run(){try{const [audit,profiles]=await Promise.all(['data/character-system/rig-audit.json','data/character-system/rig-profiles.json'].map(async p=>{const r=await fetch(p+'?t='+Date.now());if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()}));const result=validateRigAudit(audit,profiles.profiles['quaternius-humanoid']);output.textContent=JSON.stringify(result,null,2)}catch(e){output.textContent='検証失敗: '+e.message}}document.querySelector('#run').onclick=run;run()</script></body></html>
