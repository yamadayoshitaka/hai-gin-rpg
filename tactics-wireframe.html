<body><div id="hud"><b>灰銀のレゾナンス — 立体タクティクス v2.2</b><small>1対1バトル / 青いマスをタップして移動（段差は自動ジャンプ） / ドラッグで視点回転</small><div id="selected">モデル読み込み中…</div><div id="log"></div><div id="jobTools" style="display:none"><select id="jobSelect"></select><select id="motionSelect"></select><button id="playMotion">動作再生</button></div><small><a style="color:#9adfff" href="./motion-external-test.html">外部モーション検証</a></small></div><div id="commands"><button id="move">移動</button><button id="attack">たたかう</button><button id="ability">配置 / 向き</button><button id="wait">ターン終了</button></div>
<div id="endScreen"><h1 id="outcome"></h1><div id="resultDetail"></div><button onclick="location.reload()">もう一度戦う</button></div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x091322);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,320);camera.position.set(18,23,26);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.update();
scene.add(new THREE.HemisphereLight(0xe6f3ff,0x50617b,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(8,15,6);scene.add(sun);
const SIZE=13,CELL=2.2;const elevation=(x,z)=>x>=9&&z<=4?2:x>=7&&z<=5?1:0;
const tiles=[],tileMap=new Map();const tileMaterial=new THREE.MeshBasicMaterial({color:0x122d43,transparent:true,opacity:.64,depthWrite:false});
const lineMat=new THREE.LineBasicMaterial({color:0x49bde9,transparent:true,opacity:.78});
for(let z=0;z<SIZE;z++)for(let x=0;x<SIZE;x++){
 const h=elevation(x,z),group=new THREE.Group();group.position.set((x-6)*CELL,h*.8,(z-6)*CELL);
 const box=new THREE.BoxGeometry(CELL,.8+h*.8,CELL);
 const fill=new THREE.Mesh(box,tileMaterial.clone());fill.position.y=-(.8+h*.8)/2;group.add(fill);
 const edge=new THREE.LineSegments(new THREE.EdgesGeometry(box),lineMat);edge.position.y=fill.position.y;group.add(edge);
 const top=new THREE.Mesh(new THREE.PlaneGeometry(CELL*.96,CELL*.96),new THREE.MeshBasicMaterial({color:0x2763c7,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));top.rotation.x=-Math.PI/2;top.position.y=.015;top.userData.tile={x,z,h};group.add(top);
 scene.add(group);const tile={x,z,h,group,top};tiles.push(tile);tileMap.set(x+','+z,tile);
}
const WORLD_SIZE=58;let stageData=null;try{stageData=JSON.parse(localStorage.getItem('hai-gin-stage-v1'))}catch(e){}if(!stageData||stageData.width!==58){const tiles=Array(58*58).fill('grass'),objects=[];for(let z=0;z<58;z++)for(let x=0;x<58;x++){const d=Math.abs(z-29-Math.sin(x*.18)*5);if(d<2)tiles[z*58+x]='path';else if(d<4)tiles[z*58+x]='dirt';if(d>4&&(x*17+z*31)%41===0)objects.push({id:(x+z)%3?'tree_deciduous_001':'flower_tree_001',x,z});if(d>=3&&d<=4&&x%2===0)objects.push({id:'wood_fence',x,z})}stageData={width:58,height:58,season:'summer',tiles,objects}}const groundColors={grass:0x56863c,flower:0x679b49,dirt:0x95734d,path:0xb39769,water:0x357da3,stone:0x90928c,rock:0x7a7b77,sand:0xd2ba82,snow:0xe1eced,wood:0x956a42,brick:0xb16c4f};const ground=new THREE.InstancedMesh(new THREE.BoxGeometry(CELL,.12,CELL),new THREE.MeshStandardMaterial({color:0xffffff}),58*58);const inst=new THREE.Object3D();for(let z=0;z<58;z++)for(let x=0;x<58;x++){inst.position.set((x-6)*CELL,-.55,(z-6)*CELL);inst.updateMatrix();const i=z*58+x;ground.setMatrixAt(i,inst.matrix);ground.setColorAt(i,new THREE.Color(groundColors[stageData.tiles[i]]||0x6b795a))}scene.add(ground);for(const tile of tiles){tile.group.children[0].material.color.setHex(groundColors[stageData.tiles[tile.z*58+tile.x]]||0x56863c);tile.group.children[0].material.opacity=.9;tile.group.children[1].visible=false}
const objs=stageData.objects||[],treeList=objs.filter(o=>o.id.includes('tree')),fenceList=objs.filter(o=>o.id==='wood_fence');const stems=new THREE.InstancedMesh(new THREE.CylinderGeometry(.14,.23,1.9,6),new THREE.MeshStandardMaterial({color:0x654a32}),Math.max(1,treeList.length)),crowns=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.3,1),new THREE.MeshStandardMaterial({color:0xffffff}),Math.max(1,treeList.length)),fences=new THREE.InstancedMesh(new THREE.BoxGeometry(2,.18,.16),new THREE.MeshStandardMaterial({color:0x987247}),Math.max(1,fenceList.length*2));stems.count=crowns.count=treeList.length;fences.count=fenceList.length*2;treeList.forEach((o,i)=>{inst.scale.set(1,1,1);inst.position.set((o.x-6)*CELL,.95,(o.z-6)*CELL);inst.updateMatrix();stems.setMatrixAt(i,inst.matrix);inst.position.y=2.6;inst.scale.set(1.3,1.1,1.3);inst.updateMatrix();crowns.setMatrixAt(i,inst.matrix);crowns.setColorAt(i,new THREE.Color(o.id==='flower_tree_001'?0xe3a5bd:0x34733c))});fenceList.forEach((o,i)=>{for(let k=0;k<2;k++){inst.scale.set(1,1,1);inst.position.set((o.x-6)*CELL,.5+k*.55,(o.z-6)*CELL);inst.updateMatrix();fences.setMatrixAt(i*2+k,inst.matrix)}});scene.add(stems,crowns,fences);
const actors=[],clock=new THREE.Clock(),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const specs=[{name:'剣士',job:'剣士',sex:'male',x:3,z:9,enemy:false},{name:'敵兵A',job:'剣士',sex:'male',x:9,z:3,enemy:true}];
let selected=0,mode='move',jobMap=null,enemyTurn=false,turnNumber=1,finished=false,moveUsed=false,attackUsed=false,combatBusy=false;
const log=s=>$('log').textContent=s;
function updateMotionOptions(){
 const a=actors[selected];if(!a||!jobMap)return;
 $('jobSelect').value=a.job;
 const rows=(jobMap[a.job]||[]).filter(r=>r.available===true);
 $('motionSelect').replaceChildren(...rows.map(r=>new Option(r.command,r.command)));
}
async function changeJob(job){
 const a=actors[selected];if(!a||a.enemy||!jobMap[job])return;
 const previous=a.character;
 try{
  const next=await createCharacter({job,sex:a.sex,height:.95,jobs:jobMap,jumpLift:0});
  a.root.add(next.object3D);a.character=next;a.job=job;a.name=job;
  if(previous){a.root.remove(previous.object3D);previous.dispose()}
  await action(a,'idle');refresh();
 }catch(e){a.character=previous;log('職業切替失敗: '+e.message)}
}
$('jobSelect').onchange=()=>changeJob($('jobSelect').value);
$('playMotion').onclick=async()=>{
 const a=actors[selected];if(!a?.character)return;
 const cmd=$('motionSelect').value;
 try{const ok=await a.character.playCommand(cmd);log(ok?a.job+' / '+cmd+' 再生中':'未設定: '+cmd)}
 catch(e){log(cmd+' 読込失敗: '+e.message)}
};
function cellWorld(x,z){return new THREE.Vector3((x-6)*CELL,elevation(x,z)*.8,(z-6)*CELL)}
function indicator(actor){const marker=new THREE.Mesh(new THREE.RingGeometry(.49,.57,32),new THREE.MeshBasicMaterial({color:actor.enemy?0xff6262:0x65e5ff,side:THREE.DoubleSide}));marker.rotation.x=-Math.PI/2;marker.position.y=.03;actor.root.add(marker);actor.marker=marker}
function refresh(){for(const id of ['move','attack','ability']){$(id).classList.toggle('active',mode===id);$(id).disabled=enemyTurn||finished||combatBusy||(id==='move'&&moveUsed)||(id==='attack'&&attackUsed)}$('wait').disabled=enemyTurn||finished||combatBusy;const a=actors[selected];if(a&&jobMap)updateMotionOptions();$('selected').textContent=a?'ターン '+turnNumber+' / '+(enemyTurn?'敵':'味方')+'　'+a.name+' HP '+a.hp+'/'+a.maxHp+'　敵 HP '+(actors.find(b=>b.enemy)?.hp??'--')+'　移動 '+(moveUsed?'済':'可')+' / 攻撃 '+(attackUsed?'済':'可'):'読み込み中';actors.forEach((a,i)=>{a.marker.material.color.setHex(i===selected?0xffdc72:a.enemy?0xff6262:0x65e5ff)});for(const t of tiles){const a=actors[selected],dist=a?Math.abs(a.x-t.x)+Math.abs(a.z-t.z):99;const allowed=!enemyTurn&&!moveUsed&&!finished&&mode==='move'&&a&&!a.enemy&&dist<=3&&Math.abs(elevation(a.x,a.z)-t.h)<=2&&!actors.some(b=>b!==a&&b.x===t.x&&b.z===t.z);const enemy=actors.find(b=>b.enemy&&b.hp>0);const targetable=mode==='attack'&&!attackUsed&&enemy&&a&&Math.abs(a.x-enemy.x)+Math.abs(a.z-enemy.z)<=2&&Math.abs(t.x-enemy.x)<=1&&Math.abs(t.z-enemy.z)<=1;t.top.material.opacity=targetable?.4:allowed?.32:0;t.top.material.color.setHex(targetable?0xf15a53:0x2b82f0)}}
async function action(actor,state){
 if(!actor.character)return false;
 try{const ok=await actor.character.play(state);if(ok){actor.activeState=state;if(state==='attack')actor.attackUntil=performance.now()+1100}return ok}
 catch(e){log(actor.name+' '+state+': '+e.message);return false}
}
async function init(){
 try{jobMap=(await (await fetch('./job-command-motion-map.json?v=d0938be1',{cache:'no-store'})).json()).jobs}
 catch(e){log('職業モーション定義: '+e.message);return}
 $('jobSelect').replaceChildren(...Object.keys(jobMap).map(job=>new Option(job,job)));
 for(const spec of specs){
  const root=new THREE.Group();root.position.copy(cellWorld(spec.x,spec.z));scene.add(root);
  const actor={...spec,root,character:null,travel:null,hp:spec.enemy?70:100,maxHp:spec.enemy?70:100};indicator(actor);actors.push(actor);
  try{
   const character=await createCharacter({job:spec.job,sex:spec.sex,height:.95,jobs:jobMap,jumpLift:0});
   actor.character=character;root.add(character.object3D);
   character.model.rotation.y=0;
   await action(actor,'idle');
  }catch(e){log(spec.name+' モデル読込失敗: '+e.message)}
 }
 refresh();if(!actors.some(a=>a.character))log('共通キャラクターの読み込みに失敗しました');
}
function selectTile(t){if(enemyTurn||finished||combatBusy)return;const a=actors[selected];const other=actors.findIndex(b=>b.x===t.x&&b.z===t.z);
 if(mode==='place'&&a&&!a.enemy){const dest=cellWorld(t.x,t.z);faceToward(a,dest);mode='move';log('向きを設定しました');refresh();return}
 if(other>=0){
  const target=actors[other];
  if(target.enemy&&mode==='attack'&&!attackUsed&&a&&!a.enemy){
   const dist=Math.abs(a.x-t.x)+Math.abs(a.z-t.z);
   if(dist>2){log('射程外です。2マス以内へ移動してください');return}
   attackUsed=true;
   faceToward(a,target.root.position);
   performHit(a,target,35);refresh();
  }else if(target.enemy)log('攻撃コマンドを選んでください');
  return;
 }
 if(mode!=='move'||!a||a.enemy||a.travel||moveUsed)return;
 const d=Math.abs(a.x-t.x)+Math.abs(a.z-t.z);if(d>3||Math.abs(elevation(a.x,a.z)-t.h)>2)return;
 startTravel(a,t.x,t.z);moveUsed=true;refresh();
}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(tiles.map(t=>t.top),false);if(mode==='attack'){
 const enemy=actors.find(a=>a.enemy&&a.hp>0),hero=actors[selected];
 if(enemy&&hero&&!attackUsed){
  const p=enemy.root.position,hitPoint=new THREE.Vector3();
  const screen=p.clone().project(camera);
  const sx=(screen.x+1)*innerWidth/2,sy=(1-screen.y)*innerHeight/2;
  const distPx=Math.hypot(e.clientX-sx,e.clientY-sy);
  const tileHit=hits[0]&&tileMap.get(hits[0].object.userData.tile.x+','+hits[0].object.userData.tile.z);
  if(distPx<85||(tileHit&&Math.abs(tileHit.x-enemy.x)<=1&&Math.abs(tileHit.z-enemy.z)<=1)){selectTile(tileMap.get(enemy.x+','+enemy.z));return}
 }
}if(hits[0])selectTile(tileMap.get(hits[0].object.userData.tile.x+','+hits[0].object.userData.tile.z))});
async function playReaction(actor,states){
 if(!actor.character)return false;
 for(const state of states){
  try{if(await actor.character.play(state)){actor.activeState=state;return true}}catch(e){}
 }
 return false;
}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function performHit(attacker,target,amount){
 combatBusy=true;refresh();
 faceToward(attacker,target.root.position);
 await action(attacker,'attack');
 await delay(260);
 target.hp=Math.max(0,target.hp-amount);
 log(target.name+' に '+amount+' ダメージ！ 残りHP '+target.hp);
 if(target.hp>0){
  await playReaction(target,['hit','hurt','damage','被弾','受け','被弾リアクション']);
  target.reaction={start:performance.now(),duration:650,fall:false};
  refresh();await delay(700);
  if(!finished)await action(target,'idle');
 }else{
  await playReaction(target,['death','dead','die','戦闘不能','倒れる']);
  target.reaction={start:performance.now(),duration:1150,fall:true};
  finished=true;enemyTurn=false;
  refresh();await delay(1400);
  $('outcome').textContent=target.enemy?'VICTORY':'GAME OVER';
  $('resultDetail').textContent='ターン '+turnNumber+' で戦闘終了';
  $('endScreen').style.display='flex';
 }
 combatBusy=false;refresh();
}

function faceToward(actor,point){const dx=point.x-actor.root.position.x,dz=point.z-actor.root.position.z;if(Math.hypot(dx,dz)>.001)actor.root.rotation.y=Math.atan2(dx,dz)}
function startTravel(a,x,z){
 const from=a.root.position.clone(),to=cellWorld(x,z);
 faceToward(a,to);
 const jumping=elevation(a.x,a.z)!==elevation(x,z);
 const d=Math.abs(a.x-x)+Math.abs(a.z-z);
 a.travel={from,to,elapsed:0,duration:jumping?.85:Math.max(.45,d*.38),jumping};
 a.x=x;a.z=z;action(a,jumping?'jump':'walk');
}
function waitTravel(a){return new Promise(resolve=>{
 function check(){if(!a.travel)resolve();else requestAnimationFrame(check)}
 check();
})}
async function runEnemyTurn(){
 if(enemyTurn||finished||combatBusy||actors.some(a=>a.travel))return;
 enemyTurn=true;mode='enemy';refresh();log('敵のターン');
 const hero=actors.find(a=>!a.enemy);
 for(const enemy of actors.filter(a=>a.enemy&&a.character)){
  if(!hero||finished)break;
  let dist=Math.abs(enemy.x-hero.x)+Math.abs(enemy.z-hero.z);
  if(dist>2){
   const candidates=tiles.filter(t=>{
    const step=Math.abs(t.x-enemy.x)+Math.abs(t.z-enemy.z);
    return step>0&&step<=3&&Math.abs(t.h-elevation(enemy.x,enemy.z))<=2
     &&!actors.some(a=>a!==enemy&&a.x===t.x&&a.z===t.z);
   }).sort((a,b)=>(Math.abs(a.x-hero.x)+Math.abs(a.z-hero.z))-(Math.abs(b.x-hero.x)+Math.abs(b.z-hero.z)));
   const dest=candidates.find(t=>Math.abs(t.x-hero.x)+Math.abs(t.z-hero.z)<dist);
   if(dest){startTravel(enemy,dest.x,dest.z);refresh();await waitTravel(enemy)}
  }
  dist=Math.abs(enemy.x-hero.x)+Math.abs(enemy.z-hero.z);
  if(dist<=2){
   faceToward(enemy,hero.root.position);
   await performHit(enemy,hero,20);
   await new Promise(resolve=>{const until=performance.now()+1150;function check(){if(performance.now()>=until)resolve();else requestAnimationFrame(check)}check()});
  }else log('敵兵が接近しました');
 }
 if(finished)return;enemyTurn=false;turnNumber++;moveUsed=false;attackUsed=false;selected=0;mode='move';refresh();
 log('ターン '+turnNumber+'：味方の行動');
}
$('move').onclick=()=>{if(enemyTurn||moveUsed)return;mode='move';refresh()};
$('attack').onclick=()=>{if(enemyTurn||attackUsed)return;mode='attack';refresh();log('たたかう：射程2マス以内の敵をタップしてください')};
$('ability').onclick=()=>{if(enemyTurn||finished)return;mode='place';refresh();log('向きを変えるマスをタップしてください。移動先は「移動」から選択します')};
$('wait').onclick=runEnemyTurn;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);for(const a of actors){a.character?.update(dt);if(a.travel){a.travel.elapsed+=dt;const t=Math.min(1,a.travel.elapsed/a.travel.duration);a.root.position.lerpVectors(a.travel.from,a.travel.to,t);if(a.travel.jumping)a.root.position.y+=Math.sin(Math.PI*t)*1.25;if(t>=1){a.root.position.copy(a.travel.to);a.travel=null;action(a,'idle')}}if(a.reaction){const t=Math.min(1,(performance.now()-a.reaction.start)/a.reaction.duration);const kick=Math.sin(Math.PI*t);a.character?.object3D&&(a.character.object3D.rotation.z=a.reaction.fall?Math.PI*.47*t:Math.sin(Math.PI*t)*.18);if(a.reaction.fall){a.character.object3D.position.y=-.38*t}else{a.character.object3D.position.z=-.16*kick}if(t>=1&&!a.reaction.fall){a.character.object3D.rotation.z=0;a.character.object3D.position.z=0;a.reaction=null}}if(a.activeState==='attack'&&a.attackUntil&&performance.now()>=a.attackUntil){a.attackUntil=0;action(a,'idle')}}controls.update();renderer.render(scene,camera)}animate();init();
</script></body></html>
