name: Package original Leviathan sculpt to animated PBR GLB
on:
  push:
    branches:
      - feat/creature-real-m020-mesh-rig-20261116
    paths:
      - 'assets/creatures/original/m020/*.gltf'
      - 'scripts/package-original-leviathan.py'
      - '.github/workflows/package-original-leviathan.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-real-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate PBR skin weights, real mesh, motions and export three GLBs
        run: python3 scripts/package-original-leviathan.py
      - name: Commit verified original binary 3D assets to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/creatures/original/m020/{source,high,low}.glb assets/creatures/original/m020/manifest.json
          if git diff --cached --quiet; then
            echo 'No generated-asset differences'
          else
            git commit -m 'asset(creature): commit validated m020 3-tier skeletal PBR GLBs'
            git push
          fi
