name: Capture swordsman image-to-3D references
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/capture-swordsman-ai-reference.cjs'
      - '.github/workflows/capture-swordsman-ai-reference.yml'
permissions:
  contents: write
concurrency:
  group: swordsman-ai-reference
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Start local game scene
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/swordsman-ai-reference-server.log 2>&1 &
          sleep 2
      - name: Capture the ACTUAL live swordsman from 3 sides, in 3 states
        run: node qa/capture-swordsman-ai-reference.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-swordsman-ai-reference
          path: assets/ai-reference/swordsman/
          if-no-files-found: warn
      - name: Publish screenshots for AI-to-3D references
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/ai-reference/swordsman/
          if ! git diff --cached --quiet; then
            git commit -m "Record current live swordsman geometry appearance references [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
