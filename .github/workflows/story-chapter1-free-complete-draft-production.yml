name: Chapter 1 all 462 shots - resumed Free-only real draft images

# Finite first-chapter production queue; outputs are review drafts only.
# Manual-only generation. No scheduled jobs, no paid endpoints, no automatic API retries.
# Trigger through workflow_dispatch or the explicit operator trigger file; strict per-run estimate cap.
on:
  push:
    branches: [main]
    paths:
      - 'ops/start-chapter1-full-free-actual-art-once-20261114.trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: chapter1-free-one-batch-per-day
  cancel-in-progress: false

jobs:
  chapter1:
    name: Resume up to 12 review-pages, max 7500 estimated Neurons
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout canonical main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image IO dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Validate source and canonical chapter queue
        run: |
          node --check scripts/generate-story-chapter1-free-batch.mjs
          node qa/story-chapter-page-loop.test.mjs
      - name: Fail before generation unless Free confirmed and both secrets available
        shell: bash
        env:
          FREE_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
        run: |
          set -euo pipefail
          [ "$FREE_CONFIRMED" = "true" ] || { echo "::error::Workers Free not confirmed"; exit 4; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_WORKERS_AI_API_TOKEN" ] || \
            { echo "::error::Missing credentials"; exit 5; }
          echo "Free confirmation and credentials are present (values redacted)"
      - name: Checkout persistent review-only branch
        run: |
          set -euo pipefail
          git fetch origin story/chapter1-free-actual-art
          git switch -c story/chapter1-free-actual-art --track origin/story/chapter1-free-actual-art
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Count true resume progress on persistent artwork branch
        run: node scripts/generate-story-chapter1-free-batch.mjs --mode plan
      - name: Generate real review images with strict budget and page commits
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
          CLOUDFLARE_FREE_PLAN_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_PLAN_CONFIRMED }}
          CLOUDFLARE_CHAPTER1_DAILY_ESTIMATE_CAP: '7500'
        run: node scripts/generate-story-chapter1-free-batch.mjs --mode generate --max-pages 12
      - name: Independently regress every canonical image and physical actor master (NO automatic visual approval)
        if: always()
        run: |
          node qa/story-chapter1-draft-regression.mjs --strict
      - name: Assemble at most five authentic panels per visual review sheet (never game art)
        if: always()
        run: |
          if [ -f qa-reports/story-stage-production/chapter1-free-render/c01-regression.json ]; then
            python3 scripts/build-story-chapter1-review-sheets.py
          fi
      - name: Save full chapter regression report to review branch
        if: always()
        shell: bash
        run: |
          if [ -f qa-reports/story-stage-production/chapter1-free-render/c01-regression.json ]; then
            git add -- qa-reports/story-stage-production/chapter1-free-render/c01-regression.json
            if ! git diff --cached --quiet; then
              git commit -m "qa(story): checkpoint 462-scene image integrity and manual visual QA gaps"
              git push origin HEAD:story/chapter1-free-actual-art
            fi
          fi
      - name: Publish verified image counts and quota status
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const load=(p)=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const run=load('qa-reports/story-stage-production/chapter1-free-render/last-run.json');
          const qa=load('qa-reports/story-stage-production/chapter1-free-render/c01-regression.json');
          const counts=qa?.counts||{};
          const show=(value)=>value===null||value===undefined?'unknown':String(value);
          const lines=[
            '## Chapter 1: real image production (not an approval claim)',
            '',
            '| Item | Actual result |',
            '|---|---:|',
            '| New images in THIS run | '+show(run?.newRealDraftImages)+' |',
            '| New page commits in THIS run | '+show(run?.newDraftPageCommits)+' |',
            '| Cloudflare API requests in THIS run | '+show(run?.apiRequests)+' |',
            '| Run stop reason | '+show(run?.stopReason)+' |',
            '| Canonical shots | '+show(counts.expected)+' |',
            '| Native real draft images (not visually approved) | '+show(counts.validRealReviewDraft)+' |',
            '| Pre-existing registered art (P0 not certified) | '+show(counts.existingRegistrationNotP0Approved)+' |',
            '| Missing images | '+show(counts.missing)+' |',
            '| Legacy images requiring regeneration | '+show(counts.legacyNativeRegenerationRequired)+' |',
            '| Provider safety-blocked shots | '+show(counts.providerBlocked)+' |',
            '',
            'A green workflow run does NOT mean all artwork is generated, approved, or published.',
            'On Cloudflare Free quota exhaustion there is no paid fallback and no automatic retry in that run.',
            ''
          ];
          if(qa?.stages?.length){
            lines.push('### Per-stage native drafts and remaining work','','| Stage | Drafts | Missing / rework / blocked |','|---|---:|---:|');
            for(const stage of qa.stages){
              const all=stage.scenes||[];
              const drafts=all.filter(s=>s.status==='VALID_REAL_DRAFT_VISUAL_QA_PENDING').length;
              const remaining=all.filter(s=>['MISSING_REAL_ART','LEGACY_NATIVE_REGEN_REQUIRED','PROVIDER_SAFETY_BLOCKED'].includes(s.status)).length;
              lines.push('| '+stage.stageId+' | '+drafts+' | '+remaining+' |');
            }
          }
          const content=lines.join('\n')+'\n';
          console.log(content);
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,content);
          NODE
      - name: Upload per-scene review and progress proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-free-actual-art-progress-${{ github.run_id }}
          path: |
            qa-reports/story-stage-production/chapter1-free-render/
            qa-reports/story-stage-production/chapter1-review-sheets/
          retention-days: 30
          if-no-files-found: warn
