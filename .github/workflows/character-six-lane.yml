name: FF15 character face-hair and costume six-slot QA and production gate
on:
  schedule:
    - cron: '3 * * * *'
    - cron: '13 * * * *'
    - cron: '23 * * * *'
    - cron: '33 * * * *'
    - cron: '43 * * * *'
    - cron: '53 * * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Run only one domain (all for scheduled QA)'
        required: false
        default: 'all'
        type: choice
        options: [all, faceHair, outfit]
      slot:
        description: 'Select a lane (0-5) or rotate automatically'
        required: false
        default: 'auto'
        type: choice
        options: ['auto','0','1','2','3','4','5']
  pull_request:
    paths:
      - 'src/character-system/**'
      - 'src/face-*.js'
      - 'src/independent-face-masters.js'
      - 'src/hero-hair-controls-v43.js'
      - 'src/heroine-battle-costume-bridge.js'
      - 'src/outfit-maintenance-model.js'
      - 'face-mesh-studio.html'
      - 'face-body-studio.html'
      - 'male-body-studio.html'
      - 'outfit-maintenance.html'
      - 'tactics-wireframe.html'
      - 'data/character-system/quality-six-targets.json'
      - 'scripts/character-six-batch.mjs'
      - 'qa/character-six-lane-contract.test.mjs'
      - 'qa/facehair-production-visual.cjs'
      - 'qa/battle-face-lit-visual.cjs'
      - 'qa/battle-face-lit-visual.html'
      - 'qa/outfit-fps-diagnostic.test.mjs'
      - 'scripts/outfit-fps-diagnostic.mjs'
      - 'qa/studio-model-route-contract.test.mjs'
      - 'qa/facehair-*.test.mjs'
      - 'qa/human-v65-photoreal-quality.test.mjs'
      - 'qa/independent-face-masters.test.mjs'
      - 'qa/battle-face-hair-shield-recovery.test.mjs'
      - 'qa/rider-armor-coverage-regression.test.mjs'
      - '.github/workflows/character-six-lane.yml'
permissions:
  contents: read
concurrency:
  group: character-six-v2-${{ github.ref }}-${{ github.event_name }}-${{ github.head_ref || 'scheduled' }}
  # Superseded PR revisions must not block the latest visual QA; scheduled
  # quality lanes remain non-cancelling and continue their 10-minute rotation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  six-lane-regression:
    strategy:
      fail-fast: false
      matrix:
        category: [faceHair, outfit]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Three.js QA dependency (no paid API)
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Verify both actual maintenance studios and battle asset routes
        run: node --test qa/character-six-lane-contract.test.mjs qa/studio-model-route-contract.test.mjs qa/outfit-fps-diagnostic.test.mjs
      - name: Execute this 10-minute lane for actual existing model sources
        if: github.event_name != 'pull_request' && (inputs.category == 'all' || inputs.category == matrix.category || github.event_name == 'schedule')
        env:
          INPUT_SLOT: ${{ inputs.slot || 'auto' }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$INPUT_SLOT" = 'auto' ]; then
            case "$SCHEDULED_CRON" in
              '3 * * * *') INPUT_SLOT=0;;
              '13 * * * *') INPUT_SLOT=1;;
              '23 * * * *') INPUT_SLOT=2;;
              '33 * * * *') INPUT_SLOT=3;;
              '43 * * * *') INPUT_SLOT=4;;
              '53 * * * *') INPUT_SLOT=5;;
            esac
          fi
          if [ "$INPUT_SLOT" = 'auto' ]; then
            node scripts/character-six-batch.mjs --category '${{ matrix.category }}'
          else
            node scripts/character-six-batch.mjs --category '${{ matrix.category }}' --slot "$INPUT_SLOT"
          fi
      # Every PR affecting real model sources must pass all six regression lanes;
      # the minute-based scheduled rotation alone can miss a broken hair/action lane.
      - name: Verify all six FF15 acceptance lanes before PR can be merged
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for slot in 0 1 2 3 4 5; do
            echo "::group::${{ matrix.category }} / six-lane acceptance slot ${slot}"
            node scripts/character-six-batch.mjs --category '${{ matrix.category }}' --slot "${slot}"
            echo "::endgroup::"
          done
      # The six static lanes run every 10 minutes. Only the final outfit
      # slot does a costly rendered 50v50 FPS probe; PRs validate as well.
      - name: Decide whether this run requires the real outfit FPS probe
        id: outfit_probe
        if: always() && matrix.category == 'outfit'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule || '' }}
          INPUT_CATEGORY: ${{ inputs.category || 'all' }}
          INPUT_SLOT: ${{ inputs.slot || 'auto' }}
        run: |
          if [ "$EVENT_NAME" = 'pull_request' ] || [ "$CRON" = '53 * * * *' ] || {
            [ "$EVENT_NAME" = 'workflow_dispatch' ] &&
            { [ "$INPUT_CATEGORY" = 'outfit' ] || [ "$INPUT_CATEGORY" = 'all' ]; } &&
            { [ "$INPUT_SLOT" = '5' ] || [ "$INPUT_SLOT" = 'auto' ]; }
          }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium for the actual outfit-wearing battle FPS probe
        if: always() && steps.outfit_probe.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Serve the current PR HEAD or main game, not a stub scene
        if: always() && steps.outfit_probe.outputs.run == 'true'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/outfit-battle-fps-server.log 2>&1 &
          sleep 2
      - name: Capture real 50v50 outfitted soldier CI WebGL FPS P95 draw calls and runtime errors
        if: always() && steps.outfit_probe.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: node qa/game-quality-browser.cjs --lane=frame --wizard-timeout-ms=65000
      - name: Record truthful FPS or the precise failure in archived outfit evidence
        if: always() && steps.outfit_probe.outputs.run == 'true'
        env:
          GITHUB_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/outfit-fps-diagnostic.mjs
      # Face/hair is not visually certified by a green static unit test.
      # Capture independent male/female head GLBs from the real studio and
      # the actual skinned 65-bone donor/battle PBR source once hourly or on PR.
      - name: Decide whether to run real face and hair WebGL visual regression
        id: face_probe
        if: always() && matrix.category == 'faceHair'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule || '' }}
          INPUT_CATEGORY: ${{ inputs.category || 'all' }}
          INPUT_SLOT: ${{ inputs.slot || 'auto' }}
        run: |
          if [ "$EVENT_NAME" = 'pull_request' ] || [ "$CRON" = '53 * * * *' ] || {
            [ "$EVENT_NAME" = 'workflow_dispatch' ] &&
            { [ "$INPUT_CATEGORY" = 'faceHair' ] || [ "$INPUT_CATEGORY" = 'all' ]; } &&
            { [ "$INPUT_SLOT" = '5' ] || [ "$INPUT_SLOT" = 'auto' ]; }
          }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install real face/hair screenshot and geometry inspection runtime
        if: always() && steps.face_probe.outputs.run == 'true'
        run: |
          npm install --no-save --package-lock=false three@0.160.1 playwright@1.56.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve actual face studio, donor GLB and game model source
        if: always() && steps.face_probe.outputs.run == 'true'
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 >/tmp/facehair-production-qa-server.log 2>&1 &
          sleep 2
      - name: Compare female and male face and hair geometry from four live WebGL angles
        if: always() && steps.face_probe.outputs.run == 'true'
        timeout-minutes: 8
        run: node qa/facehair-production-visual.cjs
      - name: Confirm the actual skinned battle donor face source and PBR pixels
        if: always() && steps.face_probe.outputs.run == 'true'
        timeout-minutes: 6
        run: node qa/battle-face-lit-visual.cjs
      - name: Archive separate source QA, not a false model approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-six-${{ matrix.category }}-${{ github.run_id }}
          path: |
            qa-reports/character-six-lane/${{ matrix.category }}-*.json
            qa-reports/game-quality-six/browser-frame.json
            qa-reports/game-quality-six/frame-webgl.png
            qa-screenshots/facehair-production/
            qa-screenshots/battle-face/
          retention-days: 14
          if-no-files-found: warn
      - name: Link production and previews
        if: always()
        run: |
          echo 'Face/hair renders 8 real studio views and the battle donor UV/PBR view hourly at UTC :53 and on PR. These screenshots require artistic review and do not certify FF15 quality.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Outfit FPS runs once hourly at UTC :53 and on outfit PR QA; CI SwiftShader is NOT Android FPS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production path: source/GLB change → source QA → WebGL/action QA → Android FPS gate → PR/CI → main merge → Pages release SHA.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Face studio: https://yamadayoshitaka.github.io/hai-gin-rpg/face-mesh-studio.html' >> "$GITHUB_STEP_SUMMARY"
          echo 'Outfit preview: https://yamadayoshitaka.github.io/hai-gin-rpg/outfit-maintenance.html' >> "$GITHUB_STEP_SUMMARY"
          echo 'Game: https://yamadayoshitaka.github.io/hai-gin-rpg/tactics-wireframe.html' >> "$GITHUB_STEP_SUMMARY"
