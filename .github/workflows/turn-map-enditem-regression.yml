name: Realtime squad deployment and map-command regression
on:
  push:
    branches: [main]
    paths:
      - 'src/battle-realtime-commands.js'
      - 'src/battle-realtime-deployment.js'
      - 'src/battle-realtime-commands.css'
      - 'src/mass-battle-grid-sim.js'
      - 'src/mass-battle-worker-client.js'
      - 'src/mass-battle-worker-runtime.js'
      - 'tactics-wireframe.html'
      - 'qa/turn-map-paging-regression.test.mjs'
      - '.github/workflows/turn-map-enditem-regression.yml'
  pull_request:
    paths:
      - 'src/battle-realtime-commands.js'
      - 'src/battle-realtime-deployment.js'
      - 'src/battle-realtime-commands.css'
      - 'src/mass-battle-grid-sim.js'
      - 'src/mass-battle-worker-client.js'
      - 'src/mass-battle-worker-runtime.js'
      - 'tactics-wireframe.html'
      - 'qa/turn-map-paging-regression.test.mjs'
      - '.github/workflows/turn-map-enditem-regression.yml'
permissions:
  contents: read
jobs:
  turn-mobile-map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check realtime deployment and Worker syntax
        run: |
          node --check src/battle-realtime-commands.js
          node --check src/battle-realtime-deployment.js
          node --check src/mass-battle-grid-sim.js
          node --check src/mass-battle-worker-client.js
          node --check src/mass-battle-worker-runtime.js
          node --check src/battle-hit-label-layout.js
          node --check src/confirmed-hit-overlay.js
      - name: Regression for one-time deployment, map tap and HUD isolation
        run: |
          node --experimental-vm-modules --test qa/turn-map-paging-regression.test.mjs
          node --experimental-vm-modules qa/objective-turns-all-battles.test.mjs
          node --experimental-vm-modules qa/objective-turns-ten-groups.test.mjs
          node --test qa/battle-rpg-squad-hud.test.mjs
          node qa/confirmed-hit-feedback.test.mjs
