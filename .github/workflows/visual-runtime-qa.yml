name: Validate data-driven visual assets and runtime
on:
  push:
    paths:
      - 'src/**'
      - 'assets/characters/quaternius-modular/**'
      - 'assets/props/fantasy-megakit/**'
      - 'assets/vfx/kenney/**'
      - 'index.html'
      - '.github/workflows/visual-runtime-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in src/game-runtime.js src/modular-character-runtime.js src/universal-animation-runtime.js src/visual-asset-catalog.js src/kenney-vfx-runtime.js src/cc0-town-npc-visuals.js; do
            node --input-type=module --check < "$f"
          done
      - name: Check required imported assets and glTF buffer/image dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('assets')
          for model in ('Sword_Bronze','Axe_Bronze','Shield_Wooden'):
              path=root/'props/fantasy-megakit'/f'{model}.gltf'
              assert path.is_file(), f'Missing real weapon: {path}'
              doc=json.loads(path.read_text())
              for asset in [*doc.get('buffers',[]), *doc.get('images',[])]:
                  uri=asset.get('uri')
                  if uri and not uri.startswith('data:'):
                      assert (path.parent/uri).is_file(), f'Missing {path.parent/uri}'
          partdir=root/'characters/quaternius-modular/parts'
          parts=list(partdir.glob('*.gltf'))
          assert len(parts)>=20, f'Expected skinned modular parts, got {len(parts)}'
          for asset in ('slash_02','slash_03','magic_04','spark_07','trace_06'):
              assert (root/'vfx/kenney'/f'{asset}.png').is_file(), f'Missing {asset}'
          src=Path('src/visual-asset-catalog.js').read_text()
          assert src.count(':fit(')>=20
          assert src.count(':make(')>=20
          print('PASS: modular outfits, 20 jobs, 3 weapon models, VFX sprites and resource references')
          PY
