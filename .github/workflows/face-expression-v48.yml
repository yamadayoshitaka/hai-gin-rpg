name: v48 3D face expressions and body morph
on:
  pull_request:
    paths:
      - 'src/face-expression-animation-v48.js'
      - 'src/body-build-morph-v48.js'
      - 'src/character-demographics-v47.js'
      - 'src/heroine-battle-costume-bridge.js'
      - 'face-mesh-studio.html'
      - 'face-body-studio.html'
      - 'male-body-studio.html'
      - 'qa/face-expression-v48.test.mjs'
      - 'qa/face-expression-v48-browser.cjs'
      - '.github/workflows/face-expression-v48.yml'
  push:
    branches: [main]
    paths:
      - 'src/face-expression-animation-v48.js'
      - 'src/body-build-morph-v48.js'
      - 'src/character-demographics-v47.js'
      - 'src/heroine-battle-costume-bridge.js'
      - 'face-mesh-studio.html'
      - 'face-body-studio.html'
      - 'male-body-studio.html'
      - 'qa/face-expression-v48.test.mjs'
      - 'qa/face-expression-v48-browser.cjs'
      - '.github/workflows/face-expression-v48.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expression-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0 three@0.160.1
      - run: npx playwright install chromium
      - name: Verify 3D eyelid and body morphology
        run: node --test qa/face-expression-v48.test.mjs qa/character-demographics-v47.test.mjs
      - name: Start preview server
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/v48-http.log 2>&1 &
          sleep 2
      - name: Render real male/female expressions
        run: node qa/face-expression-v48-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-expression-v48-preview
          path: qa-screenshots/face-expression-v48/
          if-no-files-found: warn
          retention-days: 14
