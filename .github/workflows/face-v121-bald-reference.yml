name: Face v121 bald reference skin PBR and WebGL
on:
  pull_request:
    paths:
      - 'scripts/build-neutral-face-v121.py'
      - 'scripts/refine-neutral-face-v121.py'
      - 'scripts/reshape-v121-reference-head.py'
      - 'qa/face-v121-four-view-mesh.test.py'
      - 'qa/face-v121-lower-face-v12.test.py'
      - 'qa/face-v121-lip-bow-reference-v14.test.py'
      - 'qa/face-v121-wig-selection.test.mjs'
      - 'qa/face-v121-makeup-contour.test.mjs'
      - 'qa/face-v121-lip-cheek-v17.test.py'
      - 'qa/face-v121-v21-lip-philtrum-geometry.test.py'
      - 'qa/face-v121-v21-visual-regression.test.mjs'
      - 'scripts/add-v121-anatomical-eye-details.py'
      - 'scripts/finish-v121-natural-folds.py'
      - 'scripts/rebuild-v121-mouth-chin.py'
      - 'scripts/fair-v121-skin-v23.py'
      - 'qa/face-v121-v23-skin.test.py'
      - 'qa/face-v121-natural-folds-cleanup.test.py'
      - 'qa/face-v121-lower-lashes-nose-lips.test.py'
      - 'qa/face-v121-eye-detail-real-glb.test.py'
      - 'face-neutral-v121.html'
      - 'face-v121-parametric-sliders.js'
      - 'face-v121-expression-player.js'
      - 'face-v121-makeup-presets.js'
      - 'scripts/add-v121-face-expressions.py'
      - 'qa/face-v121-expression-morph.test.py'
      - 'face-neutral-v120.html'
      - 'face-mesh-studio.html'
      - 'qa/face-v121-bald-reference-skin.test.py'
      - 'qa/face-v121-bald-reference-browser.test.mjs'
      - '.github/workflows/face-v121-bald-reference.yml'
      - '.github/workflows/publish-pages.yml'
      - 'scripts/prepare-pages-site.py'
  push:
    branches: [feature/face-v121-bald-reference-skin]
concurrency:
  group: face-v121-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pbr-face:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Bake v120 source neutral geometry
        run: python3 scripts/build-neutral-face-v120.py
      - name: Reconstruct original v121 GLB for backup
        run: python3 scripts/backups/build-neutral-face-v121-pre-20261123.py --out assets/generated/backups/neutral-face-v121-before-refresh.glb
      - uses: actions/upload-artifact@v4
        with:
          name: v121-before-eye-uv-refresh-backup
          path: assets/generated/backups/neutral-face-v121-before-refresh.glb
          retention-days: 10
      - name: Freeze actual v20 GLB from original main commit
        run: |
          mkdir -p qa/baselines
          git fetch --no-tags --depth=1 origin 7fa3ed27adac344c46a2076f813a1f723693075b
          git worktree add --detach /tmp/v121-v20 7fa3ed27adac344c46a2076f813a1f723693075b
          (
            cd /tmp/v121-v20
            python3 scripts/build-neutral-face-v120.py
            python3 scripts/build-neutral-face-v121.py
          )
          cp /tmp/v121-v20/assets/generated/neutral-face-v121.glb qa/baselines/face-v121-v20.glb
      - name: Rebuild immutable v22 GLB baseline and retain source SHA
        run: |
          mkdir -p qa/baselines
          git fetch --no-tags --depth=1 origin 6f5c061d33e0e9825b0982daf434e4274b1df128
          git worktree add --detach /tmp/v121-v22-qa 6f5c061d33e0e9825b0982daf434e4274b1df128
          (
            cd /tmp/v121-v22-qa
            python3 scripts/build-neutral-face-v120.py
            python3 scripts/build-neutral-face-v121.py
          )
          cp /tmp/v121-v22-qa/assets/generated/neutral-face-v121.glb qa/baselines/face-v121-v22.glb
          git worktree remove --force /tmp/v121-v22-qa
      - name: Build bald female UV-eye reference PBR skin and fixed face topology
        run: python3 scripts/build-neutral-face-v121.py
      - name: Verify actual v121 geometry, index order, PNG textures and no hair/animation
        run: |
          python3 qa/face-v121-bald-reference-skin.test.py
          python3 qa/face-v121-eye-detail-real-glb.test.py
          python3 qa/face-v121-natural-folds-cleanup.test.py
          python3 qa/face-v121-lower-lashes-nose-lips.test.py
          python3 qa/face-v121-expression-morph.test.py
          python3 qa/face-v121-four-view-mesh.test.py
          python3 qa/face-v121-lower-face-v12.test.py
          python3 qa/face-v121-lip-bow-reference-v14.test.py
          python3 qa/face-v121-lip-cheek-v17.test.py
          python3 qa/face-v121-v21-lip-philtrum-geometry.test.py
          python3 qa/face-v121-v23-skin.test.py
          node --test qa/face-v121-wig-selection.test.mjs
          node --test qa/face-v121-makeup-contour.test.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v121-bald-face-pbr-glb
          path: |
            assets/generated/neutral-face-v121.glb
            qa/baselines/face-v121-v22.glb
          retention-days: 10
  mobile-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install skin baker and real browser
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          npm install --no-save --package-lock=false playwright@1.58.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Bake actual v121 GLB
        run: |
          python3 scripts/build-neutral-face-v120.py
          python3 scripts/build-neutral-face-v121.py
      - name: Rebuild immutable v22 GLB baseline and retain source SHA
        run: |
          mkdir -p qa/baselines
          git fetch --no-tags --depth=1 origin 6f5c061d33e0e9825b0982daf434e4274b1df128
          git worktree add --detach /tmp/v121-v22-visual 6f5c061d33e0e9825b0982daf434e4274b1df128
          (
            cd /tmp/v121-v22-visual
            python3 scripts/build-neutral-face-v120.py
            python3 scripts/build-neutral-face-v121.py
          )
          cp /tmp/v121-v22-visual/assets/generated/neutral-face-v121.glb qa/baselines/face-v121-v22.glb
          git worktree remove --force /tmp/v121-v22-visual
      - name: Serve v121 3D viewer
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/face-v121-server.log 2>&1 &
          sleep 2
      - name: Mobile WebGL, side/profile and GLB download smoke
        run: |
          node --test qa/face-v121-bald-reference-browser.test.mjs
          node --test qa/face-v121-v21-visual-regression.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v121-bald-front-quarter-side-webgl
          path: |
            qa/screenshots/face-v121/**/*.png
            qa/screenshots/face-v121/v23/evidence.json
            qa/screenshots/face-v121/*.glb
          if-no-files-found: ignore
          retention-days: 10
