name: Stage-1 integrated swordsman asset QA
on:
  pull_request:
    paths:
      - 'master-swordsman-prototype.html'
      - 'src/master-swordsman-assembly.js'
      - 'qa/master-swordsman-assembly.test.mjs'
      - 'qa/master-swordsman-browser.cjs'
      - '.github/workflows/master-swordsman-prototype-qa.yml'
      - 'assets/master-sources/blender/**'
  push:
    branches: [main]
    paths:
      - 'master-swordsman-prototype.html'
      - 'src/master-swordsman-assembly.js'
      - 'qa/master-swordsman-assembly.test.mjs'
      - 'qa/master-swordsman-browser.cjs'
      - '.github/workflows/master-swordsman-prototype-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real body, morph and outfit fit assumptions
        run: |
          npm install --no-save --package-lock=false three@0.160.1
          node --test qa/master-swordsman-assembly.test.mjs
      - name: Record FF13 art gate separately
        run: |
          echo '3D fit unit tests PASS. Source materials are genuine CC0 but no FF13 grade, full skeletal retarget or photo-scanned skin is certified.' >> "$GITHUB_STEP_SUMMARY"
  real-browser-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free image comparison and browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0 pngjs@7.0.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Host actual CC0 GLBs locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hero-swordsman-http.log 2>&1 &
          sleep 2
      - name: Compare real integrated body and face/eye/wardrobe frames
        run: node qa/master-swordsman-browser.cjs
      - name: Preserve actual screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swordsman-stage1-integrated-3d-screenshots
          path: qa-screenshots/hero-swordsman/
          retention-days: 14
          if-no-files-found: warn
      - name: Explain accepted versus pending visual quality
        if: always()
        run: |
          echo 'One complete actor INSPECTION assembly tested: genuine CC0 body + real face-morph geometry + original textured garment atlas, blink proxy and steel preview ornaments.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NOT approved as a real-time game model. Pending exact facial skin atlas, full eye/lip deformation, fitted hair/helmet, armor collision fit and rigged animation QA.' >> "$GITHUB_STEP_SUMMARY"
