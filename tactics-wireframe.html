<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灰銀のレゾナンス | 立体タクティクス試作 v1.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1322;color:#edf5ff;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}
#hud{position:fixed;top:10px;left:10px;z-index:5;background:#101e33e8;border:1px solid #5b91b5;padding:12px;border-radius:10px;max-width:min(90vw,350px)}#hud b{color:#f7dfa0}#hud small{display:block;color:#a9c7d9;margin-top:4px}
#jobTools{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}#jobTools select{background:#1a3857;color:white;border:1px solid #81b7d8;padding:7px;max-width:140px}#commands{position:fixed;bottom:12px;left:10px;right:10px;z-index:5;display:flex;gap:7px;flex-wrap:wrap}button{background:#1a3857;color:#fff;border:1px solid #81b7d8;border-radius:8px;padding:11px 15px;font-weight:700}button:disabled{opacity:.4}#log{max-width:300px;white-space:pre-wrap;font-size:11px;color:#e8d39c;margin-top:5px}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head>
<body><div id="hud"><b>灰銀のレゾナンス — 立体タクティクス v1.2</b><small>一対一テスト / 青いマスをタップして移動 / ドラッグで視点回転</small><div id="selected">モデル読み込み中…</div><div id="log"></div><div id="jobTools"><select id="jobSelect"></select><select id="motionSelect"></select><button id="playMotion">動作再生</button></div><small><a style="color:#9adfff" href="./motion-external-test.html">外部モーション検証</a></small></div><div id="commands"><button id="move">移動</button><button id="jump">ジャンプ移動</button><button id="attack">攻撃</button><button id="wait">待機・次の味方</button><button id="reset">配置リセット</button><button id="camera">視点リセット</button></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createCharacter} from './src/character-system/shared-character-runtime.js?v=51ec71d0';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x091322);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);camera.position.set(18,23,26);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.update();
scene.add(new THREE.HemisphereLight(0xe6f3ff,0x50617b,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(8,15,6);scene.add(sun);
const SIZE=13,CELL=2.2;const elevation=(x,z)=>x>=9&&z<=4?2:x>=7&&z<=5?1:0;
const tiles=[],tileMap=new Map();const tileMaterial=new THREE.MeshBasicMaterial({color:0x122d43,transparent:true,opacity:.64,depthWrite:false});
const lineMat=new THREE.LineBasicMaterial({color:0x49bde9,transparent:true,opacity:.78});
for(let z=0;z<SIZE;z++)for(let x=0;x<SIZE;x++){
 const h=elevation(x,z),group=new THREE.Group();group.position.set((x-6)*CELL,h*.8,(z-6)*CELL);
 const box=new THREE.BoxGeometry(CELL,.8+h*.8,CELL);
 const fill=new THREE.Mesh(box,tileMaterial.clone());fill.position.y=-(.8+h*.8)/2;group.add(fill);
 const edge=new THREE.LineSegments(new THREE.EdgesGeometry(box),lineMat);edge.position.y=fill.position.y;group.add(edge);
 const top=new THREE.Mesh(new THREE.PlaneGeometry(CELL*.96,CELL*.96),new THREE.MeshBasicMaterial({color:0x2763c7,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));top.rotation.x=-Math.PI/2;top.position.y=.015;top.userData.tile={x,z,h};group.add(top);
 scene.add(group);const tile={x,z,h,group,top};tiles.push(tile);tileMap.set(x+','+z,tile);
}
const actors=[],clock=new THREE.Clock(),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const specs=[{name:'剣士',job:'剣士',sex:'male',x:3,z:9,enemy:false},{name:'敵兵A',job:'剣士',sex:'male',x:9,z:3,enemy:true}];
let selected=0,mode='move',jobMap=null;
const log=s=>$('log').textContent=s;
function updateMotionOptions(){
 const a=actors[selected];if(!a||!jobMap)return;
 $('jobSelect').value=a.job;
 const rows=(jobMap[a.job]||[]).filter(r=>r.available===true);
 $('motionSelect').replaceChildren(...rows.map(r=>new Option(r.command,r.command)));
}
async function changeJob(job){
 const a=actors[selected];if(!a||a.enemy||!jobMap[job])return;
 const previous=a.character;
 try{
  const next=await createCharacter({job,sex:a.sex,height:.95,jobs:jobMap,jumpLift:0});
  a.root.add(next.object3D);a.character=next;a.job=job;a.name=job;
  if(previous){a.root.remove(previous.object3D);previous.dispose()}
  await action(a,'idle');refresh();
 }catch(e){a.character=previous;log('職業切替失敗: '+e.message)}
}
$('jobSelect').onchange=()=>changeJob($('jobSelect').value);
$('playMotion').onclick=async()=>{
 const a=actors[selected];if(!a?.character)return;
 const cmd=$('motionSelect').value;
 try{const ok=await a.character.playCommand(cmd);log(ok?a.job+' / '+cmd+' 再生中':'未設定: '+cmd)}
 catch(e){log(cmd+' 読込失敗: '+e.message)}
};
function cellWorld(x,z){return new THREE.Vector3((x-6)*CELL,elevation(x,z)*.8,(z-6)*CELL)}
function indicator(actor){const marker=new THREE.Mesh(new THREE.RingGeometry(.49,.57,32),new THREE.MeshBasicMaterial({color:actor.enemy?0xff6262:0x65e5ff,side:THREE.DoubleSide}));marker.rotation.x=-Math.PI/2;marker.position.y=.03;actor.root.add(marker);actor.marker=marker}
function refresh(){const a=actors[selected];if(a&&jobMap)updateMotionOptions();$('selected').textContent=a?'選択: '+a.name+' / 座標 '+a.x+','+a.z+' / 高さ '+elevation(a.x,a.z):'読み込み中';actors.forEach((a,i)=>{a.marker.material.color.setHex(i===selected?0xffdc72:a.enemy?0xff6262:0x65e5ff)});for(const t of tiles){const a=actors[selected],dist=a?Math.abs(a.x-t.x)+Math.abs(a.z-t.z):99;const allowed=(mode==='move'||mode==='jump')&&a&&!a.enemy&&dist<=(mode==='jump'?2:3)&&Math.abs(elevation(a.x,a.z)-t.h)<=(mode==='jump'?2:1)&&!actors.some(b=>b!==a&&b.x===t.x&&b.z===t.z);t.top.material.opacity=allowed?.32:0;t.top.material.color.setHex(0x2b82f0)}}
async function action(actor,state){
 if(!actor.character)return false;
 try{const ok=await actor.character.play(state);if(ok){actor.activeState=state;if(state==='attack')actor.attackUntil=performance.now()+1100}return ok}
 catch(e){log(actor.name+' '+state+': '+e.message);return false}
}
async function init(){
 try{jobMap=(await (await fetch('./job-command-motion-map.json?v=d0938be1',{cache:'no-store'})).json()).jobs}
 catch(e){log('職業モーション定義: '+e.message);return}
 $('jobSelect').replaceChildren(...Object.keys(jobMap).map(job=>new Option(job,job)));
 for(const spec of specs){
  const root=new THREE.Group();root.position.copy(cellWorld(spec.x,spec.z));scene.add(root);
  const actor={...spec,root,character:null,travel:null};indicator(actor);actors.push(actor);
  try{
   const character=await createCharacter({job:spec.job,sex:spec.sex,height:.95,jobs:jobMap,jumpLift:0});
   actor.character=character;root.add(character.object3D);
   character.model.rotation.y=spec.enemy?Math.PI:0;
   await action(actor,'idle');
  }catch(e){log(spec.name+' モデル読込失敗: '+e.message)}
 }
 refresh();if(!actors.some(a=>a.character))log('共通キャラクターの読み込みに失敗しました');
}
function selectTile(t){const a=actors[selected];const other=actors.findIndex(b=>b.x===t.x&&b.z===t.z);
 if(other>=0){if(!actors[other].enemy){selected=other;refresh()}else if(mode==='attack'&&a&&!a.enemy&&Math.abs(a.x-t.x)+Math.abs(a.z-t.z)<=2){a.root.rotation.y=Math.atan2(actors[other].root.position.x-a.root.position.x,actors[other].root.position.z-a.root.position.z);action(a,'attack');log(a.name+' が '+actors[other].name+' に攻撃モーション')}return}
 if(!['move','jump'].includes(mode)||!a||a.enemy||a.travel)return;
 const d=Math.abs(a.x-t.x)+Math.abs(a.z-t.z);if(d>(mode==='jump'?2:3)||Math.abs(elevation(a.x,a.z)-t.h)>(mode==='jump'?2:1))return;
 const from=a.root.position.clone(),to=cellWorld(t.x,t.z);a.root.rotation.y=Math.atan2(to.x-from.x,to.z-from.z);const jumping=mode==='jump';a.travel={from,to,elapsed:0,duration:jumping?.85:Math.max(.45,d*.38),jumping};a.x=t.x;a.z=t.z;action(a,jumping?'jump':'walk');refresh();
}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(tiles.map(t=>t.top),false)[0];if(hit)selectTile(tileMap.get(hit.object.userData.tile.x+','+hit.object.userData.tile.z))});
$('move').onclick=()=>{mode='move';refresh()};$('jump').onclick=()=>{const a=actors[selected];if(!a||a.enemy||a.travel)return;mode='jump';a.travel={from:a.root.position.clone(),to:a.root.position.clone(),elapsed:0,duration:1.1,jumping:true};action(a,'jump');refresh();log('ジャンプ実行中。着地後、青いマスをタップするとジャンプ移動します')};$('attack').onclick=()=>{mode='attack';refresh();log('敵をタップすると攻撃します（試作）')};$('wait').onclick=()=>{selected=0;mode='move';refresh()};$('reset').onclick=()=>{specs.forEach((s,i)=>{actors[i].x=s.x;actors[i].z=s.z;actors[i].root.position.copy(cellWorld(s.x,s.z));actors[i].travel=null;action(actors[i],'idle')});selected=0;mode='move';refresh()};$('camera').onclick=()=>{camera.position.set(18,23,26);controls.target.set(0,0,0);controls.update()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);for(const a of actors){a.character?.update(dt);if(a.travel){a.travel.elapsed+=dt;const t=Math.min(1,a.travel.elapsed/a.travel.duration);a.root.position.lerpVectors(a.travel.from,a.travel.to,t);if(a.travel.jumping)a.root.position.y+=Math.sin(Math.PI*t)*1.25;if(t>=1){a.root.position.copy(a.travel.to);a.travel=null;action(a,'idle')}}if(a.activeState==='attack'&&a.attackUntil&&performance.now()>=a.attackUntil){a.attackUntil=0;action(a,'idle')}}controls.update();renderer.render(scene,camera)}animate();init();
</script></body></html>
