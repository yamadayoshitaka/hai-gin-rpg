name: R53 garment measured cross-section refinement
on:
  push:
    branches: [r53-fixed-face-review]
    paths:
      - 'scripts/r53-garment-refine.py'
      - 'scripts/r53-garment-refine-audit.py'
      - '.github/workflows/r53-garment-refine.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/r53-garment-refine.py scripts/r53-garment-refine-audit.py
      - uses: actions/download-artifact@v4
        with:
          name: r53-age90-male-middle
          run-id: 45637676131
          github-token: ${{ github.token }}
          path: /tmp/r53-bodies
      - uses: actions/download-artifact@v4
        with:
          name: r53-garment-male_30s_obese-Ranger
          run-id: 45654418449
          github-token: ${{ github.token }}
          path: /tmp/r53-prior
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri xauth
      - name: Refine measured garment
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          MESA_GLTHREAD: 'false'
        run: |
          mkdir -p review/refine
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python scripts/r53-garment-refine.py -- /tmp/r53-bodies /tmp/r53-prior review/refine male_30s_obese Ranger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-refined-male_30s_obese-Ranger
          path: review/refine/
          if-no-files-found: warn
  refine:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        id: [male_30s_normal, male_30s_obese, female_30s_normal, female_30s_obese]
        style: [Peasant, Ranger]
        exclude:
          - id: male_30s_obese
            style: Ranger
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: r53-age90-*-middle
          run-id: 45637676131
          github-token: ${{ github.token }}
          path: /tmp/r53-bodies
      - uses: actions/download-artifact@v4
        with:
          name: r53-garment-${{ matrix.id }}-${{ matrix.style }}
          run-id: 45654418449
          github-token: ${{ github.token }}
          path: /tmp/r53-prior
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri xauth
      - name: Refine measured garment
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          MESA_GLTHREAD: 'false'
          ID: ${{ matrix.id }}
          STYLE: ${{ matrix.style }}
        run: |
          mkdir -p review/refine
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python scripts/r53-garment-refine.py -- /tmp/r53-bodies /tmp/r53-prior review/refine "$ID" "$STYLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-refined-${{ matrix.id }}-${{ matrix.style }}
          path: review/refine/
          if-no-files-found: warn
  inventory:
    needs: [pilot, refine]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: r53-refined-*
          path: review/shards
      - name: Verify candidates without rest or pose regression
        if: always()
        run: |
          python3 -m pip install pillow
          python3 scripts/r53-garment-refine-audit.py review/shards review/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-garment-refine-summary
          path: review/summary/
          if-no-files-found: error
