name: Character regression
on:
  push:
    branches: [main]
    paths:
      - 'qa/**'
      - 'assets/characters/hair-fitted-v1/**'
      - 'src/**'
      - 'action-test.html'
      - 'package.json'
      - '.github/workflows/character-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  character-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate character asset and job actions
        run: npm run test:actions
      - name: Validate all hairstyle GLBs and equipment collision allowances
        run: npm run test:hair-equipment
      - name: Install Three.js for actual GLB fringe geometry test
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Verify real male helmet fringe fills the forehead
        run: node qa/hair-headwear-occlusion.test.mjs
      - name: Fit helmets to actual head dimensions without bald scalp
        run: node qa/helmet-fit-policy.test.mjs
      - name: Guard costume, cape, helmet and shield front/back orientation
        run: npm run test:orientation
      - name: Validate all 17 roles for male/female and hand accessory mounts
        run: npm run test:all-job-fit
      - name: Guard form-fitting cloth silhouettes for every limb
        run: npm run test:cloth-fit
