          node --check src/adaptive-battle-resolution.js
          node --check src/crowd-lod-policy.js
          node --check src/crowd-performance-budget.js
          node qa/mass-crowd-occlusion-performance.test.mjs
          node qa/army-visual-ground-tempo-parity.test.mjs
          node qa/battle-board-bald-horse-regression.test.mjs
