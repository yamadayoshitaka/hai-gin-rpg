name: R53 mob head-measured wig candidates
on:
  push:
    branches: [r53-fixed-face-review]
    paths:
      - 'scripts/r53-mob-wig-fit.py'
      - 'scripts/r53-mob-wig-audit.py'
      - '.github/workflows/r53-mob-wig.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Wait for successful source inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run watch 45714187396 --exit-status --interval 20
  fit:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        id: [mob_male_01, mob_male_02, mob_male_03, mob_male_04, mob_male_05, mob_male_06, mob_male_07, mob_male_08, mob_male_09, mob_male_10, mob_female_01, mob_female_02, mob_female_03, mob_female_04, mob_female_05, mob_female_06, mob_female_07, mob_female_08, mob_female_09, mob_female_10]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            assets/characters/hair-fitted-v1
            docs/wig-production-standard-v1.md
      - name: Syntax preflight
        run: python3 -m py_compile scripts/r53-mob-wig-fit.py scripts/r53-mob-wig-audit.py
      - uses: actions/download-artifact@v4
        with:
          name: r53-mob-study-${{ matrix.id }}
          run-id: 45714187396
          github-token: ${{ github.token }}
          path: /tmp/r53-mob
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri xauth
      - name: Fit existing hair to actual mob scalp and render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          MESA_GLTHREAD: 'false'
          ID: ${{ matrix.id }}
        run: |
          mkdir -p review/wig
          cp assets/characters/hair-fitted-v1/ATTRIBUTION.md review/wig/
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python scripts/r53-mob-wig-fit.py -- /tmp/r53-mob assets/characters/hair-fitted-v1 review/wig "$ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-mob-wig-${{ matrix.id }}
          path: review/wig/
          if-no-files-found: warn
  inventory:
    needs: [source, fit]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: r53-mob-wig-*
          path: review/shards
      - name: Verify all twenty measured fit candidates
        if: always()
        run: |
          python3 -m pip install pillow
          python3 scripts/r53-mob-wig-audit.py review/shards review/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-mob-wig-summary
          path: review/summary/
          if-no-files-found: error
