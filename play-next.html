<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰銀のレゾナンス｜新ゲーム</title><style>body{margin:0;overflow:hidden;background:#10202b;color:#fff;font:14px system-ui}canvas{display:block;touch-action:none}.panel{position:fixed;z-index:2;background:#14283ddd;border:1px solid #8ca9c4;border-radius:10px;padding:10px}#top{top:8px;left:8px;right:8px}#bottom{bottom:10px;left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}button{background:#284c73;color:white;border:1px solid #a5c3df;border-radius:7px;padding:11px 3px;font-weight:bold}#message{position:fixed;bottom:115px;left:12px;right:12px;text-align:center;text-shadow:0 2px 3px black;pointer-events:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="top" class="panel"><b>灰銀のレゾナンス｜新ゲーム v0.1</b><div id="status">建物なし・地面と人物・FFT型戦闘の基礎</div></div><div id="message">地面をタップすると移動します</div><div id="bottom" class="panel"><button id="battle">戦闘開始</button><button id="move">移動</button><button id="attack">戦う</button><button id="guard">防御</button><button id="skill">職業技</button><button id="item">アイテム</button><button id="escape">逃げる</button><button id="turn">ターン終了</button></div><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8e7);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x60704c,2.5));const sun=new THREE.DirectionalLight(0xfff4dd,2);sun.position.set(20,40,30);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),mat(0x719555));ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(22,22,0x527449,0x527449);grid.position.y=.012;scene.add(grid);grid.visible=false;
const loader=new GLTFLoader(),actors=[];const msg=document.getElementById('message'),status=document.getElementById('status');
async function addActor(name,x,z,enemy=false){const root=new THREE.Group();root.position.set(x,0,z);scene.add(root);const a={name,root,enemy,hp:enemy?65:100,acted:false,guard:false};actors.push(a);try{const gender=name==='僧侶'?'Female':'Male';const gltf=await loader.loadAsync('./assets/characters/quaternius-base/Superhero_'+gender+'_FullBody.gltf');const model=gltf.scene;root.add(model);model.scale.setScalar(.012);model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model);if(bounds.isEmpty())throw Error('empty');model.position.y-=bounds.min.y;const clip=gltf.animations[0];if(clip){const mixer=new THREE.AnimationMixer(model);mixer.clipAction(clip).play();a.mixer=mixer}}catch(e){console.warn(e);const proxy=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.9,4,8),mat(enemy?0xcc5555:0x4a72be));proxy.position.y=1;root.add(proxy)}const ring=new THREE.Mesh(new THREE.RingGeometry(.55,.68,24),new THREE.MeshBasicMaterial({color:enemy?0xf26969:0x66caff,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.025;root.add(ring);return a}
const hero=await addActor('剣士',-2,2),cleric=await addActor('僧侶',-4,3),foe=await addActor('敵兵',3,-2,true);let battle=false,mode='move',turn=1,goal=null,angle=.6;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
function message(s){msg.textContent=s}function refresh(){status.textContent=battle?'FFT型ターン戦闘 / ターン '+turn+' / 敵HP '+foe.hp+' / 味方HP '+hero.hp:'建物なし・地面と人物 / 探索モード';grid.visible=battle}
function action(m){mode=m;if(m==='battle'){battle=true;turn=1;hero.acted=false;message('マスを選んで移動・攻撃');refresh()}else if(m==='escape'){battle=false;message('戦闘から離脱');refresh()}else if(m==='turn'){if(battle&&foe.hp>0){hero.hp=Math.max(0,hero.hp-(hero.guard?4:10));turn++;hero.acted=false;hero.guard=false;message('敵のターン終了 / 主人公HP '+hero.hp)}refresh()}else if(m==='guard'){hero.guard=true;hero.acted=true;message('防御態勢')}else if(m==='item'){hero.hp=Math.min(100,hero.hp+30);message('ポーション HP '+hero.hp)}else if(m==='attack'||m==='skill'){if(!battle){message('戦闘を開始してください');return}const distance=hero.root.position.distanceTo(foe.root.position);if(distance>(m==='skill'?5:2)){message('射程外です。先に移動してください');return}const damage=m==='skill'?25:12;foe.hp=Math.max(0,foe.hp-damage);hero.acted=true;message(foe.hp===0?'敵を倒しました':foe.name+'に'+damage+'ダメージ');refresh()}else message('地面をタップして移動')}
for(const id of ['battle','move','attack','guard','skill','item','escape','turn'])document.getElementById(id).onclick=()=>action(id);
renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);if(ray.ray.intersectPlane(plane,hit)&&mode==='move'){const x=battle?Math.round(hit.x):hit.x,z=battle?Math.round(hit.z):hit.z;if(battle&&Math.hypot(x-hero.root.position.x,z-hero.root.position.z)>4){message('移動範囲外（4マス）');return}goal=new THREE.Vector3(x,0,z)}});
document.getElementById('top').addEventListener('click',()=>{angle+=Math.PI/4});const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);for(const a of actors)a.mixer?.update(dt);if(goal){const d=goal.clone().sub(hero.root.position);if(d.length()<.05)goal=null;else{d.normalize();hero.root.position.addScaledVector(d,Math.min(dt*3,hero.root.position.distanceTo(goal)));hero.root.rotation.y=Math.atan2(d.x,d.z)}}const target=hero.root.position;const desired=new THREE.Vector3(target.x+Math.sin(angle)*17,17,target.z+Math.cos(angle)*17);camera.position.lerp(desired,.08);camera.lookAt(target.x,0,target.z);renderer.render(scene,camera)}refresh();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
