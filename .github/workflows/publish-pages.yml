            v117_sculpt="https://yamadayoshitaka.github.io/hai-gin-rpg/src/face-v117-reference-portrait-mesh.js?face_verify=${GITHUB_SHA:0:12}-${attempt}"
            v119_sculpt="https://yamadayoshitaka.github.io/hai-gin-rpg/src/face-v119-portrait-contours.js?face_verify=${GITHUB_SHA:0:12}-${attempt}"
            html_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-studio.html -w '%{http_code}' "${url}" || true)
            js_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-expression.js -w '%{http_code}' "${js}" || true)
            topology_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-topology.js -w '%{http_code}' "${topology}" || true)
            local_retopo_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v106-retopo.js -w '%{http_code}' "${local_retopo}" || true)
            v107_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v107.js -w '%{http_code}' "${v107}" || true)
            initial_v110_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v110-initial.js -w '%{http_code}' "${initial_v110}" || true)
            v117_sculpt_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v117-sculpt.js -w '%{http_code}' "${v117_sculpt}" || true)
            v119_sculpt_code=$(curl -sSL --connect-timeout 8 --max-time 18 -H 'Cache-Control: no-cache' -o /tmp/public-face-v119-sculpt.js -w '%{http_code}' "${v119_sculpt}" || true)
            if [[ "${html_code}" == 200 && "${js_code}" == 200 && "${topology_code}" == 200 && "${local_retopo_code}" == 200 && "${v107_code}" == 200 && "${initial_v110_code}" == 200 && "${v117_sculpt_code}" == 200 && "${v119_sculpt_code}" == 200 ]] &&
               grep -Fq "name=\"hai-gin-pages-sha\" content=\"${GITHUB_SHA}\"" /tmp/public-face-studio.html &&
               grep -Fq '顔品質 v119' /tmp/public-face-studio.html &&
               grep -Fq 'v119-portrait-contours' /tmp/public-face-studio.html &&
               grep -Fq 'portraitV119' /tmp/public-face-studio.html &&
               grep -Fq 'enableV119PortraitContours:portraitV119' /tmp/public-face-studio.html &&
               grep -Fq 'sculptV119PortraitContours' /tmp/public-face-v119-sculpt.js &&
               grep -Fq "['female','male'].includes(gender)" /tmp/public-face-v119-sculpt.js &&
               grep -Fq 'referencePortraitV117' /tmp/public-face-studio.html &&
               grep -Fq 'enableV117ReferencePortrait:referencePortraitV117' /tmp/public-face-studio.html &&
               grep -Fq 'sculptV117ReferencePortrait' /tmp/public-face-v117-sculpt.js &&
               grep -Fq 'v114-natural-realistic-eyes' /tmp/public-face-studio.html &&
               grep -Fq 'v=20261123-v115-eye-liner-lashes' /tmp/public-face-studio.html &&
               grep -Fq 'v97BuildSignature' /tmp/public-face-expression.js &&
               grep -Fq 'fitTopologyNasalSideProfile' /tmp/public-face-topology.js &&
               grep -Fq 'refineV106CheekMouthTopology' /tmp/public-face-v106-retopo.js &&
               grep -Fq 'v110DensityProfile' /tmp/public-face-v106-retopo.js &&
               grep -Fq 'v111CheekSurface' /tmp/public-face-v106-retopo.js &&
               grep -Fq "dataset.faceMeshReady='v119'" /tmp/public-face-studio.html &&
               grep -Fq 'experimentalCheekRetopo' /tmp/public-face-studio.html &&
               grep -Fq "enableV106LocalRetopo:g==='female'&&experimentalCheekRetopo" /tmp/public-face-studio.html &&
               grep -Fq 'v113NativeNormalGeometry' /tmp/public-face-studio.html &&
               grep -Fq 'eyeQualityProbe' /tmp/public-face-studio.html &&
               grep -Fq 'v115UpperLashRootError' /tmp/public-face-studio.html &&
               grep -Fq 'orbit.enablePan=true' /tmp/public-face-studio.html &&
               grep -Fq 'orbit.touches.TWO=THREE.TOUCH.DOLLY_PAN' /tmp/public-face-studio.html &&
               grep -Fq 'faceTouchHint' /tmp/public-face-studio.html &&
               grep -Fq 'v115-eye-liner-lashes' /tmp/public-face-studio.html &&
               grep -Fq 'migrateV114UneditedAutoSavedEyes' /tmp/public-face-studio.html &&
               grep -Fq 'v114-natural-realistic-eyes' /tmp/public-face-studio.html &&
               grep -Fq 'V112_SKIN_WIRE_OVERLAY' /tmp/public-face-studio.html &&
               grep -Fq 'wireOverlayGeometryMatches' /tmp/public-face-studio.html &&
               grep -Fq 'v110InitialFemaleFaceState' /tmp/public-face-v110-initial.js &&
               grep -Fq 'v=110-approved-normal-mesh' /tmp/public-face-studio.html &&
               grep -Fq 'root-contact-v109' /tmp/public-face-studio.html &&
               grep -Fq 'id="studioTechnicalDetails"' /tmp/public-face-studio.html &&
               grep -Fq 'id="faceViewerStatus"' /tmp/public-face-studio.html &&
               grep -Fq '品質・生成ログを表示' /tmp/public-face-studio.html &&
               grep -Fq 'v107NeutralCheekDepth' /tmp/public-face-v107.js &&
               grep -Fq 'v107BuildSignature' /tmp/public-face-expression.js; then
              echo "PASS: public v119 dual-gender portrait and v117 baseline, v116 controls, v115 eye rig (${GITHUB_SHA})"
              exit 0
            fi
            echo "::warning::Face v119 verification failed: HTML ${html_code} JS ${js_code} topology ${topology_code} retopo ${local_retopo_code} v119 ${v119_sculpt_code} (attempt ${attempt}/18)"
            sleep 5
          done
          echo '::error::Pages did not pass v119 face release verification. Check current HTML version, JS modules and Pages source SHA.'
          exit 1

      - name: Verify publicly accessible R53 hero review and exact image bytes
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="https://yamadayoshitaka.github.io/hai-gin-rpg/preview/r53-hero"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 30 "$root/index.html?verify=$GITHUB_SHA-$attempt" -o /tmp/r53-review.html &&
               grep -Fq 'R53 主人公｜新旧顔比較' /tmp/r53-review.html &&
               curl -fsSL --max-time 45 "$root/assets/commander-female/master_front.png?verify=$GITHUB_SHA-$attempt" -o /tmp/r53-review.png &&
               cmp -s /tmp/r53-review.png pages-dist/preview/r53-hero/assets/commander-female/master_front.png; then
              echo 'PASS public R53 hero image preview'
              exit 0
            fi
            sleep 5
          done
          echo '::error::R53 preview not verified on public CDN'
          exit 1

      - name: Verify public GLB viewer exact bytes and versioned fallback
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="https://yamadayoshitaka.github.io/hai-gin-rpg"
          version=$(grep -oE 'GLB専用モデルビューア v[0-9.]+' glb-viewer.html | head -1 | awk '{print $NF}')
          test -n "$version"
          for attempt in $(seq 1 18); do
            if curl -fsSL --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "$root/glb-viewer.html?verify=$GITHUB_SHA-$attempt" -o /tmp/glb-viewer-live.html &&
               curl -fsSL --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "$root/glb-viewer-$version.html?verify=$GITHUB_SHA-$attempt" -o /tmp/glb-viewer-versioned-live.html &&
               cmp -s /tmp/glb-viewer-live.html pages-dist/glb-viewer.html &&
               cmp -s /tmp/glb-viewer-versioned-live.html pages-dist/glb-viewer.html; then
              echo "PASS public GLB viewer $version matches packaged HTML: $GITHUB_SHA"
              exit 0
            fi
            echo "::notice::GLB viewer public bytes not current (attempt $attempt/18)"
            sleep 5
          done
          echo '::error::Public GLB viewer is not byte-identical to the tested release'
          exit 1
