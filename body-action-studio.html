<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>灰銀｜全身アクション工房 v1.0</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#eef4fb;font:14px system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:10px}h1{font-size:17px;margin:0}a{color:#9edaff}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:8px;padding:8px}section{background:#182638;border:1px solid #354a61;border-radius:10px;padding:8px;min-width:0;min-height:0}#display{display:flex;flex-direction:column}#stage{flex:1;min-height:100px;background:#28313d;overflow:hidden;border-radius:8px}canvas{display:block;touch-action:none}#settings{overflow:auto;overscroll-behavior:contain}button,select,input{font:inherit;color:inherit;background:#233b52;border:1px solid #526d87;border-radius:7px;padding:8px;min-height:42px;max-width:100%}select,input[type=range]{width:100%}button[aria-pressed=true]{background:#277187;border-color:#a8e8ef}label{display:block;margin:7px 0}h2{font-size:15px;margin:9px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.buttons{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}.buttons button{flex:1 1 auto}small,#status{color:#bdcbd8;font-size:12px;overflow-wrap:anywhere}#status{margin:4px 0}input[type=checkbox]{min-height:0} @media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,56fr) minmax(0,44fr);padding:4px;gap:4px}header{padding:6px}h1{font-size:15px}section{padding:5px}#display button{min-height:32px;padding:3px;font-size:12px}} </style></head><body>
<header><h1>全身アクション工房 v1.0</h1><a href="./glb-viewer.html?v=1.7">顔ビューアーへ戻る</a></header>
<main><section id="display"><div id="stage"></div><div class="buttons"><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="hand">手元</button><button data-view="full">全身</button></div><p id="status" role="status">人体を読み込み中…</p></section>
<section id="settings"><h2>人物設定</h2><div class="grid"><label>性別<select id="sex"><option value="female">女性</option><option value="male">男性</option></select></label><label>年代<select id="age"></select></label><label>体型<select id="build"></select></label><label>速度<input id="speed" type="range" min=".35" max="1.6" value="1" step=".05"></label></div>
<h2>全身アクション</h2><div id="actions" class="grid"></div><div class="buttons"><button id="pause">一時停止</button><button id="reset">最初から</button></div><h2>手指と持ち物</h2><div class="grid"><label>使用する手<select id="side"><option value="r">右手</option><option value="l">左手</option><option value="both">両手</option></select></label><label>持ち物<select id="item"><option value="none">なし</option><option value="cup">コップ</option><option value="rod">棒</option><option value="box">小箱</option></select></label></div><label>握る強さ <input id="grip" type="range" min="0" max="1" step=".02" value="0"></label><div class="buttons"><button id="open">開く</button><button id="close">握る</button><button id="carry">持つ</button><button id="release">離す</button></div>
<h2>関節ポーズ</h2><label>関節<select id="joint"></select></label><div class="grid"><label>X軸<input id="rx" type="range" min="-90" max="90" value="0"></label><label>Y軸<input id="ry" type="range" min="-90" max="90" value="0"></label><label>Z軸<input id="rz" type="range" min="-90" max="90" value="0"></label><button id="resetJoint">関節補正解除</button></div><label><input id="skeleton" type="checkbox"> 骨格を表示</label>
<small>男女別65骨スキンモデルを使用。年代・体型は検証用の体格／動作プリセットです。持ち物は手の関節に追従する試作で、物理衝突・E104の顔の接続は未実装です。</small></section></main>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {AGE_PROFILES,BODY_PROFILES} from './src/character-demographics-v47.js?v=80-nine-age-bands';
import {applySkinnedBuildMorph} from './src/body-build-morph-v48.js';
import {sampleHumanClip} from './src/human-motion-clips.js';
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
const scene=new T.Scene();scene.background=new T.Color(0x28313d);
const camera=new T.PerspectiveCamera(35,1,.01,40),renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
$('stage').append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.touches.TWO=T.TOUCH.DOLLY_PAN;
scene.add(new T.HemisphereLight(0xffffff,0x8b91a0,2.2));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(3,5,4);scene.add(light,new T.GridHelper(8,32,0x486377,0x354653));
const loader=new GLTFLoader(),actor=new T.Group();scene.add(actor);
const ACTIONS={idle:'待機',walk:'歩行',run:'走行',jump:'ジャンプ',sit:'座る',crouch:'しゃがむ',bow:'お辞儀',wave:'手を振る',punch:'パンチ',grasp:'物を握る',pickup:'拾う・持ち上げる'};
const AGING={under10:[1.13,1.05,0],teens:[1.05,1,0],twenties:[1,1,0],thirties:[.97,.98,.015],forties:[.93,.94,.035],fifties:[.88,.9,.055],sixties:[.79,.83,.09],seventies:[.66,.72,.15],eightyPlus:[.54,.58,.24]};
let model=null,helper=null,bones=new Map(),rest=new Map(),overrides=new Map(),generation=0,action='idle',paused=false,t=0,gripValue=0,gripTarget=0,held=false,grabDone=false,props=[],ready=false,baseHeight=1.7,viewMode='full',last=performance.now(),nextFrame=0;
const v=(x,y,z)=>new T.Vector3(x,y,z),q=()=>new T.Quaternion(),rad=Math.PI/180;
for(const [k,p] of Object.entries(AGE_PROFILES))$('age').add(new Option(p.label,k));$('age').value='twenties';
for(const [k,p] of Object.entries(BODY_PROFILES))$('build').add(new Option(p.label,k));$('build').value='normal';
for(const [k,n] of Object.entries(ACTIONS)){const b=document.createElement('button');b.textContent=n;b.dataset.action=k;b.onclick=()=>selectAction(k);$('actions').append(b)}
function dispose(root){root?.traverse(o=>{if(o.isMesh){o.geometry?.dispose();for(const m of [].concat(o.material||[])){for(const x of Object.values(m))if(x?.isTexture)x.dispose();m.dispose()}}})}
function chosen(s){return $('side').value===s||$('side').value==='both'}
function poseRest(){for(const [name,b] of bones){const r=rest.get(name);b.position.copy(r.pos);b.quaternion.copy(r.rot);b.scale.copy(r.scale)}actor.position.y=0;actor.updateMatrixWorld(true)}
function changeAge(){if(!model)return;const age=AGE_PROFILES[$('age').value],build=BODY_PROFILES[$('build').value];const h=age.heightScale;actor.scale.set(h*(1+(build.width-1)*.24),h,h*(1+(build.depth-1)*.24));applySkinnedBuildMorph(model,$('build').value);actor.updateMatrixWorld(true);status('男女別スキンモデル / '+bones.size+'骨 / '+age.label+' / '+build.label+' / '+ACTIONS[action])}
function aim(name,child,direction){const b=bones.get(name),c=bones.get(child);if(!b||!c)return;actor.updateMatrixWorld(true);const local=c.position.clone().normalize();if(local.lengthSq()<1e-8)return;const par=b.parent.getWorldQuaternion(q());const desired=direction.clone().normalize().applyQuaternion(par.invert());const basis=rest.get(name).rot.clone();const from=local.applyQuaternion(basis);b.quaternion.copy(q().setFromUnitVectors(from,desired).multiply(basis));b.updateMatrixWorld(true)}
function rotateWorld(name,x,y,z){const b=bones.get(name);if(!b)return;const par=b.parent.getWorldQuaternion(q());const delta=q().setFromEuler(new T.Euler(x,y,z));b.quaternion.premultiply(par.clone().invert().multiply(delta).multiply(par));b.updateMatrixWorld(true)}
function fingerCurl(s,amount){const hand=bones.get('hand_'+s);if(!hand)return;const normal=v(s==='l'?1:-1,0,0).applyQuaternion(hand.getWorldQuaternion(q()));for(const finger of ['index','middle','ring','pinky','thumb'])for(let j=1;j<=3;j++){const b=bones.get(finger+'_0'+j+'_'+s);if(!b)continue;b.updateWorldMatrix(true,false);const localNormal=normal.clone().applyQuaternion(b.getWorldQuaternion(q()).invert());const axis=v(0,1,0).cross(localNormal).normalize();if(axis.lengthSq()<1e-8)continue;const angle=(finger==='thumb'?[.28,.57,.42]:[.85,1.08,.76])[j-1];b.quaternion.multiply(q().setFromAxisAngle(axis,angle*amount));b.updateMatrixWorld(true)}}
function arm(s,a,e,spread=.13){const sign=s==='l'?1:-1;aim('upperarm_'+s,'lowerarm_'+s,v(sign*spread,-Math.cos(a),Math.sin(a)));aim('lowerarm_'+s,'hand_'+s,v(sign*spread*.35,-Math.cos(a+e),Math.sin(a+e)))}
function leg(s,a,k,spread=.025){const sign=s==='l'?1:-1;aim('thigh_'+s,'calf_'+s,v(sign*spread,-Math.cos(a),Math.sin(a)));aim('calf_'+s,'foot_'+s,v(sign*spread*.25,-Math.cos(a-k),Math.sin(a-k)));aim('foot_'+s,'ball_'+s,v(0,-.28,1))}
function makeProp(type){const group=new T.Group(),mat=new T.MeshStandardMaterial({color:type==='cup'?0xb9d3de:type==='rod'?0x946f48:0x9e744c,roughness:.65});let mesh;if(type==='box')mesh=new T.Mesh(new T.BoxGeometry(.065,.065,.065),mat);else{mesh=new T.Mesh(new T.CylinderGeometry(type==='cup'?.034:.017,type==='cup'?.027:.017,type==='cup'?.085:.26,24),mat);mesh.rotation.x=Math.PI/2}group.add(mesh);return group}
function clearProps(){for(const o of props){o.removeFromParent();dispose(o)}props=[]}
function syncProps(){clearProps();const item=$('item').value;if(item==='none')return;for(const s of ['l','r'])if(chosen(s)&&bones.has('hand_'+s)){const h=bones.get('hand_'+s),m=bones.get('middle_01_'+s);const p=makeProp(item);if(held){p.position.set(s==='l'?.037:-.037,m?m.position.y*.90:.085,m?m.position.z:0);h.add(p)}else if(action==='pickup'||action==='grasp'){p.position.set(s==='l'?.25:-.25,action==='pickup'?.07:baseHeight*actor.scale.y*.56,.43);scene.add(p)}else{dispose(p);continue}props.push(p)}}
function selectAction(k){action=k;t=0;grabDone=false;paused=false;$('pause').textContent='一時停止';for(const b of $('actions').children)b.setAttribute('aria-pressed',String(b.dataset.action===k));if(k==='grasp'||k==='pickup'){gripTarget=0;held=false;if($('item').value==='none')$('item').value='cup';syncProps()}else if(k!=='idle'){held=false;syncProps();gripTarget=0}if(ready)changeStatus()}
function changeStatus(){status('スキン付き人体 / '+bones.size+'骨 / '+AGE_PROFILES[$('age').value].label+' / '+BODY_PROFILES[$('build').value].label+' / '+ACTIONS[action])}
function updatePose(dt){if(!ready)return;const [tempo,amp,stoop]=AGING[$('age').value];if(!paused)t+=dt*Number($('speed').value)*tempo;poseRest();let h=[0,0],k=[.08,.08],a=[.05,.05],e=[.17,.17],bend=stoop,bob=0;const wave=Math.sin(t*4.2);
if(action==='walk'||action==='run'){const p=sampleHumanClip(action,t,{tempo:1,hipSwing:.38*amp,shoulderSwing:.3*amp});h=p.hips;k=p.knees.map(x=>x*amp);a=p.shoulders;e=p.elbows;bob=p.bob*amp;rotateWorld('spine_02',0,p.spineY,0)}
if(action==='jump'){const u=(t%2)/2,j=Math.sin(Math.PI*u);h=[.25*j,.25*j];k=[.75*j,.75*j];a=[.7*j,.7*j];bob=.32*j*amp}
if(action==='sit'||action==='crouch'){const u=Math.min(1,t/.65);h=[1.28*u,1.28*u];k=[1.55*u,1.55*u];bend+=(action==='sit'?.18:.53)*u;bob=-(action==='sit'?.38:.40)*u}
if(action==='bow'){bend+=.65*Math.sin(Math.min(1,t/1.5)*Math.PI)}
if(action==='wave'){for(const [i,s] of ['l','r'].entries())if(chosen(s)){a[i]=1.15;e[i]=1.6+.2*wave}}
if(action==='punch'){const p=(1-Math.cos(t*5))*.5;for(const [i,s] of ['l','r'].entries())if(chosen(s)){a[i]=1.25+.23*p;e[i]=1.25*(1-p)+.08}}
if(action==='grasp'||action==='pickup'){const u=Math.min(1,t/1.8),reach=action==='pickup'?Math.sin(Math.PI*u):0;for(const [i,s] of ['l','r'].entries())if(chosen(s)){a[i]=.58+.40*reach;e[i]=.82-.65*reach}if(action==='pickup'){bend+=.65*reach;h=[.75*reach,.75*reach];k=[1.2*reach,1.2*reach];bob=-.22*reach}if(u>.45&&!grabDone){grabDone=true;held=true;gripTarget=.86;$('grip').value=.86;syncProps()}}
rotateWorld('spine_01',bend*.45,0,0);rotateWorld('spine_02',bend*.55,0,0);rotateWorld('neck_01',-bend*.34,0,0);actor.position.y=bob*actor.scale.y;actor.updateMatrixWorld(true);
for(const [i,s] of ['l','r'].entries()){leg(s,h[i],k[i]);arm(s,a[i],e[i],action==='wave'&&chosen(s)?.46:.13)}
if(!paused)gripValue+=(gripTarget-gripValue)*Math.min(1,dt*12);
for(const s of ['l','r'])if(chosen(s))fingerCurl(s,gripValue);
for(const [n,angles] of overrides){const b=bones.get(n);if(b)b.quaternion.multiply(q().setFromEuler(new T.Euler(...angles.map(x=>x*rad))))}
actor.updateMatrixWorld(true)}
function cameraView(mode){viewMode=mode;const h=baseHeight*actor.scale.y;let target=v(0,h*.51,0),dist=Math.max(2.8,h*1.9);if(mode==='hand'&&ready){const s=$('side').value==='l'?'l':'r';target=bones.get('hand_'+s).getWorldPosition(v(0,0,0));dist=.62}controls.target.copy(target);camera.position.copy(target).add(mode==='side'?v(dist,0,0):mode==='back'?v(0,.08,-dist):mode==='hand'?v(.24,.12,dist):v(0,.08,dist));controls.update()}
async function load(){const id=++generation;ready=false;status('人体GLB相当のスキンモデルを読み込み中…');const sex=$('sex').value==='female'?'Female':'Male';let next;try{const g=await loader.loadAsync('./assets/characters/quaternius-base/Superhero_'+sex+'_FullBody.gltf');next=g.scene;if(id!==generation){dispose(next);return}const map=new Map(),bind=new Map();let skins=0;next.traverse(o=>{if(o.isSkinnedMesh){skins++;o.frustumCulled=false}if(o.isBone){map.set(o.name,o);bind.set(o.name,{pos:o.position.clone(),rot:o.quaternion.clone(),scale:o.scale.clone()})}});if(!skins||map.size<60||!map.has('thumb_03_r')||!map.has('pinky_03_l'))throw Error('全身・手指骨格が不足しています');clearProps();if(helper){scene.remove(helper);helper.geometry.dispose();helper.material.dispose()}if(model){actor.remove(model);dispose(model)}model=next;bones=map;rest=bind;actor.add(model);actor.scale.setScalar(1);actor.position.set(0,0,0);model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model);baseHeight=box.max.y-box.min.y;model.position.y-=box.min.y;helper=new T.SkeletonHelper(model);helper.visible=$('skeleton').checked;scene.add(helper);overrides.clear();$('joint').replaceChildren(...[...bones.keys()].filter(n=>!/leaf/.test(n)).map(n=>new Option(n,n)));$('joint').value='hand_r';syncJoint();ready=true;changeAge();selectAction('idle');cameraView('full');window.__bodyActionAudit=()=>({ready,sex:$('sex').value,age:$('age').value,build:$('build').value,action,bones:bones.size,skins,props:props.length,held,grip:gripValue,hand: bones.get('hand_r')?.getWorldPosition(v(0,0,0)).toArray(),finger:bones.get('index_02_r')?.quaternion.toArray(),height:actor.scale.y,finite:[...bones.values()].every(b=>b.quaternion.toArray().every(Number.isFinite))})}catch(e){if(next&&next!==model)dispose(next);if(id===generation)status('人体読み込み失敗：'+e.message)}}
function syncJoint(){const a=overrides.get($('joint').value)||[0,0,0];['rx','ry','rz'].forEach((id,i)=>$(id).value=a[i])}
$('sex').onchange=load;$('age').onchange=()=>{changeAge();cameraView('full')};$('build').onchange=changeAge;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};$('reset').onclick=()=>selectAction(action);
$('side').onchange=()=>{syncProps();if(viewMode==='hand')cameraView('hand')};$('item').onchange=syncProps;$('grip').oninput=()=>{gripTarget=Number($('grip').value);if(paused)gripValue=gripTarget};$('open').onclick=()=>{gripTarget=0;$('grip').value=0;held=false;grabDone=true;syncProps();if(paused)gripValue=0};$('close').onclick=()=>{gripTarget=1;$('grip').value=1;if(paused)gripValue=1};$('carry').onclick=()=>{if($('item').value==='none')$('item').value='cup';held=true;grabDone=true;gripTarget=.86;$('grip').value=.86;if(paused)gripValue=.86;syncProps()};$('release').onclick=$('open').onclick;$('joint').onchange=syncJoint;for(const id of ['rx','ry','rz'])$(id).oninput=()=>overrides.set($('joint').value,['rx','ry','rz'].map(k=>Number($(k).value)));$('resetJoint').onclick=()=>{overrides.clear();syncJoint()};$('skeleton').onchange=()=>{if(helper)helper.visible=$('skeleton').checked};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>cameraView(b.dataset.view));
new ResizeObserver(()=>{const w=$('stage').clientWidth,h=$('stage').clientHeight;if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}}).observe($('stage'));
renderer.setAnimationLoop(now=>{if(now<nextFrame)return;nextFrame=now+1000/30-1;const dt=Math.min(.08,(now-last)/1000);last=now;updatePose(Math.max(0,dt));controls.update();renderer.render(scene,camera)});
cameraView('full');load();
</script></body></html>
