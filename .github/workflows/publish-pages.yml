name: Publish RPG Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Experimental male chest fitting']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Concurrent main merges used to cancel every Pages deploy before upload.
  # Keep one running and one queued so rapid changes cannot starve publishing.
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # The deploy-pages action enforces a hard 10-minute timeout, even when a
    # larger timeout input is requested. Keep the job slightly above that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Reject corrupted public HTML and JavaScript blobs
        run: node --experimental-vm-modules qa/pages-publication-integrity.cjs
      - name: Verify 20 chapters, story progression and recorded AI voice contract
        run: node qa/story-chronicle.test.mjs
      - name: Verify new game core, town save, shops and 200-stage transitions
        run: node --experimental-vm-modules qa/game-core-contract.test.mjs
      - name: Verify continents, gacha, NPC models and fences/flowers
        run: node qa/continent-town-gacha-regression.test.mjs
      - name: Verify registered Chapter 1 character-art references and 3D viewer linkage
        run: node qa/chapter-one-character-art-bridge.test.mjs
      - name: Verify independent male/female source-derived face meshes
        run: |
          npm install --no-save --package-lock=false three@0.160.1
          node --test qa/independent-face-masters.test.mjs
      - name: Verify illustrated dialogue, original opening and scene music
        run: |
          node --experimental-vm-modules qa/story-cinematic-audio.test.mjs
          node --experimental-vm-modules qa/stage-manga-continuity.test.mjs
          node --experimental-vm-modules qa/story-cinematic-raster.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-pages.txt
      - name: Install image optimizer for slim Pages artifact
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-pages.txt
      - name: Assemble compact game website without master asset archives
        run: python scripts/prepare-pages-site.py --out pages-dist
      # GitHub Pages can leave the deployment lock active even after the
      # original deploy-pages job times out. Release the known orphan from
      # the 2026-11-10 09:53 UTC attempt before creating a new deployment.
      - name: Release stale Pages deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Clear known timed-out backend jobs before uploading this release.
          # These IDs are commit-scoped Pages deployment IDs, not Actions run IDs.
          for stale in \
            c094e70554f6e601655657887bef1fcc6b9470d5 \
            49de908d6bc6197e8334b9d0ec2dfab8b6c88e18 \
            77f657a0972e2af5087fb048f9d202b2721c407a; do
          endpoint="repos/${GITHUB_REPOSITORY}/pages/deployments/${stale}"
          echo "Checking previous Pages deployment ${stale}"
          if state=$(gh api "${endpoint}" --jq '.status' 2>/tmp/pages-status-error); then
            echo "Pages deployment state: ${state}"
            case "${state}" in
              succeed|failed|cancelled|canceled|deployment_cancelled|deployment_succeeded|deployment_failed)
                echo "Previous Pages deployment is already terminal"
                ;;
              *)
                if gh api -X POST "${endpoint}/cancel"; then
                  echo "Stale Pages deployment cancelled"
                else
                  echo "::warning::Pages cancellation API refused; deployment may still be locked"
                fi
                ;;
            esac
          else
            echo "::warning::Could not read stale Pages status; checking whether cancellation is possible"
            if gh api -X POST "${endpoint}/cancel"; then
              echo "Stale Pages deployment cancelled"
            else
              echo "::warning::Pages cancellation unavailable (status read/cancel both failed)"
            fi
          fi
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
