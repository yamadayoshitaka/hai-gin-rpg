name: Creature family six-lane quality QA (monster and summons)
on:
  schedule:
    - cron: '5 * * * *'
    - cron: '15 * * * *'
    - cron: '25 * * * *'
    - cron: '35 * * * *'
    - cron: '45 * * * *'
    - cron: '55 * * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Run only one domain (all for scheduled QA)'
        required: false
        default: 'all'
        type: choice
        options: [all, creatureMonster, creatureSummon]
      slot:
        description: 'Run one family lane 0-5; auto picks current 10-minute slot'
        required: false
        default: 'auto'
        type: choice
        options: ['auto','0','1','2','3','4','5']
  push:
    branches: [main]
    paths:
      - 'src/avian-guardian-sculpt.js'
      - 'src/magma-salamander-sculpt.js'
      - 'src/monster-geometry.js'
      - 'src/monster-realistic-palettes.js'
      - 'src/battle-registered-monster-model.js'
      - 'qa/m019-salamander-sculpt.test.mjs'
      - 'qa/creature-face-volume-batch.test.mjs'
      - '.github/workflows/creature-six-lane.yml'
  pull_request:
    paths:
      - 'src/creature-*.js'
      - 'src/avian-guardian-sculpt.js'
      - 'src/magma-salamander-sculpt.js'
      - 'src/monster-geometry.js'
      - 'src/monster-realistic-palettes.js'
      - 'src/battle-registered-monster-model.js'
      - 'qa/m019-salamander-sculpt.test.mjs'
      - 'qa/creature-face-volume-batch.test.mjs'
      - 'src/monster-*.js'
      - 'src/combat-creature-*.js'
      - 'data/creature-quality-standards.json'
      - 'scripts/creature-six-batch.mjs'
      - 'qa/creature-six-lane-contract.test.mjs'
      - '.github/workflows/creature-six-lane.yml'
permissions:
  contents: read
concurrency:
  group: creature-six-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  inspect-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        category: [creatureMonster, creatureSummon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic open-source geometry runtime
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Verify all 108 canonical IDs, protected assets and game adoption route
        run: node --test qa/creature-six-lane-contract.test.mjs
      - name: Verify magma salamander wolf-derived head, eyes, horns, planted short legs and LOD
        if: matrix.category == 'creatureMonster'
        run: node --test qa/m019-salamander-sculpt.test.mjs
      - name: Verify true avian head relief in both categories before main adoption
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: node --test qa/creature-face-volume-batch.test.mjs
      - name: Review one species family, retain protected ancestors
        if: inputs.category == 'all' || inputs.category == matrix.category || github.event_name != 'workflow_dispatch'
        env:
          INPUT_SLOT: ${{ inputs.slot || 'auto' }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$INPUT_SLOT" = 'auto' ]; then
            case "$SCHEDULED_CRON" in
              '5 * * * *') INPUT_SLOT=0;;
              '15 * * * *') INPUT_SLOT=1;;
              '25 * * * *') INPUT_SLOT=2;;
              '35 * * * *') INPUT_SLOT=3;;
              '45 * * * *') INPUT_SLOT=4;;
              '55 * * * *') INPUT_SLOT=5;;
            esac
          fi
          if [ "$INPUT_SLOT" = 'auto' ]; then
            node scripts/creature-six-batch.mjs --category '${{ matrix.category }}'
          else
            node scripts/creature-six-batch.mjs --category '${{ matrix.category }}' --slot "$INPUT_SLOT"
          fi
      - name: Save actual QA results (do not claim meshes were generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creature-six-${{ matrix.category }}-${{ github.run_id }}
          path: qa-reports/creature-six-lane/${{ matrix.category }}-*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Real game route and production gate
        if: always()
        run: |
          echo 'Monster+summon game route: creature-game-model-routing.js and monster-summon-registry.js. A reference image or GLB candidate alone is not automatically adopted.' >> "$GITHUB_STEP_SUMMARY"
          echo '8 dedicated summons / 50 mirrored summons / 50 monsters, no unauthorized change to m005/m006 or mirror copies.' >> "$GITHUB_STEP_SUMMARY"
