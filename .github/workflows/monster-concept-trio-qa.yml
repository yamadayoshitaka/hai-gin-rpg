name: Creature and humanoid 2D-to-3D mesh regression
on:
  pull_request:
    paths:
      - 'src/monster-concept-trio-sculpt.js'
      - 'src/monster-concept-trio-sculpt-v2.js'
      - 'src/monster-concept-v2-mesh.js'
      - 'src/monster-geometry.js'
      - 'src/monster-catalog.js'
      - 'src/creature-game-model-routing.js'
      - 'src/monster-character-cosplay.js'
      - 'src/monster-construct-costume.js'
      - 'src/monster-mineral-limb-articulator.js'
      - 'src/monster-demon-cosmetics.js'
      - 'qa/monster-humanoid-armor-articulation.test.mjs'
      - 'qa/capture-monster-body-cdp.mjs'
      - 'src/monster-construct-anatomy-v3.js'
      - 'src/monster-humanoid-concept-finish.js'
      - 'src/monster-character-cosplay-manifest.js'
      - 'qa/monster-concept-trio.test.mjs'
      - 'qa/monster-humanoid-concept-finish.test.mjs'
      - 'qa/monster-golem-full-shell.test.mjs'
      - 'qa/monster-golem-full-shell-visual.html'
      - 'monster-manager.html'
      - 'qa/monster-golem-full-shell-visual.html'
      - 'src/monster-summon-renderer.js'
      - 'package.json'
      - 'qa/monster-concept-v2-visual.html'
      - '.github/workflows/monster-concept-trio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js for actual 3D mesh assertions
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Verify syntax of physically sculpted surfaces
        run: |
          node --check src/monster-concept-v2-mesh.js
          node --check src/monster-concept-trio-sculpt-v2.js
      - name: Verify source integrity and all 8 species + high/low LOD
        run: |
          node --check src/monster-concept-trio-sculpt.js
          node --check src/monster-geometry.js
          node --check src/monster-reference-design.js
          npm run test:monster-concept-trio
          node --check src/monster-humanoid-concept-finish.js
          node --check src/monster-character-cosplay.js
          npm run test:humanoid-concept
          node --check src/monster-construct-costume.js
          node --check src/monster-construct-anatomy-v3.js
          npm run test:golem-full-shell
          node --check src/monster-mineral-limb-articulator.js
          node --check src/monster-demon-cosmetics.js
          node qa/monster-humanoid-armor-articulation.test.mjs
          node qa/monster-16-cosplay-pigment-regression.test.mjs

      - name: Capture real Three.js monster visuals in headless browser
        run: |
          command -v google-chrome
          mkdir -p qa-reports/monster-concept-v2
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/monster-v2-serve.log 2>&1 &
          sleep 1
          for id in m030 m046 m049; do
            timeout 30s google-chrome --headless --no-sandbox --disable-dev-shm-usage \
              --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader \
              --hide-scrollbars --virtual-time-budget=9000 \
              --window-size=1200,850 \
              --screenshot="qa-reports/monster-concept-v2/${id}.png" \
              "http://127.0.0.1:8765/qa/monster-concept-v2-visual.html?id=${id}" \
              2>/tmp/monster-v2-chrome.log
            test -s "qa-reports/monster-concept-v2/${id}.png"
            bytes=$(stat -c%s "qa-reports/monster-concept-v2/${id}.png")
            if [ "$bytes" -lt 40000 ]; then
              echo "FAILED: Headless screenshot is too small (${bytes} bytes); possibly blank WebGL canvas" >&2
              tail -60 /tmp/monster-v2-chrome.log >&2
              exit 1
            fi
            echo "CONCEPT-V2-SCREENSHOT:${id}:BEGIN"
            base64 -w 2048 "qa-reports/monster-concept-v2/${id}.png" | sed 's/^/CONCEPT-V2-B64:/'
            echo "CONCEPT-V2-SCREENSHOT:${id}:END"
          done
      - name: Verify actual GLTF poses through Chrome DevTools (not screenshots of errors)
        run: |
          mkdir -p qa-reports/golem-full-shell
          node --check qa/capture-monster-body-cdp.mjs
          for selection in m038:idle m038:walk m042:idle m045:idle; do
            IFS=: read -r id pose <<< "$selection"
            node qa/capture-monster-body-cdp.mjs "$id" "$pose" "qa-reports/golem-full-shell/${id}-${pose}.png"
          done
      - name: Retain all rigged fullbody humanoid screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-shell-posed-captures
          path: qa-reports/golem-full-shell/*.png
          retention-days: 14
      - name: Retain 3D reference preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-concept-v2-captures
          path: qa-reports/monster-concept-v2/*.png
          retention-days: 14
