name: R54 independent measured head prototype review only
on:
  push:
    branches: [r53-fixed-face-review]
    paths:
      - 'scripts/r54-new-measured-head.py'
      - '.github/workflows/r54-new-measured-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/r54-new-measured-head.py
            data
          sparse-checkout-cone-mode: false
      - run: python3 -m py_compile scripts/r54-new-measured-head.py
      - name: Install Blender from Ubuntu package repositories
        shell: bash
        run: |
          set -euo pipefail
          # The review build needs Ubuntu packages only. Limit APT to the
          # runner's Ubuntu sources; an unrelated Microsoft feed returned 403.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y blender python3-numpy xvfb libgl1-mesa-dri xauth
          blender --version
      - name: Build new geometry and render actual JPGs
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: xvfb-run -a blender -b -t 2 --python-exit-code 1 --python scripts/r54-new-measured-head.py -- review/r54-new-head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r54-independent-head-review
          path: review/r54-new-head/
          if-no-files-found: warn
