name: Story compact 20-chapter runtime regression
on:
  pull_request:
    paths:
      - 'src/story-compact-comic.js'
      - 'src/story-panel-registered-art.js'
      - 'src/story-archive-restored-art.js'
      - 'src/story-art-sourcing-policy.js'
      - 'src/story-new-original-art.js'
      - 'qa/story-stage-art-sourcing-boundary.test.mjs'
      - 'scripts/restore-existing-story-art.mjs'
      - '.github/workflows/story-chapter1-free-complete-draft-production.yml'
      - 'qa/story-archive-restoration.test.mjs'
      - 'assets/story/chapter1-provisional-live/**'
      - 'src/story-dialogue-art-binding.js'
      - 'assets/story/recap/owner-approved-kingdom-overview.webp'
      - 'qa/story-recap-art-and-cast.test.mjs'
      - 'scripts/audit-story-c01-s01-s04-compact.mjs'
      - 'src/story-reader-intros.js'
      - 'src/story-screenplay-v2.js'
      - 'src/story-pronunciations.js'
      - 'audio/voicevox/manifest.json'
      - 'qa/story-narration-audio-reachability.test.mjs'
      - 'src/story-manga-viewer.js'
      - 'src/story-art-sourcing-policy.js'
      - 'src/story-new-original-art.js'
      - 'src/story-narrative-flow.js'
      - 'game.html'
      - 'town-hub.html'
      - 'world-map.html'
      - 'data/story-compact-20chapters.json'
      - 'scripts/generate-story-chapter1-free-batch.mjs'
      - 'scripts/build-story-compact-production-queue.mjs'
      - 'qa/story-chapter1-stage-priority.test.mjs'
      - 'story-compact-review.html'
      - 'qa/story-compact-20-chapters.test.mjs'
      - '.github/workflows/story-compact-20chapters.yml'
  push:
    branches: [main]
    paths:
      - 'src/story-compact-comic.js'
      - 'src/story-manga-viewer.js'
      - 'data/story-compact-20chapters.json'
      - 'scripts/generate-story-chapter1-free-batch.mjs'
      - 'scripts/build-story-compact-production-queue.mjs'
      - 'qa/story-chapter1-stage-priority.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  story-compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax of compact event runtime
        run: |
          node --check src/story-compact-comic.js
          node --check src/story-reader-intros.js
          node --check src/story-screenplay-v2.js
          node --check src/story-manga-viewer.js
          node --check src/story-narrative-flow.js
      - name: Verify all twenty chapters, 200 stages and distinct defeat/gameover
        run: node qa/story-compact-20-chapters.test.mjs
      - name: Verify narration-first, all spoken ruby readings and safe voice cleanup
        run: node qa/story-narration-audio-reachability.test.mjs
      - name: Verify approved recap native art and visible-speaker dialogue
        run: node qa/story-recap-art-and-cast.test.mjs
      - name: Audit all stage 1-4 original CG bindings, gender/outcome and gaps
        run: node scripts/audit-story-c01-s01-s04-compact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-4-compact-backfill-audit
          path: qa-reports/story-c01-s01-s04-compact-backfill.json
          if-no-files-found: error
      - name: Verify Cloudflare Free queue selects compact CGs only (plan mode; zero API calls)
        run: |
          node --check scripts/generate-story-chapter1-free-batch.mjs
          node qa/story-chapter1-stage-priority.test.mjs
      - name: Confirm five recovered historical original WebPs are real and exactly matched to stage
        run: node qa/story-archive-restoration.test.mjs
      - name: Enforce stage1-4 historical reuse, stage5-200 NEW-only and prevent stale sheet fallback
        run: node qa/story-stage-art-sourcing-boundary.test.mjs
      - name: Verify compact CG reuse of 40 existing first-four-stage gender/outcome original assets
        run: node qa/story-compact-art-reuse.test.mjs
      - name: Build and verify 880-scene minimum-first CG queue (no paid or free API calls)
        run: |
          node --check scripts/build-story-compact-production-queue.mjs
          node scripts/build-story-compact-production-queue.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('qa-reports/story-compact-production-queue.json'));
          assert.equal(q.schemaVersion,2);
          assert.equal(q.kind,'COMPACT_20_CHAPTER_MINIMUM_FIRST_CG_QUEUE');
          assert.equal(q.entries.length,880);
          assert.equal(q.result.total,880);
          assert.equal(q.result.genderVariantsObserved,1760);
          assert.equal(q.result.exactGenderReuse+q.result.missingExactGenderArt,1760);
          assert.equal(q.result.reused+q.result.missing,880);
          assert.equal(q.result.provenNeutralShares,0);
          assert.equal(new Set(q.entries.map(row=>row.key)).size,880);
          for(const row of q.entries){
            assert.deepEqual(Object.keys(row.genderVariants).sort(),['female','male']);
            assert.equal(row.sharedApprovedArt,null);
            for(const v of Object.values(row.genderVariants)){
              assert.equal(v.reuseOtherGenderForbiddenUntilApproved,true);
              assert.equal(v.formalP0Approved,false);
            }
          }
          console.log('PASS: minimum-first 880 unique scenes with 1760 optional guarded gender variants');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: story-compact-200-stage-cg-production-queue
          path: qa-reports/story-compact-production-queue.json
          if-no-files-found: error
      - name: Preserve old individual registered artwork and 462-cut review archive
        run: |
          node qa/story-panel-one-at-a-time.test.mjs
          node qa/story-stage1-4-backlog.test.mjs
