name: Inspect imported armor glove mesh positions
on:
  pull_request:
    paths: ['qa/ai-armor-node-audit.mjs','.github/workflows/ai-armor-node-audit.yml','swordsman-ai-test.html','src/character-system/ai-armor-human-fit.js']
  push:
    branches: [main]
    paths: ['qa/ai-armor-node-audit.mjs','.github/workflows/ai-armor-node-audit.yml']
permissions:
  contents: read
jobs:
  inspect-gloves:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/ai-armor-node-audit.mjs
