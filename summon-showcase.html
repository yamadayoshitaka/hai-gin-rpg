<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>灰銀のレゾナンス | 召喚獣・軍馬 3D鑑賞</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
    body{margin:0;background:#08141b;color:#eff2ed;overflow:hidden}
    canvas{display:block;width:100vw;height:100dvh;touch-action:none}
    header{position:fixed;z-index:10;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 15px;background:#0f1d2ce8;border:1px solid #587489;border-radius:13px;box-shadow:0 9px 35px #0008}
    h1{margin:0;font-size:16px;line-height:1.2;color:#e2d7a8}
    small{display:block;color:#b5c9cf;font-size:11px;margin-top:5px}
    select,button{background:#1b3447;color:#fff;border:1px solid #708f9a;border-radius:8px;font:inherit;padding:9px;min-width:125px;cursor:pointer}
    #info{position:fixed;z-index:5;left:12px;bottom:12px;right:12px;max-width:530px;border:1px solid #708f9a;background:#0f1d2ce0;border-radius:12px;padding:13px;line-height:1.7}
    #species{font-size:22px;font-weight:700;color:#f0d28f}
    #desc{font-size:13px;color:#cdd6dc}
    #metrics{color:#a6d7d1;font-size:12px}
    a{color:#a9dceb}
    @media(min-width:620px){header{right:auto}#info{right:auto;width:480px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head>
<body>
  <header>
    <div><h1>召喚獣・軍馬 3D鑑賞 v4.4.20</h1><small>成体の頭身・小さな切れ長の目・長い鼻筋 / 細分化ポリゴン / Library立体エフェクト</small></div>
    <label for="type">種類 <select id="type">
      <option value="wolf">灰狼</option>
      <option value="wyvern">飛竜</option>
      <option value="dragon" selected>古竜</option>
      <option value="elder_dragon">天竜</option>
      <option value="horse">軍馬</option>
    </select></label>
    <button id="cry" type="button">鳴き声</button>
    <button id="attack" type="button">攻撃モーション</button>
    <button id="walk" type="button">移動を再生</button>
    <button id="wireframe" type="button">ポリゴンを確認</button>
    <a href="./motion-external-test.html">職業・アクション画面</a>
    <a href="./tactics-wireframe.html">戦場へ</a>
  </header>
  <section id="info">
    <div id="species">古竜</div>
    <div id="desc">四脚・巨大な翼・鱗と背骨の棘・角・独立した尻尾を持つ飛行召喚獣。</div>
    <div id="metrics">モデルを読み込み中...</div>
    <small>ドラッグで回転・ピンチ/ホイールで拡大。近距離では精細モデル、遠距離では軽量モデルに自動切替。騎乗者は戦場画面で確認。</small>
  </section>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {COMBAT_OBJECT_SPECS} from './src/combat-action-spec.js?v=2';
    import {createCombatWorldObjectRenderer} from './src/combat-world-object-renderer.js?v=4.4.20';
    import {createCreatureSoundRuntime} from './src/combat-creature-sounds.js?v=1';
    import {ActionVfxRuntime} from './src/character-system/action-vfx-runtime.js?v=4.4.20';
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0b1823);
    scene.fog=new THREE.Fog(0x0b1823,25,70);
    const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,130);
    camera.position.set(6,6,13);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.35;
    document.body.insertBefore(renderer.domElement,document.body.firstChild);
    const ambient=new THREE.HemisphereLight(0xdbeaff,0x4b443b,2.1);scene.add(ambient);
    const sun=new THREE.DirectionalLight(0xffe0ab,3.2);
    sun.position.set(-5,11,6);sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024);
    sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
    scene.add(sun);
    const rim=new THREE.DirectionalLight(0x83b9ff,2.4);rim.position.set(7,5,-8);scene.add(rim);
    const ground=new THREE.Mesh(new THREE.CircleGeometry(12,96),new THREE.MeshStandardMaterial({color:0x293d42,roughness:1,metalness:.05}));
    ground.rotation.x=-Math.PI/2;ground.position.y=-.035;ground.receiveShadow=true;scene.add(ground);
    const rings=new THREE.GridHelper(16,24,0x64838d,0x2d4855);rings.position.y=.006;scene.add(rings);
    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=40;
    controls.maxPolarAngle=Math.PI*.49;controls.target.set(0,2.1,0);controls.update();
    const objects=createCombatWorldObjectRenderer(scene,{camera,offset:0,cellSize:1,terrainY:()=>0});
    const creatureSounds=createCreatureSoundRuntime();
    const vfx=new ActionVfxRuntime(scene,{maxEffects:32,maxArrows:10});
    const descriptions={
      wolf:'幼い丸顔を抑えた細い成体の頭骨。奥まった切れ長の目、長い鼻先、鋭い耳と控えめな頬毛。',
      wyvern:'頭部の体積と丸い眼球を縮小。鋭い眉骨・長い鼻筋・深い眼窩と、指骨・翼膜・尾・鱗。',
      dragon:'成体の頭身比で小さくした頭骨と深い眼窩。長い鼻筋・鋭い顎・牙・角・鱗・大翼。',
      elder_dragon:'頭部を絞り、瞳を細くした威圧的な成体の顔。白金の角冠、筋肉質の四肢、立体鱗。',
      horse:'子馬風の大きな顔・丸い目を廃止。小さな頭骨と長い鼻梁、奥まった黒い目、長い管骨と蹄鉄。',
    };
    const clock=new THREE.Clock();
    let selected='dragon';
    let walking=false,nextStepAt=0,routeStep=0;
    const travelRoute=[{x:0,z:0},{x:1,z:0},{x:2,z:0},{x:2,z:1},{x:1,z:1},
      {x:0,z:1},{x:-1,z:1},{x:-2,z:1},{x:-2,z:0},{x:-1,z:0}];
    let previewObject={id:'gallery-creature',type:selected,x:0,z:0,alive:true,team:0,flying:true,mountedBy:null};
    const select=document.getElementById('type');
    function changeType(){
      selected=select.value;
      previewObject={id:'gallery-'+selected,type:selected,x:0,z:0,alive:true,team:0,
        flying:!!COMBAT_OBJECT_SPECS[selected].flying,mountedBy:null,cryStartedAt:clock.getElapsedTime()};
      walking=false;routeStep=0;
      document.getElementById('walk').textContent='移動を再生';
      document.getElementById('species').textContent=COMBAT_OBJECT_SPECS[selected].name;
      document.getElementById('desc').textContent=descriptions[selected];
      const focus=selected==='elder_dragon'?2.9:selected==='dragon'?2.6:selected==='wyvern'?2.2:1.2;
      controls.target.set(0,focus,0);
      camera.position.set(6,focus+4,selected==='elder_dragon'?15:12);
      controls.update();
    }
    select.addEventListener('change',changeType);changeType();
    document.getElementById('cry').onclick=()=>{
      creatureSounds.unlock();
      previewObject.cryStartedAt=clock.getElapsedTime();
      setTimeout(()=>creatureSounds.play(selected,'spawn',{objectId:previewObject.id,force:true}),70);
    };
    document.getElementById('attack').onclick=()=>{
      creatureSounds.unlock();
      const t=clock.getElapsedTime();
      previewObject.attackStartedAt=t;
      previewObject.attackTarget={x:0,z:5};
      setTimeout(()=>creatureSounds.play(selected,'attack',{objectId:previewObject.id,force:true}),70);
      const origin=new THREE.Vector3(0,(selected==='horse'?1.8:2.2)+(previewObject.flying?2.6:0),1);
      const target=new THREE.Vector3(0,.2,6);
      if(selected.includes('dragon'))vfx.emitBreath(origin,target,{element:selected==='elder_dragon'?'arcane':'fire',radius:1.25});
      else vfx.emit(selected==='wolf'?'attack':'heavy',
        {position:origin,target,job:selected,magic:'arcane',scale:1.5});
    };
    document.getElementById('walk').onclick=()=>{
      walking=!walking;routeStep=0;
      nextStepAt=clock.getElapsedTime();
      document.getElementById('walk').textContent=walking?'移動を停止':'移動を再生';
    };
    let polygonInspection=false;
    document.getElementById('wireframe').onclick=()=>{
      polygonInspection=!polygonInspection;
      scene.traverse(child=>{
        if(child.isInstancedMesh&&child.name.startsWith('CombatWorldObject_'))
          child.material.wireframe=polygonInspection;
      });
      document.getElementById('wireframe').textContent=polygonInspection?'通常表示に戻す':'ポリゴンを確認';
    };
    function tick(){
      requestAnimationFrame(tick);
      const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
      const spec=COMBAT_OBJECT_SPECS[selected];
      if(walking&&t>=nextStepAt){
        routeStep=(routeStep+1)%travelRoute.length;
        Object.assign(previewObject,travelRoute[routeStep]);
        nextStepAt=t+1/spec.speed;
      }
      objects.sync([previewObject],t);
      vfx.update(dt);
      controls.update();
      renderer.render(scene,camera);
      const lod=objects.detailStats()[selected];
      document.getElementById('metrics').textContent=
        '耐久 '+spec.hp+' / 攻撃 '+spec.attack+' / '+(spec.category==='mount'?'騎乗物':'独立召喚オブジェクト')+
        ' / 描画 '+(lod.high?'精細':'軽量')+'LOD / GPUインスタンス';
    }
    tick();
    window.addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
