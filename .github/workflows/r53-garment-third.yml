name: R53 garment third pass and real motion coverage audit
on:
  push:
    branches: [r53-fixed-face-review]
    paths:
      - 'scripts/r53-garment-third.py'
      - 'scripts/r53-garment-motion-audit.py'
      - 'scripts/r53-garment-third-inventory.py'
      - '.github/workflows/r53-garment-third.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sex: [male, female]
        build: [normal, obese]
        style: [Peasant, Ranger]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Syntax preflight
        run: python3 -m py_compile scripts/r53-garment-third.py scripts/r53-garment-motion-audit.py scripts/r53-garment-third-inventory.py
      - uses: actions/download-artifact@v4
        with:
          name: r53-age90-${{ matrix.sex }}-middle
          run-id: 45637676131
          github-token: ${{ github.token }}
          path: /tmp/r53-bodies
      - uses: actions/download-artifact@v4
        with:
          name: r53-refined-${{ matrix.sex }}_30s_${{ matrix.build }}-${{ matrix.style }}
          run-id: 45705334390
          github-token: ${{ github.token }}
          path: /tmp/r53-prior
      - uses: actions/download-artifact@v4
        with:
          name: r53-motion-${{ matrix.sex }}_30s_normal
          run-id: 45651345786
          github-token: ${{ github.token }}
          path: /tmp/r53-motion
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri xauth
      - name: Fit and sample actual motions
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          MESA_GLTHREAD: 'false'
          ID: ${{ matrix.sex }}_30s_${{ matrix.build }}
          STYLE: ${{ matrix.style }}
        run: |
          mkdir -p review/third
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python scripts/r53-garment-third.py -- /tmp/r53-bodies /tmp/r53-prior review/third "$ID" "$STYLE"
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python scripts/r53-garment-motion-audit.py -- /tmp/r53-bodies review/third /tmp/r53-motion review/third "$ID" "$STYLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-third-${{ matrix.sex }}_30s_${{ matrix.build }}-${{ matrix.style }}
          path: review/third/
          if-no-files-found: warn
  inventory:
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: r53-third-*
          path: review/shards
      - name: Validate all eight fit/motion/mask outputs
        if: always()
        run: |
          python3 -m pip install pillow
          python3 scripts/r53-garment-third-inventory.py review/shards review/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r53-third-summary
          path: review/summary/
          if-no-files-found: error
