name: Story Cinematic and Audio QA
on:
  pull_request:
    paths:
      - '.github/workflows/story-cinematic-qa.yml'
      - 'src/story-cinematic.js'
      - 'src/story-stage-manga.js'
      - 'src/story-chapter-comic.js'
      - 'scripts/prepare-story-chapter.mjs'
      - 'scripts/publish-story-chapter.py'
      - 'qa/story-chapter-pipeline.test.mjs'
      - '.github/workflows/story-chapter-release.yml'
      - 'src/story-pronunciations.js'
      - 'src/story-panel-neutral-ids.js'
      - 'scripts/prepare-story-art-batches.mjs'
      - 'assets/story/characters/c01-s01-visual-contract.json'
      - 'qa/story-art-canonical-references.test.mjs'
      - 'scripts/slice-story-art-batch.py'
      - 'qa/story-stage-prepost-v2.test.mjs'
      - 'qa/story-art-batches.test.mjs'
      - 'src/story-manga-art.js'
      - 'src/story-manga-viewer.js'
      - 'src/story-manga-page.js'
      - 'qa/story-full-page-layout.test.mjs'
      - 'src/story-cinematic-assets.js'
      - 'scripts/build-story-art-coverage.mjs'
      - 'qa/story-art-coverage.test.mjs'
      - 'assets/story/panels/**'
      - 'story-maintenance.html'
      - 'assets/story-cinema/**'
      - 'qa/story-cinematic-raster.test.mjs'
      - 'src/fantasy-scene-score.js'
      - 'qa/stage-manga-continuity.test.mjs'
      - 'src/game-page-audio.js'
      - 'src/story-chapters.js'
      - 'game.html'
      - 'town-hub.html'
      - 'world-map.html'
      - 'tactics-wireframe.html'
      - 'src/town-audio-director.js'
      - 'qa/story-cinematic-audio.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/story-cinematic-qa.yml'
      - 'src/story-cinematic.js'
      - 'src/story-stage-manga.js'
      - 'src/story-chapter-comic.js'
      - 'scripts/prepare-story-chapter.mjs'
      - 'scripts/publish-story-chapter.py'
      - 'qa/story-chapter-pipeline.test.mjs'
      - '.github/workflows/story-chapter-release.yml'
      - 'src/story-pronunciations.js'
      - 'src/story-panel-neutral-ids.js'
      - 'scripts/prepare-story-art-batches.mjs'
      - 'assets/story/characters/c01-s01-visual-contract.json'
      - 'qa/story-art-canonical-references.test.mjs'
      - 'scripts/slice-story-art-batch.py'
      - 'qa/story-stage-prepost-v2.test.mjs'
      - 'qa/story-art-batches.test.mjs'
      - 'src/story-manga-art.js'
      - 'src/story-manga-viewer.js'
      - 'src/story-manga-page.js'
      - 'qa/story-full-page-layout.test.mjs'
      - 'src/story-cinematic-assets.js'
      - 'scripts/build-story-art-coverage.mjs'
      - 'qa/story-art-coverage.test.mjs'
      - 'assets/story/panels/**'
      - 'story-maintenance.html'
      - 'src/fantasy-scene-score.js'
      - 'qa/stage-manga-continuity.test.mjs'
      - 'src/game-page-audio.js'
      - 'src/story-chapters.js'
      - 'game.html'
      - 'town-hub.html'
      - 'world-map.html'
      - 'tactics-wireframe.html'
      - 'src/town-audio-director.js'
      - 'qa/story-cinematic-audio.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all twenty-character cinematics and original chapter art
        run: |
          node --check src/story-cinematic.js
          node --check src/game-page-audio.js
          node --check src/story-stage-manga.js
          node --check src/story-pronunciations.js
          node --check scripts/prepare-story-art-batches.mjs
          python3 -m py_compile scripts/slice-story-art-batch.py
          node --check src/story-manga-art.js
          node --check src/story-manga-viewer.js
          node --check src/story-manga-page.js
          node --check src/story-cinematic-assets.js
          node --check src/fantasy-scene-score.js
          node --experimental-vm-modules qa/story-cinematic-audio.test.mjs
          node --experimental-vm-modules qa/stage-manga-continuity.test.mjs
          node qa/story-stage-prepost-v2.test.mjs
          node scripts/prepare-story-art-batches.mjs
          node qa/story-art-batches.test.mjs
          node qa/story-art-canonical-references.test.mjs
          node qa/story-full-page-layout.test.mjs
          node --check src/story-chapter-comic.js
          node --check scripts/prepare-story-chapter.mjs
          python3 -m py_compile scripts/publish-story-chapter.py
          node qa/story-chapter-pipeline.test.mjs
          node scripts/prepare-story-chapter.mjs --chapter 1
          node --experimental-vm-modules qa/story-cinematic-raster.test.mjs
          node scripts/build-story-art-coverage.mjs
          node qa/story-art-coverage.test.mjs
      - name: Preserve 20-chapter missing-scene briefs for art production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-art-shotlist-20chapters
          path: |
            qa-reports/story-art-shotlist.json
            qa-reports/story-art-batch-plan.json
            qa-reports/story-chapters/c01-production.json
            assets/story/panel-art-coverage.json
          if-no-files-found: ignore
          retention-days: 14
