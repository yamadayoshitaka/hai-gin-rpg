<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07172a"><title>灰銀戦記 ― 沈黙の星鐘 | レヴナの町</title>
<style>
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;font-family:system-ui,'Noto Sans JP',sans-serif;background:#08111c;color:#fff4dc}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.44;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffe2a5}
#townScene{position:fixed;inset:0;width:100%;height:100%;border:0;background:radial-gradient(circle,#3c5c6c,#101827)}
header a{display:inline-flex;align-items:center;justify-content:center;background:#795a35eb;border:1px solid #e4c28a;border-radius:6px;padding:7px clamp(6px,1.4vw,12px);min-height:37px;color:#fff2cd;text-decoration:none;font-size:clamp(11px,2.5vw,14px);font-weight:700;white-space:nowrap;touch-action:manipulation}
#veil{position:fixed;inset:0;background:linear-gradient(180deg,#07101a98,transparent 25%,transparent 78%,#06102080);pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:7px;padding:calc(6px + env(safe-area-inset-top)) 9px 8px;background:#0c1d34d9;border-bottom:1px solid #ddbb78ad;backdrop-filter:blur(6px)}
header .label{min-width:0;max-width:38vw}header .label strong{font-size:clamp(12px,3vw,18px);display:block;color:#ffe2a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .label small{display:block;font-size:10px;color:#b8ccd7;white-space:nowrap}
header nav{display:flex;flex-wrap:nowrap;gap:4px;max-width:63vw;overflow-x:auto;scrollbar-width:thin}header button{background:#203d57ea;border:1px solid #9eb3c2;color:white;border-radius:6px;padding:7px clamp(6px,1.4vw,12px);font-size:clamp(11px,2.5vw,14px);min-height:37px}
#townStatus{position:fixed;z-index:5;top:calc(65px + env(safe-area-inset-top));left:10px;padding:5px 10px;background:#101b2dcc;border:1px solid #9b8d6b;border-radius:7px;font-size:11px;color:#ebdfba;max-width:min(85vw,450px);pointer-events:none}
#panelBackdrop{position:fixed;inset:0;background:#02071395;z-index:11}#panelBackdrop[hidden],#panel[hidden],#opening[hidden]{display:none}
#panel{position:fixed;z-index:12;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94vw,510px);max-height:calc(100dvh - 32px);background:linear-gradient(145deg,#273850,#0c192c);border:2px solid #cfb17f;box-shadow:0 20px 50px #000b;border-radius:12px;padding:clamp(12px,3vw,20px);display:flex;flex-direction:column;gap:10px;overflow:hidden}
#panel h2{font:700 22px Georgia,'Noto Serif JP',serif;color:#f4d99f;margin:0}#panel p{margin:0;line-height:1.65;color:#c8d4dc;font-size:13px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:7px}.toprow button{min-width:48px}
#panel button,#panel select,#panel input{border:1px solid #89a6bb;border-radius:6px;background:#24445e;color:#fff5e3;padding:9px 10px;min-height:39px}#panel button.primary{background:#82683c;border-color:#e6d09a}
#panel select,#panel input{width:100%;min-width:0;background:#10243a}
#panelContent{overflow-y:auto;display:grid;gap:9px;min-height:0;overscroll-behavior:contain}
.entries{display:grid;gap:6px}.entry{border:1px solid #627b8c;background:#14283a;padding:9px;display:flex;align-items:center;justify-content:space-between;gap:7px;min-height:53px;border-radius:6px}.entry b{font-size:13px}.entry small{display:block;color:#c1ced4;font-size:11px}.entry button{white-space:nowrap;font-size:12px}
.controls,.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pager{grid-template-columns:55px 1fr 55px}.pager span{text-align:center;align-self:center;color:#e4d09e;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;color:#cfdfed}.stat{border:1px solid #536779;background:#122436;padding:7px}.stat strong{color:#ffdfa0}
#toast{min-height:19px;font-size:12px;color:#ffdf8c}
#opening{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:12px;background:radial-gradient(ellipse at 50% 50%,#112a46f1,#040813f9)}.sceneCard{width:min(92vw,600px);padding:clamp(18px,4vw,33px);background:linear-gradient(145deg,#1c3048,#091629);border:2px solid #dfc188;box-shadow:0 15px 50px #000b;border-radius:12px;text-align:center}.sceneCard .eyebrow{letter-spacing:.2em;color:#b7c9d4;font-size:12px}.sceneCard h1{font:700 clamp(21px,5vw,32px) Georgia,'Noto Serif JP',serif;color:#ffe0a4}.sceneCard p{line-height:2;min-height:5.3em;font-size:clamp(14px,3vw,18px);animation:paperTextFade .6s ease-in;white-space:pre-line}
@keyframes paperTextFade{from{opacity:.1;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.sceneCard{background:radial-gradient(ellipse at 50% 4%,#4b3e39c2,#142236f6 68%),linear-gradient(135deg,#263e59,#0b1526)}.sceneCard .controls button{min-height:47px;color:#fff7de;background:#385777;border:1px solid #dcc088;border-radius:8px}
@media(max-height:650px){#panel{gap:5px;padding:9px 12px}#panel h2{font-size:18px}#panel p{font-size:11px;line-height:1.4}#panel button{min-height:33px;padding:6px 8px}.entry{min-height:40px;padding:6px}}
#townExplorerControls{position:fixed;z-index:7;left:0;right:0;bottom:calc(15px + env(safe-area-inset-bottom));display:flex;flex-direction:row-reverse;align-items:flex-end;justify-content:space-between;padding:0 13px;pointer-events:none}
#townExplorerControls.swapped{flex-direction:row}
#townExplorerControls.swapped #townExplorerActions{text-align:left}
#townExplorerActions{display:grid;gap:8px;max-width:36vw;pointer-events:auto}
#townExplorerActions button{font-size:clamp(12px,3vw,16px);background:linear-gradient(#456d8fe8,#193951ee);border:1px solid #b5cfe4;color:#fff;border-radius:9px;padding:11px 9px;min-height:49px;font-weight:700;touch-action:manipulation}
#townStick{width:clamp(116px,35vw,174px);height:clamp(116px,35vw,174px);position:relative;pointer-events:auto;touch-action:none;border:2px solid #b5cce6aa;border-radius:50%;background:#173b5bba;box-shadow:inset 0 0 24px #00111baa}
#townStickKnob{width:40%;height:40%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 30% 25%,#82acd0,#2c4f75);border:2px solid #c2d8f0;border-radius:50%;pointer-events:none}
#townExplorerMessage{position:fixed;z-index:8;bottom:calc(206px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:80vw;background:#132c3edc;border:1px solid #d0b57f;border-radius:7px;padding:6px;color:#ffe7b6;text-align:center;font-size:12px;display:none;pointer-events:none}
#townExplorerControls:has(~ #panel:not([hidden])){pointer-events:none}
body:has(#panel:not([hidden])) #townExplorerControls *,body:has(#opening:not([hidden])) #townExplorerControls *{pointer-events:none!important}
@media(max-height:620px){#townExplorerActions button{min-height:34px;padding:6px}#townStick{width:102px;height:102px}#townExplorerMessage{bottom:120px}}
</style></head><body>
<iframe id="townScene" src="about:blank" title="既存の城・町ステージと7頭身人物モデルで探索" allow="autoplay"></iframe><div id="veil"></div>
<header><div class="label"><strong id="townHeading">レヴナの町</strong><small id="chapterStatus">第1章・町ステージ</small></div>
<nav aria-label="町の施設"><button type="button" data-town="items">道具屋</button><button type="button" data-town="weapons">武具屋</button><button type="button" data-town="formation">宿屋</button><button type="button" data-town="tavern">酒場</button><button type="button" data-town="save">教会</button><a id="leaveTown" href="./world-map.html?v=town-exit-2">外へ ▶</a></nav></header>
<div id="townStatus">町でセーブ可能 · 既存3Dステージで探索中</div>
<div id="townExplorerControls" aria-label="町の移動と施設操作">
 <div id="townExplorerActions"><button id="townInteract" type="button">話す・施設</button><button id="townCameraView" type="button">視点変更</button><button id="townSwapControls" type="button" aria-label="移動レバーと操作ボタンの左右を入れ替える">左右入替 ⇄</button></div>
 <div id="townStick" aria-label="移動スティック"><div id="townStickKnob"></div></div>
</div>
<div id="townExplorerMessage" role="status" aria-live="polite"></div>
<div id="panelBackdrop" hidden></div><section id="panel" role="dialog" aria-modal="true" aria-label="町のメニュー" hidden>
 <div class="toprow"><h2 id="panelTitle">町の施設</h2><button id="panelClose" type="button">閉じる ✕</button></div>
 <div id="panelSummary" class="stats"></div>
 <div id="panelContent"></div><div id="toast" role="status" aria-live="polite"></div>
</section>
<section id="opening" aria-label="オープニングイベント" hidden><div class="sceneCard"><div class="eyebrow">PROLOGUE · 灰の勅命</div><h1>第1章　レヴナの町</h1><p id="eventText">星鐘が鳴った。</p><div class="controls"><button id="eventVoice">♪ ナレーション・エコー</button><button id="eventNext">次へ ▶</button></div></div></section>
<script type="module">
import {STORY_CHAPTERS,storyVoiceKey} from './src/story-chapters.js';
import {TOWN_SHOP,TOWN_EVENTS,loadGame,persistSession,saveAtTown,buyTownItem,equipSquadItem,squadEquipmentBonus,acceptTownEvent,claimTownEvent,stageAtTown,leaveTown,validGame} from './src/game-core-flow.js';
import {CAMPAIGN_STAGE_BY_ID,stagesInChapter} from './src/campaign-stage-plan.js';
import {STAGE_PRESETS} from './src/stage-library.js';
import {RARITIES,JOBS,recruit,autoFormArmy,trainCommander,armyTroops,reserveTroops,troopCount} from './src/story-campaign.js';
const $=id=>document.getElementById(id),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let game=loadGame(localStorage,sessionStorage);
if(!validGame(game)){location.replace('./game.html');throw Error('No saved game');}
stageAtTown(game,game.townStage);
persistSession(game,sessionStorage);
// The displayed town must be the chapter's registered stage, never the older standalone action demo.
const townFrame=$('townScene');
const currentPreset=CAMPAIGN_STAGE_BY_ID[game.townStage]?.scenePreset||'royal-castle';
const townSceneUrl='./tactics-wireframe.html?town=1&stage='+encodeURIComponent(currentPreset)+'&townStage='+encodeURIComponent(game.townStage)+
 '&gender='+encodeURIComponent(game.campaign.commander.gender||'male')+'&faceId='+encodeURIComponent(game.campaign.commander.faceId||0)+
 '&commanderName='+encodeURIComponent(game.playerName);
if(townFrame.getAttribute('src')!==townSceneUrl)townFrame.src=townSceneUrl;
let panel='',page=0,shopCategory='道具',armyPriority='均衡',narration=null,selectedSquadId=game.campaign.squads[0]?.id||0;
const pages=(rows,size=3)=>({rows:rows.slice(page*size,(page+1)*size),pages:Math.max(1,Math.ceil(rows.length/size))});
const notice=message=>$('toast').textContent=message;
function renderState(){
 const active=CAMPAIGN_STAGE_BY_ID[game.townStage];
 const stageView=STAGE_PRESETS.find(p=>p.id===active.scenePreset);
 $('townHeading').textContent=active.name;
 $('chapterStatus').textContent='第'+active.chapter+'章 · '+active.id+' · '+(stageView?.name||active.name)+' · '+game.playerName;
 $('townStatus').textContent='所持金 '+game.wallet+'G · 軍資金 '+game.campaign.treasury+'G · 兵士 '+troopCount(game.campaign)+'人 · 町ではセーブ可能';
}
function persist(){persistSession(game,sessionStorage);renderState();}
function openPanel(which){resetTownMovement();panel=which;page=0;shopCategory=which==='weapons'?'武器':'道具';notice('');$('panel').hidden=false;$('panelBackdrop').hidden=false;renderPanel();}
function closePanel(){$('panel').hidden=true;$('panelBackdrop').hidden=true;panel='';}
$('panelClose').onclick=closePanel;$('panelBackdrop').onclick=closePanel;
document.querySelectorAll('[data-town]').forEach(b=>b.onclick=()=>openPanel(b.dataset.town));
function rowsHtml(list,renderer){const p=pages(list);page=Math.min(page,p.pages-1);return p.rows.map(renderer).join('')+
 '<div class="pager"><button type="button" data-page="-1" '+(page===0?'disabled':'')+'>◀</button><span>'+(page+1)+' / '+p.pages+'ページ</span><button type="button" data-page="1" '+(page>=p.pages-1?'disabled':'')+'>▶</button></div>';}
function renderPanel(){
 if(!panel)return;
 $('panelTitle').textContent=({weapons:'武具屋・隊列装備',items:'道具屋・消耗品',formation:'宿屋・隊列設定',tavern:'酒場・イベント請負',save:'教会・旅の記録',story:'王城・物語'})[panel]||'町の施設';
 $('panelSummary').innerHTML='<div class="stat">軍師：<strong>'+escapeHtml(game.playerName)+'</strong></div><div class="stat">現在：<strong>第'+CAMPAIGN_STAGE_BY_ID[game.townStage].chapter+'章・町</strong></div>';
 if(panel==='weapons'||panel==='items'){
  const armory=panel==='weapons',stock=TOWN_SHOP.filter(item=>armory?item.category===shopCategory:item.category==='道具');
  const squads=game.campaign.squads.filter(s=>s.count>0);
  if(!squads.some(s=>s.id===selectedSquadId))selectedSquadId=squads[0]?.id||0;
  const selector=armory?'<label for="equipSquadSelect">装備対象の隊列</label><select id="equipSquadSelect">'+squads.map(s=>'<option value="'+s.id+'" '+(s.id===selectedSquadId?'selected':'')+'>#'+s.id+' '+escapeHtml(s.job)+' '+s.count+'人</option>').join('')+'</select>':'';
  $('panelContent').innerHTML=
   '<p>'+(armory?'武器と防具は隊列単位で購入・装備します。バフは出撃開始時から常時有効（有効期限なし）。':'消耗品を購入します。武器・防具の購入は武具屋で行います。')+'</p>'+
   (armory?'<div class="controls">'+['武器','防具'].map(x=>'<button type="button" data-shop-category="'+x+'" '+(shopCategory===x?'class="primary"':'')+'>'+x+'</button>').join('')+'</div>'+selector:'')+
   '<div class="entries">'+rowsHtml(stock,item=>'<div class="entry"><div><b>'+escapeHtml(item.name)+'</b><small>'+item.price+'G · 所持 '+(game.inventory[item.id]||0)+' · '+escapeHtml(item.description)+'</small></div><div><button type="button" data-buy="'+item.id+'" '+(game.wallet<item.price?'disabled':'')+'>購入</button> '+(armory?'<button type="button" data-equip="'+item.id+'" '+(!(game.inventory[item.id]>0)||!squads.length?'disabled':'')+'>隊列に装備</button>':'')+'</div></div>')+'</div>'+
   '<p>所持金：'+game.wallet+'G'+(armory?'　※同じ装備を複数隊列に使うには人数分ではなく隊列数分の在庫が必要です。':'')+'</p>';
 }else if(panel==='formation'){
  const jobs=JOBS.map(job=>({job,count:game.campaign.squads.filter(x=>x.job===job).reduce((n,x)=>n+x.count,0)}));
  const squadRows=game.campaign.squads.filter(s=>s.count>0).map(s=>{
   const buff=squadEquipmentBonus(s);
   const weapon=TOWN_SHOP.find(i=>i.id===buff.weapon)?.name||'なし',armor=TOWN_SHOP.find(i=>i.id===buff.armor)?.name||'なし';
   return '<div class="entry"><div><b>隊列 #'+s.id+' '+escapeHtml(s.job)+' '+s.count+'人</b><small>武器 '+escapeHtml(weapon)+' / 防具 '+escapeHtml(armor)+' · 常時：攻撃+'+Math.round(buff.attack*100)+'%、HP+'+Math.round(buff.defense*100)+'%</small></div></div>';
  }).join('');
  $('panelContent').innerHTML='<p>宿屋では隊列を編成・雇用します。軍師1人あたり100人、全軍1000人まで。購入済みの武具のバフは出撃直後から適用されます。</p>'+
   '<div class="stats"><div class="stat">軍資金 <strong>'+game.campaign.treasury+'G</strong></div><div class="stat">予備兵 <strong>'+reserveTroops(game.campaign)+'人</strong></div></div>'+
   '<div class="entries">'+rowsHtml(jobs,entry=>'<div class="entry"><div><b>'+escapeHtml(entry.job)+'</b><small>保有兵 '+entry.count+'人 · N傭兵 10G/人</small></div><button type="button" data-recruit="'+escapeHtml(entry.job)+'">＋10人雇う</button></div>')+'</div>'+
   '<div class="controls"><select id="autoPriority">'+['均衡','攻撃重視','防御重視','機動重視','支援重視'].map(x=>'<option '+(armyPriority===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button type="button" class="primary" data-auto>オート編成</button></div>'+
   '<p>隊列装備（武具屋で変更可能）</p><div class="entries">'+squadRows+'</div>'+
   '<p>主人公の軍団 '+armyTroops(game.campaign,'player')+'/100人。</p>';
 }else if(panel==='tavern'){
  game.acceptedEvents??=[];game.claimedEvents??=[];
  $('panelContent').innerHTML='<p>酒場の依頼掲示板。受注後はワールドマップで指定ステージを攻略し、酒場に戻って報酬を受け取ります。</p>'+
   '<div class="entries">'+TOWN_EVENTS.map(entry=>{
    const accepted=game.acceptedEvents.includes(entry.id),claimed=game.claimedEvents.includes(entry.id),cleared=game.completedStages.includes(entry.stageId);
    return '<div class="entry"><div><b>'+escapeHtml(entry.title)+'</b><small>'+escapeHtml(entry.description)+' · 対象 '+entry.stageId.toUpperCase()+' · 報酬 '+entry.rewardGold+'G</small></div>'+
     (claimed?'<span>完了 ✓</span>':!accepted?'<button type="button" data-event-accept="'+entry.id+'">受注</button>':cleared?'<button type="button" data-event-claim="'+entry.id+'">報酬受取</button>':'<span>受注中</span>')+'</div>';
   }).join('')+'</div><div class="controls"><button type="button" id="openMap">依頼先へ向かう ▶</button><button type="button" id="keepWalking">町へ戻る</button></div>';
 }else if(panel==='save'){
  $('panelContent').innerHTML='<p>教会は正式なセーブ地点です。道具屋の購入、宿屋の編成、酒場の受注状態も保存します。</p>'+
   '<div class="entry"><div><b>セーブスロット 1</b><small>最終保存：'+(game.savedAt?new Date(game.savedAt).toLocaleString('ja-JP'):'未保存')+'</small></div><button class="primary" type="button" id="confirmSave">保存する</button></div>'+
   '<div class="controls"><button type="button" id="backTitle">タイトルに戻る</button><button type="button" id="keepWalking">町を探索する</button></div>';
 }else if(panel==='story'){
  const chapter=STORY_CHAPTERS[CAMPAIGN_STAGE_BY_ID[game.townStage].chapter-1];
  $('panelContent').innerHTML='<p><b>第'+chapter.id+'章　'+escapeHtml(chapter.title)+'</b></p><p>'+escapeHtml(chapter.synopsis)+'</p>'+
   '<div class="controls"><button type="button" id="readNarration">▶ ナレーション（エコー付き）</button><button type="button" id="openMap">地図へ進む</button></div>';
 }
}
$('panelContent').addEventListener('change',event=>{if(event.target.id==='equipSquadSelect')selectedSquadId=Number(event.target.value)||0;});
$('panelContent').onclick=event=>{
 const target=event.target.closest('button');if(!target)return;
 try{
  if(target.hasAttribute('data-page')){page+=Number(target.dataset.page);renderPanel();return;}
  if(target.hasAttribute('data-shop-category')){shopCategory=target.dataset.shopCategory;page=0;renderPanel();return;}
  if(target.hasAttribute('data-buy')){
   const purchase=buyTownItem(game,target.dataset.buy,1);
   persist();renderPanel();notice(purchase.item.name+'を購入しました（-'+purchase.price+'G）。');return;
  }
  if(target.hasAttribute('data-equip')){
   const gear=equipSquadItem(game,selectedSquadId,target.dataset.equip,shopCategory);
   persist();renderPanel();notice('隊列 #'+gear.squad.id+' に'+gear.item.name+'を装備。常時バフ：攻撃+'+Math.round(gear.bonus.attack*100)+'%、HP+'+Math.round(gear.bonus.defense*100)+'%');return;
  }
  if(target.hasAttribute('data-event-accept')){const quest=acceptTownEvent(game,target.dataset.eventAccept);persist();renderPanel();notice('「'+quest.title+'」を受注しました。');return;}
  if(target.hasAttribute('data-event-claim')){const quest=claimTownEvent(game,target.dataset.eventClaim);persist();renderPanel();notice('報酬 '+quest.rewardGold+'G を受け取りました。');return;}
  if(target.hasAttribute('data-recruit')){
   recruit(game.campaign,{job:target.dataset.recruit,rarity:'N',count:10,purpose:'前線',commanderId:'reserve',faceId:0});
   persist();renderPanel();notice('予備兵に10人追加しました。');return;
  }
  if(target.hasAttribute('data-auto')){
   armyPriority=$('autoPriority').value;
   autoFormArmy(game.campaign,'player',armyPriority);
   persist();renderPanel();notice('選択した方針で自動編成しました。');return;
  }
  if(target.id==='confirmSave'){saveAtTown(game,localStorage,sessionStorage);renderPanel();notice('町のセーブスロットに保存しました。');return;}
  if(target.id==='backTitle'){location.href='./game.html';return;}
  if(target.id==='keepWalking'){closePanel();return;}
  if(target.id==='readNarration'){void speakChapter(CAMPAIGN_STAGE_BY_ID[game.townStage].chapter);return;}
  if(target.id==='openMap'){goMap();return;}
 }catch(error){notice(error.message||String(error));}
};
function goMap(event){
 if(event?.preventDefault)event.preventDefault();
 resetTownMovement();
 try{leaveTown(game);persistSession(game,sessionStorage);}
 catch(error){console.warn('[Town] Session persistence failed, using map navigation fallback:',error);}
 // Navigation remains possible if storage fails or the 3D iframe is still loading.
 window.location.assign('./world-map.html?v=town-exit-2');
}
$('leaveTown').addEventListener('click',goMap);
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==townFrame.contentWindow)return;
 const data=event.data||{};
 if(data.stageId!==game.townStage)return;
 if(data.type==='hai-gin-town-exit'){goMap();return;}
 if(data.type==='hai-gin-town-facility'&&['weapons','items','formation','tavern','save','story'].includes(data.panel))openPanel(data.panel);
 if(data.type==='hai-gin-town-stage-ready'){$('townStatus').textContent='既存の3Dステージ '+data.preset+' · 操作キャラ：軍師 · 人物 '+data.actors+'体 · 施設と出口を利用できます';}
 if(data.type==='hai-gin-town-notice'){const node=$('townExplorerMessage');node.textContent=String(data.text||'');node.style.display='block';setTimeout(()=>node.style.display='none',2700);}
});
// Parent overlay owns the touch stick. The child is the unmodified battle world renderer in peaceful town mode.
const townStick=$('townStick'),townKnob=$('townStickKnob');
const townControls=$('townExplorerControls');
const TOWN_CONTROL_SIDE_KEY='hai-gin-town-stick-side-v1';
try{if(localStorage.getItem(TOWN_CONTROL_SIDE_KEY)==='right')townControls.classList.add('swapped')}catch{}
$('townSwapControls').onclick=()=>{
 resetTownMovement();
 townControls.classList.toggle('swapped');
 try{localStorage.setItem(TOWN_CONTROL_SIDE_KEY,townControls.classList.contains('swapped')?'right':'left')}catch{}
};
let townTouch=null,townAxis={x:0,y:0};
function sendTown(type,extra={}){townFrame.contentWindow?.postMessage({type,stageId:game.townStage,...extra},location.origin);}
function townPointerMove(event){
 const bounds=townStick.getBoundingClientRect(),centerX=bounds.left+bounds.width/2,centerY=bounds.top+bounds.height/2;
 // The input radius and visible knob travel must describe the same joystick.
 const travel=Math.max(1,(bounds.width-townKnob.getBoundingClientRect().width)/2);
 const dx=(event.clientX-centerX)/travel,dy=(event.clientY-centerY)/travel;
 const raw=Math.hypot(dx,dy),mag=Math.max(1,raw);
 townAxis=raw<.12?{x:0,y:0}:{x:dx/mag,y:dy/mag};
 const travelPercent=100*travel/bounds.width;
 townKnob.style.left=(50+townAxis.x*travelPercent)+'%';townKnob.style.top=(50+townAxis.y*travelPercent)+'%';
 sendTown('hai-gin-town-input',townAxis);
}
townStick.addEventListener('pointerdown',event=>{if(townTouch!==null)return;event.preventDefault();townTouch=event.pointerId;townStick.setPointerCapture(event.pointerId);townPointerMove(event)});
townStick.addEventListener('pointermove',event=>{if(event.pointerId===townTouch)townPointerMove(event)});
function resetTownMovement(){
 townTouch=null;townAxis={x:0,y:0};
 townKnob.style.left='50%';townKnob.style.top='50%';
 sendTown('hai-gin-town-input',townAxis);
}
function townPointerStop(event){if(event.pointerId===townTouch)resetTownMovement();}
for(const type of ['pointerup','pointercancel','lostpointercapture'])townStick.addEventListener(type,townPointerStop);
window.addEventListener('blur',resetTownMovement);
document.addEventListener('visibilitychange',()=>{if(document.hidden)resetTownMovement();});
$('townInteract').onclick=()=>sendTown('hai-gin-town-interact');
$('townCameraView').onclick=()=>sendTown('hai-gin-town-view');
let narrationContext=null,narrationNodes=[];
function stopNarration(){
 try{narration?.pause()}catch{}
 narration=null;
 for(const node of narrationNodes){try{node.disconnect()}catch{}}
 narrationNodes=[];
}
function addNarrationEcho(audio){
 const AudioContextClass=window.AudioContext||window.webkitAudioContext;
 if(!AudioContextClass)return null;
 narrationContext??=new AudioContextClass();
 const source=narrationContext.createMediaElementSource(audio);
 const compressor=narrationContext.createDynamicsCompressor();
 compressor.threshold.value=-12;compressor.ratio.value=3;
 compressor.attack.value=.004;compressor.release.value=.22;
 const dry=narrationContext.createGain();dry.gain.value=.82;
 source.connect(dry);dry.connect(compressor);
 // Strong multi-tap hall echo. No recursive feedback or infinite tail.
 for(const [seconds,volume] of [[.26,.58],[.53,.38],[.83,.22]]){
  const delay=narrationContext.createDelay(1.5);delay.delayTime.value=seconds;
  const wet=narrationContext.createGain();wet.gain.value=volume;
  source.connect(delay);delay.connect(wet);wet.connect(compressor);
  narrationNodes.push(delay,wet);
 }
 compressor.connect(narrationContext.destination);
 narrationNodes.push(source,dry,compressor);
 return narrationContext;
}
async function speakChapter(number,{autoplay=false}={}){
 stopNarration();
 const chapter=STORY_CHAPTERS[number-1];
 if(!chapter)return;
 try{
  const response=await fetch('./audio/voicevox/manifest.json',{cache:'no-store'});
  if(!response.ok)throw Error('ナレーション音声リストを読み込めません。');
  const manifest=await response.json();
  const clip=manifest.clips?.[storyVoiceKey(chapter)];
  if(!/^audio\/voicevox\/clips\/[a-f0-9]{16}\.(wav|mp3)$/.test(clip||''))throw Error('ナレーション音声がまだ公開されていません。');
  const audio=new Audio('./'+clip);audio.preload='auto';
  narration=audio;
  try{addNarrationEcho(audio)}catch(error){console.warn('[Narration] echo unavailable; original audio retained',error);}
  if(autoplay){
   audio.addEventListener('timeupdate',()=>{
    if($('opening').hidden||!Number.isFinite(audio.duration)||audio.duration<=0)return;
    const idx=Math.min(eventScenes.length-1,Math.floor(audio.currentTime/audio.duration*eventScenes.length));
    if(idx>eventIndex){eventIndex=idx;eventRender();}
   });
  }
  try{
   if(narrationContext?.state==='suspended'){
    const resumed=narrationContext.resume();
    if(!autoplay)await resumed;
   }
   await audio.play();
   $('eventVoice').textContent='■ ナレーション停止';
  }catch(error){
   if(error?.name==='NotAllowedError'){
    // Some mobile browsers require a gesture after navigating to this page.
    $('eventVoice').textContent='▶ タップして音声再生';
   }else throw error;
  }
 }catch(error){notice(error.message||'音声を再生できませんでした。');$('eventVoice').textContent='▶ 音声を再試行';}
}
// Story cards follow the actual narration script, rather than unrelated battle dialogue.
const chapterNarration=STORY_CHAPTERS[0].narration;
const eventScenes=(chapterNarration.match(/[^。！？]+[。！？]?/g)||[chapterNarration]).map(x=>x.trim()).filter(Boolean);
let eventIndex=0;
function eventRender(){
 $('eventText').textContent=eventScenes[eventIndex];
 $('eventText').style.animation='none';void $('eventText').offsetWidth;$('eventText').style.animation='';
 $('eventNext').textContent=eventIndex===eventScenes.length-1?'町へ進む ▶':'次へ ▶';
}
$('eventNext').onclick=()=>{
 if(narration&&narration.paused)void narrationContext?.resume().then(()=>narration.play()).catch(()=>{});
 if(eventIndex<eventScenes.length-1){eventIndex++;eventRender();return;}
 $('opening').hidden=true;game.storyFlags.openingEventCompleted=true;persist();stopNarration();
};
$('eventVoice').onclick=()=>{
 if(narration&&!narration.paused){stopNarration();$('eventVoice').textContent='▶ ナレーションを再生';return;}
 if(narration){void (async()=>{await narrationContext?.resume();await narration.play();$('eventVoice').textContent='■ ナレーション停止';})().catch(()=>void speakChapter(1));return;}
 void speakChapter(1);
};
if(new URLSearchParams(location.search).get('opening')==='1'&&!game.storyFlags.openingEventCompleted){
 $('opening').hidden=false;eventRender();void speakChapter(1,{autoplay:true});
}
window.addEventListener('pagehide',stopNarration);
renderState();
</script></body></html>
