<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰銀のレゾナンス | オブジェクト作成</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#eef4fc;font:14px system-ui}header{padding:12px 16px;background:#14253a;display:flex;align-items:center;gap:14px}a{color:#92d9ff}main{display:flex;flex-direction:column;height:calc(100dvh - 53px)}aside{padding:12px;background:#17253a;display:flex;gap:8px;align-items:center;flex-wrap:wrap}aside label,aside input[type=range],aside input[type=number],aside small,aside #build,aside #json,aside #export{display:none}aside button{width:auto;margin:0}aside select{width:auto;min-width:110px}#prompt{display:block!important;flex:4;min-width:180px;min-height:64px;padding:10px;background:#233d58;color:#fff;border:1px solid #6b9ab9;border-radius:8px;font:15px system-ui}#apply{display:block!important;flex:1;min-width:110px}label{display:block;margin:12px 0 4px}input,select,button{width:100%;padding:9px;border:1px solid #6485a6;border-radius:6px;background:#243b56;color:white}input[type=range]{padding:0}button{margin-top:10px;cursor:pointer;background:#285a80}#view{position:relative;min-width:0;flex:1;min-height:0}canvas{display:block;touch-action:none}#info{position:absolute;bottom:12px;left:12px;background:#101b2ad9;padding:8px;border-radius:5px;pointer-events:none}small{color:#a6c2da} @media(max-width:680px){main{height:calc(100dvh - 53px)}#view{flex:1;min-height:45dvh}aside{flex-shrink:0}aside button{font-size:12px;padding:9px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><a href="./index.html">← メニュー</a><strong>オブジェクト一覧｜木</strong></header><main><aside><label>オブジェクト</label><select id="type"><option value="spring">木・春</option><option value="summer">木・夏</option><option value="autumn">木・秋</option><option value="winter">木・冬</option></select><label>樹高 <span id="heightValue"></span></label><input id="height" type="range" min="3" max="18" step=".5" value="9"><label>幹の太さ <span id="trunkValue"></span></label><input id="trunk" type="range" min=".2" max="1.5" step=".05" value=".55"><label>枝の段数 <span id="levelsValue"></span></label><input id="levels" type="range" min="2" max="8" value="5"><label>枝の本数 / 段 <span id="branchesValue"></span></label><input id="branches" type="range" min="3" max="12" value="7"><label>ポリゴン細分化 <span id="detailValue"></span></label><input id="detail" type="range" min="8" max="64" step="8" value="32"><label>葉の密度 <span id="leavesValue"></span></label><input id="leaves" type="range" min="0" max="20" value="20"><label>乱数シード</label><input id="seed" type="number" value="42"><button id="build">木を再生成</button><button id="export">GLBで保存</button><button id="json">設計データ(JSON)保存</button><small>回転：ドラッグ / 拡大：ピンチ。高密度化するとスマホでは処理が重くなります。GLBはゲーム用の3D素材として利用できます。</small></aside><div id="view"><div id="info">生成中…</div></div></main><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';const $=id=>document.getElementById(id),view=$('view');const scene=new THREE.Scene();scene.background=new THREE.Color(0x102034);const camera=new THREE.PerspectiveCamera(45,1,.1,150);camera.position.set(15,12,19);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));view.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,4.5,0);scene.add(new THREE.HemisphereLight(0xffffff,0x415a67,2));const sun=new THREE.DirectionalLight(0xffedcc,2.5);sun.position.set(9,18,12);scene.add(sun);const grid=new THREE.GridHelper(40,40,0x446b84,0x294259);scene.add(grid);let tree=new THREE.Group(),count=0;scene.add(tree);const ids=['height','trunk','levels','branches','detail','leaves'];function config(){const c={type:'tree',season:$('type').value,seed:Number($('seed').value)||42};for(const id of ids)c[id]=Number($(id).value);return c}function random(seed){let n=seed>>>0;return()=>{n=(1664525*n+1013904223)>>>0;return n/4294967296}}function build(){tree.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose()}});scene.remove(tree);tree=new THREE.Group();scene.add(tree);count=0;const c=config(),rnd=random(c.seed),bark=new THREE.MeshStandardMaterial({color:0x70503a,roughness:.93}),leafMats=[0x326c37,0x428347,0x579447,0x265f38].map(color=>new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,roughness:.85}));function cylinder(a,b,r1,r2,mat){const d=new THREE.Vector3().subVectors(b,a),m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),c.detail,Math.max(1,Math.floor(c.detail/8))),mat);const attr=m.geometry.attributes.position;for(let i=0;i<attr.count;i++){const x=attr.getX(i),y=attr.getY(i),z=attr.getZ(i),ang=Math.atan2(z,x),noise=.045*Math.sin(ang*19+y*7)+.025*Math.sin(ang*41-y*16)+.015*Math.sin(ang*83+y*31);const radius=Math.hypot(x,z);if(radius>.0001){attr.setX(i,x*(1+noise));attr.setZ(i,z*(1+noise))}}attr.needsUpdate=true;m.geometry.computeVertexNormals();m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());tree.add(m);count+=m.geometry.index?m.geometry.index.count/3:m.geometry.attributes.position.count/3}const leafPlacements=[];function foliage(pos,size){if(c.season==='winter'&&rnd()<.98)return;leafPlacements.push({pos:pos.clone(),size,angle:rnd()*Math.PI*2,tilt:(rnd()-.5)*1.3,color:Math.floor(rnd()*4)})}
function createLeaves(){if(!leafPlacements.length)return;const vertices=[],colors=[],indices=[];const seasonal={spring:[0x78ad4b,0x9fc96b,0x5b9a42,0xb5d57b],summer:[0x285f2c,0x387a35,0x4e903d,0x326d39],autumn:[0xc56a25,0xe1a137,0x9f4222,0xe7bc4b],winter:[0x9a6b34,0x8d5630,0x6f4c2c,0xa07b48]};const palette=seasonal[c.season].map(c=>new THREE.Color(c));const p=new THREE.Vector3();for(const leaf of leafPlacements){const base=vertices.length/3,dir=new THREE.Vector3(Math.cos(leaf.angle),leaf.tilt,Math.sin(leaf.angle)).normalize(),side=new THREE.Vector3(-dir.z,0,dir.x).normalize(),normal=new THREE.Vector3().crossVectors(dir,side).normalize(),length=leaf.size*1.9,width=leaf.size*.68;const v=[];for(let i=0;i<=8;i++){const t=i/8,center=leaf.pos.clone().addScaledVector(dir,(t-.12)*length),w=Math.pow(Math.sin(Math.PI*t),.85)*width,vein=Math.sin(Math.PI*t)*leaf.size*.11;for(const sign of [-1,0,1]){const pt=center.clone().addScaledVector(side,sign*w).addScaledVector(normal,sign===0?vein:0);v.push(pt)}}for(const pt of v)vertices.push(pt.x,pt.y,pt.z);const col=palette[leaf.color];for(let i=0;i<v.length;i++){const brightness=i%3===1?1.16:i%3===0?.83:1;colors.push(Math.min(1,col.r*brightness),Math.min(1,col.g*brightness),Math.min(1,col.b*brightness))}for(let i=0;i<8;i++){const a=base+i*3,b=a+3;indices.push(a,b,a+1,a+1,b,b+1,a+1,b+1,a+2,a+2,b+1,b+2)}}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geometry.setIndex(indices);geometry.computeVertexNormals();const material=new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:.85,metalness:0});const mesh=new THREE.Mesh(geometry,material);mesh.name='Individual curved leaves with central veins';tree.add(mesh);count+=indices.length/3}
const H=c.height;const base=new THREE.Vector3(0,0,0),tip=new THREE.Vector3(0,H*.76,0);cylinder(base,tip,c.trunk,c.trunk*.16,bark.clone());for(let k=0;k<7;k++){const angle=k*Math.PI*2/7;const a=new THREE.Vector3(0,.25,0),b=new THREE.Vector3(Math.cos(angle)*1.5,.04,Math.sin(angle)*1.5);cylinder(a,b,c.trunk*.4,.03,bark.clone())}for(let l=0;l<c.levels;l++){const f=(l+.55)/c.levels,y=H*(.15+f*.56),len=H*(.32-f*.18);for(let j=0;j<c.branches;j++){const angle=(j+(l%2)*.5)/c.branches*Math.PI*2+(rnd()-.5)*.28,reach=len*(.7+rnd()*.5),a=new THREE.Vector3(0,y,0),b=new THREE.Vector3(Math.cos(angle)*reach,y+reach*(.25+rnd()*.45),Math.sin(angle)*reach);cylinder(a,b,c.trunk*(.33-f*.18),.035,bark.clone());for(let k=0;k<c.leaves*24;k++){const t=.45+rnd()*.65,p=a.clone().lerp(b,t).add(new THREE.Vector3((rnd()-.5)*1.5,(rnd()-.5)*1.2,(rnd()-.5)*1.5));foliage(p,.16+H*.015+rnd()*.16)}}}for(let k=0;k<c.leaves*40;k++)foliage(new THREE.Vector3((rnd()-.5)*H*.16,H*(.68+rnd()*.24),(rnd()-.5)*H*.16),.18+H*.012);createLeaves();tree.userData={objectType:'tree',parameters:c};$('info').textContent='推定 '+Math.round(count).toLocaleString()+' 三角形 / 葉 '+leafPlacements.length+' 枚';for(const id of ids)$(id+'Value').textContent=$(id).value}function applyPrompt(){const p=$('prompt').value.trim();if(!p)return;const before=config();const changes=[];function set(id,v){const el=$(id);const next=Math.max(Number(el.min),Math.min(Number(el.max),v));if(next!==Number(el.value)){el.value=next;changes.push(id)}}function adjust(id,factor){set(id,Math.round(Number($(id).value)*factor/(Number($(id).step)||1))*(Number($(id).step)||1))}
if(/大木|巨木|高く|背が高|大きな木|巨大/.test(p)){adjust('height',1.3);adjust('trunk',1.25)}
if(/小さ|低く|若木|苗木/.test(p)){adjust('height',.7);adjust('trunk',.75)}
if(/幹.{0,5}太|太い幹|幹を太/.test(p))adjust('trunk',1.45);
if(/幹.{0,5}細|細い幹/.test(p))adjust('trunk',.7);
if(/枝.{0,8}(増|多|密)|枝を増/.test(p)){adjust('branches',1.3);adjust('levels',1.2)}
if(/枝.{0,8}(減|少)|枝を減/.test(p)){adjust('branches',.7);adjust('levels',.8)}
if(/枝.{0,8}(横|広)|横に広/.test(p)){adjust('branches',1.2);adjust('height',.9)}
if(/葉.{0,10}(密|増|多|茂)|葉を増|生い茂/.test(p))adjust('leaves',1.6);
if(/葉.{0,10}(少|減|疎)|枯れ木|落葉/.test(p))adjust('leaves',.55);
if(/(?:葉|葉っぱ|葉っぱを).{0,12}(?:全部|すべて|全て|完全|一枚も|なく|無く|無し|なし|取り除|消)|(?:全部|すべて|全て).{0,8}葉.{0,8}(?:無|なく|消)|葉(?:なし|無し)|丸裸|枯れ木/.test(p))set('leaves',0);
if(/細かい|高精細|高密度ポリゴン|滑らか/.test(p))adjust('detail',1.5);
if(/軽量|低ポリ|ローポリ/.test(p))adjust('detail',.5);
if(/樹齢.{0,5}(100|百)|古木/.test(p)){adjust('trunk',1.3);adjust('branches',1.2)}
if(!changes.length){$('info').textContent='指示が反映されませんでした。対応例：葉を全部なくす・幹を太く・枝を増やす';return}
build();$('info').textContent+=' / 反映済み：'+(Number($('leaves').value)===0?'葉を0枚に変更 / ':'')+[...new Set(changes)].join(', ')}

function save(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}$('build').onclick=build;$('json').onclick=()=>save(new Blob([JSON.stringify(config(),null,2)],{type:'application/json'}),'tree-config.json');$('export').onclick=()=>{const exporter=new GLTFExporter();exporter.parse(tree,data=>save(new Blob([data],{type:'model/gltf-binary'}),'tree.glb'),err=>alert('GLB出力失敗: '+err.message),{binary:true,onlyVisible:true})};function resize(){const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(view);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}$('type').addEventListener('change',build);build();resize();animate();</script></body></html>
