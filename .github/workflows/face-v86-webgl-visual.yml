name: V88 Face WebGL Visual Regression
on:
  pull_request:
    paths:
      - 'src/face-feature-meshes.js'
      - 'src/face-v96-smile-cosmetics.js'
      - 'src/face-mouth-seal-v86.js'
      - 'src/face-native-oral-rig-v88.js'
      - 'src/face-oral-anatomy-v80.js'
      - 'src/face-scalp-wig.js'
      - 'src/face-expression-animation-v48.js'
      - 'src/independent-face-masters.js'
      - 'face-mesh-studio.html'
      - 'qa/face-v86-webgl-visual.mjs'
      - 'qa/face-v112-wire-overlay.test.mjs'
      - 'qa/face-v113-native-normal-webgl.test.mjs'
      - 'qa/face-v114-eye-webgl.test.mjs'
      - 'src/face-part-catalog-v32.js'
      - '.github/workflows/face-v86-webgl-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  black-mouth-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium, real Three.js and screenshot parser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0 pngjs@7.0.0 three@0.160.1
          npx playwright install --with-deps chromium
      - name: Serve repository browser build
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/face-webgl-server.log 2>&1 &
          sleep 2
      - name: Verify photorealistic almond eye contour and true iris/pupil in Android WebGL
        run: node qa/face-v114-eye-webgl.test.mjs
      - name: Assert actual 3490-vertex native normal face first paint, body-reselect parity and smoother cheeks
        run: node qa/face-v113-native-normal-webgl.test.mjs
      - name: Verify wire overlay keeps shaded face and hair on mobile and after body reselect
        run: node qa/face-v112-wire-overlay.test.mjs
      - name: Assert no large black polygons on normal/laugh/surprised faces
        run: node qa/face-v86-webgl-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-v88-webgl-evidence
          path: |
            qa/screenshots/face-v88/*.png
            qa/screenshots/face-v112/*.png
            qa/screenshots/face-v113/*.png
            qa/screenshots/face-v114/*.png
          if-no-files-found: ignore
          retention-days: 7
