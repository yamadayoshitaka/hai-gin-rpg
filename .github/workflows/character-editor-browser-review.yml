name: Character editor browser review
on:
  push:
    branches: [main, r44-age-neck-review]
    paths:
      - 'face-precision-r18.html'
      - 'qa/character-r42-browser.test.mjs'
      - 'assets/character-review/**'
      - '.github/workflows/character-editor-browser-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-editor-browser-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.0 three@0.160.1
      - run: npx playwright install --with-deps chromium
      - name: Browser integration and export/reload test
        run: |
          python3 -c 'import re; from pathlib import Path; s=Path("face-precision-r18.html").read_text(); Path("/tmp/editor-check.mjs").write_text("\n".join(re.findall(r"<script type=\"module\">(.*?)</script>",s,re.S)))'
          node --check /tmp/editor-check.mjs
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/character-server.log 2>&1 &
          sleep 2
          node --test qa/character-r42-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-r42-browser-review
          path: qa/screenshots/character-r42/
          if-no-files-found: warn
