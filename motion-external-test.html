<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追加モーション実機検証</title><style>body{margin:0;background:#101824;color:white;font:14px system-ui}#ui{position:fixed;z-index:3;top:8px;left:8px;right:8px;background:#16283deF;padding:12px;border-radius:12px;max-height:34vh;overflow:auto}select,button{background:#294764;color:white;border:1px solid #7896b3;border-radius:7px;padding:8px;margin:3px;max-width:100%}select{width:98%}#ui label{display:block;font-size:12px}#ui select{padding:6px;margin:2px 0 5px}#ui details{margin-top:3px}#ui summary{cursor:pointer;color:#bde0ff}#status{font-size:11px;max-height:38px;overflow:auto}#bottom{font-size:11px;opacity:.85}#status{white-space:pre-wrap;color:#ffdd91}#bottom{position:fixed;bottom:8px;left:8px;right:8px;z-index:3;background:#16283deF;padding:8px;border-radius:10px}canvas{display:block;position:fixed;top:36vh;left:0;width:100vw;height:64vh;touch-action:none}small{color:#bdd1e1}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="ui"><b>職業別モーション実機確認</b> <small>v3.3.4 / 下部ステージ・関節補正</small><label>人物モデル<select id="body"><option value="soldier" selected>男女素体・職業別アクション</option><option value="kaykit">KayKit（移植元の確認）</option></select></label><label>性別<select id="sex"><option value="male">男性モデル</option><option value="female">女性モデル</option></select></label><label>職業<select id="job"></select></label><label>職業別アクション<select id="action"></select></label><label style="display:none">再生クリップ<select id="clip"></select></label><details id="advanced"><summary>素材・検証メニューを開く</summary><label>素材ファイル<select id="asset"></select></label><div><button id="pause">一時停止</button><button id="reset">再生</button><button id="pass">正常</button><button id="fail">不具合</button><button id="copy">結果コピー</button></div><small> import * as THREE from 'three';import {buildRigPairs,applyRigPairs} from './src/character-system/retarget-adapter.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s,renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,Math.max(240,innerHeight*.64));document.body.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x172335);scene.add(new THREE.HemisphereLight(0xffffff,0x667799,2.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,8,5);scene.add(sun);const groundGrid=new THREE.GridHelper(10,20,0x5a7896,0x33475b);groundGrid.position.y=-0.015;scene.add(groundGrid);const camera=new THREE.PerspectiveCamera(45,innerWidth/Math.max(240,innerHeight*.64),.01,10000);camera.position.set(3,2,5);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.update();let data=[],commandMap={},filtered=[],model,mixer,baseModel,baseReady,pendingClip=null,action,clock=new THREE.Clock(),records={};const loader=new GLTFLoader();
let rigProfile=null,rigCoverage=0,rigMissing=[];fetch('./data/character-system/rig-profiles.json').then(r=>r.json()).then(j=>{rigProfile=j.profiles['quaternius-humanoid'];if(sourceRig&&soldierModel){buildPairs();if($('body').value==='soldier')startRetarget()}}).catch(e=>status('骨格定義読込失敗: '+e.message));let compatibleClips=[],compatibleReady=false,compatibleLoading=false;let cameraInitialized=false;let soldierModel=null,soldierMixer=null,soldierActions=[],soldierAction=null,sourceRig=null,sourceMixer=null,sourceAction=null,bonePairs=[],retargetEnabled=false;const CHARACTER_ROOT='./assets/characters/quaternius-base/';const CHARACTER_MODEL={male:'Superhero_Male_FullBody',female:'Superhero_Female_FullBody'};
function boneKey(name){let n=name.toLowerCase().replace(/^(mixamorig|armature|rig|bip001|bip01)[_:.-]*/,'').replace(/[^a-z0-9]/g,'');n=n.replace(/^(?:rigmedium|rig|mixamorig|armature|skeleton|bip001|bip01)+/,'');const side=n.includes('left')||/^l(upper|lower|hand|foot|toe|thigh|shin|arm|leg|shoulder)/.test(n)?'l':n.includes('right')||/^r(upper|lower|hand|foot|toe|thigh|shin|arm|leg|shoulder)/.test(n)?'r':'';let part='';for(const [re,key] of [[/hips|pelvis|root/,'hips'],[/spine2|chest|upperchest/,'chest'],[/spine1|spine/,'spine'],[/neck/,'neck'],[/head/,'head'],[/shoulder|clavicle/,'shoulder'],[/forearm|lowerarm|elbow/,'forearm'],[/upperarm|arm/,'upperarm'],[/hand|wrist/,'hand'],[/upleg|upperleg|thigh/,'thigh'],[/lowerleg|shin|calf/,'shin'],[/foot|ankle/,'foot'],[/toe/,'toe']]){if(re.test(n)){part=key;break}}return part?(part==='hips'||part==='spine'||part==='chest'||part==='neck'||part==='head'?part:side+part):''}
function buildPairs(){bonePairs=[];if(!sourceRig||!soldierModel||!rigProfile)return;sourceRig.traverse(o=>{if(o.isSkinnedMesh&&o.skeleton)o.skeleton.pose()});soldierModel.traverse(o=>{if(o.isSkinnedMesh&&o.skeleton)o.skeleton.pose()});const result=buildRigPairs(THREE,sourceRig,soldierModel,rigProfile);bonePairs=result.pairs;rigCoverage=result.coverage;rigMissing=result.missing;status('骨格データ対応 '+bonePairs.length+'関節 / 対応率 '+Math.round(rigCoverage*100)+'%。未対応 '+rigMissing.map(x=>x.key).join(', '))}
function resetTargetPose(){retargetEnabled=false;sourceMixer?.stopAllAction();soldierMixer?.stopAllAction();soldierModel?.traverse(o=>{if(o.isSkinnedMesh&&o.skeleton)o.skeleton.pose()});soldierModel?.updateMatrixWorld(true)}
function loadCompatibleAnimations(){if(compatibleReady||compatibleLoading)return;compatibleLoading=true;loader.load('./assets/characters/quaternius-base/animations.glb',g=>{compatibleLoading=false;compatibleReady=true;const bones=new Set();soldierModel?.traverse(o=>{if(o.isBone)bones.add(o.name)});compatibleClips=g.animations.filter(clip=>{const names=clip.tracks.filter(t=>/\.(?:quaternion|position|scale)$/.test(t.name)).map(t=>t.name.split('.')[0]);return names.length>0&&names.filter(n=>bones.has(n)).length>=Math.max(4,Math.ceil(names.length*.35))});if($('body').value==='soldier')startRetarget()},undefined,e=>{compatibleLoading=false;status('同一骨格モーション読込失敗: '+(e?.message||e));startKaykitFallback()})}
function chooseCompatibleClip(name){const n=name.toLowerCase();const terms=/run|sprint|dash/.test(n)?[/sprint/i,/run/i,/jog/i]:/walk/.test(n)?[/walk/i]:/idle|wait/.test(n)?[/idle/i]:/attack|slash|slice|stab|sword|melee|strike|combo/.test(n)?[/sword.*attack/i,/attack/i,/slash/i,/strike/i]:/block|guard/.test(n)?[/block/i,/guard/i]:/hit|hurt/.test(n)?[/hit/i,/hurt/i]:/death|die/.test(n)?[/death/i,/die/i]:[];for(const re of terms){const clip=compatibleClips.find(x=>re.test(x.name));if(clip)return clip}return null}
function sourceBoneNames(){const a=[];sourceRig?.traverse(o=>{if(o.isBone&&a.length<12)a.push(o.name)});return a.join(', ')}function targetBoneNames(){const a=[];soldierModel?.traverse(o=>{if(o.isBone&&a.length<12)a.push(o.name)});return a.join(', ')}function startKaykitFallback(){if(!soldierModel||!sourceRig||!sourceMixer)return;buildPairs();const clip=sourceRig.userData.clips?.find(x=>x.name===$('clip').value);if(!clip){status('選択モーションがありません: '+$('clip').value);return}if(!bonePairs.length){status('骨格対応0件。元クリップ '+clip.name+' / 元骨 '+sourceBoneNames()+' / 先骨 '+targetBoneNames());return}sourceMixer.stopAllAction();sourceAction=sourceMixer.clipAction(clip);sourceAction.reset().play();retargetEnabled=true;status('データ駆動骨格変換: '+clip.name+' / 関節 '+bonePairs.length+' / 対応率 '+Math.round(rigCoverage*100)+'%（姿勢・接触未検証）')}
function startRetarget(){if(!soldierModel)return;resetTargetPose();const name=$('clip').value||'';if(!name){status('アクションの読み込み待ち');return}const exact=compatibleReady?compatibleClips.find(x=>x.name===name):null;if(exact){soldierAction=soldierMixer.clipAction(exact);soldierAction.reset().play();status('同名クリップ再生: '+exact.name+'（実機未検証）');return}status('選択アクション '+name+' をデータ駆動骨格アダプターで再生します。類似名の別動作には置換しません');startKaykitFallback()}

function focusSoldier(){if(!soldierModel)return;cameraInitialized=false;const box=new THREE.Box3().setFromObject(soldierModel);if(box.isEmpty())return;const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),h=Math.max(size.y,1);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(h*.85,h*.35,h*2.1));camera.near=.01;camera.far=1000;camera.updateProjectionMatrix();controls.update()}
function setBody(){const useSoldier=$('body').value==='soldier';if(!useSoldier){retargetEnabled=false;if(baseModel)baseModel.visible=true;if(soldierModel)soldierModel.visible=false;status('KayKit共通骨格の職業別モーションを表示');return}if(baseModel)baseModel.visible=false;if(soldierModel){soldierModel.visible=true;focusSoldier();startRetarget();return}status('衣装なしの男女素体モデルを読み込み中…');loader.load(CHARACTER_ROOT+CHARACTER_MODEL[$('sex').value]+'.gltf',g=>{soldierModel=g.scene;soldierModel.traverse(o=>{if(o.isMesh||o.isSkinnedMesh)o.frustumCulled=false});scene.add(soldierModel);soldierModel.visible=$('body').value==='soldier';soldierMixer=new THREE.AnimationMixer(soldierModel);soldierActions=[];compatibleReady=false;compatibleClips=[];focusSoldier();startRetarget();},undefined,e=>{status('男女素体モデルの取得に失敗: '+(e?.message||e));$('body').value='kaykit';if(baseModel)baseModel.visible=true})}
$('body').onchange=setBody;$('sex').onchange=()=>{if(soldierModel){scene.remove(soldierModel);soldierModel=null;bonePairs=[];retargetEnabled=false;}setBody()};
function frame(obj){if(cameraInitialized)return true;const box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())return false;const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),radius=Math.max(size.x,size.y,size.z,1);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(radius*1.4,radius*.7,radius*3.8));camera.near=Math.max(.001,radius/1000);camera.far=radius*1000;camera.updateProjectionMatrix();controls.update();cameraInitialized=true;return true}
const actionName=n=>{const exact={Dodge_Backwards:'後方回避',Dodge_Backward:'後方回避',Dodge_Forward:'前方回避',Dodge_Left:'左回避',Dodge_Right:'右回避',Walking_A:'歩行A',Walking_B:'歩行B',Walking_C:'歩行C',Running_A:'ダッシュA',Running_B:'ダッシュB',Melee_Block:'防御',Melee_Blocking:'防御姿勢',Melee_Block_Hit:'防御被弾',Melee_Block_Attack:'防御反撃',Sword_Block:'剣防御',Sword_Heavy_Combo:'剣・強連撃',Sword_Regular_Combo:'剣・通常連撃',Ranged_Bow_Draw:'弓を引く',Ranged_Bow_Release:'矢を放つ',Ranged_Bow_Idle:'弓待機',Ranged_Bow_Aiming_Idle:'弓照準',Ranged_Magic_Summon:'召喚魔法',Ranged_Magic_Spellcasting:'魔法詠唱',Ranged_Magic_Spellcasting_Long:'長詠唱',Ranged_Magic_Shoot:'魔法発射',Melee_Unarmed_Attack_Kick:'蹴り攻撃',Melee_Unarmed_Kick:'蹴り攻撃',Melee_Unarmed_Attack_Punch_A:'拳攻撃',Melee_Unarmed_Punch:'拳攻撃',Melee_1H_Stab:'片手剣・突き',Melee_1H_Slash:'片手剣・斬撃',Melee_2H_Idle:'両手武器待機',Death_A:'戦闘不能A',Hit_A:'被弾A',Hit_B:'被弾B',Idle_A:'待機A',Idle_B:'待機B',Sneaking:'忍び歩き',Lockpick:'解錠',Lockpicking:'解錠動作',NinjaJump_Start:'忍者跳躍開始',NinjaJump_Land:'忍者着地',Shield_Dash:'盾突進',Shield_OneShot:'盾攻撃'};if(exact[n])return exact[n];return n.replace(/^Melee_1H_Attack_/,'片手剣・').replace(/^Melee_2H_Attack_/,'両手武器・').replace(/^Melee_Dualwield_/,'二刀流・').replace(/^Sword_Regular_/,'剣・通常').replace(/^Ranged_Bow_/,'弓・').replace(/^Ranged_Magic_/,'魔法・').replace(/^Melee_Unarmed_/,'格闘・').replace(/_/g,' ')};function play(){if($('body').value==='soldier'){startRetarget();return}if(!mixer)return;action?.stop();const clip=baseModel?.userData.animations.find(x=>x.name===$('clip').value);if(!clip)return;action=mixer.clipAction(clip);action.reset().play();status('再生中: '+clip.name+'\n共通モデル: KayKit Medium')}
const BASE='motions/external/kaykit/KayKit_Character_Animations_1.1/Mannequin Character/characters/Mannequin_Medium.glb';
baseReady=new Promise((resolve,reject)=>loader.load(encodeURI(BASE),g=>{baseModel=g.scene;baseModel.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.frustumCulled=false}});scene.add(baseModel);baseModel.visible=$('body').value!=='soldier';model=baseModel;mixer=new THREE.AnimationMixer(baseModel);frame(baseModel);resolve()},undefined,reject));
let requestId=0;async function load(){const row=filtered[+$('asset').value];if(!row)return;const current=++requestId;status('共通モデルとモーションを読み込み中...');try{await baseReady}catch(e){status('共通モデルの読み込み失敗: '+e.message);return}loader.load(encodeURI(row.file),g=>{if(current!==requestId)return;mixer.stopAllAction();baseModel.userData.animations=g.animations;sourceRig=g.scene;sourceRig.userData.clips=g.animations;sourceMixer=new THREE.AnimationMixer(sourceRig);buildPairs();$('clip').replaceChildren(...g.animations.filter(a=>row.clips.includes(a.name)).map(a=>new Option(actionName(a.name),a.name)));if(pendingClip&&row.clips.includes(pendingClip))$('clip').value=pendingClip;pendingClip=null;play();if($('body').value==='soldier')startRetarget();else status('共通モデルで再生: '+$('clip').value+'\n※同一Rig_Medium骨格の素材のみ表示。')},undefined,e=>status('読み込み失敗: '+(e?.message||e)))}
try{const response=await fetch('motion-external-inventory.json?cache='+Date.now());if(!response.ok)throw Error('HTTP '+response.status);data=(await response.json()).filter(x=>x.clips.length);const jobs={ '剣士':['Melee_','Sword_','Walking_','Running_','Dodge_','Hit_','Death_'],'格闘家':['Unarmed','Melee_Hook','Dodge_','Walking_','Running_','Hit_','Death_'],'魔法使い':['Ranged_Magic','Idle_','Walking_','Running_','Hit_','Death_'],'弓使い':['Ranged_Bow','HoldingBow','Walking_','Running_','Dodge_','Hit_','Death_'],'盾戦士':['Shield_','Sword_Block','Melee_Block','Walking_','Running_','Hit_','Death_'],'盗賊':['Sneaking','Lockpick','Dodge_','Walking_','Running_','Melee_Dualwield','Hit_','Death_'],'忍者':['NinjaJump','Melee_Dualwield','Dodge_','Running_','Hit_','Death_'],'農民・職人':['Farm_','Chop','Hammer','Dig','Saw','Work_','Fishing_','Walking_'],'共通動作':['Walking_','Running_','Idle_','Death_','Hit_','Jump_','Dodge_']};$('job').replaceChildren(...Object.keys(jobs).map(x=>new Option(x,x)));const mapResponse=await fetch('job-command-motion-map.json?cache='+Date.now());if(!mapResponse.ok)throw Error('職業定義HTTP '+mapResponse.status);commandMap=(await mapResponse.json()).jobs;$('job').replaceChildren(...Object.keys(commandMap).map(x=>new Option(x,x)));function filterJob(){const commands=commandMap[$('job').value]||[];filtered=commands.map(c=>data.find(d=>d.file===c.asset)).filter(Boolean);$('asset').replaceChildren(...filtered.map((x,i)=>new Option(x.file.split('/').slice(-2).join('/'),i)));const valid=commands.filter(c=>c.available&&data.some(d=>d.file===c.asset&&d.clips.includes(c.clip)));$('action').replaceChildren(...valid.map((c,i)=>new Option(c.command,i)));$('action').onchange=()=>{const c=valid[+$('action').value];if(!c)return;const i=filtered.findIndex(x=>x.file===c.asset);if(i<0)return;$('asset').value=String(i);pendingClip=c.clip;load()};if(valid.length){$('action').value='0';$('action').onchange()}else status('この職業に対応するモーションはありません')} $('job').onchange=filterJob;$('asset').onchange=()=>{pendingClip=null;load()};$('clip').onchange=play;filterJob()}catch(e){status('一覧取得エラー: '+e.message)}
$('pause').onclick=()=>{const a=$('body').value==='soldier'?(retargetEnabled?sourceAction:soldierAction):action;if(a){a.paused=!a.paused;$('pause').textContent=a.paused?'再開':'一時停止'}};$('reset').onclick=play;function mark(result){const key=filtered[+$('asset').value]?.file+' :: '+$('clip').value;records[key]=result;$('qa').textContent='判定記録 '+Object.keys(records).length+'件'}$('pass').onclick=()=>mark('PASS');$('fail').onclick=()=>mark('FAIL');$('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(records,null,2)).then(()=>status('検証結果をコピーしました')).catch(e=>status('コピー失敗: '+e.message));window.addEventListener('resize',()=>{camera.aspect=innerWidth/Math.max(240,innerHeight*.64);camera.updateProjectionMatrix();renderer.setSize(innerWidth,Math.max(240,innerHeight*.64))});setBody();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);mixer?.update(dt);soldierMixer?.update(dt);if(retargetEnabled&&sourceMixer&&soldierModel){sourceMixer.update(dt);sourceRig.updateMatrixWorld(true);soldierModel.updateMatrixWorld(true);applyRigPairs(THREE,bonePairs);soldierModel.updateMatrixWorld(true)}renderer.render(scene,camera)}tick();
