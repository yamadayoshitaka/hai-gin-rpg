name: Three-team battle HUD regression
on:
  pull_request:
    paths:
      - 'src/battle-rpg-squad-source.js'
      - 'src/battle-rpg-squad-hud.js'
      - 'src/battle-rpg-squad-hud.css'
      - 'tactics-wireframe.html'
      - 'qa/battle-rpg-squad-hud.test.mjs'
  push:
    branches: [main]
    paths:
      - 'src/battle-rpg-squad-source.js'
      - 'src/battle-rpg-squad-hud.js'
      - 'src/battle-rpg-squad-hud.css'
      - 'tactics-wireframe.html'
      - 'qa/battle-rpg-squad-hud.test.mjs'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check src/battle-rpg-squad-source.js && node --check src/battle-rpg-squad-hud.js
      - name: Verify three-team / nested jobs / enemy parity
        run: node --test qa/battle-rpg-squad-hud.test.mjs
