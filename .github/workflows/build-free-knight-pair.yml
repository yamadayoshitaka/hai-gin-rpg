name: Build free knight body + armor GLBs (CC0 and MIT)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-free-knight-pair.yml'
      - 'tools/build-free-knight-pair.py'
permissions:
  contents: write
concurrency:
  group: build-free-knight-pair
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install free Blender
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy
      - name: Export independent licensed body and armor GLBs
        run: |
          blender -b --python-exit-code 1 --python tools/build-free-knight-pair.py
          test -s assets/characters/free-knight/knight_male_body.glb
          test -s assets/characters/free-knight/knight_full_plate_armor.glb
          test -s assets/characters/free-knight/manifest.json
      - name: Archive free model pair
        uses: actions/upload-artifact@v4
        with:
          name: free-knight-body-and-armor-glb
          path: assets/characters/free-knight/
          if-no-files-found: error
      - name: Commit candidates (preview-only; game models unchanged)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/free-knight/
          if ! git diff --cached --quiet; then
            git commit -m "Generate free separate body and armor GLBs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
