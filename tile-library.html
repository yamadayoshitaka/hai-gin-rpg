<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マップチップ管理｜灰銀のレゾナンス</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1725;color:#edf4fc;font:14px system-ui}header{padding:12px 16px;background:#1b3046;display:flex;align-items:center;gap:14px}a{color:#a4d9ff}main{display:grid;grid-template-columns:185px minmax(0,1fr) 330px;height:calc(100dvh - 48px)}aside{background:#122337;overflow:auto;padding:12px}button,select,input{font:inherit}button{cursor:pointer;color:#eaf4ff;background:#294863;border:1px solid #5d809b;border-radius:7px;padding:9px}button.active{border-color:#f6c56b;background:#6a4e24}#categories{display:grid;gap:7px}#categories button{text-align:left}section{padding:12px;overflow:auto}#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}.tile{background:#1a3045;border:1px solid #425f76;padding:7px;border-radius:8px;text-align:center}.tile.active{border-color:#ffcc73;box-shadow:0 0 0 1px #ffcc73}.tile canvas{width:100%;aspect-ratio:1;display:block;border-radius:5px}.tile span{display:block;padding-top:5px;font-size:12px}#preview{height:300px;position:relative;background:#8da8b7;border-radius:9px;overflow:hidden;touch-action:none}#preview canvas{display:block}#detail{display:grid;gap:9px}#detail strong{font-size:18px}#actions{display:flex;flex-wrap:wrap;gap:7px}#actions button{flex:1}#map{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:#34475b;margin-top:12px;aspect-ratio:1;touch-action:none}#map canvas{width:100%;height:100%;image-rendering:auto}small{color:#aec6d9}#status{padding:7px;color:#b8d4e9;font-size:12px}@media(max-width:850px){main{display:block;height:auto}aside{display:flex;gap:8px;overflow-x:auto}#categories{display:flex;white-space:nowrap}#categories button{flex:none}section{overflow:visible}#preview{height:260px}#map{max-width:420px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><a href="./index.html">← メニュー</a><b>マップチップ・テクスチャ管理</b><small>1マス = 1タイルID</small></header><main><aside><div id="categories"></div></aside><section><h3 id="heading">タイル一覧</h3><div id="tiles"></div></section><section id="detail"><strong id="name">タイルを選択</strong><small id="meta"></small><label>季節 <select id="season"><option value="spring">春</option><option value="summer" selected>夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label><div id="preview"></div><div id="actions"><button id="png">PNG保存</button><button id="json">配置JSON保存</button><button id="clear">配置クリア</button></div><small>下の8×8マップをタップすると選択タイルを配置します。ドラッグで3D回転、ピンチで拡大。</small><div id="map"></div><div id="status">ゲーム用データとして書き出せます。ゲーム本体への自動同期は未接続です。</div></section></main><script type="module" src="./src/tile-library.js?v=1"></script></body></html>
