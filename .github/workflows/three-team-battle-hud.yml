name: Three-team battle HUD regression
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check src/battle-rpg-squad-source.js && node --check src/battle-rpg-squad-hud.js
      - name: Install lightweight DOM test dependency
        run: npm install --no-save --package-lock=false linkedom@0.18.12
      - name: Verify real DOM with three teams and nested job divisions
        run: node --test qa/battle-rpg-squad-hud.test.mjs qa/battle-three-team-hud-dom.test.mjs qa/battle-three-team-radar.test.mjs
