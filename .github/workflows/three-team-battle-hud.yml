name: Three-team battle HUD regression
on:
  pull_request:
    paths:
      - 'src/battle-realtime-commands.js'
      - 'src/battle-realtime-commands.css'
      - 'src/battle-realtime-deployment.js'
      - 'src/battle-exploration-floor.js'
      - 'qa/battle-transparent-radar-deploy-floor.test.mjs'
      - 'src/battle-rpg-squad-source.js'
      - 'src/battle-rpg-squad-hud.js'
      - 'src/battle-portrait-identity.js'
      - 'src/battle-stage-identity.js'
      - 'world-map.html'
      - 'qa/battle-rpg-squad-hud.test.mjs'
      - 'qa/battle-radar-engagement-regression.test.mjs'
      - 'qa/battle-contact-and-recovery-regression.test.mjs'
      - 'qa/battle-stage-deployment-portraits.test.mjs'
      - 'qa/inn-strategy-three-team-wizard.test.mjs'
      - 'qa/inn-roster-first-formation.test.mjs'
      - 'qa/training-ground-forge-critical-roster.test.mjs'
      - 'qa/battle-formation-switch.test.mjs'
      - 'src/battle-formation-orders.js'
      - 'src/prebattle-opening-tactics.js'
      - 'qa/prebattle-additional-tactics.test.mjs'
      - 'src/inn-formation-wizard.js'
      - 'src/inn-formation-rules.js'
      - 'src/training-formation-purchase.js'
      - 'qa/training-formation-purchase.test.mjs'
      - 'src/sortie-formation-template-rules.js'
      - 'qa/formation-minimum-deployment-radar.test.mjs'
      - 'qa/three-team-sortie.test.mjs'
      - 'src/three-team-sortie-ui.js'
      - 'town-hub.html'
      - 'src/three-team-core-bridge.js'
      - 'tactics-wireframe.html'
      - 'qa/battle-three-team-*'
      - 'src/battle-center-radar.js'
      - 'qa/battle-formation-autonomy-regression.test.mjs'
      - 'qa/formation-signature-movement.test.mjs'
      - 'src/formation-signature-strategies.js'
      - 'src/inn-formation-wizard.js'
      - 'src/three-team-sortie-ui.css'
      - 'src/battle-realtime-commands.css'
      - 'src/mass-battle-grid-sim.js'
      - 'src/combat-action-runtime.js'
      - 'qa/realtime-deployment-mobile-performance.test.mjs'
      - 'qa/mobile-prebattle-training-layout.test.mjs'
      - 'qa/battle-capture-objective.test.mjs'
      - 'qa/battle-map-inspection.test.mjs'
      - 'src/battle-map-inspection.js'
      - 'src/battle-capture-objective.js'
      - 'src/targeted-strategy-runtime.js'
      - '.github/workflows/three-team-battle-hud.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check src/battle-portrait-identity.js && node --check src/battle-stage-identity.js && node --check src/battle-rpg-squad-source.js && node --check src/battle-rpg-squad-hud.js && node --check src/battle-realtime-commands.js && node --check src/battle-realtime-deployment.js && node --check src/three-team-core-bridge.js
      - name: Verify wide bridge pathing and large-monster footprint spacing
        run: node --check src/battle-wide-bridge-clearance.js && node --test qa/battle-wide-bridge-clearance.test.mjs
      - name: Verify transparent battle radar, exact deploy taps and building floors
        run: node --check src/battle-exploration-floor.js && node --test qa/battle-transparent-radar-deploy-floor.test.mjs
      - name: Verify read-only battle map inspection and squad pins
        run: node --check src/battle-map-inspection.js && node --test qa/battle-map-inspection.test.mjs qa/battle-map-stability-twofinger.test.mjs qa/battle-camera-drag-hold.test.mjs
      - name: Verify simplified commands and true capture victory
        run: node --check src/battle-capture-objective.js && node --check src/targeted-strategy-runtime.js && node --test qa/battle-capture-objective.test.mjs
      - name: Install lightweight DOM test dependency
        run: npm install --no-save --package-lock=false linkedom@0.18.12
      - name: Verify real DOM with three teams and nested job divisions
        run: node --test qa/battle-rpg-squad-hud.test.mjs qa/battle-three-team-hud-dom.test.mjs qa/battle-three-team-radar.test.mjs qa/battle-three-team-prebattle.test.mjs qa/realtime-deployment-mobile-performance.test.mjs
      - name: Verify squad engagement from real fighters, live radar alignment and blocked-path recovery
        run: |
          node --check src/mass-battle-grid-sim.js
          node --test qa/battle-contact-and-recovery-regression.test.mjs qa/battle-radar-engagement-regression.test.mjs qa/battle-three-team-events.test.mjs
      - name: Verify small-screen opening strategy taps and training animation layout
        run: node --test qa/mobile-prebattle-training-layout.test.mjs
      - name: Verify stage identity, one deployment and captain/species portraits
        run: node --experimental-vm-modules qa/battle-stage-deployment-portraits.test.mjs
      - name: Verify formation-only inn and three-team stage handoff
        run: node --experimental-vm-modules qa/inn-strategy-three-team-wizard.test.mjs
      - name: Verify compatible formation opening tactics and enlarged training preview
        run: node --check src/prebattle-opening-tactics.js && node --check src/battle-realtime-commands.js && node --experimental-vm-modules --test qa/prebattle-additional-tactics.test.mjs
      - name: Verify roster-first inn, equipment, captain and high-tier eligibility
        run: node --experimental-vm-modules qa/inn-roster-first-formation.test.mjs
      - name: Verify training ground, forge upgrades, gacha preservation and story-critical losses
        run: node --test qa/training-ground-forge-critical-roster.test.mjs
      - name: Verify training soldier stock, wallet quote and atomic deployment
        run: node --check src/training-formation-purchase.js && node --test qa/training-formation-purchase.test.mjs
      - name: Verify paged inn, per-team items and formation-gated tactics
        run: node --test qa/mobile-formation-command-items.test.mjs
      - name: Verify battle-time formation changes and regrouping
        run: node --experimental-vm-modules qa/battle-formation-switch.test.mjs
      - name: Verify formation-aware healing, bridge routing and emergency enemy decisions
        run: node --check src/combat-action-runtime.js && node --check src/mass-battle-grid-sim.js && node --test qa/battle-formation-autonomy-regression.test.mjs
      - name: Verify per-formation signature tactics, animated preview and direct battle placement
        run: node --check src/formation-signature-strategies.js && node --check src/battle-realtime-commands.js && node --check src/targeted-strategy-runtime.js && node --test qa/formation-signature-movement.test.mjs
