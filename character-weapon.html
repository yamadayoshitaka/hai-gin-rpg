<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰銀のレゾナンス | 武器取り込み</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e9eff9;font:15px system-ui;padding:16px}a{color:#c0e5ff}main{max-width:750px;margin:20px auto}section{background:#192b43;border:1px solid #45617d;border-radius:12px;padding:16px;margin:14px 0}input,button{font:inherit;padding:10px;background:#294968;color:white;border:1px solid #7896b3;border-radius:8px;max-width:100%}button{cursor:pointer}#status{white-space:pre-wrap;color:#ffe1a2}canvas{width:100%;height:45vh;display:block;border-radius:9px;touch-action:none}small{color:#b7cbe0}</style></head><body><a href="./motion-external-test.html">← 職業別モーション実機確認へ戻る</a><main><h1>武器取り込み</h1><section><p>端末から GLB / GLTF ファイルを選択して、3Dプレビューできます。</p><input id="asset" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"><p id="status">ファイルを選択してください。</p><small>GLTFが外部bin・画像を参照する場合はGLB形式を推奨します。取り込んだデータはこの端末内での一時プレビューのみです。GitHubへの保存・ゲーム反映はまだ行いません。</small></section><section><div id="view"></div></section></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const view=document.querySelector('#view'),status=document.querySelector('#status');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(view.clientWidth,Math.max(280,innerHeight*.45));view.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x172335);scene.add(new THREE.HemisphereLight(0xffffff,0x667b98,2.4));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,6,5);scene.add(sun);const camera=new THREE.PerspectiveCamera(45,view.clientWidth/Math.max(280,innerHeight*.45),.01,1000);camera.position.set(2,2,4);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const loader=new GLTFLoader();let object;document.querySelector('#asset').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;status.textContent='読み込み中：'+file.name;try{const buffer=await file.arrayBuffer();const gltf=await new Promise((resolve,reject)=>loader.parse(buffer,'',resolve,reject));if(object)scene.remove(object);object=gltf.scene;scene.add(object);const box=new THREE.Box3().setFromObject(object);if(box.isEmpty())throw Error('表示可能な3Dメッシュがありません');const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size.length()*.6,size.length()*.35,size.length()*.8));camera.near=Math.max(.001,size.length()/1000);camera.far=Math.max(100,size.length()*100);camera.updateProjectionMatrix();controls.update();status.textContent='プレビュー成功：'+file.name+'\nメッシュ寸法：'+size.x.toFixed(2)+' × '+size.y.toFixed(2)+' × '+size.z.toFixed(2);}catch(err){status.textContent='読み込み失敗：'+err.message;console.error(err);}});function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera)}render();addEventListener('resize',()=>{const h=Math.max(280,innerHeight*.45);renderer.setSize(view.clientWidth,h);camera.aspect=view.clientWidth/h;camera.updateProjectionMatrix();});</script></body></html>
