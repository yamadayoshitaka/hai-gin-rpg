name: Free AI site GLB import and validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/ai-model-inbox/**'
      - 'tools/ai-3d-glb-audit.mjs'
      - 'tools/ai-3d-free-import.mjs'
      - 'qa/ai-3d-import.test.mjs'
      - '.github/workflows/ai-3d-free-import.yml'
permissions:
  contents: write
concurrency:
  group: ai-3d-free-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GLB validation and safe import lifecycle
        run: node --test qa/ai-3d-import.test.mjs
      - name: Validate and register incoming free AI GLBs as candidates
        run: node tools/ai-3d-free-import.mjs
      - name: Upload intake QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-glb-intake-report
          path: qa/ai-3d-inbox-report.json
          if-no-files-found: warn
      - name: Commit approved-for-review candidates only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/ai-model-inbox data/ai-model-registry.json
          if [ -d assets/ai-generated ]; then
            git add -A assets/ai-generated
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Import GLB candidates from free AI sites [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
