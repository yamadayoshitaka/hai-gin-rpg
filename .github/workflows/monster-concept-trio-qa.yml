name: Eight-species concept monster geometry regression
on:
  pull_request:
    paths:
      - 'src/monster-concept-trio-sculpt.js'
      - 'src/monster-geometry.js'
      - 'src/monster-catalog.js'
      - 'src/creature-game-model-routing.js'
      - 'qa/monster-concept-trio.test.mjs'
      - '.github/workflows/monster-concept-trio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js for actual 3D mesh assertions
        run: npm install --no-save --package-lock=false three@0.160.1
      - name: Verify source integrity and all 8 species + high/low LOD
        run: |
          node --check src/monster-concept-trio-sculpt.js
          node --check src/monster-geometry.js
          node --check src/monster-reference-design.js
          npm run test:monster-concept-trio
