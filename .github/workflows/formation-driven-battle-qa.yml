name: Formation-driven battle AI and indoor route regression
on:
  pull_request:
    paths:
      - 'src/formation-driven-ai.js'
      - 'src/formation-ai-indoor-route.js'
      - 'src/mass-battle-grid-sim.js'
      - 'src/three-team-core-bridge.js'
      - 'src/three-team-sortie.js'
      - 'src/sortie-formation-logic.js'
      - 'src/sortie-formation-template-rules.js'
      - 'src/formation-signature-strategies.js'
      - 'tactics-wireframe.html'
      - 'qa/formation-driven-battle-ai.test.mjs'
      - '.github/workflows/formation-driven-battle-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check route, doctrine and simulation syntax
        run: |
          node --check src/formation-driven-ai.js
          node --check src/formation-ai-indoor-route.js
          node --check src/mass-battle-grid-sim.js
          node --check src/three-team-core-bridge.js
          node --check src/three-team-sortie.js
          node --check src/formation-signature-strategies.js
      - name: Test symmetric enemy/ally doctrine, indoor exits and production movement gates
        run: |
          node --test qa/formation-driven-battle-ai.test.mjs
          node --test qa/battle-ai-wandering-regression.test.mjs qa/battle-corpse-cell-pingpong.test.mjs
